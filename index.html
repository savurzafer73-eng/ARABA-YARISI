<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Turbo Road 5.0</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

#rotate{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#05070b;
  color:white;
  text-align:center;
}

#rotate .phone{
  width:85px;
  height:52px;
  border:4px solid white;
  border-radius:9px;
  transform:rotate(90deg);
  margin-bottom:28px;
  animation:turn 1.5s infinite ease-in-out;
}

@keyframes turn{
  0%,100%{transform:rotate(90deg)}
  50%{transform:rotate(0deg)}
}

#rotate h2{
  font-size:24px;
  margin-bottom:8px;
}

#rotate p{
  opacity:.7;
}

#menu{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,120,20,.12),transparent 35%),
    linear-gradient(180deg,#07101a,#020306);
  color:white;
}

.panel{
  width:min(440px,90vw);
  padding:30px 24px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  background:rgba(8,12,18,.82);
  box-shadow:0 25px 80px rgba(0,0,0,.65);
  text-align:center;
  backdrop-filter:blur(14px);
}

.logo{
  font-size:44px;
  font-weight:1000;
  letter-spacing:2px;
  font-style:italic;
  color:#fff;
  text-shadow:0 4px 25px rgba(255,100,20,.45);
}

.logo span{
  color:#ff6b19;
}

.version{
  margin-top:5px;
  color:#84909e;
  font-size:12px;
  letter-spacing:3px;
}

.best{
  margin:25px 0;
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,.045);
  color:#aeb8c4;
}

.best strong{
  display:block;
  color:#fff;
  font-size:23px;
  margin-top:5px;
}

.startBtn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  background:linear-gradient(135deg,#ff8a25,#e94710);
  color:#fff;
  font-size:18px;
  font-weight:900;
  box-shadow:0 10px 30px rgba(235,72,16,.28);
}

.startBtn:active{
  transform:scale(.97);
}

.tip{
  margin-top:18px;
  color:#687482;
  font-size:12px;
  line-height:1.6;
}

#pause{
  position:fixed;
  top:calc(12px + env(safe-area-inset-top));
  right:calc(12px + env(safe-area-inset-right));
  z-index:15;
  width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:13px;
  background:rgba(5,8,12,.62);
  color:#fff;
  font-size:18px;
  display:none;
}

#pause:active{
  transform:scale(.92);
}

#touchHint{
  position:fixed;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  z-index:10;
  color:rgba(255,255,255,.35);
  font-size:11px;
  pointer-events:none;
  display:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="rotate">
  <div class="phone"></div>
  <h2>Telefonu yatay çevir</h2>
  <p>Turbo Road yatay ekran için tasarlandı</p>
</div>

<div id="menu">
  <div class="panel">
    <div class="logo">TURBO <span>ROAD</span></div>
    <div class="version">PROFESSIONAL 5.0</div>

    <div class="best">
      EN YÜKSEK SKOR
      <strong id="bestScore">0</strong>
    </div>

    <button class="startBtn" id="startBtn">YARIŞI BAŞLAT</button>

    <div class="tip">
      Sol tarafa dokun: SOL<br>
      Sağ tarafa dokun: SAĞ<br>
      Klavye: ← →
    </div>
  </div>
</div>

<button id="pause">Ⅱ</button>
<div id="touchHint">SOL / SAĞ dokunarak yön ver</div>

<script>
"use strict";

/* =========================================================
   TURBO ROAD 5.0
   Tek dosya / Harici asset yok
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d",{alpha:false});

const menu = document.getElementById("menu");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pause");
const rotateBox = document.getElementById("rotate");
const bestScoreEl = document.getElementById("bestScore");
const touchHint = document.getElementById("touchHint");

let W=0,H=0,DPR=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=innerWidth;
  H=innerHeight;

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize,{passive:true});
resize();

/* =========================
   STORAGE
   ========================= */

let bestScore=Number(localStorage.getItem("turboRoadBest")||0);
bestScoreEl.textContent=bestScore.toLocaleString("tr-TR");

/* =========================
   GAME STATE
   ========================= */

let running=false;
let paused=false;
let gameOver=false;

let score=0;
let distance=0;
let speed=0;
let targetSpeed=0;

let playerLane=1;
let playerX=0;

let traffic=[];
let scenery=[];

let spawnTimer=0;
let sceneryTimer=0;
let last=performance.now();

const MAX_SPEED=310;

/* =========================
   AUDIO
   ========================= */

let audio=null;
let engineOsc=null;
let engineGain=null;

function initAudio(){
  if(audio) return;

  try{
    audio=new (window.AudioContext||window.webkitAudioContext)();

    engineOsc=audio.createOscillator();
    engineGain=audio.createGain();

    engineOsc.type="sawtooth";
    engineOsc.frequency.value=70;
    engineGain.gain.value=0;

    engineOsc.connect(engineGain);
    engineGain.connect(audio.destination);

    engineOsc.start();
  }catch(e){}
}

function updateEngine(){
  if(!audio || !engineOsc || !engineGain) return;

  const n=Math.max(0,Math.min(1,speed/MAX_SPEED));

  engineOsc.frequency.setTargetAtTime(
    55+n*125,
    audio.currentTime,
    .04
  );

  engineGain.gain.setTargetAtTime(
    running&&!paused&&!gameOver ? .018+n*.035 : 0,
    audio.currentTime,
    .08
  );
}

function crashSound(){
  if(!audio) return;

  try{
    const o=audio.createOscillator();
    const g=audio.createGain();

    o.type="square";
    o.frequency.setValueAtTime(110,audio.currentTime);
    o.frequency.exponentialRampToValueAtTime(
      45,audio.currentTime+.35
    );

    g.gain.setValueAtTime(.12,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(
      .001,audio.currentTime+.4
    );

    o.connect(g);
    g.connect(audio.destination);

    o.start();
    o.stop(audio.currentTime+.4);
  }catch(e){}
}

/* =========================
   ORIENTATION
   ========================= */

function checkOrientation(){
  const portrait=H>W;

  rotateBox.style.display=
    portrait && running ? "flex":"none";
}

addEventListener("resize",checkOrientation);

/* =========================
   ROAD
   ========================= */

function horizon(){
  return H*.30;
}

function roadCenter(y){
  const t=Math.max(0,Math.min(1,(y-horizon())/(H-horizon()));

  return W*.5
    + Math.sin(distance*.0007)*W*.025*t
    + Math.sin(distance*.0013+2)*W*.012*t*t;
}

function roadWidth(y){
  const t=Math.max(0,Math.min(1,(y-horizon())/(H-horizon())));
  return W*(.16+.72*Math.pow(t,.78));
}

function laneX(lane,y){
  const rw=roadWidth(y);
  const c=roadCenter(y);

  return c+(-1+lane)*rw/3;
}

/* =========================
   SKY
   ========================= */

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H*.55);
  g.addColorStop(0,"#071421");
  g.addColorStop(.45,"#173348");
  g.addColorStop(1,"#d18d5e");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* Sun */
  const sx=W*.72;
  const sy=H*.22;
  const r=Math.min(W,H)*.075;

  const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,r*2.3);
  sg.addColorStop(0,"rgba(255,238,174,.9)");
  sg.addColorStop(.3,"rgba(255,188,94,.25)");
  sg.addColorStop(1,"rgba(255,188,94,0)");

  ctx.fillStyle=sg;
  ctx.fillRect(0,0,W,H*.55);

  ctx.fillStyle="#ffe8ae";
  ctx.beginPath();
  ctx.arc(sx,sy,r*.52,0,Math.PI*2);
  ctx.fill();
}

/* =========================
   GROUND
   ========================= */

function drawGround(){
  const y=horizon();

  ctx.fillStyle="#2b482b";
  ctx.fillRect(0,y,W,H-y);

  const g=ctx.createLinearGradient(0,y,0,H);
  g.addColorStop(0,"#304e2d");
  g.addColorStop(1,"#111e12");

  ctx.fillStyle=g;
  ctx.fillRect(0,y,W,H-y);
}

/* =========================
   ROAD
   ========================= */

function drawRoad(){
  const hy=horizon();

  const topC=roadCenter(hy);
  const bottomC=roadCenter(H);

  const topW=roadWidth(hy);
  const bottomW=roadWidth(H);

  ctx.beginPath();
  ctx.moveTo(topC-topW/2,hy);
  ctx.lineTo(topC+topW/2,hy);
  ctx.lineTo(bottomC+bottomW/2,H);
  ctx.lineTo(bottomC-bottomW/2,H);
  ctx.closePath();

  const rg=ctx.createLinearGradient(0,hy,0,H);
  rg.addColorStop(0,"#353b42");
  rg.addColorStop(.5,"#20252b");
  rg.addColorStop(1,"#111419");

  ctx.fillStyle=rg;
  ctx.fill();

  /* road shoulders */
  ctx.lineWidth=Math.max(3,W*.006);

  ctx.strokeStyle="#d5d0c2";
  ctx.beginPath();
  ctx.moveTo(topC-topW/2,hy);
  ctx.lineTo(bottomC-bottomW/2,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(topC+topW/2,hy);
  ctx.lineTo(bottomC+bottomW/2,H);
  ctx.stroke();

  /* lane markings */
  for(let lane=1;lane<3;lane++){
    drawLaneLine(lane);
  }

  /* roadside rumble */
  drawShoulderStripes(-1);
  drawShoulderStripes(1);
}

function drawLaneLine(lane){
  const segments=18;

  for(let i=0;i<segments;i++){
    let a=i/segments;
    let b=(i+.52)/segments;

    const curve=Math.pow(a,1.8);
    const curve2=Math.pow(b,1.8);

    const y1=horizon()+curve*(H-horizon());
    const y2=horizon()+curve2*(H-horizon());

    const x1=laneX(lane,y1);
    const x2=laneX(lane,y2);

    ctx.strokeStyle="rgba(245,245,235,.78)";
    ctx.lineWidth=Math.max(1.5,W*.004);

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }
}

function drawShoulderStripes(side){
  for(let i=0;i<13;i++){
    const a=i/13;
    const b=(i+.48)/13;

    const y1=horizon()+Math.pow(a,1.75)*(H-horizon());
    const y2=horizon()+Math.pow(b,1.75)*(H-horizon());

    const c1=roadCenter(y1);
    const c2=roadCenter(y2);
    const rw1=roadWidth(y1);
    const rw2=roadWidth(y2);

    const off1=side*(rw1/2+W*.012);
    const off2=side*(rw2/2+W*.012);

    ctx.strokeStyle="#f1d05d";
    ctx.lineWidth=Math.max(2,W*.006);

    ctx.beginPath();
    ctx.moveTo(c1+off1,y1);
    ctx.lineTo(c2+off2,y2);
    ctx.stroke();
  }
}

/* =========================
   SCENERY
   ========================= */

function addScenery(){
  const side=Math.random()<.5?-1:1;

  scenery.push({
    side,
    z:0,
    type:Math.random()<.7?"tree":"rock",
    offset:.12+Math.random()*.18
  });
}

function drawTree(x,y,s){
  /* shadow */
  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.beginPath();
  ctx.ellipse(x,y+s*.45,s*.55,s*.12,0,0,Math.PI*2);
  ctx.fill();

  /* trunk */
  ctx.fillStyle="#65442c";
  ctx.fillRect(x-s*.10,y-s*.75,s*.2,s*.8);

  /* crown */
  ctx.fillStyle="#183d25";

  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.arc(
      x+(i-2)*s*.20,
      y-s*.88-Math.abs(i-2)*s*.05,
      s*.30,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  ctx.fillStyle="#245a31";
  ctx.beginPath();
  ctx.arc(x,y-s*1.1,s*.35,0,Math.PI*2);
  ctx.fill();
}

function drawRock(x,y,s){
  ctx.fillStyle="#565b58";
  ctx.beginPath();
  ctx.moveTo(x-s*.55,y);
  ctx.lineTo(x-s*.32,y-s*.45);
  ctx.lineTo(x+s*.18,y-s*.55);
  ctx.lineTo(x+s*.58,y-s*.1);
  ctx.lineTo(x+s*.42,y);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="rgba(255,255,255,.12)";
  ctx.beginPath();
  ctx.moveTo(x-s*.28,y-s*.4);
  ctx.lineTo(x+s*.12,y-s*.5);
  ctx.lineTo(x+s*.25,y-s*.27);
  ctx.closePath();
  ctx.fill();
}

function drawScenery(){
  for(const s of scenery){
    const p=s.z;
    const y=horizon()+Math.pow(p,1.75)*(H-horizon());
    const rw=roadWidth(y);
    const c=roadCenter(y);

    const x=c+s.side*(rw/2+W*(.045+s.offset*p));

    const size=W*(.025+.15*p);

    if(s.type==="tree") drawTree(x,y,size);
    else drawRock(x,y,size*.8);
  }
}

/* =========================
   CARS
   ========================= */

const CAR_W_RATIO=.092;
const CAR_MAX_W=118;
const CAR_ASPECT=1.62;

function carSize(){
  const w=Math.min(W*CAR_W_RATIO,CAR_MAX_W);
  return {
    w,
    h:w*CAR_ASPECT
  };
}

const CAR_TYPES=[
  {body:"#e7e9ec",accent:"#11161b"},
  {body:"#e63d32",accent:"#191919"},
  {body:"#2876d2",accent:"#10151c"},
  {body:"#f0b22c",accent:"#151515"},
  {body:"#45a65c",accent:"#101b13"},
  {body:"#b84ee2",accent:"#17101d"}
];

function roundedRect(x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);

  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function drawCar(x,y,w,h,type=0,player=false){
  const data=CAR_TYPES[type%CAR_TYPES.length];

  ctx.save();
  ctx.translate(x,y);

  /* shadow */
  ctx.fillStyle="rgba(0,0,0,.42)";
  ctx.beginPath();
  ctx.ellipse(0,h*.43,w*.52,h*.12,0,0,Math.PI*2);
  ctx.fill();

  /* body */
  const bg=ctx.createLinearGradient(-w/2,0,w/2,0);
  bg.addColorStop(0,"#090c10");
  bg.addColorStop(.12,data.body);
  bg.addColorStop(.5,data.body);
  bg.addColorStop(.88,data.body);
  bg.addColorStop(1,"#080b0e");

  roundedRect(-w*.46,-h*.5,w*.92,h*.96,w*.16);
  ctx.fillStyle=bg;
  ctx.fill();

  /* roof/cabin */
  const roofY=-h*.27;
  const roofW=w*.62;
  const roofH=h*.35;

  roundedRect(
    -roofW/2,
    roofY,
    roofW,
    roofH,
    w*.11
  );

  const glass=ctx.createLinearGradient(0,roofY,0,roofY+roofH);
  glass.addColorStop(0,"#0b1722");
  glass.addColorStop(.55,"#284454");
  glass.addColorStop(1,"#071017");

  ctx.fillStyle=glass;
  ctx.fill();

  /* center divider */
  ctx.fillStyle="rgba(255,255,255,.16)";
  ctx.fillRect(-w*.018,roofY,w*.036,roofH);

  /* hood highlight */
  ctx.fillStyle="rgba(255,255,255,.15)";
  roundedRect(-w*.32,h*.08,w*.64,h*.20,w*.04);
  ctx.fill();

  /* grille */
  ctx.fillStyle=data.accent;
  roundedRect(-w*.25,h*.27,w*.5,h*.10,w*.025);
  ctx.fill();

  /* headlights */
  ctx.fillStyle="#fff8d0";

  roundedRect(-w*.34,h*.19,w*.18,h*.065,w*.02);
  ctx.fill();

  roundedRect(w*.16,h*.19,w*.18,h*.065,w*.02);
  ctx.fill();

  /* red tail detail */
  ctx.fillStyle="#ff2828";
  roundedRect(-w*.37,-h*.40,w*.20,h*.055,w*.02);
  ctx.fill();

  roundedRect(w*.17,-h*.40,w*.20,h*.055,w*.02);
  ctx.fill();

  /* wheels */
  for(const side of [-1,1]){
    ctx.fillStyle="#07090b";

    roundedRect(
      side*w*.40-w*.07,
      -h*.31,
      w*.14,
      h*.28,
      w*.035
    );
    ctx.fill();

    roundedRect(
      side*w*.40-w*.07,
      h*.12,
      w*.14,
      h*.28,
      w*.035
    );
    ctx.fill();

    ctx.fillStyle="#969da3";

    ctx.beginPath();
    ctx.arc(
      side*w*.40,
      -h*.17,
      w*.038,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
      side*w*.40,
      h*.26,
      w*.038,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  /* player glow */
  if(player){
    ctx.shadowColor="rgba(255,100,20,.5)";
    ctx.shadowBlur=18;
    ctx.strokeStyle="rgba(255,120,35,.7)";
    ctx.lineWidth=2;
    roundedRect(-w*.46,-h*.5,w*.92,h*.96,w*.16);
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  ctx.restore();
}

/* =========================
   TRAFFIC
   ========================= */

function spawnTraffic(){
  const lane=Math.floor(Math.random()*3);

  /* prevent impossible immediate overlap */
  if(traffic.some(c=>c.lane===lane && c.z<.18)) return;

  traffic.push({
    lane,
    z:.035,
    speed:.18+Math.random()*.18,
    type:Math.floor(Math.random()*CAR_TYPES.length),
    passed:false
  });
}

function updateTraffic(dt){
  for(const car of traffic){

    /*
      Cars approach naturally from horizon.
      No sky-drop effect.
    */
    car.z+=dt*(speed/MAX_SPEED)*car.speed;

    if(!car.passed && car.z>.80){
      car.passed=true;
      score+=25;
    }
  }

  traffic=traffic.filter(c=>c.z<1.15);
}

/* =========================
   COLLISION
   ========================= */

function collision(){
  const ps=carSize();

  const py=H*.79;

  for(const car of traffic){

    if(car.z<.73 || car.z>.98) continue;

    const cy=horizon()+Math.pow(car.z,1.75)*(H-horizon());
    const cx=laneX(car.lane,cy);

    const dx=Math.abs(cx-playerX);
    const dy=Math.abs(cy-py);

    if(
      dx < ps.w*.55 &&
      dy < ps.h*.52
    ){
      return true;
    }
  }

  return false;
}

/* =========================
   PLAYER
   ========================= */

function drawPlayer(){
  const s=carSize();
  const y=H*.79;

  drawCar(
    playerX,
    y,
    s.w,
    s.h,
    3,
    true
  );
}

/* =========================
   WORLD
   ========================= */

function updateScenery(dt){
  sceneryTimer-=dt;

  if(sceneryTimer<=0){
    sceneryTimer=.18+Math.random()*.3;
    addScenery();
  }

  for(const s of scenery){
    s.z+=dt*(speed/MAX_SPEED)*.95;
  }

  scenery=scenery.filter(s=>s.z<1.15);
}

/* =========================
   DRAW TRAFFIC
   ========================= */

function drawTraffic(){

  const s=carSize();

  /* distant first */
  traffic.sort((a,b)=>a.z-b.z);

  for(const car of traffic){

    const y=
      horizon()+
      Math.pow(car.z,1.75)*(H-horizon());

    const x=laneX(car.lane,y);

    /*
      The model uses the same base dimensions as
      the player's vehicle. Perspective is expressed
      through position rather than changing the car's
      design proportions.
    */
    const perspective=.72+car.z*.28;

    drawCar(
      x,
      y,
      s.w*perspective,
      s.h*perspective,
      car.type,
      false
    );
  }
}

/* =========================
   HUD
   ========================= */

function drawHUD(){
  if(!running) return;

  ctx.fillStyle="rgba(4,7,11,.48)";
  roundedRect(14,14,165,66,16);
  ctx.fill();

  ctx.fillStyle="#8d98a5";
  ctx.font="bold 11px Arial";
  ctx.fillText("SKOR",27,35);

  ctx.fillStyle="#fff";
  ctx.font="900 24px Arial";
  ctx.fillText(
    Math.floor(score).toLocaleString("tr-TR"),
    27,61
  );

  ctx.fillStyle="rgba(4,7,11,.48)";
  roundedRect(W-145,14,130,66,16);
  ctx.fill();

  ctx.fillStyle="#8d98a5";
  ctx.font="bold 11px Arial";
  ctx.fillText("HIZ",W-132,35);

  ctx.fillStyle="#fff";
  ctx.font="900 24px Arial";
  ctx.fillText(
    Math.floor(speed)+" KM/H",
    W-132,61
  );

  /* speed bar */
  const barW=Math.min(W*.28,250);
  const bx=W/2-barW/2;
  const by=H-30;

  ctx.fillStyle="rgba(255,255,255,.12)";
  roundedRect(bx,by,barW,6,3);
  ctx.fill();

  ctx.fillStyle="#ff6b19";
  roundedRect(
    bx,
    by,
    barW*(speed/MAX_SPEED),
    6,
    3
  );
}

/* =========================
   GAME OVER
   ========================= */

function drawGameOver(){
  ctx.fillStyle="rgba(0,0,0,.58)";
  ctx.fillRect(0,0,W,H);

  const pw=Math.min(410,W*.82);
  const ph=245;
  const px=W/2-pw/2;
  const py=H/2-ph/2;

  ctx.fillStyle="rgba(8,12,18,.94)";
  roundedRect(px,py,pw,ph,24);
  ctx.fill();

  ctx.strokeStyle="rgba(255,255,255,.12)";
  ctx.lineWidth=1;
  roundedRect(px,py,pw,ph,24);
  ctx.stroke();

  ctx.fillStyle="#fff";
  ctx.textAlign="center";
  ctx.font="900 32px Arial";
  ctx.fillText("YARIŞ BİTTİ",W/2,py+58);

  ctx.fillStyle="#87929f";
  ctx.font="bold 13px Arial";
  ctx.fillText("SKOR",W/2,py+92);

  ctx.fillStyle="#ff7b24";
  ctx.font="900 35px Arial";
  ctx.fillText(
    Math.floor(score).toLocaleString("tr-TR"),
    W/2,py+130
  );

  ctx.fillStyle="#fff";
  ctx.font="bold 14px Arial";
  ctx.fillText(
    "Tekrar başlamak için dokun",
    W/2,py+183
  );

  ctx.textAlign="left";
}

/* =========================
   GAME UPDATE
   ========================= */

function update(dt){

  if(!running || paused || gameOver) return;

  targetSpeed=
    Math.min(
      MAX_SPEED,
      150+distance*.018
    );

  speed+=(targetSpeed-speed)*dt*1.7;

  distance+=speed*dt*.035;
  score+=speed*dt*.055;

  spawnTimer-=dt;

  const spawnRate=
    Math.max(
      .42,
      .95-distance*.0009
    );

  if(spawnTimer<=0){
    spawnTimer=spawnRate;
    spawnTraffic();
  }

  updateTraffic(dt);
  updateScenery(dt);

  /* player follows selected lane */
  const targetX=laneX(playerLane,H*.79);

  playerX+=(targetX-playerX)*Math.min(1,dt*10);

  if(collision()){
    crashSound();
    gameOver=true;
    speed*=.35;

    if(score>bestScore){
      bestScore=Math.floor(score);
      localStorage.setItem(
        "turboRoadBest",
        bestScore
      );
      bestScoreEl.textContent=
        bestScore.toLocaleString("tr-TR");
    }
  }

  updateEngine();
}

/* =========================
   MAIN DRAW
   ========================= */

function draw(){
  drawSky();
  drawGround();

  /* scenery behind road */
  drawScenery();

  drawRoad();
  drawTraffic();
  drawPlayer();

  drawHUD();

  if(gameOver){
    drawGameOver();
  }
}

/* =========================
   LOOP
   ========================= */

function loop(now){

  let dt=(now-last)/1000;
  last=now;

  dt=Math.min(dt,.035);

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================
   START
   ========================= */

function startGame(){

  initAudio();

  if(audio && audio.state==="suspended"){
    audio.resume();
  }

  running=true;
  paused=false;
  gameOver=false;

  score=0;
  distance=0;
  speed=145;
  targetSpeed=145;

  playerLane=1;
  playerX=laneX(1,H*.79);

  traffic=[];
  scenery=[];

  spawnTimer=.7;
  sceneryTimer=0;

  menu.style.display="none";
  pauseBtn.style.display="block";
  touchHint.style.display="block";

  checkOrientation();
}

startBtn.addEventListener("click",startGame);

/* =========================
   PAUSE
   ========================= */

pauseBtn.addEventListener("click",()=>{
  if(!running || gameOver) return;

  paused=!paused;
  pauseBtn.textContent=paused?"▶":"Ⅱ";
});

/* =========================
   CONTROL
   ========================= */

function moveLeft(){
  if(!running || paused || gameOver) return;
  playerLane=Math.max(0,playerLane-1);
}

function moveRight(){
  if(!running || paused || gameOver) return;
  playerLane=Math.min(2,playerLane+1);
}

/* touch */
let touchStartX=0;

canvas.addEventListener("touchstart",e=>{
  if(gameOver){
    startGame();
    return;
  }

  const t=e.changedTouches[0];
  touchStartX=t.clientX;
},{passive:true});

canvas.addEventListener("touchend",e=>{
  if(!running || paused || gameOver) return;

  const t=e.changedTouches[0];
  const dx=t.clientX-touchStartX;

  if(Math.abs(dx)>35){
    if(dx<0) moveLeft();
    else moveRight();
    return;
  }

  if(t.clientX<W/2) moveLeft();
  else moveRight();

},{passive:true});

/* mouse */
canvas.addEventListener("mousedown",e=>{
  if(gameOver){
    startGame();
    return;
  }

  if(e.clientX<W/2) moveLeft();
  else moveRight();
});

/* keyboard */
addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    e.preventDefault();
    moveLeft();
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    e.preventDefault();
    moveRight();
  }

  if(e.key===" "){
    e.preventDefault();

    if(running && !gameOver){
      paused=!paused;
      pauseBtn.textContent=paused?"▶":"Ⅱ";
    }
  }

  if(e.key==="Enter" && gameOver){
    startGame();
  }
});

/* =========================
   FULLSCREEN
   ========================= */

async function fullscreen(){

  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }
  }catch(e){}
}

startBtn.addEventListener("click",fullscreen);

/* =========================
   WAKE LOCK
   ========================= */

let wakeLock=null;

async function requestWakeLock(){

  try{
    if("wakeLock" in navigator){
      wakeLock=await navigator.wakeLock.request("screen");
    }
  }catch(e){}
}

startBtn.addEventListener("click",requestWakeLock);

/* =========================
   VISIBILITY
   ========================= */

document.addEventListener("visibilitychange",()=>{
  if(document.hidden && running && !gameOver){
    paused=true;
    pauseBtn.textContent="▶";
  }
});

/* =========================
   INITIAL
   ========================= */

function initialScene(){

  for(let i=0;i<14;i++){

    scenery.push({
      side:i%2?1:-1,
      z:i/15+.03,
      type:i%4===0?"rock":"tree",
      offset:.12+Math.random()*.15
    });
  }

  playerX=laneX(1,H*.79);
}

initialScene();
draw();

</script>
