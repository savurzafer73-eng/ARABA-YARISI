<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#081018">
<title>Turbo Road 5.1</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#081018;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

#menu{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(#07131f,#030609);
  color:white;
}

.box{
  width:min(430px,90%);
  padding:30px 24px;
  border-radius:24px;
  background:rgba(12,18,25,.94);
  border:1px solid rgba(255,255,255,.12);
  text-align:center;
  box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.logo{
  font-size:43px;
  font-weight:900;
  font-style:italic;
  letter-spacing:2px;
}

.logo span{
  color:#ff641c;
}

.sub{
  margin-top:6px;
  color:#788592;
  font-size:11px;
  letter-spacing:4px;
}

.best{
  margin:25px 0;
  padding:15px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
  color:#8c99a5;
}

.best b{
  display:block;
  color:#fff;
  font-size:25px;
  margin-top:5px;
}

#start{
  width:100%;
  padding:17px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#ff8a2a,#e64212);
  color:#fff;
  font-size:18px;
  font-weight:bold;
}

#start:active{
  transform:scale(.97);
}

.info{
  margin-top:17px;
  color:#71808d;
  font-size:12px;
  line-height:1.6;
}

#pause{
  display:none;
  position:fixed;
  z-index:5;
  top:15px;
  right:15px;
  width:45px;
  height:45px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:13px;
  background:rgba(0,0,0,.5);
  color:white;
  font-size:18px;
}

#rotate{
  display:none;
  position:fixed;
  z-index:20;
  inset:0;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  background:#05080b;
  text-align:center;
}

#rotate h2{
  margin-top:20px;
}

#rotate p{
  margin-top:8px;
  color:#89939c;
}

.phone{
  width:70px;
  height:45px;
  border:4px solid white;
  border-radius:8px;
  transform:rotate(90deg);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="rotate">
  <div class="phone"></div>
  <h2>Telefonu yatay çevir</h2>
  <p>Turbo Road yatay ekran için tasarlandı.</p>
</div>

<div id="menu">
  <div class="box">
    <div class="logo">TURBO <span>ROAD</span></div>
    <div class="sub">5.1 PROFESSIONAL</div>

    <div class="best">
      EN YÜKSEK SKOR
      <b id="best">0</b>
    </div>

    <button id="start">YARIŞI BAŞLAT</button>

    <div class="info">
      Ekranın soluna dokun: SOL<br>
      Ekranın sağına dokun: SAĞ<br>
      Bilgisayarda: ← →
    </div>
  </div>
</div>

<button id="pause">Ⅱ</button>

<script>
(function(){

"use strict";

/* ==============================
   TEMEL
============================== */

var canvas=document.getElementById("canvas");
var ctx=canvas.getContext("2d");

var menu=document.getElementById("menu");
var startButton=document.getElementById("start");
var pauseButton=document.getElementById("pause");
var bestElement=document.getElementById("best");
var rotate=document.getElementById("rotate");

var W=window.innerWidth;
var H=window.innerHeight;

var running=false;
var paused=false;
var over=false;

var score=0;
var distance=0;
var speed=140;

var lane=1;
var playerX=0;

var cars=[];
var trees=[];

var spawnTimer=0;
var treeTimer=0;

var lastTime=0;

/* ==============================
   EN YÜKSEK SKOR
============================== */

var bestScore=0;

try{
  bestScore=parseInt(localStorage.getItem("turboRoadBest")||"0",10);
}catch(e){
  bestScore=0;
}

bestElement.innerHTML=bestScore.toLocaleString("tr-TR");

/* ==============================
   EKRAN
============================== */

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  var dpr=Math.min(window.devicePixelRatio||1,1.5);

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  if(!running){
    playerX=getLaneX(1,H*.80);
  }
}

window.addEventListener("resize",resize);
resize();

/* ==============================
   YOL GEOMETRİSİ
============================== */

function horizon(){
  return H*.30;
}

function roadCenter(y){

  var t=(y-horizon())/(H-horizon());

  if(t<0)t=0;
  if(t>1)t=1;

  return W*.5+
         Math.sin(distance*.001)*W*.035*t;
}

function roadWidth(y){

  var t=(y-horizon())/(H-horizon());

  if(t<0)t=0;
  if(t>1)t=1;

  return W*(.18+.70*Math.pow(t,.82));
}

function getLaneX(l,y){

  var y2=Math.max(horizon(),Math.min(H,y));
  var center=roadCenter(y2);
  var width=roadWidth(y2);

  return center+(l-1)*(width/3);
}

/* ==============================
   ARABA ÖLÇÜSÜ
============================== */

function getCarSize(){

  var w=Math.min(W*.085,108);

  return {
    w:w,
    h:w*1.58
  };
}

/* ==============================
   GÖKYÜZÜ
============================== */

function drawSky(){

  var g=ctx.createLinearGradient(0,0,0,H*.55);

  g.addColorStop(0,"#071521");
  g.addColorStop(.55,"#35566b");
  g.addColorStop(1,"#d39a6b");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* güneş */

  var x=W*.76;
  var y=H*.19;
  var r=Math.min(W,H)*.055;

  var sg=ctx.createRadialGradient(x,y,0,x,y,r*3);

  sg.addColorStop(0,"rgba(255,235,170,.9)");
  sg.addColorStop(.25,"rgba(255,205,110,.35)");
  sg.addColorStop(1,"rgba(255,205,110,0)");

  ctx.fillStyle=sg;
  ctx.fillRect(0,0,W,H*.6);

  ctx.fillStyle="#ffeab0";
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

/* ==============================
   ZEMİN
============================== */

function drawGround(){

  var y=horizon();

  var g=ctx.createLinearGradient(0,y,0,H);

  g.addColorStop(0,"#46633b");
  g.addColorStop(1,"#152117");

  ctx.fillStyle=g;
  ctx.fillRect(0,y,W,H-y);
}

/* ==============================
   YOL
============================== */

function drawRoad(){

  var hy=horizon();

  var tc=roadCenter(hy);
  var bc=roadCenter(H);

  var tw=roadWidth(hy);
  var bw=roadWidth(H);

  /* yol */

  ctx.beginPath();

  ctx.moveTo(tc-tw/2,hy);
  ctx.lineTo(tc+tw/2,hy);
  ctx.lineTo(bc+bw/2,H);
  ctx.lineTo(bc-bw/2,H);

  ctx.closePath();

  var g=ctx.createLinearGradient(0,hy,0,H);

  g.addColorStop(0,"#41464b");
  g.addColorStop(.5,"#252a2f");
  g.addColorStop(1,"#121519");

  ctx.fillStyle=g;
  ctx.fill();

  /* yol kenarları */

  ctx.strokeStyle="#ded7c4";
  ctx.lineWidth=Math.max(3,W*.005);

  ctx.beginPath();
  ctx.moveTo(tc-tw/2,hy);
  ctx.lineTo(bc-bw/2,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(tc+tw/2,hy);
  ctx.lineTo(bc+bw/2,H);
  ctx.stroke();

  /* şeritler */

  drawLaneMark(1);
  drawLaneMark(2);
}

function drawLaneMark(index){

  for(var i=0;i<16;i++){

    var a=i/16;
    var b=(i+.45)/16;

    var y1=horizon()+Math.pow(a,1.8)*(H-horizon());
    var y2=horizon()+Math.pow(b,1.8)*(H-horizon());

    var x1=getLaneX(index,y1);
    var x2=getLaneX(index,y2);

    ctx.strokeStyle="rgba(245,245,240,.85)";
    ctx.lineWidth=Math.max(2,W*.004);

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }
}

/* ==============================
   AĞAÇLAR
============================== */

function addTree(){

  trees.push({
    side:Math.random()<.5?-1:1,
    z:.02,
    offset:.08+Math.random()*.15
  });
}

function drawTree(x,y,size){

  /* gölge */

  ctx.fillStyle="rgba(0,0,0,.2)";

  ctx.beginPath();
  ctx.ellipse(
    x,
    y+size*.12,
    size*.55,
    size*.13,
    0,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* gövde */

  ctx.fillStyle="#63452d";

  ctx.fillRect(
    x-size*.09,
    y-size*.65,
    size*.18,
    size*.65
  );

  /* yapraklar */

  ctx.fillStyle="#173e24";

  for(var i=0;i<5;i++){

    ctx.beginPath();

    ctx.arc(
      x+(i-2)*size*.18,
      y-size*(.72+Math.abs(i-2)*.06),
      size*.27,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.fillStyle="#285d32";

  ctx.beginPath();
  ctx.arc(
    x,
    y-size*.94,
    size*.31,
    0,
    Math.PI*2
  );
  ctx.fill();
}

function updateTrees(dt){

  treeTimer-=dt;

  if(treeTimer<=0){

    treeTimer=.18+Math.random()*.25;

    addTree();
  }

  for(var i=0;i<trees.length;i++){

    trees[i].z+=dt*(speed/300)*.9;
  }

  trees=trees.filter(function(t){
    return t.z<1.1;
  });
}

function drawTrees(){

  for(var i=0;i<trees.length;i++){

    var t=trees[i];

    var y=horizon()+
          Math.pow(t.z,1.8)*
          (H-horizon());

    var rw=roadWidth(y);
    var c=roadCenter(y);

    var x=c+
          t.side*
          (rw/2+W*(.045+t.offset*t.z));

    var size=W*(.018+.13*t.z);

    drawTree(x,y,size);
  }
}

/* ==============================
   ARABA
============================== */

var colors=[
  "#e8e9e7",
  "#e43d32",
  "#2e78d2",
  "#efad25",
  "#45a75e",
  "#b94ed8"
];

function roundRect(x,y,w,h,r){

  var rr=Math.min(r,w/2,h/2);

  ctx.beginPath();

  ctx.moveTo(x+rr,y);
  ctx.lineTo(x+w-rr,y);

  ctx.quadraticCurveTo(x+w,y,x+w,y+rr);

  ctx.lineTo(x+w,y+h-rr);

  ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);

  ctx.lineTo(x+rr,y+h);

  ctx.quadraticCurveTo(x,y+h,x,y+h-rr);

  ctx.lineTo(x,y+rr);

  ctx.quadraticCurveTo(x,y,x+rr,y);

  ctx.closePath();
}

function drawCar(x,y,w,h,colorIndex,isPlayer){

  var color=colors[colorIndex%colors.length];

  ctx.save();

  ctx.translate(x,y);

  /* gölge */

  ctx.fillStyle="rgba(0,0,0,.45)";

  ctx.beginPath();
  ctx.ellipse(
    0,
    h*.47,
    w*.52,
    h*.105,
    0,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* dış gövde */

  var body=ctx.createLinearGradient(-w/2,0,w/2,0);

  body.addColorStop(0,"#090b0e");
  body.addColorStop(.14,color);
  body.addColorStop(.5,color);
  body.addColorStop(.86,color);
  body.addColorStop(1,"#090b0e");

  roundRect(
    -w*.46,
    -h*.5,
    w*.92,
    h*.98,
    w*.12
  );

  ctx.fillStyle=body;
  ctx.fill();

  /* tavan */

  var roofW=w*.60;
  var roofH=h*.34;
  var roofY=-h*.29;

  roundRect(
    -roofW/2,
    roofY,
    roofW,
    roofH,
    w*.08
  );

  var glass=ctx.createLinearGradient(
    0,roofY,
    0,roofY+roofH
  );

  glass.addColorStop(0,"#09141d");
  glass.addColorStop(.5,"#355364");
  glass.addColorStop(1,"#091118");

  ctx.fillStyle=glass;
  ctx.fill();

  /* cam orta çizgisi */

  ctx.fillStyle="rgba(255,255,255,.14)";

  ctx.fillRect(
    -w*.014,
    roofY,
    w*.028,
    roofH
  );

  /* kaput parlaması */

  ctx.fillStyle="rgba(255,255,255,.12)";

  roundRect(
    -w*.30,
    h*.05,
    w*.60,
    h*.17,
    w*.025
  );

  ctx.fill();

  /* farlar */

  ctx.fillStyle="#fff6cf";

  roundRect(
    -w*.35,
    h*.18,
    w*.18,
    h*.06,
    w*.015
  );
  ctx.fill();

  roundRect(
    w*.17,
    h*.18,
    w*.18,
    h*.06,
    w*.015
  );
  ctx.fill();

  /* ön ızgara */

  ctx.fillStyle="#111519";

  roundRect(
    -w*.23,
    h*.29,
    w*.46,
    h*.08,
    w*.02
  );

  ctx.fill();

  /* tekerlekler */

  var sides=[-1,1];

  for(var s=0;s<sides.length;s++){

    var side=sides[s];

    ctx.fillStyle="#050608";

    roundRect(
      side*w*.40-w*.065,
      -h*.31,
      w*.13,
      h*.25,
      w*.025
    );
    ctx.fill();

    roundRect(
      side*w*.40-w*.065,
      h*.13,
      w*.13,
      h*.25,
      w*.025
    );
    ctx.fill();

    ctx.fillStyle="#9ca2a6";

    ctx.beginPath();
    ctx.arc(
      side*w*.40,
      -h*.18,
      w*.033,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
      side*w*.40,
      h*.25,
      w*.033,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  /* arka stoplar */

  ctx.fillStyle="#ff2929";

  roundRect(
    -w*.36,
    -h*.40,
    w*.18,
    h*.055,
    w*.01
  );
  ctx.fill();

  roundRect(
    w*.18,
    -h*.40,
    w*.18,
    h*.055,
    w*.01
  );
  ctx.fill();

  /* oyuncu dış çizgisi */

  if(isPlayer){

    ctx.strokeStyle="rgba(255,105,25,.8)";
    ctx.lineWidth=2;

    roundRect(
      -w*.46,
      -h*.5,
      w*.92,
      h*.98,
      w*.12
    );

    ctx.stroke();
  }

  ctx.restore();
}

/* ==============================
   TRAFİK
============================== */

function spawnCar(){

  var selectedLane=Math.floor(Math.random()*3);

  for(var i=0;i<cars.length;i++){

    if(
      cars[i].lane===selectedLane &&
      cars[i].z<.20
    ){
      return;
    }
  }

  cars.push({
    lane:selectedLane,
    z:.025,
    color:Math.floor(Math.random()*colors.length),
    speed:.20+Math.random()*.16
  });
}

function updateCars(dt){

  for(var i=0;i<cars.length;i++){

    cars[i].z+=
      dt*
      (speed/300)*
      cars[i].speed;
  }

  cars=cars.filter(function(car){
    return car.z<1.12;
  });
}

function drawCars(){

  var size=getCarSize();

  cars.sort(function(a,b){
    return a.z-b.z;
  });

  for(var i=0;i<cars.length;i++){

    var car=cars[i];

    var y=horizon()+
          Math.pow(car.z,1.75)*
          (H-horizon());

    var x=getLaneX(car.lane,y);

    /*
      Oyuncu aracıyla aynı temel model.
      Uzaklık sadece perspektif oranını değiştirir.
    */

    var p=.70+car.z*.30;

    drawCar(
      x,
      y,
      size.w*p,
      size.h*p,
      car.color,
      false
    );
  }
}

/* ==============================
   ÇARPIŞMA
============================== */

function hitTest(){

  var size=getCarSize();
  var playerY=H*.80;

  for(var i=0;i<cars.length;i++){

    var car=cars[i];

    if(car.z<.70 || car.z>.99){
      continue;
    }

    var y=horizon()+
          Math.pow(car.z,1.75)*
          (H-horizon());

    var x=getLaneX(car.lane,y);

    if(
      Math.abs(x-playerX)<size.w*.62 &&
      Math.abs(y-playerY)<size.h*.50
    ){
      return true;
    }
  }

  return false;
}

/* ==============================
   OYUNCU
============================== */

function drawPlayer(){

  var size=getCarSize();

  drawCar(
    playerX,
    H*.80,
    size.w,
    size.h,
    3,
    true
  );
}

/* ==============================
   HUD
============================== */

function drawHUD(){

  if(!running)return;

  ctx.fillStyle="rgba(0,0,0,.48)";
  roundRect(14,14,165,65,14);
  ctx.fill();

  ctx.fillStyle="#9aa5af";
  ctx.font="bold 11px Arial";
  ctx.fillText("SKOR",28,35);

  ctx.fillStyle="#fff";
  ctx.font="bold 23px Arial";
  ctx.fillText(
    Math.floor(score).toLocaleString("tr-TR"),
    28,
    61
  );

  ctx.fillStyle="rgba(0,0,0,.48)";
  roundRect(W-145,14,130,65,14);
  ctx.fill();

  ctx.fillStyle="#9aa5af";
  ctx.font="bold 11px Arial";
  ctx.fillText("HIZ",W-130,35);

  ctx.fillStyle="#fff";
  ctx.font="bold 21px Arial";
  ctx.fillText(
    Math.floor(speed)+" KM/H",
    W-130,
    61
  );
}

/* ==============================
   GAME OVER
============================== */

function drawGameOver(){

  ctx.fillStyle="rgba(0,0,0,.62)";
  ctx.fillRect(0,0,W,H);

  var w=Math.min(400,W*.82);
  var h=220;
  var x=W/2-w/2;
  var y=H/2-h/2;

  ctx.fillStyle="rgba(8,12,17,.96)";
  roundRect(x,y,w,h,22);
  ctx.fill();

  ctx.strokeStyle="rgba(255,255,255,.12)";
  ctx.lineWidth=1;
  roundRect(x,y,w,h,22);
  ctx.stroke();

  ctx.textAlign="center";

  ctx.fillStyle="#fff";
  ctx.font="bold 30px Arial";
  ctx.fillText("YARIŞ BİTTİ",W/2,y+55);

  ctx.fillStyle="#ff7020";
  ctx.font="bold 34px Arial";
  ctx.fillText(
    Math.floor(score).toLocaleString("tr-TR"),
    W/2,
    y+110
  );

  ctx.fillStyle="#9ba5ae";
  ctx.font="14px Arial";
  ctx.fillText(
    "Tekrar oynamak için dokun",
    W/2,
    y+170
  );

  ctx.textAlign="left";
}

/* ==============================
   OYUN GÜNCELLEME
============================== */

function update(dt){

  if(!running || paused || over)return;

  speed=Math.min(
    310,
    speed+dt*2.0
  );

  distance+=speed*dt;

  score+=speed*dt*.055;

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnTimer=Math.max(
      .42,
      .95-distance*.000035
    );

    spawnCar();
  }

  updateCars(dt);
  updateTrees(dt);

  var targetX=getLaneX(lane,H*.80);

  playerX+=
    (targetX-playerX)*
    Math.min(1,dt*11);

  if(hitTest()){
    finishGame();
  }
}

/* ==============================
   OYUN BİTİR
============================== */

function finishGame(){

  if(over)return;

  over=true;

  if(score>bestScore){

    bestScore=Math.floor(score);

    try{
      localStorage.setItem(
        "turboRoadBest",
        String(bestScore)
      );
    }catch(e){}

    bestElement.innerHTML=
      bestScore.toLocaleString("tr-TR");
  }
}

/* ==============================
   ANA ÇİZİM
============================== */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawSky();
  drawGround();
  drawTrees();
  drawRoad();
  drawCars();
  drawPlayer();
  drawHUD();

  if(over){
    drawGameOver();
  }
}

/* ==============================
   OYUN DÖNGÜSÜ
============================== */

function loop(time){

  if(!lastTime){
    lastTime=time;
  }

  var dt=(time-lastTime)/1000;

  if(dt>.04){
    dt=.04;
  }

  lastTime=time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* ==============================
   BAŞLAT
============================== */

function startGame(){

  running=true;
  paused=false;
  over=false;

  score=0;
  distance=0;
  speed=140;

  lane=1;
  playerX=getLaneX(1,H*.80);

  cars=[];
  trees=[];

  spawnTimer=.8;
  treeTimer=.05;

  menu.style.display="none";
  pauseButton.style.display="block";

  checkOrientation();

  try{

    if(
      document.documentElement.requestFullscreen &&
      !document.fullscreenElement
    ){
      document.documentElement.requestFullscreen();
    }

  }catch(e){}
}

startButton.addEventListener("click",function(e){

  e.preventDefault();
  startGame();

});

/* ==============================
   DURAKLAT
============================== */

pauseButton.addEventListener("click",function(){

  if(!running || over)return;

  paused=!paused;

  pauseButton.innerHTML=paused?"▶":"Ⅱ";
});

/* ==============================
   KONTROLLER
============================== */

function left(){

  if(!running || paused || over)return;

  lane--;

  if(lane<0)lane=0;
}

function right(){

  if(!running || paused || over)return;

  lane++;

  if(lane>2)lane=2;
}

var touchStartX=0;
var touchStartY=0;

canvas.addEventListener("touchstart",function(e){

  if(over){
    startGame();
    return;
  }

  if(!e.touches.length)return;

  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;

},{passive:true});

canvas.addEventListener("touchend",function(e){

  if(!running || paused || over)return;

  if(!e.changedTouches.length)return;

  var x=e.changedTouches[0].clientX;
  var y=e.changedTouches[0].clientY;

  var dx=x-touchStartX;
  var dy=y-touchStartY;

  if(Math.abs(dx)>35 && Math.abs(dx)>Math.abs(dy)){

    if(dx<0){
      left();
    }else{
      right();
    }

    return;
  }

  if(x<W/2){
    left();
  }else{
    right();
  }

},{passive:true});

/* ==============================
   PC KONTROL
============================== */

window.addEventListener("keydown",function(e){

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    e.preventDefault();
    left();
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    e.preventDefault();
    right();
  }

  if(e.key===" "){
    e.preventDefault();

    if(running && !over){
      paused=!paused;
      pauseButton.innerHTML=paused?"▶":"Ⅱ";
    }
  }

  if(e.key==="Enter" && over){
    startGame();
  }
});

/* ==============================
   YATAY EKRAN
============================== */

function checkOrientation(){

  if(!running){
    rotate.style.display="none";
    return;
  }

  if(window.innerHeight>window.innerWidth){
    rotate.style.display="flex";
  }else{
    rotate.style.display="none";
  }
}

window.addEventListener("resize",checkOrientation);

/* ==============================
   BAŞLANGIÇ SAHNESİ
============================== */

for(var i=0;i<12;i++){

  trees.push({
    side:i%2===0?-1:1,
    z:.04+i*.075,
    offset:.08+Math.random()*.12
  });
}

playerX=getLaneX(1,H*.80);

draw();

})();
</script>
