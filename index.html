<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05080d">
<title>Turbo Road X</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080d;
  font-family:Arial,sans-serif;
  touch-action:none;
}

body{
  position:fixed;
}

canvas{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  padding:12px;
  display:flex;
  justify-content:space-between;
  z-index:10;
  pointer-events:none;
}

.box{
  min-width:90px;
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  background:rgba(5,8,13,.78);
  color:white;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.small{
  font-size:10px;
  color:#aab4bf;
  text-transform:uppercase;
}

.big{
  margin-top:2px;
  font-size:17px;
  font-weight:bold;
}

#pause{
  position:fixed;
  right:12px;
  top:74px;
  width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:50%;
  background:rgba(5,8,13,.8);
  color:white;
  font-size:18px;
  z-index:15;
}

#nitroWrap{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:300px;
  max-width:55%;
  height:12px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  overflow:hidden;
  background:rgba(0,0,0,.6);
  z-index:12;
}

#nitro{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#00a9ff,#66f5ff);
}

.touch{
  position:fixed;
  bottom:0;
  width:50%;
  height:48%;
  z-index:5;
}

#left{
  left:0;
}

#right{
  right:0;
}

#menu,
#over{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(
    rgba(2,5,9,.45),
    rgba(2,5,9,.9)
  );
}

#over{
  display:none;
}

.panel{
  width:90%;
  max-width:420px;
  padding:28px;
  text-align:center;
  color:white;
  border:1px solid rgba(255,255,255,.14);
  border-radius:24px;
  background:rgba(7,11,17,.94);
  box-shadow:0 20px 80px rgba(0,0,0,.6);
}

.logo{
  font-size:34px;
  font-weight:900;
  letter-spacing:2px;
}

.sub{
  margin-top:7px;
  color:#9eaab7;
  font-size:13px;
}

.stat{
  display:flex;
  justify-content:space-between;
  padding:11px 0;
  color:#b9c3cc;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.stat strong{
  color:white;
}

.main{
  width:100%;
  margin-top:24px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#e21d32;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.main:active{
  transform:scale(.98);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="box">
    <div class="small">Skor</div>
    <div class="big" id="score">0</div>
  </div>

  <div class="box">
    <div class="small">Para</div>
    <div class="big" id="money">$0</div>
  </div>

  <div class="box">
    <div class="small">Hız</div>
    <div class="big">
      <span id="speed">0</span> KM/H
    </div>
  </div>
</div>

<button id="pause">Ⅱ</button>

<div id="nitroWrap">
  <div id="nitro"></div>
</div>

<div id="left" class="touch"></div>
<div id="right" class="touch"></div>

<div id="menu">
  <div class="panel">

    <div class="logo">TURBO ROAD X</div>

    <div class="sub">
      HIGHWAY TRAFFIC RACING
    </div>

    <div class="stat">
      <span>Araç</span>
      <strong>1969 Mustang</strong>
    </div>

    <div class="stat">
      <span>Yol</span>
      <strong>3 Şerit</strong>
    </div>

    <div class="stat">
      <span>Kontrol</span>
      <strong>Sol / Sağ</strong>
    </div>

    <button class="main" id="start">
      YARIŞA BAŞLA
    </button>

  </div>
</div>

<div id="over">
  <div class="panel">

    <div class="logo">KAZA!</div>

    <div class="stat">
      <span>Skor</span>
      <strong id="finalScore">0</strong>
    </div>

    <div class="stat">
      <span>Kazanılan Para</span>
      <strong id="finalMoney">$0</strong>
    </div>

    <button class="main" id="restart">
      TEKRAR YARIŞ
    </button>

  </div>
</div>

<script>
(function(){

"use strict";

/* =========================
   TEMEL
========================= */

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var W = 0;
var H = 0;

function resize(){

  W = window.innerWidth;
  H = window.innerHeight;

  if(W < 320){
    W = 320;
  }

  if(H < 480){
    H = 480;
  }

  canvas.width = W;
  canvas.height = H;
}

resize();

window.addEventListener("resize",resize);


/* =========================
   OYUN DEĞİŞKENLERİ
========================= */

var running = false;
var paused = false;

var score = 0;
var money = 0;

var gameSpeed = 300;
var playerOffset = 0;

var steer = 0;

var nitro = 100;
var nitroActive = false;

var roadScroll = 0;

var traffic = [];

var spawnTimer = 0;

var elapsed = 0;


/* =========================
   YOL
========================= */

var ROAD_LEFT = 0.18;
var ROAD_RIGHT = 0.82;

function roadLeft(){
  return W * ROAD_LEFT;
}

function roadRight(){
  return W * ROAD_RIGHT;
}

function roadWidth(){
  return roadRight() - roadLeft();
}

function laneWidth(){
  return roadWidth() / 3;
}

function laneX(lane){
  return roadLeft() + laneWidth() * lane + laneWidth() / 2;
}


/* =========================
   ARAÇ BOYUTU
========================= */

var CAR_SCALE = 0.70;

var CAR_W = 48 * CAR_SCALE;
var CAR_H = 88 * CAR_SCALE;


/* =========================
   OYUNCU
========================= */

function playerX(){
  return W / 2 + playerOffset * roadWidth() * 0.36;
}

function playerY(){
  return H * 0.78;
}


/* =========================
   YARDIMCI
========================= */

function clamp(v,min,max){
  if(v < min) return min;
  if(v > max) return max;
  return v;
}

function random(min,max){
  return Math.random() * (max-min) + min;
}


/* =========================
   YOL ÇİZ
========================= */

function drawRoad(){

  var left = roadLeft();
  var right = roadRight();

  /* Arka plan */

  ctx.fillStyle = "#4e703f";
  ctx.fillRect(0,0,W,H);

  /* Çim detayları */

  var i;

  for(i=0;i<35;i++){

    var tx = (i * 97) % W;
    var ty = ((i * 151 + roadScroll * .25) % H);

    ctx.fillStyle = i % 2 === 0 ? "#5c7d47" : "#45683a";

    ctx.fillRect(tx,ty,2,7);
  }


  /* Yol */

  ctx.fillStyle = "#252a2f";
  ctx.fillRect(left,0,right-left,H);


  /* Yol omuzları */

  ctx.fillStyle = "#b7b7b7";

  ctx.fillRect(left-5,0,5,H);
  ctx.fillRect(right,0,5,H);


  /* Beyaz kenar çizgileri */

  ctx.fillStyle = "#f2f2f2";

  ctx.fillRect(left+4,0,3,H);
  ctx.fillRect(right-7,0,3,H);


  /* Şerit çizgileri */

  var lw = laneWidth();

  ctx.fillStyle = "rgba(255,255,255,.85)";

  var dashH = 55;
  var gap = 35;

  var offset = roadScroll % (dashH+gap);

  var lane;

  for(lane=1;lane<=2;lane++){

    var x = left + lw * lane;

    var y = -dashH + offset;

    while(y < H){

      ctx.fillRect(x-2,y,4,dashH);

      y += dashH + gap;
    }
  }


  /* Yol ışıkları / direkler */

  var postOffset = roadScroll % 170;

  var py = -170 + postOffset;

  while(py < H){

    drawRoadPost(left-28,py);
    drawRoadPost(right+28,py);

    py += 170;
  }
}


/* =========================
   YOL DİREĞİ
========================= */

function drawRoadPost(x,y){

  ctx.fillStyle = "#d8d8d8";
  ctx.fillRect(x-2,y,4,27);

  ctx.fillStyle = "#f8f8f8";
  ctx.fillRect(x-7,y,14,7);

  ctx.fillStyle = "#777";
  ctx.fillRect(x-4,y+7,8,3);
}


/* =========================
   ARABA
========================= */

function roundedRect(x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);

  ctx.closePath();
}


/* =========================
   ARABA ÇİZİMİ
========================= */

function drawCar(x,y,color,isPlayer){

  var w = CAR_W;
  var h = CAR_H;

  var left = x - w/2;
  var top = y - h/2;

  ctx.save();

  /* Gölge */

  ctx.fillStyle = "rgba(0,0,0,.38)";

  roundedRect(
    left+3,
    top+5,
    w,
    h,
    9
  );

  ctx.fill();


  /* Gövde */

  ctx.fillStyle = color;

  roundedRect(
    left,
    top,
    w,
    h,
    9
  );

  ctx.fill();


  /* Kaput */

  ctx.fillStyle = isPlayer ? "#b41124" : "#22282e";

  roundedRect(
    left+5,
    top+5,
    w-10,
    h*.25,
    6
  );

  ctx.fill();


  /* Cam */

  ctx.fillStyle = "#172630";

  roundedRect(
    left+6,
    top+h*.29,
    w-12,
    h*.28,
    5
  );

  ctx.fill();


  /* Cam parlaması */

  ctx.fillStyle = "rgba(180,235,255,.35)";

  ctx.fillRect(
    left+9,
    top+h*.32,
    w-18,
    4
  );


  /* Orta çizgi */

  ctx.fillStyle = "rgba(255,255,255,.18)";

  ctx.fillRect(
    x-1,
    top+h*.59,
    2,
    h*.27
  );


  /* Farlar */

  ctx.fillStyle = "#fff7bd";

  ctx.fillRect(
    left+5,
    top+4,
    8,
    4
  );

  ctx.fillRect(
    left+w-13,
    top+4,
    8,
    4
  );


  /* Stop lambaları */

  ctx.fillStyle = "#e3162d";

  ctx.fillRect(
    left+5,
    top+h-8,
    9,
    4
  );

  ctx.fillRect(
    left+w-14,
    top+h-8,
    9,
    4
  );


  /* Lastikler */

  ctx.fillStyle = "#090b0d";

  ctx.fillRect(
    left-3,
    top+17,
    5,
    17
  );

  ctx.fillRect(
    left+w-2,
    top+17,
    5,
    17
  );

  ctx.fillRect(
    left-3,
    top+h-34,
    5,
    17
  );

  ctx.fillRect(
    left+w-2,
    top+h-34,
    5,
    17
  );


  /* Mustang oyuncu detay */

  if(isPlayer){

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
      left+5,
      top+h*.61,
      w-10,
      3
    );

    ctx.fillStyle = "#f0b429";

    ctx.fillRect(
      left+8,
      top+h*.72,
      w-16,
      3
    );
  }

  ctx.restore();
}


/* =========================
   TRAFİK KONTROL
========================= */

function laneBlocked(lane,y,gap){

  var i;

  for(i=0;i<traffic.length;i++){

    if(
      traffic[i].lane === lane &&
      Math.abs(traffic[i].y-y) < gap
    ){
      return true;
    }
  }

  return false;
}


function chooseLane(){

  var available = [];
  var i;

  for(i=0;i<3;i++){

    if(!laneBlocked(i,-100,120)){
      available.push(i);
    }
  }

  if(available.length === 0){

    return Math.floor(Math.random()*3);
  }

  return available[
    Math.floor(Math.random()*available.length)
  ];
}


/* =========================
   TRAFİK OLUŞTUR
========================= */

function spawnTraffic(){

  var lane = chooseLane();

  var colors = [
    "#f1f1f1",
    "#171b20",
    "#1686d9",
    "#e3aa22",
    "#329b5b",
    "#c52b39",
    "#7445c5",
    "#b8b8b8"
  ];

  var car = {

    lane:lane,

    x:laneX(lane),

    y:-CAR_H-40,

    speed:random(235,315),

    color:colors[
      Math.floor(Math.random()*colors.length)
    ],

    passed:false
  };

  traffic.push(car);
}


/* =========================
   TRAFİK GÜNCELLE
========================= */

function updateTraffic(dt){

  var i;

  for(i=traffic.length-1;i>=0;i--){

    var car = traffic[i];

    car.y += car.speed * dt;

    /* Oyuncuyu geçti */

    if(!car.passed && car.y > playerY()+CAR_H){

      car.passed = true;

      score += 10;
      money += 1;
    }

    /* Sil */

    if(car.y > H+CAR_H+60){

      traffic.splice(i,1);
    }
  }
}


/* =========================
   ÇARPIŞMA
========================= */

function collision(){

  var px = playerX();
  var py = playerY();

  var i;

  for(i=0;i<traffic.length;i++){

    var c = traffic[i];

    if(
      Math.abs(px-c.x) < CAR_W*.62 &&
      Math.abs(py-c.y) < CAR_H*.58
    ){

      return true;
    }
  }

  return false;
}


/* =========================
   OYUNCU
========================= */

function updatePlayer(dt){

  var move = steer;

  if(move !== 0){

    playerOffset += move * dt * 1.65;
  }

  playerOffset = clamp(
    playerOffset,
    -0.92,
    0.92
  );


  /* Nitro */

  if(nitroActive && nitro > 0){

    nitro -= 34 * dt;

    if(nitro < 0){
      nitro = 0;
    }

    gameSpeed = 470;

  }else{

    if(nitro < 100){

      nitro += 10 * dt;

      if(nitro > 100){
        nitro = 100;
      }
    }

    gameSpeed = 300 + Math.min(score*.8,90);
  }
}


/* =========================
   HUD
========================= */

function updateHUD(){

  document.getElementById("score").innerHTML =
    Math.floor(score);

  document.getElementById("money").innerHTML =
    "$" + Math.floor(money);

  document.getElementById("speed").innerHTML =
    Math.floor(gameSpeed * .38);

  document.getElementById("nitro").style.width =
    nitro + "%";
}


/* =========================
   TRAFİK ÇİZ
========================= */

function drawTraffic(){

  var i;

  for(i=0;i<traffic.length;i++){

    drawCar(
      traffic[i].x,
      traffic[i].y,
      traffic[i].color,
      false
    );
  }
}


/* =========================
   OYUNCU ÇİZ
========================= */

function drawPlayer(){

  drawCar(
    playerX(),
    playerY(),
    "#d7192e",
    true
  );
}


/* =========================
   OYUN BAŞLAT
========================= */

function startGame(){

  document.getElementById("menu").style.display="none";
  document.getElementById("over").style.display="none";

  running=true;
  paused=false;

  score=0;
  money=0;

  playerOffset=0;

  nitro=100;

  traffic=[];

  spawnTimer=.5;

  elapsed=0;

  steer=0;

  updateHUD();
}


/* =========================
   OYUN BİTİR
========================= */

function gameOver(){

  running=false;

  document.getElementById("finalScore").innerHTML =
    Math.floor(score);

  document.getElementById("finalMoney").innerHTML =
    "$" + Math.floor(money);

  document.getElementById("over").style.display =
    "flex";
}


/* =========================
   PAUSE
========================= */

document.getElementById("pause").onclick=function(){

  if(!running){
    return;
  }

  paused=!paused;

  if(paused){

    document.getElementById("pause").innerHTML="▶";

  }else{

    document.getElementById("pause").innerHTML="Ⅱ";
  }
};


/* =========================
   BUTONLAR
========================= */

document.getElementById("start").onclick=function(){
  startGame();
};

document.getElementById("restart").onclick=function(){
  startGame();
};


/* =========================
   KLAVYE
========================= */

var keys={
  left:false,
  right:false,
  nitro:false
};

window.addEventListener("keydown",function(e){

  var k=e.key.toLowerCase();

  if(k==="arrowleft" || k==="a"){
    keys.left=true;
  }

  if(k==="arrowright" || k==="d"){
    keys.right=true;
  }

  if(k==="shift" || k===" "){
    keys.nitro=true;
  }

  if(k==="p"){
    if(running){
      paused=!paused;
    }
  }

});


window.addEventListener("keyup",function(e){

  var k=e.key.toLowerCase();

  if(k==="arrowleft" || k==="a"){
    keys.left=false;
  }

  if(k==="arrowright" || k==="d"){
    keys.right=false;
  }

  if(k==="shift" || k===" "){
    keys.nitro=false;
  }

});


/* =========================
   TOUCH
========================= */

var leftArea=document.getElementById("left");
var rightArea=document.getElementById("right");


leftArea.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    keys.left=true;

  },
  {passive:false}
);


leftArea.addEventListener(
  "touchend",
  function(e){

    e.preventDefault();

    keys.left=false;

  },
  {passive:false}
);


leftArea.addEventListener(
  "touchcancel",
  function(){

    keys.left=false;

  },
  {passive:false}
);


rightArea.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    keys.right=true;

  },
  {passive:false}
);


rightArea.addEventListener(
  "touchend",
  function(e){

    e.preventDefault();

    keys.right=false;

  },
  {passive:false}
);


rightArea.addEventListener(
  "touchcancel",
  function(){

    keys.right=false;

  },
  {passive:false}
);


/* =========================
   MOUSE
========================= */

leftArea.addEventListener("mousedown",function(){
  keys.left=true;
});

leftArea.addEventListener("mouseup",function(){
  keys.left=false;
});

leftArea.addEventListener("mouseleave",function(){
  keys.left=false;
});

rightArea.addEventListener("mousedown",function(){
  keys.right=true;
});

rightArea.addEventListener("mouseup",function(){
  keys.right=false;
});

rightArea.addEventListener("mouseleave",function(){
  keys.right=false;
});


/* =========================
   NITRO TOUCH
========================= */

window.addEventListener(
  "touchstart",
  function(e){

    if(e.touches.length >= 2){

      nitroActive=true;
    }

  },
  {passive:false}
);


window.addEventListener(
  "touchend",
  function(e){

    if(e.touches.length < 2){

      nitroActive=false;
    }

  },
  {passive:false}
);


/* =========================
   ANA DÖNGÜ
========================= */

var lastTime = Date.now();

function gameLoop(){

  var now = Date.now();

  var dt = (now-lastTime)/1000;

  lastTime=now;

  if(dt > .05){
    dt=.05;
  }

  if(running && !paused){

    elapsed += dt;

    /* Klavye direksiyon */

    if(keys.left && !keys.right){

      steer=-1;

    }else if(keys.right && !keys.left){

      steer=1;

    }else{

      steer=0;
    }


    /* Nitro */

    nitroActive=keys.nitro;


    updatePlayer(dt);

    updateTraffic(dt);


    /* Trafik oluştur */

    spawnTimer -= dt;

    if(spawnTimer <= 0){

      spawnTraffic();

      /*
        Araçların beraber gelmemesi için
        aralık değişken.
      */

      spawnTimer =
        random(.65,1.25);

    }


    /* Yol hareketi */

    roadScroll += gameSpeed * dt;


    /* Çarpışma */

    if(collision()){

      gameOver();
    }

    updateHUD();
  }


  /* Çiz */

  drawRoad();

  drawTraffic();

  if(running){

    drawPlayer();
  }


  window.requestAnimationFrame(gameLoop);
}


/* =========================
   ANİMASYON FALLBACK
========================= */

if(!window.requestAnimationFrame){

  window.requestAnimationFrame =
    window.webkitRequestAnimationFrame ||
    function(callback){

      return window.setTimeout(
        function(){
          callback(Date.now());
        },
        16
      );
    };
}


/* =========================
   BAŞLAT
========================= */

gameLoop();

})();
</script>

</body>
</html>
