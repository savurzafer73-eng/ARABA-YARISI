<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Mustang Highway</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
    background:#222;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#top{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    width:min(94vw,650px);
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.box{
    background:rgba(0,0,0,.65);
    color:white;
    border:1px solid rgba(255,255,255,.2);
    border-radius:12px;
    padding:8px 12px;
    min-width:90px;
    text-align:center;
    backdrop-filter:blur(5px);
}

.label{
    font-size:10px;
    opacity:.7;
}

.value{
    font-size:18px;
    font-weight:bold;
}

#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(88vw,430px);
    padding:25px;
    text-align:center;
    color:white;
    background:rgba(0,0,0,.82);
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    pointer-events:auto;
    display:none;
}

#message h1{
    margin:0 0 10px;
    font-size:30px;
}

#message p{
    margin:8px 0 20px;
    opacity:.8;
}

#startBtn{
    border:0;
    border-radius:14px;
    padding:14px 28px;
    font-size:18px;
    font-weight:bold;
    background:#e53935;
    color:white;
    cursor:pointer;
}

#controls{
    position:absolute;
    bottom:max(18px,env(safe-area-inset-bottom));
    left:0;
    right:0;
    display:flex;
    justify-content:space-between;
    padding:0 18px;
    pointer-events:auto;
}

.control{
    width:min(31vw,145px);
    height:min(18vw,90px);
    min-height:65px;
    border-radius:20px;
    border:2px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.45);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    backdrop-filter:blur(5px);
    touch-action:none;
}

.control:active{
    background:rgba(255,255,255,.2);
    transform:scale(.96);
}

#hint{
    position:absolute;
    bottom:115px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.4);
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    white-space:nowrap;
}

@media(min-width:800px){
    #controls{
        bottom:25px;
        padding:0 35px;
    }

    .control{
        width:120px;
        height:75px;
    }

    #hint{
        bottom:110px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

    <div id="top">
        <div class="box">
            <div class="label">SKOR</div>
            <div class="value" id="score">0</div>
        </div>

        <div class="box">
            <div class="label">HIZ</div>
            <div class="value"><span id="speed">0</span> km/h</div>
        </div>

        <div class="box">
            <div class="label">EN YÜKSEK</div>
            <div class="value" id="best">0</div>
        </div>
    </div>

    <div id="message">
        <h1 id="messageTitle">MUSTANG HIGHWAY</h1>
        <p id="messageText">
            1969 Mustang ile trafiğin arasından ilerle!
        </p>
        <button id="startBtn">OYUNA BAŞLA</button>
    </div>

    <div id="hint">Telefon: sol/sağ alanlara dokun • Bilgisayar: ← →</div>

    <div id="controls">
        <div class="control" id="left">◀</div>
        <div class="control" id="right">▶</div>
    </div>

</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;

let running = false;
let gameOver = false;

let score = 0;
let best = Number(localStorage.getItem("mustangBest") || 0);

let roadX = 0;
let roadWidth = 0;
let laneWidth = 0;

let player = {
    x:0,
    y:0,
    width:60,
    height:105,
    targetX:0
};

let traffic = [];
let particles = [];

let leftPressed = false;
let rightPressed = false;

let speed = 6;
let distance = 0;
let spawnTimer = 0;
let lastTime = 0;

document.getElementById("best").textContent = best;

function resize(){

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    roadWidth = Math.min(W * .82, 520);
    roadX = (W - roadWidth) / 2;
    laneWidth = roadWidth / 3;

    player.width = Math.min(62, W * .14);
    player.height = player.width * 1.72;

    if(!running){
        player.x = W / 2 - player.width / 2;
        player.targetX = player.x;
        player.y = H - player.height - 125;
    }
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", ()=>setTimeout(resize,150));

resize();

function showStart(){

    running = false;
    gameOver = false;

    document.getElementById("message").style.display = "block";
    document.getElementById("messageTitle").textContent = "MUSTANG HIGHWAY";
    document.getElementById("messageText").textContent =
        "1969 Mustang ile trafiğin arasından ilerle!";

    document.getElementById("startBtn").textContent = "OYUNA BAŞLA";
}

function startGame(){

    score = 0;
    distance = 0;
    speed = 6;
    traffic = [];
    particles = [];
    spawnTimer = 0;

    player.x = W / 2 - player.width / 2;
    player.targetX = player.x;
    player.y = H - player.height - 125;

    running = true;
    gameOver = false;

    document.getElementById("message").style.display = "none";

    lastTime = performance.now();
    requestAnimationFrame(loop);
}

function endGame(){

    running = false;
    gameOver = true;

    if(score > best){
        best = score;
        localStorage.setItem("mustangBest",best);
        document.getElementById("best").textContent = best;
    }

    document.getElementById("message").style.display = "block";
    document.getElementById("messageTitle").textContent = "KAZA!";
    document.getElementById("messageText").textContent =
        "Skorun: " + score + " • En yüksek: " + best;

    document.getElementById("startBtn").textContent = "TEKRAR OYNA";
}

document.getElementById("startBtn").addEventListener("click",startGame);

function road(){

    // gökyüzü
    let sky = ctx.createLinearGradient(0,0,0,H*.45);
    sky.addColorStop(0,"#77b7e8");
    sky.addColorStop(1,"#dcefff");

    ctx.fillStyle = sky;
    ctx.fillRect(0,0,W,H);

    // uzak tepeler
    ctx.fillStyle = "#6c806c";

    ctx.beginPath();
    ctx.moveTo(0,H*.40);

    for(let x=0;x<=W;x+=40){
        let y = H*.35 + Math.sin(x*.012)*30;
        ctx.lineTo(x,y);
    }

    ctx.lineTo(W,H*.55);
    ctx.lineTo(0,H*.55);
    ctx.closePath();
    ctx.fill();

    // çim
    ctx.fillStyle = "#527d42";
    ctx.fillRect(0,H*.42,W,H*.58);

    // yol
    ctx.fillStyle = "#303030";
    ctx.fillRect(roadX,0,roadWidth,H);

    // yol kenar çizgileri
    ctx.fillStyle = "#f4f4f4";
    ctx.fillRect(roadX+4,0,5,H);
    ctx.fillRect(roadX+roadWidth-9,0,5,H);

    // şerit çizgileri
    ctx.strokeStyle = "#eee";
    ctx.lineWidth = 4;
    ctx.setLineDash([32,30]);

    let offset = (distance*1.3)%62;

    for(let i=1;i<3;i++){

        let x = roadX + laneWidth*i;

        ctx.beginPath();
        ctx.moveTo(x,-80+offset);
        ctx.lineTo(x,H+80);
        ctx.stroke();
    }

    ctx.setLineDash([]);

    // yol kenarı küçük direkler
    for(let y=(-50+(distance*.7)%80);y<H;y+=80){

        ctx.fillStyle="#fff";
        ctx.fillRect(roadX-18,y,7,28);
        ctx.fillRect(roadX+roadWidth+11,y,7,28);
    }
}

function drawMustang(x,y,w,h){

    ctx.save();
    ctx.translate(x,y);

    // gölge
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.ellipse(w/2,h*.88,w*.48,h*.12,0,0,Math.PI*2);
    ctx.fill();

    // tekerlekler
    ctx.fillStyle="#101010";

    roundRect(ctx,w*.03,h*.25,w*.18,h*.40,8);
    roundRect(ctx,w*.79,h*.25,w*.18,h*.40,8);

    // gövde
    let body = ctx.createLinearGradient(0,0,w,0);
    body.addColorStop(0,"#7b1010");
    body.addColorStop(.5,"#e22");
    body.addColorStop(1,"#7b1010");

    ctx.fillStyle=body;

    roundRect(ctx,w*.12,h*.10,w*.76,h*.76,14);

    // kaput
    ctx.fillStyle="#b81717";
    roundRect(ctx,w*.18,h*.02,w*.64,h*.24,10);

    // ön ızgara
    ctx.fillStyle="#151515";
    roundRect(ctx,w*.19,h*.73,w*.62,h*.12,4);

    // farlar
    ctx.fillStyle="#ffeaa0";

    ctx.beginPath();
    ctx.arc(w*.25,h*.79,w*.07,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(w*.75,h*.79,w*.07,0,Math.PI*2);
    ctx.fill();

    // cam
    ctx.fillStyle="#263b4a";

    ctx.beginPath();
    ctx.moveTo(w*.25,h*.27);
    ctx.lineTo(w*.75,h*.27);
    ctx.lineTo(w*.67,h*.48);
    ctx.lineTo(w*.33,h*.48);
    ctx.closePath();
    ctx.fill();

    // cam yansıması
    ctx.fillStyle="rgba(255,255,255,.25)";
    ctx.beginPath();
    ctx.moveTo(w*.32,h*.29);
    ctx.lineTo(w*.53,h*.29);
    ctx.lineTo(w*.39,h*.45);
    ctx.closePath();
    ctx.fill();

    // Mustang çizgisi
    ctx.fillStyle="#f4f4f4";
    ctx.fillRect(w*.12,h*.58,w*.76,h*.035);

    // kapı çizgileri
    ctx.strokeStyle="rgba(0,0,0,.3)";
    ctx.lineWidth=1;

    ctx.beginPath();
    ctx.moveTo(w*.3,h*.51);
    ctx.lineTo(w*.3,h*.70);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(w*.7,h*.51);
    ctx.lineTo(w*.7,h*.70);
    ctx.stroke();

    ctx.restore();
}

function drawTrafficCar(car){

    ctx.save();

    ctx.translate(car.x,car.y);

    let w=car.width;
    let h=car.height;

    ctx.fillStyle="rgba(0,0,0,.3)";
    ctx.beginPath();
    ctx.ellipse(w/2,h*.9,w*.45,h*.10,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=car.color;

    roundRect(ctx,w*.12,h*.08,w*.76,h*.78,12);

    ctx.fillStyle="#182b36";

    ctx.beginPath();
    ctx.moveTo(w*.25,h*.25);
    ctx.lineTo(w*.75,h*.25);
    ctx.lineTo(w*.66,h*.48);
    ctx.lineTo(w*.34,h*.48);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#222";

    roundRect(ctx,w*.04,h*.28,w*.16,h*.35,6);
    roundRect(ctx,w*.80,h*.28,w*.16,h*.35,6);

    ctx.fillStyle="#ffdf85";

    ctx.beginPath();
    ctx.arc(w*.25,h*.78,w*.07,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(w*.75,h*.78,w*.07,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function roundRect(c,x,y,w,h,r){

    c.beginPath();

    c.moveTo(x+r,y);
    c.lineTo(x+w-r,y);
    c.quadraticCurveTo(x+w,y,x+w,y+r);
    c.lineTo(x+w,y+h-r);
    c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    c.lineTo(x+r,y+h);
    c.quadraticCurveTo(x,y+h,x,y+h-r);
    c.lineTo(x,y+r);
    c.quadraticCurveTo(x,y,x+r,y);

    c.closePath();
    c.fill();
}

function spawnCar(){

    let lane=Math.floor(Math.random()*3);

    let width=Math.min(58,W*.13);
    let height=width*1.55;

    let colors=[
        "#1976d2",
        "#f5f5f5",
        "#222",
        "#fbc02d",
        "#7b1fa2",
        "#00897b"
    ];

    traffic.push({
        x:roadX+laneWidth*lane+laneWidth/2-width/2,
        y:-height-30,
        width:width,
        height:height,
        speed:2+Math.random()*2.5,
        color:colors[Math.floor(Math.random()*colors.length)]
    });
}

function update(dt){

    distance += speed*dt*60;

    speed += .0015*dt*60;

    if(speed>13) speed=13;

    score = Math.floor(distance/12);

    document.getElementById("score").textContent=score;
    document.getElementById("speed").textContent=Math.floor(speed*22);

    // hareket
    let moveSpeed = 8 * dt * 60;

    if(leftPressed){
        player.targetX -= moveSpeed;
    }

    if(rightPressed){
        player.targetX += moveSpeed;
    }

    let minX=roadX+10;
    let maxX=roadX+roadWidth-player.width-10;

    player.targetX=Math.max(minX,Math.min(maxX,player.targetX));

    player.x += (player.targetX-player.x)*.22;

    // trafik
    spawnTimer -= dt;

    let spawnRate=Math.max(.42,1.0-speed*.045);

    if(spawnTimer<=0){
        spawnCar();
        spawnTimer=spawnRate;
    }

    for(let i=traffic.length-1;i>=0;i--){

        let car=traffic[i];

        car.y += (speed+car.speed)*dt*60;

        if(car.y>H+100){
            traffic.splice(i,1);
            continue;
        }

        if(collide(player,car)){
            createCrash();
            endGame();
            return;
        }
    }

    updateParticles(dt);
}

function collide(a,b){

    let padX=8;
    let padY=12;

    return (
        a.x+padX < b.x+b.width-padX &&
        a.x+a.width-padX > b.x+padX &&
        a.y+padY < b.y+b.height-padY &&
        a.y+a.height-padY > b.y+padY
    );
}

function createCrash(){

    for(let i=0;i<35;i++){

        particles.push({
            x:player.x+player.width/2,
            y:player.y+player.height*.5,
            vx:(Math.random()-.5)*8,
            vy:(Math.random()-.5)*8,
            life:1,
            size:Math.random()*5+2
        });
    }
}

function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.x+=p.vx*dt*60;
        p.y+=p.vy*dt*60;
        p.vy+=.15*dt*60;
        p.life-=dt;

        if(p.life<=0)
            particles.splice(i,1);
    }
}

function drawParticles(){

    for(let p of particles){

        ctx.globalAlpha=Math.max(0,p.life);
        ctx.fillStyle="#ffd54f";

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }

    ctx.globalAlpha=1;
}

function draw(){

    road();

    for(let car of traffic)
        drawTrafficCar(car);

    drawMustang(
        player.x,
        player.y,
        player.width,
        player.height
    );

    drawParticles();
}

function loop(time){

    if(!running)
        return;

    let dt=(time-lastTime)/1000;

    dt=Math.min(dt,.035);

    lastTime=time;

    update(dt);
    draw();

    if(running)
        requestAnimationFrame(loop);
}

function setControl(button,type){

    function down(e){

        e.preventDefault();

        if(type==="left")
            leftPressed=true;

        if(type==="right")
            rightPressed=true;
    }

    function up(e){

        e.preventDefault();

        if(type==="left")
            leftPressed=false;

        if(type==="right")
            rightPressed=false;
    }

    button.addEventListener("pointerdown",down,{passive:false});
    button.addEventListener("pointerup",up,{passive:false});
    button.addEventListener("pointercancel",up,{passive:false});
    button.addEventListener("pointerleave",up,{passive:false});
}

setControl(document.getElementById("left"),"left");
setControl(document.getElementById("right"),"right");

// Telefon ekranının sol/sağ tarafına dokunma
canvas.addEventListener("pointerdown",function(e){

    if(!running) return;

    if(e.clientX < W/2){
        leftPressed=true;
    }else{
        rightPressed=true;
    }
},{passive:false});

canvas.addEventListener("pointerup",function(){
    leftPressed=false;
    rightPressed=false;
});

canvas.addEventListener("pointercancel",function(){
    leftPressed=false;
    rightPressed=false;
});

// Bilgisayar klavyesi
window.addEventListener("keydown",function(e){

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
        leftPressed=true;
        e.preventDefault();
    }

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
        rightPressed=true;
        e.preventDefault();
    }

    if((e.key===" " || e.key==="Enter") && !running){
        startGame();
    }
});

window.addEventListener("keyup",function(e){

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
        leftPressed=false;

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
        rightPressed=false;
});

// Sayfa kaymasını engelle
document.addEventListener("touchmove",function(e){
    e.preventDefault();
},{passive:false});

// Başlangıç
showStart();
draw();

</script>

</body>
</html>
