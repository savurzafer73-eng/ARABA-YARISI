<script>
"use strict";

/* =========================
CANVAS
========================= */

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var W=0;
var H=0;
var dpr=1;

/* =========================
GENİŞ YOL
========================= */

/*
ÖNCE:
34% - 66%

ŞİMDİ:
30% - 70%

Toplam yol genişliği %40.
*/

var ROAD_LEFT=0.30;
var ROAD_RIGHT=0.70;

function roadLeft(){
return W*ROAD_LEFT;
}

function roadRight(){
return W*ROAD_RIGHT;
}

function roadWidth(){
return roadRight()-roadLeft();
}

function laneWidth(){
return roadWidth()/3;
}

function laneX(lane){
return roadLeft()+
laneWidth()*lane+
laneWidth()/2;
}

/* =========================
GAME
========================= */

var running=false;
var paused=false;
var crashDone=false;

var score=0;
var money=0;

var playerOffset=0;
var steer=0;

var gameSpeed=300;

var nitro=100;
var nitroActive=false;

var traffic=[];
var spawnTimer=0;
var elapsed=0;
var roadScroll=0;

/* =========================
KEYS
========================= */

var keys={
left:false,
right:false,
nitro:false
};

var touchNitro=false;

/* =========================
CAR
========================= */

var CAR_SCALE=.70;

var CAR_W=48*CAR_SCALE;
var CAR_H=88*CAR_SCALE;

/* =========================
AUDIO
========================= */

var audioCtx=null;
var engineOsc=null;
var engineGain=null;
var engineFilter=null;
var audioReady=false;

var soundEnabled=true;
var lastNitroState=false;

function initAudio(){

if(audioReady){
return;
}

try{

var AudioContext=
window.AudioContext||
window.webkitAudioContext;

if(!AudioContext){
return;
}

audioCtx=new AudioContext();

engineOsc=audioCtx.createOscillator();
engineGain=audioCtx.createGain();
engineFilter=audioCtx.createBiquadFilter();

engineOsc.type="sawtooth";

engineFilter.type="lowpass";
engineFilter.frequency.value=700;

engineGain.gain.value=.0001;

engineOsc.connect(engineFilter);
engineFilter.connect(engineGain);
engineGain.connect(audioCtx.destination);

engineOsc.start();

audioReady=true;

}catch(e){

audioReady=false;
}
}

function resumeAudio(){

if(!audioReady){
return;
}

try{

if(audioCtx.state==="suspended"){
audioCtx.resume();
}

}catch(e){}
}

function startEngineSound(){

if(!soundEnabled){
return;
}

initAudio();
resumeAudio();

if(!audioReady){
return;
}

engineGain.gain.setTargetAtTime(
.035,
audioCtx.currentTime,
.05
);
}

function stopEngineSound(){

if(!audioReady){
return;
}

engineGain.gain.setTargetAtTime(
.0001,
audioCtx.currentTime,
.08
);
}

function updateEngineSound(){

if(!audioReady){
return;
}

if(
!soundEnabled||
!running||
paused
){

engineGain.gain.setTargetAtTime(
.0001,
audioCtx.currentTime,
.08
);

return;
}

var speedRatio=
(gameSpeed-250)/300;

speedRatio=
clamp(speedRatio,0,1);

var frequency=
75+speedRatio*115;

if(nitroActive){
frequency+=45;
}

engineOsc.frequency.setTargetAtTime(
frequency,
audioCtx.currentTime,
.04
);

engineFilter.frequency.setTargetAtTime(
500+speedRatio*1500,
audioCtx.currentTime,
.05
);

engineGain.gain.setTargetAtTime(
nitroActive?.055:.035,
audioCtx.currentTime,
.06
);
}

function nitroSound(){

if(!audioReady||!soundEnabled){
return;
}

try{

var osc=
audioCtx.createOscillator();

var gain=
audioCtx.createGain();

osc.type="sawtooth";

osc.frequency.setValueAtTime(
90,
audioCtx.currentTime
);

osc.frequency.exponentialRampToValueAtTime(
520,
audioCtx.currentTime+.18
);

gain.gain.setValueAtTime(
.0001,
audioCtx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.11,
audioCtx.currentTime+.025
);

gain.gain.exponentialRampToValueAtTime(
.0001,
audioCtx.currentTime+.32
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();

osc.stop(
audioCtx.currentTime+.34
);

}catch(e){}
}

function crashSound(){

if(!audioReady||!soundEnabled){
return;
}

try{

var osc=
audioCtx.createOscillator();

var gain=
audioCtx.createGain();

osc.type="square";

osc.frequency.setValueAtTime(
130,
audioCtx.currentTime
);

osc.frequency.exponentialRampToValueAtTime(
42,
audioCtx.currentTime+.38
);

gain.gain.setValueAtTime(
.0001,
audioCtx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.22,
audioCtx.currentTime+.02
);

gain.gain.exponentialRampToValueAtTime(
.0001,
audioCtx.currentTime+.45
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();

osc.stop(
audioCtx.currentTime+.48
);

}catch(e){}
}

function updateSound(){

updateEngineSound();

if(
nitroActive &&
!lastNitroState
){

nitroSound();
vibrationNitro();
}

lastNitroState=nitroActive;
}

/* =========================
VIBRATION
========================= */

function vibrate(pattern){

try{

if(
navigator &&
navigator.vibrate
){

navigator.vibrate(pattern);
}

}catch(e){}
}

function vibrationNitro(){

function vibrationCrash(){

vibrate([
180,
70,

70,

/* =========================
HELPERS
========================= */

function clamp(v,min,max){

return Math.max(
min,
Math.min(max,v)
);
}

function random(min,max){

return min+
Math.random()*(max-min);
}

function resize(){

dpr=
window.devicePixelRatio||1;

W=window.innerWidth;
H=window.innerHeight;

canvas.width=
Math.floor(W*dpr);

canvas.height=
Math.floor(H*dpr);

canvas.style.width=
W+"px";

canvas.style.height=
H+"px";

ctx.setTransform(
dpr,0,0,dpr,0,0
);
}

window.addEventListener(
"resize",
resize
);

resize();

/* =========================
PLAYER
========================= */

function playerX(){

return W/2+
playerOffset*
roadWidth()*.36;
}

function playerY(){

return H*.78;
}

function updatePlayer(dt){

var move=steer;

if(move!==0){

playerOffset+=
move*dt*1.65;
}

playerOffset=
clamp(
playerOffset,
-.92,
.92
);

if(
nitroActive&&
nitro>0
){

nitro-=34*dt;

if(nitro<0){
nitro=0;
}

gameSpeed=470;

}else{

if(nitro<100){

nitro+=10*dt;

if(nitro>100){
nitro=100;
}
}

gameSpeed=
300+
Math.min(
score*.8,
90
);
}
}

/* =========================
TRAFİK MESAFE KONTROLÜ
========================= */

/*
Araçların üst üste çıkmasını
engellemek için daha büyük
dikey mesafe kullanıyoruz.
*/

function laneBlocked(
lane,
y,
gap
){

var i;

for(
i=0;
i<traffic.length;
i++
){

if(
traffic[i].lane===lane &&
Math.abs(
traffic[i].y-y
)<gap
){

return true;
}
}

return false;
}

/*
Yeni araç oluşturulmadan önce
aynı şeritte yeterli boşluk
olması şart.
*/

function chooseLane(){

var available=[];
var i;

for(i=0;i<3;i++){

if(
!laneBlocked(
i,
-CAR_H-70,
CAR_H*2.7
)
){

available.push(i);
}
}

if(available.length===0){

return -1;
}

return available[
Math.floor(
Math.random()*
available.length
)
];
}

/* =========================
SPAWN
========================= */

function spawnTraffic(){

var lane=
chooseLane();

/*
Hiç boş şerit yoksa araç
oluşturmuyoruz.
*/

if(lane===-1){
return;
}

var colors=[
"#f1f1f1",
"#171b20",
"#1686d9",
"#e3aa22",
"#329b5b",
"#c52b39",
"#7445c5",
"#b8b8b8"
];

var car={
lane:lane,

x:laneX(lane),

/*
Araç ekranın üstünden
kontrollü şekilde geliyor.
*/

y:-CAR_H-60,

speed:random(
235,
315
),

color:
colors[
Math.floor(
Math.random()*
colors.length
)
],

passed:false
};

traffic.push(car);
}

/* =========================
TRAFİK UPDATE
========================= */

function updateTraffic(dt){

var i;
var c;

for(
i=traffic.length-1;
i>=0;
i--
){

c=traffic[i];

c.y+=
(gameSpeed-c.speed)*dt;

/*
PUAN
*/

if(
!c.passed&&
c.y>playerY()+CAR_H
){

c.passed=true;

score+=10;
money+=1;
}

/*
EKRANDAN ÇIKANLARI SİL
*/

if(
c.y>
H+CAR_H*2
){

traffic.splice(i,1);
}
}
}

/* =========================
GÜÇLÜ ÇARPIŞMA
========================= */

function collision(){

var px=playerX();
var py=playerY();

var i;
var c;

for(
i=0;
i<traffic.length;
i++
){

c=traffic[i];

/*
HAFİF TEMAS BİLE KAZA

Yanal temas:
%82

Dikey temas:
%78
*/

if(

Math.abs(px-c.x)
<CAR_W*.82

&&

Math.abs(py-c.y)
<CAR_H*.78

){

return true;
}
}

return false;
}

/* =========================
ROAD DRAW
========================= */

function drawRoad(){

var left=roadLeft();
var right=roadRight();

/* DOĞA */

ctx.fillStyle="#4e703f";

ctx.fillRect(
0,
0,
W,
H
);

/* ÇİMEN DETAYLARI */

var i;

for(
i=0;
i<45;
i++
){

var tx=
(i*97)%W;

var ty=
(
i*151+
roadScroll*.25
)%H;

ctx.fillStyle=
i%2===0
?"#5c7d47"
:"#45683a";

ctx.fillRect(
tx,
ty,
2,
7
);
}

/* YOL */

ctx.fillStyle="#252a2f";

ctx.fillRect(
left,
0,
right-left,
H
);

/* YOL KENARLARI */

ctx.fillStyle="#b7b7b7";

ctx.fillRect(
left-5,
0,
5,
H
);

ctx.fillRect(
right,
0,
5,
H
);

ctx.fillStyle="#f2f2f2";

ctx.fillRect(
left+4,
0,
3,
H
);

ctx.fillRect(
right-7,
0,
3,
H
);

/* ŞERİT ÇİZGİLERİ */

var lw=
laneWidth();

ctx.fillStyle=
"rgba(255,255,255,.85)";

var dashH=55;
var gap=35;

var offset=
roadScroll%
(dashH+gap);

var lane;

for(
lane=1;
lane<=2;
lane++
){

var x=
left+lw*lane;

var y=
-dashH+offset;

while(y<H){

ctx.fillRect(
x-2,
y,
4,
dashH
);

y+=
dashH+gap;
}
}

/* YOL DİREKLERİ */

var postOffset=
roadScroll%170;

var py=
-170+postOffset;

while(py<H){

drawRoadPost(
left-28,
py
);

drawRoadPost(
right+28,
py
);

py+=170;
}
}

function drawRoadPost(x,y){

ctx.fillStyle="#d5d5d5";

ctx.fillRect(
x,
y,
4,
17
);

ctx.fillStyle="#e8e8e8";

ctx.fillRect(
x-2,
y,
8,
5
);

ctx.fillStyle="#303030";

ctx.fillRect(
x,
y+17,
4,
3
);
}

/* =========================
ROUNDED RECT
========================= */

function roundedRect(
x,
y,
w,
h,
r
){

var rr=
Math.min(
r,
w/2,
h/2
);

ctx.beginPath();

ctx.moveTo(
x+rr,
y
);

ctx.lineTo(
x+w-rr,
y
);

ctx.quadraticCurveTo(
x+w,
y,
x+w,
y+rr
);

ctx.lineTo(
x+w,
y+h-rr
);

ctx.quadraticCurveTo(
x+w,
y+h,
x+w-rr,
y+h
);

ctx.lineTo(
x+rr,
y+h
);

ctx.quadraticCurveTo(
x,
y+h,
x,
y+h-rr
);

ctx.lineTo(
x,
y+rr
);

ctx.quadraticCurveTo(
x,
y,
x+rr,
y
);

ctx.closePath();
}

/* =========================
CAR DRAW
========================= */

function drawCar(
x,
y,
color,
isPlayer
){

var w=CAR_W;
var h=CAR_H;

var left=x-w/2;
var top=y-h/2;

ctx.save();

/* GÖLGE */

ctx.fillStyle=
"rgba(0,0,0,.38)";

roundedRect(
left+3,
top+5,
w,
h,
9
);

ctx.fill();

/* GÖVDE */

ctx.fillStyle=color;

roundedRect(
left,
top,
w,
h,
9
);

ctx.fill();

/* ÖN */

ctx.fillStyle=
isPlayer
?"#b41124"
:"#22282e";

roundedRect(
left+5,
top+5,
w-10,
h*.25,
6
);

ctx.fill();

/* CAM */

ctx.fillStyle=
"#172630";

roundedRect(
left+6,
top+h*.29,
w-12,
h*.28,
5
);

ctx.fill();

/* CAM IŞIK */

ctx.fillStyle=
"rgba(180,235,255,.35)";

ctx.fillRect(
left+9,
top+h*.32,
w-18,
4
);

/* ORTA */

ctx.fillStyle=
"rgba(255,255,255,.18)";

ctx.fillRect(
x-1,
top+h*.59,
2,
h*.27
);

/* FAR */

ctx.fillStyle="#fff7bd";

ctx.fillRect(
left+5,
top+4,
8,
4
);

function updateTouchState(){

var count=0;
var id;

){

}
}

]="left";

},

document.getElementById(

i++
){

activeTouches[
e.changedTouches[i].identifier
]="right";
}

keys.right=true;

updateTouchState();

},
{passive:false}
);

function touchEnd(e){

e.preventDefault();

var i;

for(
i=0;
i<e.changedTouches.length;
i++
){

delete activeTouches[
e.changedTouches[i].identifier
];
}

var left=false;
var right=false;
var id;

for(id in activeTouches){

if(
activeTouches.hasOwnProperty(id)
){

if(
activeTouches[id]==="left"
){
left=true;
}

if(
activeTouches[id]==="right"
){
right=true;
}
}
}

keys.left=left;
keys.right=right;

updateTouchState();
}

function gameLoop(time){

if(!lastTime){
lastTime=time;
}

var dt=
(time-lastTime)/1000;

lastTime=time;

if(dt>.05){
dt=.05;
}

if(
running&&
!paused
){

elapsed+=dt;

/* STEER */

if(
keys.left&&
!keys.right
){

steer=-1;

}else if(
keys.right&&
!keys.left
){

steer=1;

}else{

steer=0;
}

/* NITRO */

nitroActive=
keys.nitro||

updatePlayer(dt);

updateTraffic(dt);

/* SPAWN */

spawnTimer-=dt;

if(spawnTimer<=0){

spawnTraffic();

spawnTimer=
random(.80,1.35);

gameSpeed*dt;

gameOver();
}

updateHUD();

updateSound();
}

/* DRAW */

drawRoad();

if(running){

drawPlayer();
}

requestAnimationFrame(
gameLoop
);
