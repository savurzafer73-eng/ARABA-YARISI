<script>
"use strict";

/* =========================
   CANVAS
========================= */

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var W=0;
var H=0;
var DPR=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================
   ROAD
   DAHA GENİŞ
========================= */

var ROAD_LEFT=.28;
var ROAD_RIGHT=.72;

function roadWidth(){
  return W*(ROAD_RIGHT-ROAD_LEFT);
}

function roadLeft(){
  return W*ROAD_LEFT;
}

function roadRight(){
  return W*ROAD_RIGHT;
}

function laneWidth(){
  return roadWidth()/3;
}

function laneX(lane){
  return roadLeft()+laneWidth()*(lane+.5);
}


/* =========================
   GAME
========================= */

var running=false;
var paused=false;

var score=0;
var money=0;

var gameSpeed=290;
var baseSpeed=290;

var playerOffset=0;

var traffic=[];
var particles=[];

var roadScroll=0;

var spawnTimer=0;
var lastTime=0;

var steerLeft=false;
var steerRight=false;
var nitro=false;

var nitroAmount=100;


/* =========================
   CAR SIZE
========================= */

var CAR_SCALE=.70;
var CAR_W=48*CAR_SCALE;
var CAR_H=88*CAR_SCALE;


/*
  Aynı şeritteki araçlar arasında
  minimum güvenli mesafe.
*/
var TRAFFIC_MIN_GAP=CAR_H*1.22;


/* =========================
   PLAYER
========================= */

function playerX(){
  return W/2+playerOffset*roadWidth()*.36;
}

function playerY(){
  return H*.78;
}


/* =========================
   RANDOM
========================= */

function random(a,b){
  return a+Math.random()*(b-a);
}


/* =========================
   SOUND
========================= */

var audioCtx=null;
var engineOsc=null;
var engineGain=null;
var soundOn=true;

function initAudio(){

  if(audioCtx){
    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }
    return;
  }

  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    engineOsc=audioCtx.createOscillator();
    engineGain=audioCtx.createGain();

    engineOsc.type="sawtooth";
    engineOsc.frequency.value=70;

    engineGain.gain.value=0;

    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);

    engineOsc.start();

  }catch(e){}
}

function engineSound(){

  if(!audioCtx||!engineOsc||!engineGain||!soundOn){
    return;
  }

  var f=55+gameSpeed*.18;

  engineOsc.frequency.setTargetAtTime(
    f,
    audioCtx.currentTime,
    .04
  );

  engineGain.gain.setTargetAtTime(
    running&&!paused ? .035 : 0,
    audioCtx.currentTime,
    .06
  );
}

function beep(freq,duration,type){

  if(!soundOn){
    return;
  }

  initAudio();

  if(!audioCtx){
    return;
  }

  var o=audioCtx.createOscillator();
  var g=audioCtx.createGain();

  o.type=type||"square";
  o.frequency.value=freq;

  g.gain.value=.08;

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start();

  g.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  o.stop(audioCtx.currentTime+duration);
}


/* =========================
   TRAFFIC
========================= */

function laneBlocked(lane,y,gap){

  var i;
  var c;

  for(i=0;i<traffic.length;i++){

    c=traffic[i];

    if(
      c.lane===lane &&
      Math.abs(c.y-y)<gap
    ){
      return true;
    }
  }

  return false;
}


function chooseLane(){

  var available=[];
  var i;

  for(i=0;i<3;i++){

    if(
      !laneBlocked(
        i,
        -CAR_H-80,
        CAR_H*2.5
      )
    ){
      available.push(i);
    }
  }

  if(available.length===0){
    return -1;
  }

  return available[
    Math.floor(
      Math.random()*available.length
    )
  ];
}


function spawnTraffic(){

  var lane=chooseLane();

  if(lane===-1){
    return;
  }

  var colors=[
    "#f1f1f1",
    "#171b20",
    "#1686d9",
    "#e3aa22",
    "#329b5b",
    "#c52b39",
    "#7445c5",
    "#b8b8b8"
  ];

  traffic.push({

    lane:lane,

    x:laneX(lane),

    y:-CAR_H-60,

    speed:random(235,315),

    color:
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ],

    passed:false
  });
}


/* =========================
   TRAFFIC SEPARATION
   ÖNEMLİ:
   ARAÇLAR BİRBİRİNİN
   İÇİNDEN GEÇMEZ
========================= */

function separateTraffic(){

  var lane;
  var list;
  var i;
  var j;
  var temp;

  for(lane=0;lane<3;lane++){

    list=[];

    for(i=0;i<traffic.length;i++){

      if(traffic[i].lane===lane){
        list.push(traffic[i]);
      }
    }

    /*
      Öndeki araç üstte,
      arkadaki araç altta.
    */
    list.sort(function(a,b){
      return a.y-b.y;
    });

    for(j=1;j<list.length;j++){

      var front=list[j-1];
      var back=list[j];

      if(
        back.y-front.y<
        TRAFFIC_MIN_GAP
      ){

        /*
          Arkadaki araç asla
          öndekinin içine giremez.
        */
        back.y=
          front.y+
          TRAFFIC_MIN_GAP;

        /*
          Arkadaki araç daha hızlıysa
          öndekine yetişmesin.
        */
        if(back.speed>front.speed){
          back.speed=front.speed;
        }
      }
    }
  }
}


/* =========================
   UPDATE TRAFFIC
========================= */

function updateTraffic(dt){

  var i;
  var c;

  for(i=traffic.length-1;i>=0;i--){

    c=traffic[i];

    c.y+=(gameSpeed-c.speed)*dt;

    /*
      Oyuncuyu geçtiyse puan.
    */
    if(
      !c.passed &&
      c.y>playerY()+CAR_H
    ){

      c.passed=true;

      score+=10;
      money+=1;
    }

    if(c.y>H+CAR_H*2){

      traffic.splice(i,1);
    }
  }

  /*
    Önce hareket ettir,
    sonra tüm trafik araçlarını
    birbirinden ayır.
  */
  separateTraffic();

  /*
    İkinci kontrol zincirleme
    sıkışmaları da düzeltir.
  */
  separateTraffic();
}


/* =========================
   PLAYER COLLISION
========================= */

function collision(){

  var px=playerX();
  var py=playerY();

  var i;
  var c;

  for(i=0;i<traffic.length;i++){

    c=traffic[i];

    if(
      Math.abs(px-c.x)<
      CAR_W*.82 &&

      Math.abs(py-c.y)<
      CAR_H*.78
    ){

      return true;
    }
  }

  return false;
}


/* =========================
   PARTICLES
========================= */

function addCrashParticles(){

  var i;

  for(i=0;i<35;i++){

    particles.push({

      x:playerX(),

      y:playerY(),

      vx:random(-220,220),

      vy:random(-220,120),

      life:random(.5,1.1),

      size:random(2,6)
    });
  }
}

function updateParticles(dt){

  var i;
  var p;

  for(i=particles.length-1;i>=0;i--){

    p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=300*dt;

    p.life-=dt;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}


/* =========================
   ROAD DRAW
========================= */

function drawRoad(){

  /*
    Zemin
  */

  ctx.fillStyle="#31552d";
  ctx.fillRect(0,0,W,H);

  /*
    Yol
  */

  ctx.fillStyle="#272b30";

  ctx.fillRect(
    roadLeft(),
    0,
    roadWidth(),
    H
  );

  /*
    Yol kenarları
  */

  ctx.fillStyle="#d5d5d5";

  ctx.fillRect(
    roadLeft()-5,
    0,
    5,
    H
  );

  ctx.fillRect(
    roadRight(),
    0,
    5,
    H
  );

  /*
    Yol içindeki şerit çizgileri
  */

  ctx.strokeStyle="#eeeeee";
  ctx.lineWidth=3;

  ctx.setLineDash([28,28]);

  roadScroll+=gameSpeed/60;

  var offset=roadScroll%56;

  var i;

  for(i=1;i<3;i++){

    var x=
      roadLeft()+
      laneWidth()*i;

    ctx.beginPath();

    ctx.moveTo(x,-56+offset);
    ctx.lineTo(x,H+56);

    ctx.stroke();
  }

  ctx.setLineDash([]);


  /*
    Kenar kırmızı/beyaz
    küçük işaretler
  */

  var stripeH=30;
  var sOffset=roadScroll%60;

  ctx.fillStyle="#ffffff";

  for(i=-1;i<H/stripeH+3;i++){

    var yy=i*60+sOffset;

    ctx.fillRect(
      roadLeft()-8,
      yy,
      8,
      30
    );

    ctx.fillRect(
      roadRight(),
      yy,
      8,
      30
    );
  }
}


/* =========================
   NATURE
========================= */

function drawNature(){

  var offset=(roadScroll*.55)%90;

  var i;

  /*
    Sol ağaçlar
  */

  for(i=-2;i<12;i++){

    var y=i*90+offset;

    drawTree(
      roadLeft()-random(35,75),
      y
    );
  }

  /*
    Sağ ağaçlar
  */

  for(i=-2;i<12;i++){

    var y2=i*90+offset+35;

    drawTree(
      roadRight()+random(35,75),
      y2
    );
  }
}

function drawTree(x,y){

  ctx.fillStyle="#553b24";

  ctx.fillRect(
    x-3,
    y+12,
    6,
    22
  );

  ctx.beginPath();

  ctx.fillStyle="#173f25";

  ctx.arc(
    x,
    y,
    17,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.fillStyle="#235d31";

  ctx.arc(
    x-8,
    y+7,
    12,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.fillStyle="#2e7138";

  ctx.arc(
    x+8,
    y+7,
    11,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================
   CAR DRAW
========================= */

function drawCar(x,y,color,isPlayer){

  var w=CAR_W;
  var h=CAR_H;

  /*
    Gölge
  */

  ctx.fillStyle="rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y+h*.48,
    w*.65,
    h*.17,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    Gövde
  */

  ctx.fillStyle=color;

  ctx.beginPath();

  ctx.roundRect(
    x-w/2,
    y-h/2,
    w,
    h,
    9
  );

  ctx.fill();


  /*
    Tavan/cam
  */

  ctx.fillStyle=
    isPlayer ?
    "#263746" :
    "#252c32";

  ctx.beginPath();

  ctx.roundRect(
    x-w*.31,
    y-h*.22,
    w*.62,
    h*.36,
    6
  );

  ctx.fill();


  /*
    Cam parlaması
  */

  ctx.fillStyle="rgba(180,225,255,.35)";

  ctx.fillRect(
    x-w*.22,
    y-h*.18,
    w*.44,
    h*.05
  );


  /*
    Farlar
  */

  ctx.fillStyle="#fff5b0";

  ctx.fillRect(
    x-w*.34,
    y-h*.45,
    w*.20,
    5
  );

  ctx.fillRect(
    x+w*.14,
    y-h*.45,
    w*.20,
    5
  );


  /*
    Stop lambaları
  */

  ctx.fillStyle="#e51d2a";

  ctx.fillRect(
    x-w*.34,
    y+h*.39,
    w*.20,
    5
  );

  ctx.fillRect(
    x+w*.14,
    y+h*.39,
    w*.20,
    5
  );


  /*
    Tekerlekler
  */

  ctx.fillStyle="#080a0c";

  ctx.fillRect(
    x-w*.57,
    y-h*.29,
    7,
    h*.20
  );

  ctx.fillRect(
    x+w*.43,
    y-h*.29,
    7,
    h*.20
  );

  ctx.fillRect(
    x-w*.57,
    y+h*.10,
    7,
    h*.20
  );

  ctx.fillRect(
    x+w*.43,
    y+h*.10,
    7,
    h*.20
  );


  /*
    Oyuncu için Mustang
  */

  if(isPlayer){

    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.roundRect(
      x-w/2,
      y-h/2,
      w,
      h,
      9
    );

    ctx.stroke();

    /*
      Mustang çizgisi
    */

    ctx.fillStyle="#eeeeee";

    ctx.fillRect(
      x-2,
      y-h*.44,
      4,
      h*.78
    );
  }
}


/* =========================
   PLAYER DRAW
========================= */

function drawPlayer(){

  drawCar(
    playerX(),
    playerY(),
    "#c52b39",
    true
  );
}


/* =========================
   TRAFFIC DRAW
========================= */

function drawTraffic(){

  var i;

  for(i=0;i<traffic.length;i++){

    drawCar(
      traffic[i].x,
      traffic[i].y,
      traffic[i].color,
      false
    );
  }
}


/* =========================
   PARTICLE DRAW
========================= */

function drawParticles(){

  var i;
  var p;

  for(i=0;i<particles.length;i++){

    p=particles[i];

    ctx.globalAlpha=
      Math.max(0,p.life);

    ctx.fillStyle="#ffb52e";

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;
}


/* =========================
   GAME LOOP
========================= */

function update(dt){

  if(!running||paused){
    return;
  }

  /*
    Direksiyon
  */

  var steerSpeed=1.75;

  if(steerLeft){
    playerOffset-=steerSpeed*dt;
  }

  if(steerRight){
    playerOffset+=steerSpeed*dt;
  }

  /*
    Sınırlar
  */

  if(playerOffset<-1){
    playerOffset=-1;
  }

  if(playerOffset>1){
    playerOffset=1;
  }


  /*
    Nitro
  */

  if(nitro&&nitroAmount>0){

    gameSpeed=baseSpeed+190;

    nitroAmount-=35*dt;

    if(nitroAmount<0){
      nitroAmount=0;
    }

  }else{

    gameSpeed=baseSpeed;
  }


  /*
    Yavaşça hızlan
  */

  baseSpeed+=5*dt;

  if(baseSpeed>430){
    baseSpeed=430;
  }


  /*
    Trafik üretimi
  */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnTraffic();

    /*
      Hız arttıkça araçlar
      biraz daha sık gelir.
    */

    spawnTimer=
      random(.78,1.25)-
      Math.min(baseSpeed/3000,.12);

    if(spawnTimer<.55){
      spawnTimer=.55;
    }
  }


  updateTraffic(dt);

  updateParticles(dt);


  /*
    Oyuncu kazası
  */

  if(collision()){

    running=false;

    addCrashParticles();

    beep(90,.45,"sawtooth");

    if(navigator.vibrate){
      navigator.vibrate([120,70,180]);
    }

    document.getElementById("finalScore").textContent=score;
    document.getElementById("finalMoney").textContent=money;

    document.getElementById("gameover")
      .classList.remove("hidden");

    document.getElementById("hud")
      .classList.add("hidden");

    document.getElementById("controls")
      .classList.add("hidden");

    document.getElementById("nitroBar")
      .classList.add("hidden");

    return;
  }


  /*
    Ses
  */

  engineSound();


  /*
    HUD
  */

  document.getElementById("score").textContent=score;

  document.getElementById("money").textContent=money;

  document.getElementById("speed").textContent=
    Math.round(gameSpeed);

  document.getElementById("nitroFill").style.width=
    nitroAmount+"%";
}


/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawRoad();

  drawNature();

  drawTraffic();

  drawPlayer();

  drawParticles();
}


/* =========================
   MAIN LOOP
========================= */

function loop(t){

  if(!lastTime){
    lastTime=t;
  }

  var dt=(t-lastTime)/1000;

  if(dt>.05){
    dt=.05;
  }

  lastTime=t;

  update(dt);

  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================
   START GAME
========================= */

function startGame(){

  initAudio();

  running=true;
  paused=false;

  score=0;
  money=0;

  baseSpeed=290;
  gameSpeed=290;

  playerOffset=0;

  traffic=[];
  particles=[];

  spawnTimer=.5;

  nitroAmount=100;

  document.getElementById("menu")
    .classList.add("hidden");

  document.getElementById("gameover")
    .classList.add("hidden");

  document.getElementById("pause")
    .classList.add("hidden");

  document.getElementById("hud")
    .classList.remove("hidden");

  document.getElementById("controls")
    .classList.remove("hidden");

  document.getElementById("nitroBar")
    .classList.remove("hidden");

  beep(500,.12,"square");
}


/* =========================

========================= */

function showMenu(){

  running=false;
  paused=false;

  traffic=[];
  particles=[];

  document.getElementById("menu")
    .classList.remove("hidden");

  document.getElementById("pause")
    .classList.add("hidden");

/* =========================

========================= */

function togglePause(){

  if(!running){
    return;
  }

  paused=!paused;

  if(paused){

    document.getElementById("pause")
      .classList.remove("hidden");

  }else{

    document.getElementById("pause")
      .classList.add("hidden");
  }

  engineSound();
}

/* =========================
   TOUCH CONTROLS
========================= */

var leftPointer=false;
var rightPointer=false;

function updateTouch(){

  steerLeft=leftPointer;
  steerRight=rightPointer;

  nitro=
    leftPointer&&
    rightPointer;
}


function touchDown(side,e){

  e.preventDefault();

  if(side==="left"){
    leftPointer=true;
  }else{
    rightPointer=true;
  }

  updateTouch();
}


function touchUp(side,e){

  e.preventDefault();

  if(side==="left"){
    leftPointer=false;
  }else{
    rightPointer=false;
  }

  updateTouch();
}


var left=document.getElementById("leftTouch");
var right=document.getElementById("rightTouch");

left.addEventListener(
  "touchstart",
  function(e){
    touchDown("left",e);
  },
  {passive:false}
);

left.addEventListener(
  "touchend",
  function(e){
    touchUp("left",e);
  },
  {passive:false}
);

left.addEventListener(
  "touchcancel",
  function(e){
    touchUp("left",e);
  },
  {passive:false}
);


right.addEventListener(
  "touchstart",
  function(e){
    touchDown("right",e);
  },
  {passive:false}
);

right.addEventListener(
  "touchend",
  function(e){
    touchUp("right",e);
  },
  {passive:false}
);

right.addEventListener(
  "touchcancel",
  function(e){
    touchUp("right",e);
  },
  {passive:false}
);


/*
  Masaüstünde mouse ile de
  sol/sağ kontrol.
*/

left.addEventListener("mousedown",function(){
  leftPointer=true;
  updateTouch();
});

left.addEventListener("mouseup",function(){
  leftPointer=false;
  updateTouch();
});

right.addEventListener("mousedown",function(){
  rightPointer=true;
  updateTouch();
});

right.addEventListener("mouseup",function(){
  rightPointer=false;
  updateTouch();
});


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",function(e){

  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A"){
    steerLeft=true;
  }

  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D"){
    steerRight=true;
  }

  if(
    e.key==="Shift"||
    e.code==="Space"
  ){
    nitro=true;
  }

  if(e.key==="p"||e.key==="P"){
    togglePause();
  }
});


document.addEventListener("keyup",function(e){

  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A"){
    steerLeft=false;
  }

  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D"){
    steerRight=false;
  }

  if(
    e.key==="Shift"||
    e.code==="Space"
  ){
    nitro=false;
  }
});


/* =========================
   PREVENT CONTEXT MENU
========================= */

document.addEventListener(
  "contextmenu",
  function(e){
    e.preventDefault();
  }
);


/* =========================
   INITIAL
========================= */

showMenu();

</script>
