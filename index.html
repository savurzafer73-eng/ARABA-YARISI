<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road Ultimate</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101114;
  font-family:Arial,sans-serif;
}

body{
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#101114;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ================= HUD ================= */

#hud{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(94vw,520px);
  display:flex;
  justify-content:space-between;
  gap:7px;
  z-index:10;
  pointer-events:none;
}

.hudBox{
  min-width:90px;
  padding:8px 12px;
  border-radius:13px;
  background:rgba(5,7,10,.72);
  color:#fff;
  text-align:center;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(7px);
  box-shadow:0 7px 20px rgba(0,0,0,.18);
}

.hudSmall{
  font-size:10px;
  letter-spacing:1px;
  opacity:.65;
}

.hudValue{
  font-size:19px;
  font-weight:900;
}

/* ================= MENU ================= */

#menu{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    linear-gradient(
      rgba(0,0,0,.28),
      rgba(0,0,0,.82)
    );
}

.menuPanel{
  width:min(90vw,400px);
  padding:28px;
  border-radius:25px;
  background:rgba(14,15,19,.96);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 25px 80px rgba(0,0,0,.65);
  text-align:center;
  color:#fff;
}

.logo{
  font-size:34px;
  font-weight:1000;
  letter-spacing:2px;
}

.logo span{
  color:#ff3434;
}

.subtitle{
  color:#aaa;
  font-size:13px;
  margin:5px 0 24px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  color:#fff;
  background:#25262c;
  border:1px solid rgba(255,255,255,.12);
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.startBtn{
  background:linear-gradient(135deg,#ff3434,#a90000);
  box-shadow:0 7px 20px rgba(210,0,0,.25);
}

.info{
  margin-top:18px;
  font-size:12px;
  line-height:1.7;
  color:#888;
}

/* ================= TOUCH ================= */

.touchZone{
  position:absolute;
  bottom:0;
  width:50%;
  height:57%;
  z-index:8;
  touch-action:none;
}

#leftZone{
  left:0;
}

#rightZone{
  right:0;
}

.touchHint{
  position:absolute;
  bottom:25px;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.38);
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  pointer-events:none;
  font-size:26px;
  z-index:9;
}

#leftHint{
  left:25px;
}

#rightHint{
  right:25px;
}

/* ================= SOUND ================= */

#soundBtn{
  position:absolute;
  right:12px;
  bottom:15px;
  width:48px;
  height:48px;
  padding:0;
  margin:0;
  border-radius:50%;
  z-index:15;
  background:rgba(0,0,0,.62);
}

/* ================= GAME OVER ================= */

#gameOver{
  position:absolute;
  inset:0;
  z-index:25;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.74);
}

.overPanel{
  width:min(88vw,360px);
  padding:28px;
  border-radius:23px;
  background:#15161b;
  color:#fff;
  text-align:center;
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.overPanel h2{
  font-size:30px;
}

.result{
  color:#bbb;
  margin:12px 0 18px;
  line-height:1.8;
}

@media(max-width:600px){

  .hud{
    width:96vw;
  }

  .hudBox{
    min-width:0;
    flex:1;
    padding:6px 4px;
  }

  .hudValue{
    font-size:15px;
  }

  .logo{
    font-size:29px;
  }

  .menuPanel{
    padding:24px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

  <div class="hudBox">
    <div class="hudSmall">HIZ</div>
    <div class="hudValue">
      <span id="speedText">0</span> KM/H
    </div>
  </div>

  <div class="hudBox">
    <div class="hudSmall">SKOR</div>
    <div class="hudValue" id="scoreText">0</div>
  </div>

  <div class="hudBox">
    <div class="hudSmall">ALTIN</div>
    <div class="hudValue">
      🪙 <span id="coinText">0</span>
    </div>
  </div>

</div>

<div id="leftZone" class="touchZone"></div>
<div id="rightZone" class="touchZone"></div>

<div id="leftHint" class="touchHint">‹</div>
<div id="rightHint" class="touchHint">›</div>

<button id="soundBtn">🔊</button>

<div id="menu">

  <div class="menuPanel">

    <div class="logo">
      TURBO <span>ROAD</span>
    </div>

    <div class="subtitle">
      Ultimate Racing
    </div>

    <button class="startBtn" id="startBtn">
      🏁 YARIŞA BAŞLA
    </button>

    <button id="helpBtn">
      ℹ️ NASIL OYNANIR?
    </button>

    <div class="info">
      📱 Sol tarafa basılı tut → SOLA<br>
      📱 Sağ tarafa basılı tut → SAĞA<br>
      Parmağını kaldır → DÜZ<br>
      💻 Bilgisayarda ← →
    </div>

  </div>

</div>

<div id="gameOver">

  <div class="overPanel">

    <h2>YARIŞ BİTTİ</h2>

    <div class="result">
      Skor: <b id="finalScore">0</b><br>
      Toplanan altın: <b id="finalCoins">0</b>
    </div>

    <button class="startBtn" id="restartBtn">
      🔄 TEKRAR OYNA
    </button>

    <button id="menuBtn">
      🏠 ANA MENÜ
    </button>

  </div>

</div>

</div>

<script>
"use strict";

/* =========================================================
   ELEMENTLER
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const menu=document.getElementById("menu");
const gameOver=document.getElementById("gameOver");

const leftZone=document.getElementById("leftZone");
const rightZone=document.getElementById("rightZone");

const speedText=document.getElementById("speedText");
const scoreText=document.getElementById("scoreText");
const coinText=document.getElementById("coinText");

/* =========================================================
   CANVAS
========================================================= */

let W=0;
let H=0;

let DPR=Math.min(
  window.devicePixelRatio||1,
  2
);

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  DPR=Math.min(
    window.devicePixelRatio||1,
    2
  );

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  if(typeof player!=="undefined"){

    player.y=getPlayerY();

    if(!running){

      player.x=W/2;
      player.targetX=W/2;
    }
  }
}

window.addEventListener(
  "resize",
  resize
);

/* =========================================================
   OYUN DEĞİŞKENLERİ
========================================================= */

let running=false;
let lastTime=0;

let score=0;
let coins=0;

let speed=0;
let targetSpeed=0;

let roadOffset=0;

let steering=0;

let touchLeft=false;
let touchRight=false;

let keyboardLeft=false;
let keyboardRight=false;

/* =========================================================
   PERSPEKTİF
========================================================= */

function getHorizon(){

  return H*.34;
}

function roadProgress(y){

  const horizon=getHorizon();

  return Math.max(
    0,
    Math.min(
      1,
      (y-horizon)/
      (H-horizon)
    )
  );
}

function roadWidthAt(y){

  const p=roadProgress(y);

  return W*(
    .13+
    .91*Math.pow(
      p,
      .79
    )
  );
}

function roadCenterAt(y){

  const p=roadProgress(y);

  return W/2+
    Math.sin(
      roadOffset*.00055
    )*
    W*.032*
    Math.pow(
      p,
      1.7
    );
}

function getPlayerY(){

  return H*.81;
}

/* =========================================================
   PLAYER
========================================================= */

const player={

  x:0,
  y:0,

  width:50,
  height:94,

  targetX:0,

  color:"#c8141c",

  tilt:0
};

/* =========================================================
   TRAFİK
========================================================= */

let traffic=[];
let spawnTimer=0;

const trafficColors=[
  "#e8e8e8",
  "#1c6da8",
  "#e69b17",
  "#20242a",
  "#368b61",
  "#7543a5",
  "#bd4b15",
  "#555b62"
];

function spawnTraffic(){

  /*
    Aracın ortaya çıkacağı lane seçiliyor.
    Çok yakın iki araç aynı anda doğmasın.
  */

  let lane=
    Math.floor(
      Math.random()*3
    );

  const last=
    traffic[
      traffic.length-1
    ];

  if(
    last &&
    last.progress<.20 &&
    last.lane===lane
  ){

    lane=
      (lane+1+
      Math.floor(
        Math.random()*2
      ))%3;
  }

  traffic.push({

    lane:lane,

    /*
      Araç ufuk çizgisinden değil,
      yolun görünür bölümünün biraz
      ilerisinden geliyor.
    */

    progress:.075,

    speed:
      .19+
      Math.random()*.075,

    width:40,
    height:78,

    color:
      trafficColors[
        Math.floor(
          Math.random()*
          trafficColors.length
        )
      ],

    y:0,
    x:0,
    drawW:0,
    drawH:0
  });
}

/* =========================================================
   ALTIN
========================================================= */

let coinObjects=[];
let coinTimer=0;

function spawnCoin(){

  const lane=
    Math.floor(
      Math.random()*3
    );

  coinObjects.push({

    lane:lane,

    progress:.10,

    spin:
      Math.random()*
      Math.PI*2,

    x:0,
    y:0,
    size:8
  });
}

/* =========================================================
   SES
========================================================= */

let audioCtx=null;
let engineOsc=null;
let engineGain=null;
let engineFilter=null;

let audioStarted=false;
let soundEnabled=true;

function initAudio(){

  if(
    audioStarted||
    !soundEnabled
  ){
    return;
  }

  try{

    audioCtx=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

    engineOsc=
      audioCtx.createOscillator();

    engineGain=
      audioCtx.createGain();

    engineFilter=
      audioCtx.createBiquadFilter();

    engineOsc.type="sawtooth";

    engineFilter.type="lowpass";

    engineFilter.frequency.value=600;

    engineGain.gain.value=0;

    engineOsc.connect(
      engineFilter
    );

    engineFilter.connect(
      engineGain
    );

    engineGain.connect(
      audioCtx.destination
    );

    engineOsc.start();

    audioStarted=true;

  }catch(e){}
}

function updateEngineSound(){

  if(
    !audioStarted||
    !audioCtx||
    !soundEnabled
  ){
    return;
  }

  const now=
    audioCtx.currentTime;

  const normalized=
    Math.max(
      0,
      Math.min(
        1,
        speed/220
      )
    );

  engineOsc.frequency.setTargetAtTime(
    55+
    normalized*205,
    now,
    .05
  );

  engineFilter.frequency.setTargetAtTime(
    450+
    normalized*1900,
    now,
    .06
  );

  engineGain.gain.setTargetAtTime(
    running
      ?
      .008+
      normalized*.045
      :
      0,
    now,
    .08
  );
}

function collisionSound(){

  if(!soundEnabled)return;

  initAudio();

  if(!audioCtx)return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(
    130,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    42,
    audioCtx.currentTime+.25
  );

  gain.gain.setValueAtTime(
    .15,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.28
  );

  osc.connect(gain);
  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime+.3
  );
}

function coinSound(){

  if(!soundEnabled)return;

  initAudio();

  if(!audioCtx)return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    600,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    1050,
    audioCtx.currentTime+.1
  );

  gain.gain.setValueAtTime(
    .08,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.18
  );

  osc.connect(gain);
  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime+.2
  );
}

/* =========================================================
   ARKA PLAN
========================================================= */

function drawBackground(){

  const horizon=getHorizon();

  const sky=
    ctx.createLinearGradient(
      0,0,0,
      horizon+100
    );

  sky.addColorStop(
    0,
    "#4f9bd0"
  );

  sky.addColorStop(
    .55,
    "#a9d4e8"
  );

  sky.addColorStop(
    1,
    "#dce9e8"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,W,H
  );

  /* Güneş */

  ctx.beginPath();

  ctx.arc(
    W*.80,
    H*.12,
    Math.max(
      24,
      W*.055
    ),
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,239,175,.9)";

  ctx.fill();

  /* Uzak dağ */

  ctx.fillStyle="#708d87";

  ctx.beginPath();

  ctx.moveTo(
    0,
    horizon+.08*H
  );

  ctx.lineTo(
    W*.10,
    H*.20
  );

  ctx.lineTo(
    W*.22,
    H*.29
  );

  ctx.lineTo(
    W*.36,
    H*.17
  );

  ctx.lineTo(
    W*.51,
    H*.29
  );

  ctx.lineTo(
    W*.66,
    H*.18
  );

  ctx.lineTo(
    W*.82,
    H*.29
  );

  ctx.lineTo(
    W,
    H*.19
  );

  ctx.lineTo(
    W,
    horizon+.10*H
  );

  ctx.closePath();

  ctx.fill();

  /* Zemin */

  ctx.fillStyle="#52794c";

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );

  /* Yol kenarı çimen detayları */

  ctx.fillStyle=
    "rgba(30,70,32,.18)";

  for(
    let i=0;
    i<20;
    i++
  ){

    const y=
      horizon+
      ((i*97+
      roadOffset*.7)%
      (H-horizon));

    const p=
      roadProgress(y);

    const rw=
      roadWidthAt(y);

    const rc=
      roadCenterAt(y);

    const side=
      i%2===0?-1:1;

    const x=
      rc+
      side*
      (rw/2+
      12+
      p*45);

    ctx.fillRect(
      x,
      y,
      3+p*3,
      8+p*7
    );
  }
}

/* =========================================================
   YOL
========================================================= */

function drawRoad(){

  const horizon=getHorizon();

  const topCenter=
    roadCenterAt(horizon);

  const bottomCenter=
    roadCenterAt(H);

  const topWidth=
    roadWidthAt(horizon);

  const bottomWidth=
    roadWidthAt(H);

  /* yol gövdesi */

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.closePath();

  const roadGradient=
    ctx.createLinearGradient(
      0,
      horizon,
      0,
      H
    );

  roadGradient.addColorStop(
    0,
    "#55565b"
  );

  roadGradient.addColorStop(
    .45,
    "#3c3d42"
  );

  roadGradient.addColorStop(
    1,
    "#24252a"
  );

  ctx.fillStyle=
    roadGradient;

  ctx.fill();

  /* dış beyaz çizgiler */

  ctx.strokeStyle="#f4f4f4";

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.stroke();

  /* Kırmızı-beyaz kenar taşları */

  const dashCount=22;

  const moving=
    (roadOffset*.0016)%1;

  for(
    let i=0;
    i<dashCount;
    i++
  ){

    let p1=
      i/dashCount+
      moving/dashCount;

    p1%=1;

    let p2=p1+.026;

    if(p2>1)p2=1;

    const y1=
      horizon+
      p1*(H-horizon);

    const y2=
      horizon+
      p2*(H-horizon);

    const c1=
      roadCenterAt(y1);

    const c2=
      roadCenterAt(y2);

    const w1=
      roadWidthAt(y1);

    const w2=
      roadWidthAt(y2);

    ctx.strokeStyle=
      i%2===0
        ?
        "#ffffff"
        :
        "#d32929";

    ctx.lineWidth=
      Math.max(
        2,
        7*roadProgress(y1)
      );

    ctx.beginPath();

    ctx.moveTo(
      c1-w1/2,
      y1
    );

    ctx.lineTo(
      c2-w2/2,
      y2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      c1+w1/2,
      y1
    );

    ctx.lineTo(
      c2+w2/2,
      y2
    );

    ctx.stroke();
  }

  /* Şerit çizgileri */

  const gap=66;
  const dashLength=31;

  for(
    let lane=1;
    lane<3;
    lane++
  ){

    for(
      let y=
        horizon-
        gap+
        (roadOffset*1.45)%gap;

      y<H;

      y+=gap
    ){

      const y1=
        Math.max(
          horizon,
          y
        );

      const y2=
        Math.min(
          H,
          y+dashLength
        );

      if(y2<=horizon)continue;

      const c1=
        roadCenterAt(y1);

      const c2=
        roadCenterAt(y2);

      const w1=
        roadWidthAt(y1);

      const w2=
        roadWidthAt(y2);

      const x1=
        c1-w1/2+
        w1*(lane/3);

      const x2=
        c2-w2/2+
        w2*(lane/3);

      const p=
        roadProgress(y1);

      ctx.strokeStyle=
        "rgba(255,255,255,.72)";

      ctx.lineWidth=
        Math.max(
          1,
          3.5*p
        );

      ctx.beginPath();

      ctx.moveTo(
        x1,y1
      );

      ctx.lineTo(
        x2,y2
      );

      ctx.stroke();
    }
  }
}

/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
  ctx,x,y,w,h,r
){

  const rr=
    Math.min(
      r,
      Math.abs(w)/2,
      Math.abs(h)/2
    );

  ctx.beginPath();

  ctx.moveTo(
    x+rr,y
  );

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    rr
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    rr
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    rr
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    rr
  );

  ctx.closePath();
}

/* =========================================================
   RENK
========================================================= */

function shadeColor(
  hex,
  amount
){

  let c=
    hex.replace("#","");

  let r=parseInt(
    c.substring(0,2),
    16
  );

  let g=parseInt(
    c.substring(2,4),
    16
  );

  let b=parseInt(
    c.substring(4,6),
    16
  );

  r=Math.max(
    0,
    Math.min(
      255,
      r+amount
    )
  );

  g=Math.max(
    0,
    Math.min(
      255,
      g+amount
    )
  );

  b=Math.max(
    0,
    Math.min(
      255,
      b+amount
    )
  );

  return "#"+
    r.toString(16).padStart(2,"0")+
    g.toString(16).padStart(2,"0")+
    b.toString(16).padStart(2,"0");
}

/* =========================================================
   PROFESYONEL ARABA ÇİZİMİ
========================================================= */

function drawCar(
  x,y,w,h,color,
  isPlayer=false,
  tilt=0
){

  if(w<=0||h<=0)return;

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(tilt);

  /* gölge */

  ctx.fillStyle=
    "rgba(0,0,0,.38)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.47,
    w*.60,
    h*.105,
    0,0,
    Math.PI*2
  );

  ctx.fill();

  /* lastikler */

  ctx.fillStyle="#090a0c";

  const tw=
    Math.max(
      3,
      w*.18
    );

  const th=
    Math.max(
      7,
      h*.245
    );

  roundRect(
    ctx,
    -w*.55,
    -h*.31,
    tw,
    th,
    3
  );
  ctx.fill();

  roundRect(
    ctx,
    w*.37,
    -h*.31,
    tw,
    th,
    3
  );
  ctx.fill();

  roundRect(
    ctx,
    -w*.55,
    h*.11,
    tw,
    th,
    3
  );
  ctx.fill();

  roundRect(
    ctx,
    w*.37,
    h*.11,
    tw,
    th,
    3
  );
  ctx.fill();

  /* jantlar */

  if(w>18){

    ctx.fillStyle="#8e949a";

    for(
      const wx of [
        -w*.47,
        w*.45
      ]
    ){

      ctx.beginPath();

      ctx.arc(
        wx,
        -h*.18,
        Math.max(
          2,
          w*.045
        ),
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.beginPath();

      ctx.arc(
        wx,
        h*.24,
        Math.max(
          2,
          w*.045
        ),
        0,
        Math.PI*2
      );

      ctx.fill();
    }
  }

  /* ana gövde */

  const bodyGrad=
    ctx.createLinearGradient(
      -w/2,
      0,
      w/2,
      0
    );

  bodyGrad.addColorStop(
    0,
    shadeColor(color,-42)
  );

  bodyGrad.addColorStop(
    .20,
    shadeColor(color,-13)
  );

  bodyGrad.addColorStop(
    .48,
    color
  );

  bodyGrad.addColorStop(
    .72,
    shadeColor(color,16)
  );

  bodyGrad.addColorStop(
    1,
    shadeColor(color,-25)
  );

  ctx.fillStyle=bodyGrad;

  roundRect(
    ctx,
    -w/2,
    -h/2,
    w,
    h,
    w*.16
  );

  ctx.fill();

  /* tavan */

  ctx.fillStyle=
    shadeColor(color,-7);

  roundRect(
    ctx,
    -w*.35,
    -h*.25,
    w*.70,
    h*.47,
    w*.12
  );

  ctx.fill();

  /* ön cam */

  const glass=
    ctx.createLinearGradient(
      0,
      -h*.27,
      0,
      0
    );

  glass.addColorStop(
    0,
    "#4d6872"
  );

  glass.addColorStop(
    .5,
    "#21353d"
  );

  glass.addColorStop(
    1,
    "#10191e"
  );

  ctx.fillStyle=glass;

  roundRect(
    ctx,
    -w*.285,
    -h*.235,
    w*.57,
    h*.22,
    w*.055
  );

  ctx.fill();

  /* cam bölmesi */

  ctx.fillStyle=
    "rgba(255,255,255,.15)";

  ctx.beginPath();

  ctx.moveTo(
    -w*.22,
    -h*.20
  );

  ctx.lineTo(
    -w*.07,
    -h*.20
  );

  ctx.lineTo(
    -w*.18,
    -h*.055
  );

  ctx.closePath();

  ctx.fill();

  /* arka cam */

  ctx.fillStyle="#14242b";

  roundRect(
    ctx,
    -w*.285,
    h*.045,
    w*.57,
    h*.19,
    w*.055
  );

  ctx.fill();

  /* ön tampon */

  ctx.fillStyle=
    shadeColor(color,-38);

  roundRect(
    ctx,
    -w*.38,
    -h*.475,
    w*.76,
    h*.07,
    w*.025
  );

  ctx.fill();

  /* ön ızgara */

  if(w>15){

    ctx.fillStyle="#111";

    roundRect(
      ctx,
      -w*.27,
      -h*.455,
      w*.54,
      h*.035,
      2
    );

    ctx.fill();
  }

  /* farlar */

  ctx.fillStyle="#fff3bd";

  roundRect(
    ctx,
    -w*.35,
    -h*.455,
    w*.20,
    h*.065,
    2
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.15,
    -h*.455,
    w*.20,
    h*.065,
    2
  );

  ctx.fill();

  /* stoplar */

  ctx.fillStyle="#ff2929";

  roundRect(
    ctx,
    -w*.34,
    h*.39,
    w*.21,
    h*.06,
    2
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.13,
    h*.39,
    w*.21,
    h*.06,
    2
  );

  ctx.fill();

  /* PLAYER MUSTANG */

  if(isPlayer){

    /* siyah yarış şeridi */

    ctx.fillStyle="#151515";

    roundRect(
      ctx,
      -w*.072,
      -h*.47,
      w*.144,
      h*.94,
      w*.02
    );

    ctx.fill();

    /* yan şeritler */

    ctx.fillStyle=
      "rgba(255,255,255,.16)";

    ctx.fillRect(
      -w*.265,
      -h*.43,
      w*.023,
      h*.86
    );

    ctx.fillRect(
      w*.242,
      -h*.43,
      w*.023,
      h*.86
    );

    /* Mustang yazısı */

    if(w>25){

      ctx.fillStyle=
        "rgba(255,255,255,.92)";

      ctx.font=
        `900 ${Math.max(
          6,
          w*.11
        )}px Arial`;

      ctx.textAlign="center";
      ctx.textBaseline="middle";

      ctx.fillText(
        "MUSTANG",
        0,
        h*.045
      );
    }

    /* küçük amblem */

    ctx.fillStyle="#d9d9d9";

    ctx.beginPath();

    ctx.arc(
      0,
      -h*.425,
      Math.max(
        2,
        w*.043
      ),
      0,
      Math.PI*2
    );

    ctx.fill();

    /* egzoz */

    ctx.fillStyle="#080808";

    ctx.beginPath();

    ctx.arc(
      -w*.25,
      h*.47,
      Math.max(1.5,w*.025),
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      w*.25,
      h*.47,
      Math.max(1.5,w*.025),
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function calculateSteering(){

  if(
    keyboardLeft &&
    !keyboardRight
  ){

    steering=-1;
    return;
  }

  if(
    keyboardRight &&
    !keyboardLeft
  ){

    steering=1;
    return;
  }

  if(
    touchLeft &&
    !touchRight
  ){

    steering=-1;
    return;
  }

  if(
    touchRight &&
    !touchLeft
  ){

    steering=1;
    return;
  }

  steering=0;
}

function updatePlayer(dt){

  const power=
    245+
    speed*1.45;

  player.targetX+=
    steering*
    power*
    dt;

  const roadW=
    roadWidthAt(
      player.y
    );

  const center=
    roadCenterAt(
      player.y
    );

  const padding=
    player.width*.60;

  const minX=
    center-
    roadW/2+
    padding;

  const maxX=
    center+
    roadW/2-
    padding;

  player.targetX=
    Math.max(
      minX,
      Math.min(
        maxX,
        player.targetX
      )
    );

  const follow=
    12+
    speed/35;

  player.x+=
    (
      player.targetX-
      player.x
    )*
    Math.min(
      1,
      dt*follow
    );

  const wantedTilt=
    steering*.065;

  player.tilt+=
    (
      wantedTilt-
      player.tilt
    )*
    Math.min(
      1,
      dt*11
    );
}

/* =========================================================
   TRAFİK UPDATE
========================================================= */

function updateTraffic(dt){

  for(
    let i=traffic.length-1;
    i>=0;
    i--
  ){

    const car=traffic[i];

    car.progress+=
      dt*
      car.speed*
      (
        .72+
        speed/185
      );

    if(
      car.progress>1.08
    ){

      traffic.splice(i,1);

      score+=10;

      continue;
    }

    const p=
      Math.max(
        .075,
        Math.min(
          1,
          car.progress
        )
      );

    /*
      Perspektif eğrisi:
      araçlar yolun üzerinde kalıyor.
    */

    const visualP=
      Math.pow(
        p,
        1.10
      );

    car.y=
      getHorizon()+
      visualP*
      (
        H-
        getHorizon()
      );

    const roadW=
      roadWidthAt(car.y);

    const center=
      roadCenterAt(car.y);

    const laneW=
      roadW/3;

    car.x=
      center-
      roadW/2+
      laneW*
      (car.lane+.5);

    /*
      Trafik araçları uzakta küçük,
      yakında doğal şekilde büyüyor.
    */

    const scale=
      .11+
      Math.pow(
        p,
        .73
      )*.82;

    car.drawW=
      Math.max(
        5,
        car.width*scale
      );

    car.drawH=
      Math.max(
        10,
        car.height*scale
      );
  }
}

/* =========================================================
   COIN UPDATE
========================================================= */

function updateCoins(dt){

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    const c=coinObjects[i];

    c.progress+=
      dt*
      (
        .22+
        speed/700
      );

    c.spin+=
      dt*6;

    if(
      c.progress>1.08
    ){

      coinObjects.splice(i,1);

      continue;
    }

    const p=
      Math.max(
        .10,
        Math.min(
          1,
          c.progress
        )
      );

    c.y=
      getHorizon()+
      Math.pow(
        p,
        1.03
      )*
      (
        H-
        getHorizon()
      );

    const roadW=
      roadWidthAt(c.y);

    const center=
      roadCenterAt(c.y);

    const laneW=
      roadW/3;

    c.x=
      center-
      roadW/2+
      laneW*
      (c.lane+.5);

    c.size=
      4+
      Math.pow(
        p,
        .65
      )*17;
  }
}

/* =========================================================
   COIN DRAW
========================================================= */

function drawCoins(){

  for(
    const c of coinObjects
  ){

    ctx.save();

    ctx.translate(
      c.x,
      c.y
    );

    const sx=
      Math.abs(
        Math.cos(c.spin)
      );

    ctx.scale(
      Math.max(.18,sx),
      1
    );

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      c.size,
      0,
      Math.PI*2
    );

    const grad=
      ctx.createRadialGradient(
        -c.size*.25,
        -c.size*.25,
        1,
        0,
        0,
        c.size
      );

    grad.addColorStop(
      0,
      "#fff5a8"
    );

    grad.addColorStop(
      .45,
      "#ffd83d"
    );

    grad.addColorStop(
      1,
      "#d28c00"
    );

    ctx.fillStyle=grad;
    ctx.fill();

    ctx.strokeStyle="#a36c00";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle="#8b5b00";

    ctx.font=
      `bold ${Math.max(
        6,
        c.size*.9
      )}px Arial`;

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      "₺",
      0,
      1
    );

    ctx.restore();
  }
}

/* =========================================================
   ÇARPIŞMA
========================================================= */

function hitTest(a,b){

  if(
    b.drawW<15||
    b.drawH<25
  ){
    return false;
  }

  const aw=
    a.width*.68;

  const ah=
    a.height*.65;

  const bw=
    b.drawW*.67;

  const bh=
    b.drawH*.65;

  return(
    Math.abs(
      a.x-b.x
    )<
    (aw+bw)/2
    &&
    Math.abs(
      a.y-b.y
    )<
    (ah+bh)/2
  );
}

function coinHit(c){

  return(
    Math.abs(
      player.x-c.x
    )<
    player.width*.62
    &&
    Math.abs(
      player.y-c.y
    )<
    player.height*.60
  );
}

/* =========================================================
   START
========================================================= */

function startGame(){

  initAudio();

  if(
    audioCtx &&
    audioCtx.state==="suspended"
  ){
    audioCtx.resume();
  }

  running=true;

  menu.style.display="none";
  gameOver.style.display="none";

  score=0;
  coins=0;

  speed=0;
  targetSpeed=0;

  roadOffset=0;

  traffic=[];
  coinObjects=[];

  spawnTimer=.95;
  coinTimer=1.25;

  touchLeft=false;
  touchRight=false;

  keyboardLeft=false;
  keyboardRight=false;

  steering=0;

  player.x=W/2;
  player.targetX=W/2;
  player.y=getPlayerY();
  player.tilt=0;

  speedText.textContent="0";
  scoreText.textContent="0";
  coinText.textContent="0";

  lastTime=
    performance.now();
}

/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  if(!running)return;

  running=false;

  speed=0;

  steering=0;

  touchLeft=false;
  touchRight=false;

  keyboardLeft=false;
  keyboardRight=false;

  updateEngineSound();

  collisionSound();

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(score);

  document.getElementById(
    "finalCoins"
  ).textContent=
    coins;

  gameOver.style.display="flex";
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(!running)return;

  targetSpeed=
    Math.min(
      220,
      95+
      score*.025
    );

  speed+=
    (
      targetSpeed-
      speed
    )*
    Math.min(
      1,
      dt*1.6
    );

  roadOffset+=
    speed*
    dt*
    2.8;

  score+=
    speed*
    dt*
    .035;

  updatePlayer(dt);

  spawnTimer-=dt;
  coinTimer-=dt;

  if(
    spawnTimer<=0
  ){

    spawnTraffic();

    spawnTimer=
      Math.max(
        .72,
        1.30-
        speed/570
      );
  }

  if(
    coinTimer<=0
  ){

    spawnCoin();

    coinTimer=
      1.05+
      Math.random()*.85;
  }

  updateTraffic(dt);
  updateCoins(dt);

  /* trafik çarpışması */

  for(
    const car of traffic
  ){

    if(
      hitTest(
        player,
        car
      )
    ){

      endGame();

      return;
    }
  }

  /* altın toplama */

  for(
    let i=
      coinObjects.length-1;
    i>=0;
    i--
  ){

    if(
      coinHit(
        coinObjects[i]
      )
    ){

      coinObjects.splice(
        i,
        1
      );

      coins++;

      score+=25;

      coinSound();
    }
  }

  speedText.textContent=
    Math.floor(speed);

  scoreText.textContent=
    Math.floor(score);

  coinText.textContent=
    coins;

  updateEngineSound();
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawRoad();

  /*
    Uzak araçlar önce çizilir.
    Yakındaki araçlar sonradan çizilir.
  */

  const sortedTraffic=
    traffic.slice().sort(
      (a,b)=>
        a.y-b.y
    );

  for(
    const car of sortedTraffic
  ){

    drawCar(
      car.x,
      car.y,
      car.drawW,
      car.drawH,
      car.color,
      false,
      0
    );
  }

  drawCoins();

  /* oyuncu her zaman üstte */

  drawCar(
    player.x,
    player.y,
    player.width,
    player.height,
    player.color,
    true,
    player.tilt
  );
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

  const dt=
    Math.min(
      .035,
      (now-lastTime)/1000||0
    );

  lastTime=now;

  update(dt);

  draw();

  requestAnimationFrame(loop);
}

player.x=W/2;
player.targetX=W/2;
player.y=getPlayerY();

lastTime=

requestAnimationFrame(loop);

        audioCtx &&
        audioCtx.state==="suspended"
      ){

        audioCtx.resume();
      }

      updateEngineSound();
    }
  }
);

</script>
