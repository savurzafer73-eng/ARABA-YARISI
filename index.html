<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road Ultimate - Play Edition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d11;font-family:Arial,sans-serif;touch-action:none;}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* HUD */
#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(94vw,520px);display:flex;justify-content:space-between;gap:6px;z-index:10;pointer-events:none;}
.hudBox{min-width:85px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.65);color:#fff;text-align:center;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(5px);}
.hudSmall{font-size:10px;opacity:.7;}
.hudValue{font-size:18px;font-weight:bold;}

/* KONTROLLER */
.touchZone{position:absolute;bottom:0;width:35%;height:60%;z-index:8;touch-action:none;}
#leftZone{left:0;} #rightZone{right:0;}
#nosBtn{position:absolute;bottom:25px;right:25px;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#00d2ff,#0066ff);border:2px solid #fff;color:#fff;font-weight:900;font-size:16px;z-index:15;box-shadow:0 0 15px rgba(0,150,255,.6);display:flex;align-items:center;justify-content:center;}
#nosBtn:active{transform:scale(.92);}

/* MENÜ & GARAJ */
.overlay{position:absolute;inset:0;z-index:20;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);}
.panel{width:min(90vw,420px);padding:24px;border-radius:20px;background:#15151c;border:1px solid rgba(255,255,255,.15);text-align:center;color:#fff;}
.logo{font-size:32px;font-weight:900;letter-spacing:2px;} .logo span{color:#ff3838;}
button.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;font-size:16px;font-weight:bold;color:#fff;background:#282832;cursor:pointer;}
button.btnPrimary{background:linear-gradient(135deg,#ff3030,#b80000);}

/* GARAJ ÖĞELERİ */
.carSelect{display:flex;align-items:center;justify-content:space-between;margin:15px 0;background:#1e1e28;padding:12px;border-radius:12px;}
.carNav{background:#3a3a4a;border:none;color:#fff;padding:8px 14px;border-radius:8px;font-size:18px;cursor:pointer;}
</style>
</head>
<body>

<div id="game">
<canvas id="canvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hudBox"><div class="hudSmall">HIZ</div><div class="hudValue"><span id="speedText">0</span> <small>KM/H</small></div></div>
  <div class="hudBox"><div class="hudSmall">SKOR</div><div class="hudValue" id="scoreText">0</div></div>
  <div class="hudBox"><div class="hudSmall">ALTIN</div><div class="hudValue">🪙 <span id="coinText">0</span></div></div>
</div>

<!-- DOKUNMATİK KONTROLLER -->
<div id="leftZone" class="touchZone"></div>
<div id="rightZone" class="touchZone"></div>
<div id="nosBtn">NOS</div>

<!-- ANA MENÜ / GARAJ -->
<div id="menu" class="overlay">
  <div class="panel">
    <div class="logo">TURBO <span>ROAD</span></div>
    <p style="color:#aaa;font-size:12px;margin-bottom:15px;">Google Play Edition</p>
    
    <div class="carSelect">
      <button class="carNav" id="prevCar">‹</button>
      <div>
        <div id="carName" style="font-weight:bold;font-size:18px;">Mustang GT</div>
        <div id="carStatus" style="font-size:12px;color:#4caf50;">SEÇİLDİ</div>
      </div>
      <button class="carNav" id="nextCar">›</button>
    </div>

    <button class="btn btnPrimary" id="startBtn">🏁 BAŞLA</button>
    <button class="btn" id="buyBtn" style="display:none;">🪙 500 ALTIN İLE AÇ</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameOver" class="overlay" style="display:none;">
  <div class="panel">
    <h2 style="font-size:28px;color:#ff3838;">KAZA YAPTIN!</h2>
    <p style="margin:15px 0;color:#bbb;">Skor: <b id="finalScore" style="color:#fff;">0</b> | Altın: <b id="finalCoins" style="color:#ffd700;">0</b></p>
    <button class="btn btnPrimary" id="restartBtn">🔄 TEKRAR DENE</button>
    <button class="btn" id="garajBtn">🏠 GARAJA DÖN</button>
  </div>
</div>
</div>

<script>
"use strict";

const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

// OYUN DURUMU
let running = false, lastTime = 0, score = 0, coins = parseInt(localStorage.getItem("tr_coins") || "0");
let speed = 0, targetSpeed = 0, roadOffset = 0, isNos = false;

// ARAÇ LİSTESİ & GARAJ
const CARS = [
  { id: "mustang", name: "Mustang GT", color: "#d71920", price: 0, unlocked: true },
  { id: "viper", name: "Viper GTS", color: "#1e88e5", price: 300, unlocked: localStorage.getItem("tr_car_viper") === "1" },
  { id: "phantom", name: "Phantom RX", color: "#f57c00", price: 600, unlocked: localStorage.getItem("tr_car_phantom") === "1" }
];
let currentCarIdx = 0;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  player.y = H * 0.80;
}
window.addEventListener("resize", resize);

// OYUNCU & FİZİK
const player = { x: 0, y: 0, width: 50, height: 95, targetX: 0, tilt: 0 };
let steering = 0, tLeft = false, tRight = false, kLeft = false, kRight = false;

function updateSteering(){
  steering = (kLeft || tLeft) ? -1 : (kRight || tRight) ? 1 : 0;
}

// PERSPEKTİF YOL
const getHorizon = () => H * 0.35;
const roadProgress = y => Math.max(0, Math.min(1, (y - getHorizon()) / (H - getHorizon())));
const roadWidthAt = y => W * (0.12 + 0.88 * Math.pow(roadProgress(y), 0.8));
const roadCenterAt = y => W / 2 + Math.sin(roadOffset * 0.0006) * W * 0.03 * Math.pow(roadProgress(y), 1.5);

// TRAFİK VE ALTINLAR
let traffic = [], coinObjects = [];
const trafficColors = ["#cccccc", "#3949ab", "#43a047", "#8e24aa"];

function spawnTraffic(){
  traffic.push({ lane: Math.floor(Math.random()*3), progress: 0.08, speed: 0.18 + Math.random()*0.1, color: trafficColors[Math.floor(Math.random()*trafficColors.length)], width: 42, height: 80, x:0, y:0, drawW:0, drawH:0 });
}
function spawnCoin(){
  coinObjects.push({ lane: Math.floor(Math.random()*3), progress: 0.1, x:0, y:0, size:8 });
}

// OYUN DÖNGÜSÜ
function startGame(){
  running = true;
  document.getElementById("menu").style.display = "none";
  document.getElementById("gameOver").style.display = "none";
  score = 0; speed = 0; roadOffset = 0;
  traffic = []; coinObjects = [];
  player.x = W/2; player.targetX = W/2;
  lastTime = performance.now();
  updateUI();
}

function update(dt){
  if(!running) return;

  let maxSpd = (isNos ? 260 : 180);
  targetSpeed = Math.min(maxSpd, 100 + score * 0.03 + (isNos ? 80 : 0));
  speed += (targetSpeed - speed) * dt * 2;
  roadOffset += speed * dt * 3;
  score += speed * dt * 0.05;

  // Oyuncu Hareketi
  player.targetX += steering * (260 + speed * 1.2) * dt;
  let c = roadCenterAt(player.y), w = roadWidthAt(player.y);
  player.targetX = Math.max(c - w/2 + 30, Math.min(c + w/2 - 30, player.targetX));
  player.x += (player.targetX - player.x) * dt * 12;
  player.tilt += (steering * 0.08 - player.tilt) * dt * 10;

  // Spawnlar
  if(Math.random() < dt * 1.2) spawnTraffic();
  if(Math.random() < dt * 0.9) spawnCoin();

  // Trafik Güncelle
  for(let i = traffic.length - 1; i >= 0; i--){
    let t = traffic[i];
    t.progress += dt * t.speed * (0.8 + speed/200);
    if(t.progress > 1.05){ traffic.splice(i,1); score+=15; continue; }
    
    t.y = getHorizon() + Math.pow(t.progress, 1.1) * (H - getHorizon());
    let rw = roadWidthAt(t.y), rc = roadCenterAt(t.y);
    t.x = rc - rw/2 + (rw/3) * (t.lane + 0.5);
    t.drawW = t.width * (0.15 + t.progress * 0.85);
    t.drawH = t.height * (0.15 + t.progress * 0.85);

    // Çarpmak
    if(Math.abs(player.x - t.x) < (player.width + t.drawW)*0.35 && Math.abs(player.y - t.y) < (player.height + t.drawH)*0.35){
      endGame();
    }
  }

  // Altın Güncelle
  for(let i = coinObjects.length - 1; i >= 0; i--){
    let cn = coinObjects[i];
    cn.progress += dt * 0.25;
    if(cn.progress > 1.05){ coinObjects.splice(i,1); continue; }
    cn.y = getHorizon() + Math.pow(cn.progress, 1.05) * (H - getHorizon());
    let rw = roadWidthAt(cn.y), rc = roadCenterAt(cn.y);
    cn.x = rc - rw/2 + (rw/3) * (cn.lane + 0.5);
    cn.size = 5 + cn.progress * 12;

    if(Math.abs(player.x - cn.x) < player.width*0.5 && Math.abs(player.y - cn.y) < player.height*0.5){
      coinObjects.splice(i,1); coins += 1;
      localStorage.setItem("tr_coins", coins);
    }
  }

  updateUI();
}

function updateUI(){
  document.getElementById("speedText").textContent = Math.floor(speed);
  document.getElementById("scoreText").textContent = Math.floor(score);
  document.getElementById("coinText").textContent = coins;
}

function endGame(){
  running = false;
  document.getElementById("finalScore").textContent = Math.floor(score);
  document.getElementById("finalCoins").textContent = coins;
  document.getElementById("gameOver").style.display = "flex";
}

// ÇİZİM
function draw(){
  ctx.clearRect(0, 0, W, H);

  // Arka Plan & Yol
  ctx.fillStyle = "#1a233a"; ctx.fillRect(0,0,W,getHorizon());
  ctx.fillStyle = "#2e7d32"; ctx.fillRect(0,getHorizon(),W,H-getHorizon());

  let h = getHorizon(), tc = roadCenterAt(h), bc = roadCenterAt(H), tw = roadWidthAt(h), bw = roadWidthAt(H);
  ctx.beginPath(); ctx.moveTo(tc-tw/2, h); ctx.lineTo(tc+tw/2, h); ctx.lineTo(bc+bw/2, H); ctx.lineTo(bc-bw/2, H);
  ctx.fillStyle = "#33333d"; ctx.fill();

  // Trafik & Altın Çizimi
  for(let c of coinObjects){
    ctx.beginPath(); ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
    ctx.fillStyle = "#ffd700"; ctx.fill();
  }
  for(let t of traffic){
    ctx.fillStyle = t.color;
    ctx.fillRect(t.x - t.drawW/2, t.y - t.drawH/2, t.drawW, t.drawH);
  }

  // Oyuncu Arabası
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.tilt);
  ctx.fillStyle = CARS[currentCarIdx].color;
  ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);
  
  // Nitro Efekti
  if(isNos && running){
    ctx.fillStyle = "#00d2ff";
    ctx.fillRect(-player.width/4, player.height/2, player.width/2, 15 + Math.random()*10);
  }
  ctx.restore();
}

function loop(now){
  let dt = Math.min((now - lastTime)/1000, 0.1);
  lastTime = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}

// GARAJ MANTIĞI
function updateGaraj(){
  let c = CARS[currentCarIdx];
  document.getElementById("carName").textContent = c.name;
  let status = document.getElementById("carStatus");
  let buyBtn = document.getElementById("buyBtn");
  let startBtn = document.getElementById("startBtn");

  if(c.unlocked){
    status.textContent = "SAHİPSİN"; status.style.color = "#4caf50";
    buyBtn.style.display = "none"; startBtn.style.display = "block";
  }else{
    status.textContent = "KİLİTLİ"; status.style.color = "#f44336";
    buyBtn.style.display = "block"; startBtn.style.display = "none";
    buyBtn.textContent = `🪙 ${c.price} ALTIN İLE AÇ`;
  }
}

document.getElementById("prevCar").onclick = () => { currentCarIdx = (currentCarIdx - 1 + CARS.length) % CARS.length; updateGaraj(); };
document.getElementById("nextCar").onclick = () => { currentCarIdx = (currentCarIdx + 1) % CARS.length; updateGaraj(); };
document.getElementById("buyBtn").onclick = () => {
  let c = CARS[currentCarIdx];
  if(coins >= c.price){
    coins -= c.price; localStorage.setItem("tr_coins", coins);
    c.unlocked = true; localStorage.setItem("tr_car_" + c.id, "1");
    updateGaraj(); updateUI();
  } else { alert("Yetersiz Altın!"); }
};

// KONTROL DİNLEYİCİLERİ
const nosBtn = document.getElementById("nosBtn");
nosBtn.addEventListener("pointerdown", () => isNos = true);
nosBtn.addEventListener("pointerup", () => isNos = false);

document.getElementById("leftZone").addEventListener("pointerdown", () => { tLeft = true; updateSteering(); });
document.getElementById("leftZone").addEventListener("pointerup", () => { tLeft = false; updateSteering(); });
document.getElementById("rightZone").addEventListener("pointerdown", () => { tRight = true; updateSteering(); });
document.getElementById("rightZone").addEventListener("pointerup", () => { tRight = false; updateSteering(); });

window.addEventListener("keydown", e => {
  if(e.key === "ArrowLeft" || e.key === "a") kLeft = true;
  if(e.key === "ArrowRight" || e.key === "d") kRight = true;
  if(e.shiftKey) isNos = true;
  updateSteering();
});
window.addEventListener("keyup", e => {
  if(e.key === "ArrowLeft" || e.key === "a") kLeft = false;
  if(e.key === "ArrowRight" || e.key === "d") kRight = false;
  if(!e.shiftKey) isNos = false;
  updateSteering();
});

document.getElementById("startBtn").onclick = startGame;
document.getElementById("restartBtn").onclick = startGame;
document.getElementById("garajBtn").onclick = () => { document.getElementById("gameOver").style.display = "none"; document.getElementById("menu").style.display = "flex"; };

resize();
updateGaraj();
requestAnimationFrame(loop);
</script>
</body>
</html>
