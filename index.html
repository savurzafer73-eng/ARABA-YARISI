<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road Ultimate</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

body{
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#111;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ================= HUD ================= */

#hud{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(94vw,520px);
  display:flex;
  justify-content:space-between;
  gap:6px;
  z-index:10;
  pointer-events:none;
}

.hudBox{
  min-width:90px;
  padding:8px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.62);
  color:white;
  text-align:center;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(5px);
}

.hudSmall{
  font-size:11px;
  opacity:.7;
}

.hudValue{
  font-size:20px;
  font-weight:bold;
}

/* ================= MENU ================= */

#menu{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(
    rgba(0,0,0,.42),
    rgba(0,0,0,.80)
  );
}

.menuPanel{
  width:min(90vw,400px);
  padding:28px;
  border-radius:24px;
  background:rgba(15,15,18,.95);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 70px rgba(0,0,0,.65);
  text-align:center;
  color:white;
}

.logo{
  font-size:34px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#ff3838;
}

.subtitle{
  color:#aaa;
  font-size:13px;
  margin:5px 0 25px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:#24242a;
  border:1px solid rgba(255,255,255,.12);
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.startBtn{
  background:linear-gradient(135deg,#ff3030,#b80000);
}

.info{
  margin-top:18px;
  font-size:12px;
  line-height:1.6;
  color:#888;
}

/* ================= DİREKSİYON ================= */

.touchZone{
  position:absolute;
  bottom:0;
  width:50%;
  height:55%;
  z-index:8;
  touch-action:none;
}

#leftZone{
  left:0;
}

#rightZone{
  right:0;
}

.touchHint{
  position:absolute;
  bottom:25px;
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  pointer-events:none;
  font-size:25px;
  z-index:9;
}

#leftHint{
  left:25px;
}

#rightHint{
  right:25px;
}

/* ================= SES ================= */

#soundBtn{
  position:absolute;
  right:12px;
  bottom:15px;
  width:48px;
  height:48px;
  padding:0;
  margin:0;
  border-radius:50%;
  z-index:15;
  background:rgba(0,0,0,.6);
}

/* ================= GAME OVER ================= */

#gameOver{
  position:absolute;
  inset:0;
  z-index:25;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
}

.overPanel{
  width:min(88vw,360px);
  padding:28px;
  border-radius:22px;
  background:#151519;
  color:white;
  text-align:center;
  border:1px solid rgba(255,255,255,.12);
}

.overPanel h2{
  font-size:30px;
}

.result{
  color:#bbb;
  margin:12px 0 18px;
  line-height:1.8;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .hudBox{
    min-width:0;
    flex:1;
    padding:6px 4px;
  }

  .hudValue{
    font-size:16px;
  }

  .logo{
    font-size:29px;
  }

  .menuPanel{
    padding:24px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- HUD -->
<div id="hud">

  <div class="hudBox">
    <div class="hudSmall">HIZ</div>
    <div class="hudValue">
      <span id="speedText">0</span> KM/H

</div>

<!-- DİREKSİYON -->

<div id="rightHint" class="touchHint">›</div>

<!-- MENÜ -->
<div id="menu">

  <div class="menuPanel">

    </button>

      🏠 ANA MENÜ
    </button>

<script>
"use strict";

/* =========================================================
   ELEMENTLER
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const menu=document.getElementById("menu");
const gameOver=document.getElementById("gameOver");

const leftZone=document.getElementById("leftZone");
const rightZone=document.getElementById("rightZone");

/* =========================================================
   CANVAS
========================================================= */

let W=0;
let H=0;

let DPR=Math.min(
  window.devicePixelRatio || 1,
  2
);

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  if(typeof player!=="undefined" && !running){

    player.x=W/2;
    player.targetX=W/2;
    player.y=getPlayerY();
  }
}

window.addEventListener(
  "resize",
  resize
);

/* =========================================================
   OYUN DEĞİŞKENLERİ
========================================================= */

let running=false;
let lastTime=0;

let score=0;
let coins=0;

let speed=0;
let targetSpeed=0;

let roadOffset=0;

/* =========================================================
   YOL PERSPEKTİFİ
========================================================= */

/*
   ÖNEMLİ:
   Yol artık gökyüzünden başlamıyor.

   Ufuk daha aşağıda tutuluyor.
   Böylece araçlar yola girmeden
   gökyüzünde görünmüyor.
*/

function getHorizon(){

  return H*.31;
}

function roadProgress(y){

  const horizon=getHorizon();

  return Math.max(
    0,
    Math.min(
      1,
      (y-horizon)/
      (H-horizon)
    )
  );
}

function roadWidthAt(y){

  const p=roadProgress(y);

  return W*(
    .16+
    .86*Math.pow(p,.82)
  );
}

function roadCenterAt(y){

  const p=roadProgress(y);

  return W/2+
    Math.sin(
      roadOffset*.00055
    )*
    W*.045*
    Math.pow(p,1.6);
}

/*
   Oyuncu kesinlikle yolun alt bölümünde.
*/

function getPlayerY(){

  return H*.80;
}

/* =========================================================
   DİREKSİYON
========================================================= */

let steering=0;

let touchLeft=false;
let touchRight=false;

let keyboardLeft=false;
let keyboardRight=false;

function calculateSteering(){

  if(keyboardLeft && !keyboardRight){

    steering=-1;
    return;
  }

  if(keyboardRight && !keyboardLeft){

    steering=1;
    return;
  }

  if(touchLeft && !touchRight){

    steering=-1;
    return;
  }

  if(touchRight && !touchLeft){

    steering=1;
    return;
  }

  steering=0;
}

/* =========================================================
   OYUNCU
========================================================= */

const player={

  x:0,
  y:0,

  width:52,
  height:100,

  targetX:0,

  color:"#d71920",

  tilt:0
};

/* =========================================================
   TRAFİK
========================================================= */

let traffic=[];
let spawnTimer=0;

const trafficColors=[
  "#eeeeee",
  "#1769aa",
  "#f39c12",
  "#20252b",
  "#38a169",
  "#8e44ad",
  "#d35400"
];

/* =========================================================
   ALTIN
========================================================= */

let coinObjects=[];
let coinTimer=0;

/* =========================================================
   SES
========================================================= */

let audioCtx=null;
let engineOsc=null;
let engineGain=null;
let engineFilter=null;

let audioStarted=false;
let soundEnabled=true;

function initAudio(){

  if(audioStarted || !soundEnabled)
    return;

  try{

    audioCtx=new(
      window.AudioContext ||
      window.webkitAudioContext
    )();

    engineOsc=
      audioCtx.createOscillator();

    engineGain=
      audioCtx.createGain();

    engineFilter=
      audioCtx.createBiquadFilter();

    engineOsc.type="sawtooth";

    engineFilter.type="lowpass";

    engineFilter.frequency.value=600;

    engineGain.gain.value=0;

    engineOsc.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);

    engineOsc.start();

    audioStarted=true;

  }catch(e){

    console.log(e);
  }
}

function updateEngineSound(){

  if(
    !audioStarted ||
    !audioCtx ||
    !soundEnabled
  )
    return;

  const now=audioCtx.currentTime;

  const normalized=
    Math.max(
      0,
      Math.min(
        1,
        speed/220
      )
    );

  engineOsc.frequency.setTargetAtTime(
    55+
    normalized*210,
    now,
    .05
  );

  engineFilter.frequency.setTargetAtTime(
    450+
    normalized*1900,
    now,
    .06
  );

  const volume=
    running
      ?
      .008+
      normalized*.045
      :
      0;

  engineGain.gain.setTargetAtTime(
    volume,
    now,
    .08
  );
}

function collisionSound(){

  if(!soundEnabled)
    return;

  initAudio();

  if(!audioCtx)
    return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(
    120,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    40,
    audioCtx.currentTime+.25
  );

  gain.gain.setValueAtTime(
    .16,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.28
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime+.3
  );
}

function coinSound(){

  if(!soundEnabled)
    return;

  initAudio();

  if(!audioCtx)
    return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    600,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    1050,
    audioCtx.currentTime+.1
  );

  gain.gain.setValueAtTime(
    .08,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.18
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime+.2
  );
}

/* =========================================================
   ARKA PLAN
========================================================= */

function drawBackground(){

  const horizon=getHorizon();

  const sky=
    ctx.createLinearGradient(
      0,
      0,
      0,
      horizon+100
    );

  sky.addColorStop(
    0,
    "#62addf"
  );

  sky.addColorStop(
    .55,
    "#a9d7ed"
  );

  sky.addColorStop(
    1,
    "#dce8e9"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /* Güneş */

  ctx.beginPath();

  ctx.arc(
    W*.80,
    H*.12,
    Math.max(25,W*.055),
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,240,180,.9)";

  ctx.fill();

  /* Uzak dağlar */

  ctx.fillStyle="#708d88";

  ctx.beginPath();

  ctx.moveTo(
    0,
    horizon+.08*H
  );

  ctx.lineTo(
    W*.10,
    H*.20
  );

  ctx.lineTo(
    W*.22,
    H*.29
  );

  ctx.lineTo(
    W*.36,
    H*.17
  );

  ctx.lineTo(
    W*.51,
    H*.29
  );

  ctx.lineTo(
    W*.66,
    H*.18
  );

  ctx.lineTo(
    W*.82,
    H*.29
  );

  ctx.lineTo(
    W,
    H*.19
  );

  ctx.lineTo(
    W,
    horizon+.10*H
  );

  ctx.closePath();

  ctx.fill();

  /* Daha uzak zemin */

  ctx.fillStyle="#557b4d";

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );

  /* Yol dışı şerit dokusu */

  ctx.fillStyle=
    "rgba(255,255,255,.025)";

  for(
    let y=horizon;
    y<H;
    y+=32
  ){

    ctx.fillRect(
      0,
      y,
      W,
      2
    );
  }
}

/* =========================================================
   YOL
========================================================= */

function drawRoad(){

  const horizon=getHorizon();

  const topCenter=
    roadCenterAt(horizon);

  const bottomCenter=
    roadCenterAt(H);

  const topWidth=
    roadWidthAt(horizon);

  const bottomWidth=
    roadWidthAt(H);

  /* Yol */

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.closePath();

  const roadGradient=
    ctx.createLinearGradient(
      0,
      horizon,
      0,
      H
    );

  roadGradient.addColorStop(
    0,
    "#42434a"
  );

  roadGradient.addColorStop(
    1,
    "#28292e"
  );

  ctx.fillStyle=roadGradient;

  ctx.fill();

  /* Yol kenar çizgileri */

  ctx.strokeStyle="#f4f4f4";

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.stroke();

  /* Kırmızı-beyaz yol kenarları */

  const segment=70;

  for(
    let i=0;
    i<16;
    i++
  ){

    const p1=
      (i/16+
      ((roadOffset*.001)%1)/16);

    const p2=
      p1+.025;

    const y1=
      horizon+
      Math.min(1,p1)*(
        H-horizon
      );

    const y2=
      horizon+
      Math.min(1,p2)*(
        H-horizon
      );

    if(y1>=H)
      continue;

    const c1=roadCenterAt(y1);
    const c2=roadCenterAt(y2);

    const w1=roadWidthAt(y1);
    const w2=roadWidthAt(y2);

    ctx.strokeStyle=
      i%2===0
        ? "#ffffff"
        : "#d52a2a";

    ctx.lineWidth=
      Math.max(
        2,
        7*roadProgress(y1)
      );

    ctx.beginPath();

    ctx.moveTo(
      c1-w1/2,
      y1
    );

    ctx.lineTo(
      c2-w2/2,
      y2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      c1+w1/2,
      y1
    );

    ctx.lineTo(
      c2+w2/2,
      y2
    );

    ctx.stroke();
  }

  /* 3 şerit çizgisi */

  const gap=72;
  const length=34;

  for(
    let lane=1;
    lane<3;
    lane++
  ){

    for(
      let y=
        horizon+
        ((roadOffset*1.35)%gap)-
        gap;

      y<H;

      y+=gap
    ){

      const y2=
        Math.min(
          H,
          y+length
        );

      if(y2<=horizon)
        continue;

      const c1=
        roadCenterAt(y);

      const c2=
        roadCenterAt(y2);

      const w1=
        roadWidthAt(y);

      const w2=
        roadWidthAt(y2);

      const x1=
        c1-w1/2+
        w1*(lane/3);

      const x2=
        c2-w2/2+
        w2*(lane/3);

      const p=
        roadProgress(y);

      ctx.strokeStyle=
        "rgba(255,255,255,.78)";

      ctx.lineWidth=
        Math.max(
          1,
          4*p
        );

      ctx.beginPath();

      ctx.moveTo(
        x1,
        y
      );

      ctx.lineTo(
        x2,
        y2
      );

      ctx.stroke();
    }
  }
}

/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
  ctx,
  x,
  y,
  w,
  h,
  r
){

  const rr=
    Math.min(
      r,
      Math.abs(w)/2,
      Math.abs(h)/2
    );

  ctx.beginPath();

  ctx.moveTo(
    x+rr,
    y
  );

  ctx.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    rr
  );

  ctx.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    rr
  );

  ctx.arcTo(
    x,
    y+h,
    x,
    y,
    rr
  );

  ctx.arcTo(
    x,
    y,
    x+w,
    y,
    rr
  );

  ctx.closePath();
}

/* =========================================================
   RENK
========================================================= */

function shadeColor(
  hex,
  amount
){

  let c=
    hex.replace("#","");

  let r=parseInt(
    c.substring(0,2),
    16
  );

  let g=parseInt(
    c.substring(2,4),
    16
  );

  let b=parseInt(
    c.substring(4,6),
    16
  );

  r=Math.max(
    0,
    Math.min(
      255,
      r+amount
    )
  );

  g=Math.max(
    0,
    Math.min(
      255,
      g+amount
    )
  );

  b=Math.max(
    0,
    Math.min(
      255,
      b+amount
    )
  );

  return "#"+
    r.toString(16).padStart(2,"0")+
    g.toString(16).padStart(2,"0")+
    b.toString(16).padStart(2,"0");
}

/* =========================================================
   ARABA ÇİZİMİ
========================================================= */

function drawCar(
  x,
  y,
  w,
  h,
  color,
  isPlayer=false,
  tilt=0
){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(tilt);

  /* Gölge */

  ctx.fillStyle=
    "rgba(0,0,0,.38)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.47,
    w*.62,
    h*.12,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* Tekerlekler */

  ctx.fillStyle="#0c0c0d";

  const tw=w*.18;
  const th=h*.25;

  roundRect(
    ctx,
    -w*.57,
    -h*.31,
    tw,
    th,
    3
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.39,
    -h*.31,
    tw,
    th,
    3
  );

  ctx.fill();

  roundRect(
    ctx,
    -w*.57,
    h*.12,
    tw,
    th,
    3
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.39,
    h*.12,
    tw,
    th,
    3
  );

  ctx.fill();

  /* Ana gövde */
