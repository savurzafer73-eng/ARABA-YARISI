<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101114">
<title>Turbo Road Ultimate</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101114;
  font-family:Arial,sans-serif;
}

body{
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#101114;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* HUD */
#hud{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(94vw,540px);
  display:flex;
  gap:7px;
  z-index:20;
  pointer-events:none;
}

.hudBox{
  flex:1;
  min-width:0;
  padding:7px 8px;
  border-radius:13px;
  background:rgba(5,7,10,.72);
  color:#fff;
  text-align:center;
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(7px);
}

.hudSmall{
  font-size:9px;
  letter-spacing:1px;
  opacity:.62;
}

.hudValue{
  font-size:17px;
  font-weight:900;
}

/* MENU */
#menu{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(220,30,30,.18),transparent 35%),
    linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.86));
}

.menuPanel{
  width:min(90vw,400px);
  padding:27px;
  border-radius:25px;
  background:rgba(14,15,19,.97);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 25px 80px rgba(0,0,0,.7);
  text-align:center;
  color:white;
}

.logo{
  font-size:34px;
  font-weight:1000;
  letter-spacing:2px;
}

.logo span{
  color:#ff3434;
}

.subtitle{
  color:#aaa;
  font-size:13px;
  margin:5px 0 22px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:#25262c;
  border:1px solid rgba(255,255,255,.12);
}

button:active{
  transform:scale(.97);
}

.startBtn{
  background:linear-gradient(135deg,#ff3b3b,#9c0000);
  box-shadow:0 8px 24px rgba(200,0,0,.25);
}

.info{
  margin-top:17px;
  font-size:12px;
  line-height:1.7;
  color:#858585;
}

/* TOUCH */
.touchZone{
  position:absolute;
  bottom:0;
  width:50%;
  height:60%;
  z-index:10;
  touch-action:none;
}

#leftZone{
  left:0;
}

#rightZone{
  right:0;
}

.touchHint{
  position:absolute;
  bottom:22px;
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.34);
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.11);
  pointer-events:none;
  font-size:25px;
  z-index:11;
}

#leftHint{
  left:22px;
}

#rightHint{
  right:22px;
}

#soundBtn{
  position:absolute;
  right:12px;
  bottom:13px;
  width:48px;
  height:48px;
  padding:0;
  margin:0;
  border-radius:50%;
  z-index:30;
  background:rgba(0,0,0,.65);
}

/* GAME OVER */
#gameOver{
  position:absolute;
  inset:0;
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.76);
}

.overPanel{
  width:min(88vw,360px);
  padding:28px;
  border-radius:23px;
  background:#15161b;
  color:white;
  text-align:center;
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 20px 70px rgba(0,0,0,.65);
}

.overPanel h2{
  font-size:30px;
}

.result{
  color:#bbb;
  margin:12px 0 18px;
  line-height:1.8;
}

@media(max-width:600px){
  .hud{
    width:96vw;
  }

  .hudValue{
    font-size:14px;
  }

  .logo{
    font-size:29px;
  }

  .menuPanel{
    padding:23px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

  <div class="hudBox">
    <div class="hudSmall">HIZ</div>
    <div class="hudValue">
      <span id="speedText">0</span> KM/H
    </div>
  </div>

  <div class="hudBox">
    <div class="hudSmall">SKOR</div>
    <div class="hudValue" id="scoreText">0</div>
  </div>

  <div class="hudBox">
    <div class="hudSmall">ALTIN</div>
    <div class="hudValue">
      🪙 <span id="coinText">0</span>
    </div>
  </div>

</div>

<div id="leftZone" class="touchZone"></div>
<div id="rightZone" class="touchZone"></div>

<div id="leftHint" class="touchHint">‹</div>
<div id="rightHint" class="touchHint">›</div>

<button id="soundBtn">🔊</button>

<div id="menu">

  <div class="menuPanel">

    <div class="logo">
      TURBO <span>ROAD</span>
    </div>

    <div class="subtitle">
      Ultimate Racing
    </div>

    <button class="startBtn" id="startBtn">
      🏁 YARIŞA BAŞLA
    </button>

    <button id="helpBtn">
      ℹ️ NASIL OYNANIR?
    </button>

    <div class="info">
      📱 Sol tarafa basılı tut → SOLA<br>
      📱 Sağ tarafa basılı tut → SAĞA<br>
      Parmağını kaldır → DÜZ<br>
      💻 Bilgisayarda ← →
    </div>

  </div>

</div>

<div id="gameOver">

  <div class="overPanel">

    <h2>YARIŞ BİTTİ</h2>

    <div class="result">
      Skor: <b id="finalScore">0</b><br>
      Toplanan altın: <b id="finalCoins">0</b>
    </div>

    <button class="startBtn" id="restartBtn">
      🔄 TEKRAR OYNA
    </button>

    <button id="menuBtn">
      🏠 ANA MENÜ
    </button>

  </div>

</div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;
let DPR=1;

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  DPR=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);

  if(typeof player!=="undefined"){
    player.y=getPlayerY();

    if(!running){
      player.x=W/2;
      player.targetX=W/2;
    }
  }
}

window.addEventListener("resize",resize);


/* =========================================================
   OYUN
========================================================= */

let running=false;
let lastTime=0;

let score=0;
let coins=0;

let speed=0;
let targetSpeed=0;

let roadOffset=0;

let steering=0;

let touchLeft=false;
let touchRight=false;

let keyboardLeft=false;
let keyboardRight=false;


/* =========================================================
   PERSPEKTİF
========================================================= */

function getHorizon(){
  return H*.34;
}

function roadProgress(y){

  const horizon=getHorizon();

  return Math.max(
    0,
    Math.min(
      1,
      (y-horizon)/(H-horizon)
    )
  );
}

function roadWidthAt(y){

  const p=roadProgress(y);

  return W*(
    .14+
    .90*Math.pow(p,.80)
  );
}

function roadCenterAt(y){

  const p=roadProgress(y);

  return W/2+
    Math.sin(roadOffset*.00055)*
    W*.032*
    Math.pow(p,1.7);
}

function getPlayerY(){
  return H*.815;
}


/* =========================================================
   PLAYER
   DAHA KÜÇÜK
========================================================= */

const player={

  x:0,
  y:0,

  width:43,
  height:82,

  targetX:0,

  color:"#c8141c",

  tilt:0

};


/* =========================================================
   TRAFİK
========================================================= */

let traffic=[];
let spawnTimer=0;

const trafficColors=[
  "#e8e8e8",
  "#1d6da8",
  "#e69b17",
  "#20242a",
  "#368b61",
  "#7543a5",
  "#bd4b15",
  "#555b62"
];

function spawnTraffic(){

  let lane=Math.floor(Math.random()*3);

  const last=traffic[traffic.length-1];

  if(
    last &&
    last.progress<.18 &&
    last.lane===lane
  ){

    lane=(lane+1+Math.floor(Math.random()*2))%3;
  }

  traffic.push({

    lane:lane,

    progress:.055,

    speed:.185+Math.random()*.06,

    width:38,
    height:74,

    color:
      trafficColors[
        Math.floor(
          Math.random()*trafficColors.length
        )
      ],

    y:0,
    x:0,

    drawW:0,
    drawH:0
  });
}


/* =========================================================
   ALTIN
========================================================= */

let coinObjects=[];
let coinTimer=0;

function spawnCoin(){

  coinObjects.push({

    lane:Math.floor(Math.random()*3),

    progress:.08,

    spin:Math.random()*Math.PI*2,

    x:0,
    y:0,
    size:8
  });
}


/* =========================================================
   SES
   DAHA TOK / DÜŞÜK FREKANS
========================================================= */

let audioCtx=null;
let engineOsc=null;
let engineGain=null;
let engineFilter=null;

let audioStarted=false;
let soundEnabled=true;

function initAudio(){

  if(audioStarted || !soundEnabled){
    return;
  }

  try{

    audioCtx=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

    engineOsc=
      audioCtx.createOscillator();

    engineGain=
      audioCtx.createGain();

    engineFilter=
      audioCtx.createBiquadFilter();

    engineOsc.type="triangle";

    engineFilter.type="lowpass";

    engineFilter.frequency.value=420;

    engineGain.gain.value=0;

    engineOsc.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);

    engineOsc.start();

    audioStarted=true;

  }catch(e){}
}

function updateEngineSound(){

  if(
    !audioStarted||
    !audioCtx||
    !soundEnabled
  ){
    return;
  }

  const now=audioCtx.currentTime;

  const normalized=Math.max(
    0,
    Math.min(1,speed/220)
  );

  /* Daha düşük motor sesi */
  engineOsc.frequency.setTargetAtTime(
    38+normalized*135,
    now,
    .08
  );

  engineFilter.frequency.setTargetAtTime(
    280+normalized*900,
    now,
    .10
  );

  engineGain.gain.setTargetAtTime(
    running
      ? .006+normalized*.035
      : 0,
    now,
    .10
  );
}

function collisionSound(){

  if(!soundEnabled)return;

  initAudio();

  if(!audioCtx)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    105,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    38,
    audioCtx.currentTime+.22
  );

  gain.gain.setValueAtTime(
    .13,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.24
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime+.25
  );
}

function coinSound(){

  if(!soundEnabled)return;

  initAudio();

  if(!audioCtx)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    480,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    760,
    audioCtx.currentTime+.12
  );

  gain.gain.setValueAtTime(
    .055,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.18
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime+.2
  );
}


/* =========================================================
   ARKA PLAN
========================================================= */

function drawBackground(){

  const horizon=getHorizon();

  const sky=
    ctx.createLinearGradient(
      0,0,0,horizon+120
    );

  sky.addColorStop(0,"#4b96ca");
  sky.addColorStop(.55,"#a7d1e5");
  sky.addColorStop(1,"#dce9e7");

  ctx.fillStyle=sky;

  ctx.fillRect(0,0,W,H);

  /* güneş */

  ctx.beginPath();

  ctx.arc(
    W*.80,
    H*.12,
    Math.max(24,W*.055),
    0,
    Math.PI*2
  );

  ctx.fillStyle="rgba(255,239,175,.9)";
  ctx.fill();

  /* dağlar */

  ctx.fillStyle="#718c86";

  ctx.beginPath();

  ctx.moveTo(0,horizon+.08*H);

  ctx.lineTo(W*.10,H*.20);
  ctx.lineTo(W*.22,H*.29);
  ctx.lineTo(W*.36,H*.17);
  ctx.lineTo(W*.51,H*.29);
  ctx.lineTo(W*.66,H*.18);
  ctx.lineTo(W*.82,H*.29);
  ctx.lineTo(W,H*.19);

  ctx.lineTo(W,horizon+.10*H);

  ctx.closePath();

  ctx.fill();

  /* zemin */

  ctx.fillStyle="#52794c";

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );
}


/* =========================================================
   YOL
========================================================= */

function drawRoad(){

  const horizon=getHorizon();

  const topCenter=roadCenterAt(horizon);
  const bottomCenter=roadCenterAt(H);

  const topWidth=roadWidthAt(horizon);
  const bottomWidth=roadWidthAt(H);

  /* yol */

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.closePath();

  const gradient=
    ctx.createLinearGradient(
      0,horizon,0,H
    );

  gradient.addColorStop(0,"#57585c");
  gradient.addColorStop(.45,"#3d3e42");
  gradient.addColorStop(1,"#24252a");

  ctx.fillStyle=gradient;
  ctx.fill();

  /* kenar çizgileri */

  ctx.strokeStyle="#f4f4f4";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.stroke();

  /* kırmızı beyaz kenar */

  const dashCount=25;

  const moving=
    (roadOffset*.0016)%1;

  for(let i=0;i<dashCount;i++){

    let p1=
      i/dashCount+
      moving/dashCount;

    p1%=1;

    let p2=Math.min(1,p1+.024);

    const y1=
      horizon+p1*(H-horizon);

    const y2=
      horizon+p2*(H-horizon);

    const c1=roadCenterAt(y1);
    const c2=roadCenterAt(y2);

    const w1=roadWidthAt(y1);
    const w2=roadWidthAt(y2);

    ctx.strokeStyle=
      i%2===0
        ? "#fff"
        : "#d32929";

    ctx.lineWidth=
      Math.max(2,7*roadProgress(y1));

    ctx.beginPath();

    ctx.moveTo(
      c1-w1/2,
      y1
    );

    ctx.lineTo(
      c2-w2/2,
      y2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      c1+w1/2,
      y1
    );

    ctx.lineTo(
      c2+w2/2,
      y2
    );

    ctx.stroke();
  }

  /* şerit çizgileri */

  const gap=70;

  for(let lane=1;lane<3;lane++){

    for(
      let y=
        horizon-gap+
        (roadOffset*1.5)%gap;

      y<H;

      y+=gap
    ){

      const y1=Math.max(horizon,y);
      const y2=Math.min(H,y+32);

      const c1=roadCenterAt(y1);
      const c2=roadCenterAt(y2);

      const w1=roadWidthAt(y1);
      const w2=roadWidthAt(y2);

      const x1=
        c1-w1/2+
        w1*(lane/3);

      const x2=
        c2-w2/2+
        w2*(lane/3);

      const p=roadProgress(y1);

      ctx.strokeStyle="rgba(255,255,255,.72)";

      ctx.lineWidth=
        Math.max(1,3.5*p);

      ctx.beginPath();

      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);

      ctx.stroke();
    }
  }
}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(ctx,x,y,w,h,r){

  const rr=Math.min(
    r,
    Math.abs(w)/2,
    Math.abs(h)/2
  );

  ctx.beginPath();

  ctx.moveTo(x+rr,y);

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    rr
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    rr
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    rr
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    rr
  );

  ctx.closePath();
}


/* =========================================================
   RENK
========================================================= */

function shadeColor(hex,amount){

  let c=hex.replace("#","");

  let r=parseInt(c.substring(0,2),16);
  let g=parseInt(c.substring(2,4),16);
  let b=parseInt(c.substring(4,6),16);

  r=Math.max(0,Math.min(255,r+amount));
  g=Math.max(0,Math.min(255,g+amount));
  b=Math.max(0,Math.min(255,b+amount));

  return "#"+
    r.toString(16).padStart(2,"0")+
    g.toString(16).padStart(2,"0")+
    b.toString(16).padStart(2,"0");
}


/* =========================================================
   GELİŞMİŞ ARABA
   ÖN TARAF YUKARI BAKIYOR
   HİÇBİR TRAFİK ARACI YANA DÖNMÜYOR
========================================================= */

function drawCar(
  x,
  y,
  w,
  h,
  color,
  isPlayer=false,
  tilt=0
){

  if(w<=2 || h<=4)return;

  ctx.save();

  /*
    TRAFİK ARAÇLARI ASLA DÖNMÜYOR.
    SADECE OYUNCU ÇOK AZ YATABİLİYOR.
  */

  ctx.translate(x,y);

  if(isPlayer){
    ctx.rotate(tilt);
  }else{
    ctx.rotate(0);
  }

  /* gölge */

  ctx.fillStyle="rgba(0,0,0,.38)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.47,
    w*.58,
    h*.075,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* lastikler */

  const tireW=Math.max(2.5,w*.17);
  const tireH=Math.max(5,h*.22);

  ctx.fillStyle="#090a0c";

  const tires=[
    [-w*.53,-h*.30],
    [ w*.36,-h*.30],
    [-w*.53, h*.10],
    [ w*.36, h*.10]
  ];

  for(const t of tires){

    roundRect(
      ctx,
      t[0],
      t[1],
      tireW,
      tireH,
      Math.max(1,tireW*.35)
    );

    ctx.fill();
  }

  /* jant */

  if(w>13){

    ctx.fillStyle="#a8adb1";

    for(const wx of [-w*.445,w*.425]){

      ctx.beginPath();

      ctx.arc(
        wx,
        -h*.18,
        Math.max(1.5,w*.045),
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.beginPath();

      ctx.arc(
        wx,
        h*.23,
        Math.max(1.5,w*.045),
        0,
        Math.PI*2
      );

      ctx.fill();
    }
  }

  /* gövde */

  const bodyGrad=
    ctx.createLinearGradient(
      -w/2,
      0,
      w/2,
      0
    );

  bodyGrad.addColorStop(
    0,
    shadeColor(color,-45)
  );

  bodyGrad.addColorStop(
    .22,
    shadeColor(color,-15)
  );

  bodyGrad.addColorStop(
    .50,
    color
  );

  bodyGrad.addColorStop(
    .76,
    shadeColor(color,17)
  );

  bodyGrad.addColorStop(
    1,
    shadeColor(color,-30)
  );

  ctx.fillStyle=bodyGrad;

  roundRect(
    ctx,
    -w/2,
    -h/2,
    w,
    h,
    Math.max(2,w*.15)
  );

  ctx.fill();

  /* ön kaput */

  ctx.fillStyle=
    "rgba(255,255,255,.08)";

  roundRect(
    ctx,
    -w*.37,
    -h*.43,
    w*.74,
    h*.20,
    w*.05
  );

  ctx.fill();

  /* tavan */

  ctx.fillStyle=
    shadeColor(color,-9);

  roundRect(
    ctx,
    -w*.34,
    -h*.25,
    w*.68,
    h*.49,
    w*.12
  );

  ctx.fill();

  /* ön cam */

  const glass=
    ctx.createLinearGradient(
      0,
      -h*.27,
      0,
      -h*.02
    );

  glass.addColorStop(0,"#66818a");
  glass.addColorStop(.45,"#263d45");
  glass.addColorStop(1,"#101a1e");

  ctx.fillStyle=glass;

  roundRect(
    ctx,
    -w*.285,
    -h*.225,
    w*.57,
    h*.205,
    w*.05
  );

  ctx.fill();

  /* cam parlama */

  if(w>16){

    ctx.fillStyle="rgba(255,255,255,.17)";

    ctx.beginPath();

    ctx.moveTo(
      -w*.22,
      -h*.19
    );

    ctx.lineTo(
      -w*.08,
      -h*.19
    );

    ctx.lineTo(
      -w*.18,
      -h*.07
    );

    ctx.closePath();

    ctx.fill();
  }

  /* arka cam */

  ctx.fillStyle="#15252b";

  roundRect(
    ctx,
    -w*.285,
    h*.045,
    w*.57,
    h*.17,
    w*.05
  );

  ctx.fill();

  /* yan cam çerçeveleri */

  ctx.strokeStyle=
    "rgba(0,0,0,.42)";

  ctx.lineWidth=Math.max(1,w*.035);

  ctx.beginPath();

  ctx.moveTo(
    -w*.29,
    -h*.01
  );

  ctx.lineTo(
    -w*.29,
    h*.20
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    w*.29,
    -h*.01
  );

  ctx.lineTo(
    w*.29,
    h*.20
  );

  ctx.stroke();

  /* ön tampon */

  ctx.fillStyle=
    shadeColor(color,-42);

  roundRect(
    ctx,
    -w*.39,
    -h*.48,
    w*.78,
    h*.065,
    w*.025
  );

  ctx.fill();

  /* ızgara */

  if(w>14){

    ctx.fillStyle="#111";

    roundRect(
      ctx,
      -w*.25,
      -h*.455,
      w*.50,
      h*.035,
      2
    );

    ctx.fill();
  }

  /* farlar */

  ctx.fillStyle="#fff2b5";

  roundRect(
    ctx,
    -w*.35,
    -h*.46,
    w*.20,
    h*.065,
    2
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.15,
    -h*.46,
    w*.20,
    h*.065,
    2
  );

  ctx.fill();

  /* far parlaması */

  if(w>18){

    ctx.fillStyle="rgba(255,255,255,.7)";

    ctx.fillRect(
      -w*.32,
      -h*.447,
      w*.08,
      h*.018
    );

    ctx.fillRect(
      w*.18,
      -h*.447,
      w*.08,
      h*.018
    );
  }

  /* stoplar */

  ctx.fillStyle="#ef2525";

  roundRect(
    ctx,
    -w*.35,
    h*.39,
    w*.21,
    h*.06,
    2
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.14,
    h*.39,
    w*.21,
    h*.06,
    2
  );

  ctx.fill();

  /* PLAYER DETAY */

  if(isPlayer){

    /* Mustang siyah orta şerit */

    ctx.fillStyle="#151515";

    roundRect(
      ctx,
      -w*.075,
      -h*.47,
      w*.15,
      h*.94,
      w*.018
    );

    ctx.fill();

    /* beyaz ince şerit */

    ctx.fillStyle="rgba(255,255,255,.20)";

    ctx.fillRect(
      -w*.22,
      -h*.43,
      w*.018,
      h*.86
    );

    ctx.fillRect(
      w*.202,
      -h*.43,
      w*.018,
      h*.86
    );

    /* Mustang yazısı */

    if(w>22){

      ctx.fillStyle="rgba(255,255,255,.92)";

      ctx.font=
        `900 ${Math.max(5,w*.105)}px Arial`;

      ctx.textAlign="center";
      ctx.textBaseline="middle";

      ctx.fillText(
        "MUSTANG",
        0,
        h*.045
      );
    }

    /* amblem */

    if(w>15){

      ctx.fillStyle="#ddd";

      ctx.beginPath();

      ctx.arc(
        0,
        -h*.425,
        Math.max(1.5,w*.04),
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    /* egzoz */

    ctx.fillStyle="#080808";

    ctx.beginPath();

    ctx.arc(
      -w*.24,
      h*.47,
      Math.max(1,w*.024),
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      w*.24,
      h*.47,
      Math.max(1,w*.024),
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function calculateSteering(){

  if(keyboardLeft&&!keyboardRight){
    steering=-1;
    return;
  }

  if(keyboardRight&&!keyboardLeft){
    steering=1;
    return;
  }

  if(touchLeft&&!touchRight){
    steering=-1;
    return;
  }

  if(touchRight&&!touchLeft){
    steering=1;
    return;
  }

  steering=0;
}

function updatePlayer(dt){

  const power=235+speed*1.30;

  player.targetX+=
    steering*
    power*
    dt;

  const roadW=
    roadWidthAt(player.y);

  const center=
    roadCenterAt(player.y);

  /*
    Aracı yolun içinde tut.
  */

  const padding=
    player.width*.64;

  const minX=
    center-roadW/2+padding;

  const maxX=
    center+roadW/2-padding;

  player.targetX=Math.max(
    minX,
    Math.min(maxX,player.targetX)
  );

  const follow=
    11+speed/40;

  player.x+=
    (player.targetX-player.x)*
    Math.min(1,dt*follow);

  /*
    Çok küçük yatış.
    Aracın yan gidiyormuş gibi görünmesini önler.
  */

  const wantedTilt=
    steering*.035;

  player.tilt+=
    (wantedTilt-player.tilt)*
    Math.min(1,dt*9);
}


/* =========================================================
   TRAFİK UPDATE
========================================================= */

function updateTraffic(dt){

  for(
    let i=traffic.length-1;
    i>=0;
    i--
  ){

    const car=traffic[i];

    car.progress+=
      dt*
      car.speed*
      (.72+speed/185);

    if(car.progress>1.08){

      traffic.splice(i,1);

      score+=10;

      continue;
    }

    const p=Math.max(
      .055,
      Math.min(1,car.progress)
    );

    /*
      Daha düzgün perspektif.
    */

    const visualP=
      Math.pow(p,1.10);

    car.y=
      getHorizon()+
      visualP*
      (H-getHorizon());

    const roadW=
      roadWidthAt(car.y);

    const center=
      roadCenterAt(car.y);

    const laneW=roadW/3;

    /*
      Aracın tam merkezini şeride koy.
    */

    car.x=
      center-
      roadW/2+
      laneW*(car.lane+.5);

    /*
      Trafik oyuncudan daha küçük.
    */

    const scale=
      .105+
      Math.pow(p,.73)*.72;

    car.drawW=
      Math.max(
        5,
        car.width*scale
      );

    car.drawH=
      Math.max(
        9,
        car.height*scale
      );
  }
}


/* =========================================================
   COINS UPDATE
========================================================= */

function updateCoins(dt){

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    const c=coinObjects[i];

    c.progress+=
      dt*(.22+speed/700);

    c.spin+=dt*6;

    if(c.progress>1.08){

      coinObjects.splice(i,1);

      continue;
    }

    const p=Math.max(
      .08,
      Math.min(1,c.progress)
    );

    c.y=
      getHorizon()+
      Math.pow(p,1.03)*
      (H-getHorizon());

    const roadW=
      roadWidthAt(c.y);

    const center=
      roadCenterAt(c.y);

    const laneW=roadW/3;

    c.x=
      center-
      roadW/2+
      laneW*(c.lane+.5);

    c.size=
      4+
      Math.pow(p,.65)*17;
  }
}


/* =========================================================
   COINS DRAW
========================================================= */

function drawCoins(){

  for(const c of coinObjects){

    ctx.save();

    ctx.translate(c.x,c.y);

    const sx=
      Math.abs(Math.cos(c.spin));

    ctx.scale(
      Math.max(.18,sx),
      1
    );

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      c.size,
      0,
      Math.PI*2
    );

    const grad=
      ctx.createRadialGradient(
        -c.size*.25,
        -c.size*.25,
        1,
        0,
        0,
        c.size
      );

    grad.addColorStop(
      0,
      "#fff5a8"
    );

    grad.addColorStop(
      .45,
      "#ffd83d"
    );

    grad.addColorStop(
      1,
      "#d28c00"
    );

    ctx.fillStyle=grad;

    ctx.fill();

    ctx.strokeStyle="#a36c00";
    ctx.lineWidth=2;

    ctx.stroke();

    ctx.fillStyle="#8b5b00";

    ctx.font=
      `bold ${Math.max(6,c.size*.9)}px Arial`;

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText("₺",0,1);

    ctx.restore();
  }
}


/* =========================================================
   ÇARPIŞMA
   DAHA DOĞRU HITBOX
========================================================= */

function hitTest(a,b){

  if(
    b.drawW<10||
    b.drawH<18
  ){
    return false;
  }

  /*
    Görsel boyuttan bağımsız,
    araçların yol üzerindeki gerçek
    temas alanına yakın kutular.
  */

  const aw=
    a.width*.48;

  const ah=
    a.height*.38;

  const bw=
    Math.max(5,b.drawW*.46);

  const bh=
    Math.max(8,b.drawH*.38);

  return(
    Math.abs(a.x-b.x)<
      (aw+bw)/2
    &&
    Math.abs(
      (a.y+h*.02)-
      (b.y+b.drawH*.08)
    )<
      (ah+bh)/2
  );
}

function coinHit(c){

  return(
    Math.abs(player.x-c.x)<
      player.width*.58
    &&
    Math.abs(player.y-c.y)<
      player.height*.52
  );
}


/* =========================================================
   START
========================================================= */

function startGame(){

  initAudio();

  if(
    audioCtx &&
    audioCtx.state==="suspended"
  ){
    audioCtx.resume();
  }

  running=true;

  document.getElementById("menu")
    .style.display="none";

  document.getElementById("gameOver")
    .style.display="none";

  score=0;
  coins=0;

  speed=0;
  targetSpeed=0;

  roadOffset=0;

  traffic=[];
  coinObjects=[];

  spawnTimer=.85;
  coinTimer=1.2;

  touchLeft=false;
  touchRight=false;

  keyboardLeft=false;
  keyboardRight=false;

  steering=0;

  player.x=W/2;
  player.targetX=W/2;
  player.y=getPlayerY();
  player.tilt=0;

  speedText.textContent="0";
  scoreText.textContent="0";
  coinText.textContent="0";

  lastTime=performance.now();
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  if(!running)return;

  running=false;

  speed=0;

  steering=0;

  touchLeft=false;
  touchRight=false;

  keyboardLeft=false;
  keyboardRight=false;

  updateEngineSound();

  collisionSound();

  document.getElementById("finalScore")
    .textContent=Math.floor(score);

  document.getElementById("finalCoins")
    .textContent=coins;

  document.getElementById("gameOver")
    .style.display="flex";
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(!running)return;

  targetSpeed=
    Math.min(
      220,
      95+score*.025
    );

  speed+=
    (targetSpeed-speed)*
    Math.min(1,dt*1.6);

  roadOffset+=
    speed*dt*2.8;

  score+=
    speed*dt*.035;

  updatePlayer(dt);

  spawnTimer-=dt;
  coinTimer-=dt;

  if(spawnTimer<=0){

    spawnTraffic();

    spawnTimer=
      Math.max(
        .70,
        1.28-speed/570
      );
  }

  if(coinTimer<=0){

    spawnCoin();

    coinTimer=
      1.05+
      Math.random()*.85;
  }

  updateTraffic(dt);
  updateCoins(dt);

  /*
    ÇARPIŞMA
  */

  for(const car of traffic){

    if(hitTest(player,car)){

      endGame();

      return;
    }
  }

  /*
    ALTIN
  */

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    if(coinHit(coinObjects[i])){

      coinObjects.splice(i,1);

      coins++;

      score+=25;

      coinSound();
    }
  }

  speedText.textContent=
    Math.floor(speed);

  scoreText.textContent=
    Math.floor(score);

  coinText.textContent=
    coins;

  updateEngineSound();
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawRoad();

  /*
    EN ÖNEMLİ DÜZELTME:
    Araçlar artık y konumuna göre
    arkadan öne doğru çiziliyor.

    Böylece oyuncu aracı trafik aracının
    üstünden geçiyormuş gibi görünmüyor.
  */

  const sortedTraffic=
    traffic
      .slice()
      .sort(
        (a,b)=>a.y-b.y
      );

  for(const car of sortedTraffic){

    drawCar(
      car.x,
      car.y,
      car.drawW,
      car.drawH,
      car.color,
      false,
      0
    );
  }

  drawCoins();

  /*
    Oyuncu en önde çizilir.
    Bu artık fiziksel çarpışmayı etkilemez;
    sadece görüntü sıralamasıdır.
  */

  drawCar(
    player.x,
    player.y,
    player.width,
    player.height,
    player.color,
    true,
    player.tilt
  );
}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

  const dt=
    Math.min(
      .035,
      (now-lastTime)/1000||0
    );

  lastTime=now;

  update(dt);

  draw();

  requestAnimationFrame(loop);
}

   INIT
========================================================= */

player.targetX=W/2;

);

    e.preventDefault();

    try{

        e.pointerId
      );
    }catch(err){}
  }
);

    if(e.pointerType==="mouse")return;

   BLUR
========================================================= */

    touchLeft=false;

   KLAVYE
========================================================= */

  "keydown",
  function(e){

    if(e.key==="ArrowLeft"){

      keyboardLeft=true;

      calculateSteering();

      e.preventDefault();
    }

    if(e.key==="ArrowRight"){

      keyboardRight=true;

      calculateSteering();

      e.preventDefault();
    }

      e.key===" " &&
      !running
    ){

      startGame();

      e.preventDefault();
    }
  }
);

  "keyup",
  function(e){

    if(e.key==="ArrowLeft"){

      keyboardLeft=false;

      calculateSteering();
    }

    if(e.key==="ArrowRight"){

      keyboardRight=false;

      calculateSteering();
    }
  }
);
