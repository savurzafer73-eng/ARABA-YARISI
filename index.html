<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05080d">
<title>Turbo Road X</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080d;
  font-family:Arial,sans-serif;
  touch-action:none;
}

body{
  position:fixed;
  color:white;
}

canvas{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  padding:12px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  z-index:10;
  pointer-events:none;
}

.box{
  min-width:82px;
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:13px;
  background:rgba(5,8,13,.78);
  color:white;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
  backdrop-filter:blur(8px);
}

.small{
  font-size:9px;
  color:#8e9aa7;
  text-transform:uppercase;
  letter-spacing:1px;
}

.big{
  margin-top:2px;
  font-size:16px;
  font-weight:bold;
}

/* =========================
   PAUSE
========================= */

#pause{
  position:fixed;
  right:12px;
  top:72px;
  width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:50%;
  background:rgba(5,8,13,.82);
  color:white;
  font-size:17px;
  z-index:15;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

/* =========================
   NITRO
========================= */

#nitroWrap{
  position:fixed;
  left:50%;
  bottom:19px;
  transform:translateX(-50%);
  width:300px;
  max-width:48%;
  height:12px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  overflow:hidden;
  background:rgba(0,0,0,.65);
  z-index:12;
}

#nitro{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#00a9ff,#67f7ff);
  box-shadow:0 0 15px rgba(0,200,255,.7);
}

/* =========================
   TOUCH
========================= */

.touch{
  position:fixed;
  bottom:0;
  width:50%;
  height:48%;
  z-index:5;
}

#left{
  left:0;
}

#right{
  right:0;
}

/* =========================
   EKRANLAR
========================= */

.screen{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 25%,rgba(220,25,45,.16),transparent 38%),
    linear-gradient(180deg,rgba(2,5,9,.25),rgba(2,5,9,.96));
}

#garage,
#tracks,
#settings,
#over,
#pauseScreen{
  display:none;
}

/* =========================
   ANA PANEL
========================= */

.panel{
  width:92%;
  max-width:470px;
  max-height:92vh;
  overflow:auto;
  padding:25px;
  color:white;
  border:1px solid rgba(255,255,255,.13);
  border-radius:28px;
  background:
    linear-gradient(145deg,rgba(18,24,33,.97),rgba(5,9,15,.97));
  box-shadow:
    0 25px 90px rgba(0,0,0,.72),
    inset 0 1px rgba(255,255,255,.05);
}

.panel::-webkit-scrollbar{
  width:0;
}

/* =========================
   LOGO
========================= */

.logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:2px;
  line-height:1;
  text-align:center;
}

.logo span{
  color:#e21d32;
}

.sub{
  margin-top:8px;
  color:#8793a0;
  font-size:11px;
  text-align:center;
  letter-spacing:2px;
}

/* =========================
   COIN
========================= */

.balance{
  margin:20px auto 15px;
  width:max-content;
  padding:9px 15px;
  border-radius:30px;
  border:1px solid rgba(255,196,40,.25);
  background:rgba(255,190,30,.08);
  color:#ffd45a;
  font-weight:bold;
  font-size:15px;
}

/* =========================
   MENU BUTONLARI
========================= */

.menuButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.main{
  width:100%;
  margin-top:10px;
  padding:15px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#ef233c,#b90f24);
  color:white;
  font-size:16px;
  font-weight:900;
  letter-spacing:.5px;
  cursor:pointer;
  box-shadow:0 9px 25px rgba(225,25,50,.25);
}

.main:active,
.menuBtn:active,
.cardBtn:active{
  transform:scale(.97);
}

.menuBtn{
  min-height:57px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;
  background:linear-gradient(145deg,#18212c,#0d131b);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.menuBtn .icon{
  display:block;
  font-size:19px;
  margin-bottom:4px;
}

.menuBtn .label{
  display:block;
  font-size:11px;
  color:#aeb8c3;
}

/* =========================
   ARABA GÖSTERİM
========================= */

.carPreview{
  height:155px;
  margin:15px 0;
  border-radius:20px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  background:
    radial-gradient(circle at 50% 60%,rgba(220,30,50,.22),transparent 40%),
    linear-gradient(180deg,#111a24,#080d13);
}

.carPreview:after{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  bottom:18px;
  height:2px;
  background:rgba(255,255,255,.08);
}

.previewCar{
  position:absolute;
  left:50%;
  top:50%;
  width:72px;
  height:115px;
  transform:translate(-50%,-50%);
  border-radius:18px 18px 11px 11px;
  background:linear-gradient(90deg,#a80d1f,#ef3042,#a80d1f);
  box-shadow:
    0 18px 30px rgba(0,0,0,.65),
    0 0 30px rgba(220,25,45,.18);
}

.previewCar:before{
  content:"";
  position:absolute;
  left:9px;
  right:9px;
  top:25px;
  height:34px;
  border-radius:9px;
  background:linear-gradient(180deg,#1d3949,#08131b);
  border:2px solid rgba(255,255,255,.08);
}

.previewCar:after{
  content:"";
  position:absolute;
  left:9px;
  right:9px;
  bottom:18px;
  height:4px;
  background:#f4c44c;
}

/* =========================
   STATLAR
========================= */

.stat{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  color:#aab5c0;
  border-bottom:1px solid rgba(255,255,255,.06);
  font-size:13px;
}

.stat strong{
  color:white;
}

/* =========================
   ALT BAŞLIK
========================= */

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 0 10px;
  font-size:12px;
  color:#8d99a5;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

/* =========================
   KARTLAR
========================= */

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  padding:13px;
  min-height:150px;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(145deg,#141d27,#0b1017);
}

.cardTitle{
  font-size:13px;
  font-weight:bold;
}

.cardSub{
  margin-top:4px;
  color:#798692;
  font-size:10px;
}

.cardPrice{
  margin-top:11px;
  color:#ffd34f;
  font-size:12px;
  font-weight:bold;
}

.cardBtn{
  width:100%;
  margin-top:9px;
  padding:10px 7px;
  border:0;
  border-radius:10px;
  background:#e21d32;
  color:white;
  font-size:11px;
  font-weight:bold;
}

.cardBtn.locked{
  background:#27313b;
  color:#9ca7b1;
}

.cardBtn.owned{
  background:#173c2a;
  color:#73e7a2;
}

/* =========================
   SETTINGS
========================= */

.settingRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.settingName{
  font-size:13px;
}

.toggle{
  width:48px;
  height:26px;
  border-radius:20px;
  background:#303943;
  position:relative;
}

.toggle.on{
  background:#e21d32;
}

.toggle:after{
  content:"";
  position:absolute;
  top:4px;
  left:4px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:white;
  transition:.15s;
}

.toggle.on:after{
  left:26px;
}

/* =========================
   GERİ
========================= */

.back{
  width:100%;
  margin-top:12px;
  padding:13px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:13px;
  background:#111923;
  color:#cbd3da;
  font-weight:bold;
}

/* =========================
   COUNTDOWN
========================= */

#countdown{
  position:fixed;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  z-index:20;
  font-size:70px;
  font-weight:900;
  text-shadow:0 10px 35px rgba(0,0,0,.7);
  display:none;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){
  .panel{
    padding:19px;
  }

  .logo{
    font-size:31px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .menuButtons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================
     HUD
========================= -->

<div id="hud">

  <div class="box">
    <div class="small">Skor</div>
    <div class="big" id="score">0</div>
  </div>

  <div class="box">
    <div class="small">Para</div>
    <div class="big" id="money">$0</div>
  </div>

  <div class="box">
    <div class="small">Hız</div>
    <div class="big">
      <span id="speed">0</span> KM/H

<!-- =========================

  <div class="panel">

    <div class="logo">

    </div>

    </div>

<!-- =========================

<script>
(function(){

"use strict";

/* =====================================================
   CANVAS
===================================================== */

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var W=0;
var H=0;

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  if(W<320) W=320;
  if(H<480) H=480;

  canvas.width=W;
  canvas.height=H;
}

resize();

window.addEventListener("resize",resize);


/* =====================================================
   SAVE SİSTEMİ
===================================================== */

var save={
  money:0,
  selectedCar:0,
  selectedTrack:0,
  cars:[true,false,false,false],
  tracks:[true,false,false,false],
  sound:true,
  vibration:true
};

function loadSave(){

  try{

    var data=localStorage.getItem("turboRoadXSave");

    if(data){

      var parsed=JSON.parse(data);

      if(parsed.money!=null) save.money=parsed.money;
      if(parsed.selectedCar!=null) save.selectedCar=parsed.selectedCar;
      if(parsed.selectedTrack!=null) save.selectedTrack=parsed.selectedTrack;
      if(parsed.cars) save.cars=parsed.cars;
      if(parsed.tracks) save.tracks=parsed.tracks;
      if(parsed.sound!=null) save.sound=parsed.sound;
      if(parsed.vibration!=null) save.vibration=parsed.vibration;
    }

  }catch(e){}

}

function saveGame(){

  try{
    localStorage.setItem(
      "turboRoadXSave",
      JSON.stringify(save)
    );
  }catch(e){}
}

loadSave();


/* =====================================================
   ARAÇLAR
===================================================== */

var cars=[

  {
    name:"1969 Mustang",
    price:0,
    color:"#d7192e",
    speed:300
  },

  {
    name:"Night Runner",
    price:150,
    color:"#171b20",
    speed:325
  },

  {
    name:"Street GT",
    price:350,
    color:"#1686d9",
    speed:350
  },

  {
    name:"Vortex RS",
    price:650,
    color:"#7d39d1",
    speed:380
  }

];


/* =====================================================
   PİSTLER
===================================================== */

var tracks=[

  {
    name:"Highway",
    price:0,
    grass:"#4e703f",
    road:"#252a2f"
  },

  {
    name:"Night City",
    price:250,
    grass:"#101822",
    road:"#171b21"
  },

  {
    name:"Desert Run",
    price:450,
    grass:"#a57c43",
    road:"#302c2a"
  },

  {
    name:"Mountain Pass",
    price:800,
    grass:"#263b31",
    road:"#25282c"
  }

];


/* =====================================================
   SES SİSTEMİ
===================================================== */

var audioCtx=null;
var engineOsc=null;
var engineGain=null;

function initAudio(){

  if(!save.sound) return;

  try{

    if(!audioCtx){

      var AC=
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AC) return;

      audioCtx=new AC();
    }

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

  }catch(e){}
}

function beep(freq,duration,type,volume){

  if(!save.sound) return;

  initAudio();

  if(!audioCtx) return;

  try{

    var osc=audioCtx.createOscillator();
    var gain=audioCtx.createGain();

    osc.type=type || "sine";

    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
      volume || .08,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
      audioCtx.currentTime+duration
    );

  }catch(e){}
}

function startEngine(){

  if(!save.sound) return;

  initAudio();

  if(!audioCtx) return;

  if(engineOsc) return;

  try{

    engineOsc=audioCtx.createOscillator();
    engineGain=audioCtx.createGain();

    engineOsc.type="sawtooth";

    engineOsc.frequency.value=80;

    engineGain.gain.value=.018;

    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);

    engineOsc.start();

  }catch(e){}

}

function updateEngine(){

  if(!engineOsc || !engineGain || !audioCtx) return;

  try{

    engineOsc.frequency.value=
      60 + gameSpeed*.34;

    engineGain.gain.value=
      save.sound && running && !paused ? .018 : .001;

  }catch(e){}

}

function stopEngine(){

  if(engineOsc){

    try{
      engineOsc.stop();
    }catch(e){}

    engineOsc=null;
    engineGain=null;
  }
}


/* =====================================================
   OYUN DEĞİŞKENLERİ
===================================================== */

var running=false;
var paused=false;

var score=0;
var raceMoney=0;

var gameSpeed=300;

var playerOffset=0;
var steer=0;

var nitro=100;
var nitroActive=false;

var roadScroll=0;

var traffic=[];

var spawnTimer=0;

var elapsed=0;

var countdownActive=false;
var countdownValue=0;


/* =====================================================
   YOL
===================================================== */

var ROAD_LEFT=.18;
var ROAD_RIGHT=.82;

function roadLeft(){
  return W*ROAD_LEFT;
}

function roadRight(){
  return W*ROAD_RIGHT;
}

function roadWidth(){
  return roadRight()-roadLeft();
}

function laneWidth(){
  return roadWidth()/3;
}

function laneX(lane){
  return roadLeft()+laneWidth()*lane+laneWidth()/2;
}


/* =====================================================
   ARAÇ BOYUTU
===================================================== */

var CAR_SCALE=.70;

var CAR_W=48*CAR_SCALE;
var CAR_H=88*CAR_SCALE;


/* =====================================================
   OYUNCU
===================================================== */

function playerX(){
  return W/2+playerOffset*roadWidth()*.36;
}

function playerY(){
  return H*.78;
}


/* =====================================================
   YARDIMCI
===================================================== */

function clamp(v,min,max){

  if(v<min) return min;
  if(v>max) return max;

  return v;
}

function random(min,max){
  return Math.random()*(max-min)+min;
}


/* =====================================================
   YOL
===================================================== */

function drawRoad(){

  var left=roadLeft();
  var right=roadRight();

  var tr=tracks[save.selectedTrack];

  /* arka plan */

  ctx.fillStyle=tr.grass;
  ctx.fillRect(0,0,W,H);

  /* çevre detayları */

  var i;

  for(i=0;i<45;i++){

    var tx=(i*97)%W;
    var ty=((i*151+roadScroll*.25)%H);

    if(save.selectedTrack===1){

      ctx.fillStyle=i%2===0
        ?"rgba(40,90,120,.5)"
        :"rgba(30,50,70,.5)";

    }else{

      ctx.fillStyle=
        i%2===0
        ?"rgba(255,255,255,.08)"
        :"rgba(0,0,0,.08)";
    }

    ctx.fillRect(tx,ty,2,7);
  }

  /* yol */

  ctx.fillStyle=tr.road;

  ctx.fillRect(
    left,
    0,
    right-left,
    H
  );

  /* omuz */

  ctx.fillStyle="#b7b7b7";

  ctx.fillRect(left-5,0,5,H);
  ctx.fillRect(right,0,5,H);

  /* kenar çizgileri */

  ctx.fillStyle="#f2f2f2";

  ctx.fillRect(left+4,0,3,H);
  ctx.fillRect(right-7,0,3,H);

  /* şeritler */

  var lw=laneWidth();

  ctx.fillStyle="rgba(255,255,255,.85)";

  var dashH=55;
  var gap=35;

  var offset=roadScroll%(dashH+gap);

  var lane;

  for(lane=1;lane<=2;lane++){

    var x=left+lw*lane;

    var y=-dashH+offset;

    while(y<H){

      ctx.fillRect(
        x-2,
        y,
        4,
        dashH
      );

      y+=dashH+gap;
    }
  }

  /* direkler */

  var postOffset=roadScroll%170;

  var py=-170+postOffset;

  while(py<H){

    drawRoadPost(left-28,py);
    drawRoadPost(right+28,py);

    py+=170;
  }
}


/* =====================================================
   YOL DİREĞİ
===================================================== */

function drawRoadPost(x,y){

  ctx.fillStyle="#d8d8d8";
  ctx.fillRect(x-2,y,4,27);

  ctx.fillStyle="#f8f8f8";
  ctx.fillRect(x-7,y,14,7);

  ctx.fillStyle="#777";
  ctx.fillRect(x-4,y+7,8,3);
}


/* =====================================================
   ARABA ÇİZİMİ
===================================================== */

function roundedRect(x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(
    x+w,y,
    x+w,y+r
  );

  ctx.lineTo(x+w,y+h-r);

  ctx.quadraticCurveTo(
    x+w,y+h,
    x+w-r,y+h
  );

  ctx.lineTo(x+r,y+h);

  ctx.quadraticCurveTo(
    x,y+h,
    x,y+h-r
  );

  ctx.lineTo(x,y+r);

  ctx.quadraticCurveTo(
    x,y,
    x+r,y
  );

  ctx.closePath();
}


function drawCar(x,y,color,isPlayer){

  var w=CAR_W;
  var h=CAR_H;

  var left=x-w/2;
  var top=y-h/2;

  ctx.save();

  /* gölge */

  ctx.fillStyle="rgba(0,0,0,.38)";

  roundedRect(
    left+3,
    top+5,
    w,
    h,
    9
  );

  ctx.fill();

  /* gövde */

  ctx.fillStyle=color;

  roundedRect(
    left,
    top,
    w,
    h,
    9
  );

  ctx.fill();

  /* üst parlaklık */

  if(isPlayer){

    ctx.shadowColor="rgba(255,30,50,.55)";
    ctx.shadowBlur=12;

    ctx.fillStyle=color;

    roundedRect(
      left+2,
      top+2,
      w-4,
      h-4,
      8
    );

    ctx.fill();

    ctx.shadowBlur=0;
  }

  /* kaput */

  ctx.fillStyle=isPlayer
    ? "#b41124"
    : "#22282e";

  roundedRect(
    left+5,
    top+5,
    w-10,
    h*.25,
    6
  );

  ctx.fill();

  /* cam */

  ctx.fillStyle="#172630";

  roundedRect(
    left+6,
    top+h*.29,
    w-12,
    h*.28,
    5
  );

  ctx.fill();

  /* cam yansıma */

  ctx.fillStyle="rgba(180,235,255,.35)";

  ctx.fillRect(
    left+9,
    top+h*.32,
    w-18,
    4
  );

  /* orta çizgi */

  ctx.fillStyle="rgba(255,255,255,.18)";

  ctx.fillRect(
    x-1,
    top+h*.59,
    2,
    h*.27
  );

  /* far */

  ctx.fillStyle="#fff7bd";

  ctx.fillRect(
    left+5,
    top+4,
    8,
    4
  );

  ctx.fillRect(
    left+w-13,
    top+4,
    8,
    4
  );

  /* stop */

  ctx.fillStyle="#e3162d";

  ctx.fillRect(
    left+5,
    top+h-8,
    9,
    4
  );

  ctx.fillRect(
    left+w-14,
    top+h-8,
    9,
    4
  );

  /* lastikler */

  ctx.fillStyle="#090b0d";

  ctx.fillRect(
    left-3,
    top+17,
    5,
    17
  );

  ctx.fillRect(
    left+w-2,
    top+17,
    5,
    17
  );

  ctx.fillRect(
    left-3,
    top+h-34,
    5,
    17
  );

  ctx.fillRect(
    left+w-2,
    top+h-34,
    5,
    17
  );

  if(isPlayer){

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
      left+5,
      top+h*.61,
      w-10,
      3
    );

    ctx.fillStyle="#f0b429";

    ctx.fillRect(
      left+8,
      top+h*.72,
      w-16,
      3
    );
  }

  ctx.restore();
}


/* =====================================================
   TRAFİK
===================================================== */

function laneBlocked(lane,y,gap){

  var i;

  for(i=0;i<traffic.length;i++){

    if(
      traffic[i].lane===lane &&
      Math.abs(traffic[i].y-y)<gap
    ){
      return true;
    }
  }

  return false;
}


function chooseLane(){

  var available=[];
  var i;

  for(i=0;i<3;i++){

    if(!laneBlocked(i,-100,125)){
      available.push(i);
    }
  }

  if(available.length===0){

    return Math.floor(Math.random()*3);
  }

  return available[
    Math.floor(Math.random()*available.length)
  ];
}


function spawnTraffic(){

  var lane=chooseLane();

  var colors=[
    "#f1f1f1",
    "#171b20",
    "#1686d9",
    "#e3aa22",
    "#329b5b",
    "#c52b39",
    "#7445c5",
    "#b8b8b8"
  ];

  var car={

    lane:lane,

    x:laneX(lane),

    y:-CAR_H-40,

    speed:gameSpeed,

    color:colors[
      Math.floor(
        Math.random()*colors.length
      )
    ],

    passed:false
  };

  traffic.push(car);
}


function updateTraffic(dt){

  var i;

  for(i=traffic.length-1;i>=0;i--){

    var car=traffic[i];

    car.y+=car.speed*dt;

    if(
      !car.passed &&
      car.y>playerY()+CAR_H
    ){

      car.passed=true;

      score+=10;

      raceMoney+=1;

      beep(720,.08,"sine",.045);
    }

    if(car.y>H+CAR_H+60){

      traffic.splice(i,1);
    }
  }
}


/* =====================================================
   ÇARPIŞMA
===================================================== */

function collision(){

  var px=playerX();
  var py=playerY();

  var i;

  for(i=0;i<traffic.length;i++){

    var c=traffic[i];

    if(
      Math.abs(px-c.x)<CAR_W*.62 &&
      Math.abs(py-c.y)<CAR_H*.58
    ){

      return true;
    }
  }

  return false;
}


/* =====================================================
   OYUNCU
===================================================== */

function updatePlayer(dt){

  var move=steer;

  if(move!==0){

    playerOffset+=
      move*dt*1.65;
  }

  playerOffset=clamp(
    playerOffset,
    -.92,
    .92
  );

  if(
    nitroActive &&
    nitro>0
  ){

    nitro-=34*dt;

    if(nitro<0){
      nitro=0;
    }

    gameSpeed=
      cars[save.selectedCar].speed+150;

  }else{

    if(nitro<100){

      nitro+=10*dt;

      if(nitro>100){
        nitro=100;
      }
    }

    gameSpeed=
      cars[save.selectedCar].speed+
      Math.min(score*.8,90);
  }
}

function startGame(){

  initAudio();

  hideScreens();

  running=true;
  paused=false;

  score=0;
  raceMoney=0;

  playerOffset=0;

  nitro=100;

  traffic=[];

  spawnTimer=.7;

  elapsed=0;

  steer=0;

  countdownActive=true;
  countdownValue=3;

  document.getElementById("countdown").style.display=
    "block";

  document.getElementById("pause").innerHTML="Ⅱ";

  startEngine();

  countdownStep();

  updateHUD();
}


function countdownStep(){

  if(!countdownActive) return;

  var box=
    document.getElementById("countdown");

  if(countdownValue>0){

    box.innerHTML=countdownValue;

    beep(
      countdownValue===1 ? 880:620,
      .15,
      "square",
      .07
    );

    setTimeout(
      function(){

        countdownValue--;

        countdownStep();

      },
      800
    );

  }else{

    box.innerHTML="GO!";

    beep(1100,.2,"triangle",.08);

    setTimeout(
      function(){

        box.style.display="none";
        countdownActive=false;

      },
      650
    );
  }
}

    if(running){

      paused=!paused;

      document.getElementById("pauseScreen").style.display=
        paused ? "flex":"none";
    }
  }

});

function gameLoop(){

  var now=Date.now();

  var dt=(now-lastTime)/1000;

  lastTime=now;

  if(dt>.05){
    dt=.05;
  }

  if(
    running &&
    !paused &&
    !countdownActive
  ){

    elapsed+=dt;

    /* direksiyon */

    if(
      keys.left &&
      !keys.right
    ){

      steer=-1;

    }else if(
      keys.right &&
      !keys.left
    ){

      steer=1;

    }else{

      steer=0;
    }

    /* nitro */

    nitroActive=
      keys.nitro ||
      nitroActive;

    updatePlayer(dt);

    updateTraffic(dt);

    /* trafik */

    spawnTimer-=dt;

    if(spawnTimer<=0){

      spawnTraffic();

      spawnTimer=
        random(.75,1.2);
    }

    roadScroll+=
      gameSpeed*dt;

    if(collision()){

      gameOver();
    }

    updateHUD();
  }

  drawRoad();

  drawTraffic();

  if(running){

    drawPlayer();
  }

  window.requestAnimationFrame(gameLoop);
}


/* =====================================================
   REQUEST ANIMATION FRAME FALLBACK
===================================================== */

if(!window.requestAnimationFrame){

  window.requestAnimationFrame=
    window.webkitRequestAnimationFrame ||
    function(callback){

      return window.setTimeout(
        function(){

          callback(Date.now());

        },
        16
      );
    };
}


/* =====================================================
   BAŞLANGIÇ
===================================================== */

updateMenu();

renderGarage();

renderTracks();

gameLoop();

})();
</script>
