<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820">
<title>Turbo Road 3.0</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  touch-action:none;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.box{
  color:#fff;
  background:rgba(8,15,20,.62);
  border:1px solid rgba(255,255,255,.16);
  border-radius:13px;
  padding:8px 12px;
  backdrop-filter:blur(8px);
  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

#speed{
  font-size:25px;
  font-weight:900;
}

#speed span{
  font-size:10px;
  opacity:.7;
}

#score,#money{
  font-size:13px;
  font-weight:800;
  margin-top:2px;
}

#pause{
  position:fixed;
  right:12px;
  top:82px;
  z-index:7;
  width:45px;
  height:45px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:50%;
  color:white;
  background:rgba(8,15,20,.65);
  font-size:18px;
  display:none;
}

#controls{
  position:fixed;
  bottom:17px;
  left:0;
  right:0;
  z-index:6;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.control{
  width:82px;
  height:82px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.18);
  background:rgba(8,15,20,.55);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:300;
  pointer-events:auto;
  backdrop-filter:blur(7px);
  box-shadow:0 7px 25px rgba(0,0,0,.35);
}

.control:active{
  background:rgba(220,48,28,.72);
  transform:scale(.95);
}

#menu,
#settings{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(3,8,12,.82);
  backdrop-filter:blur(8px);
}

#settings{
  display:none;
}

.menu{
  width:min(92vw,430px);
  padding:28px 22px;
  border-radius:24px;
  background:linear-gradient(145deg,#17232c,#071016);
  border:1px solid rgba(255,255,255,.13);
  color:white;
  text-align:center;
  box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.logo{
  font-size:40px;
  line-height:1;
  font-weight:1000;
  letter-spacing:-2px;
}

.logo b{
  color:#f23b25;
}

.desc{
  color:#aebbc3;
  font-size:12px;
  margin:9px 0 22px;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  margin:5px 0;
  font-size:15px;
  font-weight:900;
  color:#fff;
  background:linear-gradient(135deg,#d72c1d,#ff542d);
  box-shadow:0 7px 20px rgba(239,54,29,.23);
}

button:active{
  transform:scale(.97);
}

.secondary{
  background:rgba(255,255,255,.08);
  box-shadow:none;
}

.setting{
  text-align:left;
  margin:12px 0;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
  color:#ddd;
}

.setting input{
  width:100%;
  margin-top:10px;
}

#loading{
  position:fixed;
  inset:0;
  z-index:100;
  background:#071018;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
  transition:opacity .5s;
}

@media(max-width:500px){
  .control{
    width:74px;
    height:74px;
    font-size:36px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="loading">TURBO ROAD</div>

<div id="hud">
  <div class="box">
    <div id="speed">0 <span>KM/H</span></div>
    <div id="score">SKOR: 0</div>
  </div>

  <div class="box">
    <div id="money">💰 0</div>
  </div>
</div>

<button id="pause">Ⅱ</button>

<div id="controls">
  <div class="control" id="left">‹</div>
  <div class="control" id="right">›</div>
</div>

<div id="menu">
  <div class="menu">
    <div class="logo">TURBO <b>ROAD</b></div>
    <div class="desc">3.0 PROFESSIONAL • 1969 MUSTANG</div>

    <button id="start">YARIŞA BAŞLA</button>
    <button class="secondary" id="sound">🔊 SES: AÇIK</button>
    <button class="secondary" id="settingsBtn">⚙ AYARLAR</button>
  </div>
</div>

<div id="settings">
  <div class="menu">
    <h2>⚙ AYARLAR</h2>

    <div class="setting">
      Motor sesi
      <input id="volume" type="range" min="0" max="1" step=".01" value=".65">
    </div>

    <button id="closeSettings">KAPAT</button>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   TURBO ROAD 3.0
   Açılı kamera + 3 şerit + doğa + trafik + Mustang
   ========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{alpha:false});

let W=innerWidth;
let H=innerHeight;
let DPR=1;

function resize(){
  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(devicePixelRatio||1,1.5);

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* =========================================================
   STATE
   ========================================================= */

let running=false;
let paused=false;

let lastTime=0;

let speed=0;
let distance=0;
let score=0;
let money=0;

let playerLane=1;
let playerX=0;
let targetX=0;

let leftPressed=false;
let rightPressed=false;

let soundOn=true;
let volume=.65;

let crashTimer=0;

const traffic=[];
const trees=[];
const rocks=[];

/* =========================================================
   ROAD
   ========================================================= */

function horizon(){
  return H*.20;
}

function roadCenter(p){
  const curve1=Math.sin(distance*.00085)*W*.035;
  const curve2=Math.sin(distance*.00031)*W*.025;

  return W*.5+
    curve1*p+
    curve2*p*p;
}

function roadWidth(p){
  return W*(.065+.39*Math.pow(p,1.08));
}

function roadBounds(p){
  const c=roadCenter(p);
  const w=roadWidth(p);

  return {
    left:c-w/2,
    right:c+w/2,
    center:c,
    width:w
  };
}

/* =========================================================
   PERSPEKTİF
   ========================================================= */

function depthY(p){
  return horizon()+
    Math.pow(Math.max(0,Math.min(1,p)),1.62)*
    (H-horizon());
}

/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBackground(){

  const sky=ctx.createLinearGradient(0,0,0,H);

  sky.addColorStop(0,"#74b8d5");
  sky.addColorStop(.42,"#b8d8c7");
  sky.addColorStop(1,"#d9cf9c");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  /* güneş */

  ctx.fillStyle="rgba(255,240,180,.75)";
  ctx.beginPath();
  ctx.arc(W*.78,H*.12,Math.min(W,H)*.055,0,Math.PI*2);
  ctx.fill();

  /* uzak tepeler */

  ctx.fillStyle="#718d73";

  ctx.beginPath();
  ctx.moveTo(0,H*.31);

  for(let x=0;x<=W;x+=35){
    const y=
      H*.29+
      Math.sin(x*.007)*H*.035+
      Math.sin(x*.017)*H*.015;

    ctx.lineTo(x,y);
  }

  ctx.lineTo(W,H*.45);
  ctx.lineTo(0,H*.45);
  ctx.closePath();
  ctx.fill();

  /* çim */

  ctx.fillStyle="#6f9b55";
  ctx.fillRect(0,H*.32,W,H*.68);
}

/* =========================================================
   ROAD
   ========================================================= */

function drawRoad(){

  const p0=0;
  const p1=1;

  const far=roadBounds(p0);
  const near=roadBounds(p1);

  /* asfalt */

  ctx.fillStyle="#4a4b47";

  ctx.beginPath();
  ctx.moveTo(far.left,depthY(p0));
  ctx.lineTo(far.right,depthY(p0));
  ctx.lineTo(near.right,depthY(p1));
  ctx.lineTo(near.left,depthY(p1));
  ctx.closePath();
  ctx.fill();

  /* asfalt hafif şerit */

  ctx.strokeStyle="rgba(255,255,255,.65)";
  ctx.lineWidth=Math.max(2,W*.004);

  ctx.beginPath();
  ctx.moveTo(far.left,depthY(p0));
  ctx.lineTo(near.left,depthY(p1));
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(far.right,depthY(p0));
  ctx.lineTo(near.right,depthY(p1));
  ctx.stroke();

  /* 3 şerit */

  for(let lane=1;lane<=2;lane++){

    const ratio=lane/3;

    for(let i=0;i<18;i++){

      let p=((i/18)+(distance*.00042))%1;

      const y=depthY(p);
      const r=roadBounds(p);

      const x=r.left+r.width*ratio;

      const dashH=
        3+
        Math.pow(p,1.7)*32;

      const gap=
        7+
        Math.pow(p,1.7)*13;

      ctx.fillStyle="rgba(245,245,235,.72)";

      ctx.fillRect(
        x-1.5,
        y,
        3,
        dashH
      );

      /* gölge altı */

      if(p>.35){
        ctx.fillStyle="rgba(0,0,0,.04)";
        ctx.fillRect(
          x-3,
          y+dashH+gap,
          6,
          2
        );
      }
    }
  }

  /* yol kenarı metal bariyer */

  drawGuardRail(-1);
  drawGuardRail(1);
}

function drawGuardRail(side){

  ctx.strokeStyle="#4c4e4c";
  ctx.lineWidth=Math.max(2,W*.006);

  ctx.beginPath();

  for(let i=0;i<=25;i++){

    const p=i/25;
    const y=depthY(p);
    const r=roadBounds(p);

    const x=
      side<0
      ? r.left-W*.018
      : r.right+W*.018;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.stroke();

  /* direkler */

  for(let i=2;i<25;i+=3){

    const p=i/25;
    const y=depthY(p);
    const r=roadBounds(p);

    const x=
      side<0
      ? r.left-W*.018
      : r.right+W*.018;

    const h=3+Math.pow(p,1.8)*15;

    ctx.fillStyle="#404341";
    ctx.fillRect(x-1,y-h/2,2,h);
  }
}

/* =========================================================
   TREES
   ========================================================= */

function addTree(){

  const side=Math.random()<.5?-1:1;

  trees.push({
    side:side,
    p:Math.random()*.95,
    offset:.035+Math.random()*.12,
    scale:.75+Math.random()*.55,
    palm:Math.random()<.20
  });
}

for(let i=0;i<45;i++) addTree();

function updateTrees(dt){

  const movement=speed*.000008*dt;

  for(const t of trees){

    t.p+=movement;

    if(t.p>1.08){

      t.p=Math.random()*.03;

      t.side=Math.random()<.5?-1:1;
      t.offset=.035+Math.random()*.12;
      t.scale=.75+Math.random()*.55;
      t.palm=Math.random()<.18;
    }
  }
}

function drawTree(t){

  if(t.p<.015) return;

  const y=depthY(t.p);
  const r=roadBounds(t.p);

  /*
     KRİTİK:
     Ağaç yol sınırının DIŞINDA.
     Asfalta girmesi mümkün değil.
  */

  const safe=W*.035;

  let x;

  if(t.side<0){
    x=r.left-safe-t.offset*W*.28;
  }else{
    x=r.right+safe+t.offset*W*.28;
  }

  const size=
    (7+Math.pow(t.p,1.7)*48)*t.scale;

  if(t.palm){
    drawPalm(x,y,size);
  }else{
    drawNormalTree(x,y,size);
  }
}

function drawNormalTree(x,y,s){

  /* gölge */

  ctx.fillStyle="rgba(0,0,0,.18)";
  ctx.beginPath();
  ctx.ellipse(x,y+2,s*.55,s*.18,0,0,Math.PI*2);
  ctx.fill();

  const trunkW=Math.max(2,s*.13);

  ctx.fillStyle="#65452b";
  ctx.fillRect(
    x-trunkW/2,
    y-s*.65,
    trunkW,
    s*.65
  );

  ctx.fillStyle="#1c4e2d";

  ctx.beginPath();
  ctx.arc(x,y-s*.85,s*.40,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#28663a";

  ctx.beginPath();
  ctx.arc(x-s*.27,y-s*.69,s*.35,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x+s*.27,y-s*.70,s*.35,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#367947";

  ctx.beginPath();
  ctx.arc(x,y-s*1.08,s*.27,0,Math.PI*2);
  ctx.fill();
}

function drawPalm(x,y,s){

  ctx.strokeStyle="#64452d";
  ctx.lineWidth=Math.max(2,s*.09);

  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.quadraticCurveTo(
    x-s*.04,
    y-s*.55,
    x+s*.06,
    y-s*.95
  );
  ctx.stroke();

  ctx.strokeStyle="#2e6538";
  ctx.lineWidth=Math.max(1,s*.055);

  for(let i=0;i<7;i++){

    const a=
      -Math.PI*.95+
      i*Math.PI*.30;

    ctx.beginPath();
    ctx.moveTo(
      x+s*.06,
      y-s*.95
    );

    ctx.lineTo(
      x+s*.06+Math.cos(a)*s*.48,
      y-s*.95+Math.sin(a)*s*.30
    );

    ctx.stroke();
  }
}

function drawAllTrees(){

  trees
    .slice()
    .sort((a,b)=>a.p-b.p)
    .forEach(drawTree);
}

/* =========================================================
   ROCKS
   ========================================================= */

for(let i=0;i<18;i++){

  rocks.push({
    side:Math.random()<.5?-1:1,
    p:Math.random(),
    offset:.04+Math.random()*.14
  });
}

function updateRocks(dt){

  for(const r of rocks){

    r.p+=speed*.000006*dt;

    if(r.p>1.08){

      r.p=Math.random()*.04;
      r.side=Math.random()<.5?-1:1;
      r.offset=.04+Math.random()*.14;
    }
  }
}

function drawRock(r){

  if(r.p<.03) return;

  const y=depthY(r.p);
  const road=roadBounds(r.p);

  const safe=W*.04;

  const x=r.side<0
    ?road.left-safe-r.offset*W*.2
    :road.right+safe+r.offset*W*.2;

  const s=4+Math.pow(r.p,1.7)*28;

  ctx.fillStyle="#666456";

  ctx.beginPath();
  ctx.moveTo(x-s,y);
  ctx.lineTo(x-s*.55,y-s*.55);
  ctx.lineTo(x+s*.15,y-s*.65);
  ctx.lineTo(x+s,y-s*.12);
  ctx.lineTo(x+s*.55,y+s*.08);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="rgba(255,255,255,.12)";

  ctx.beginPath();
  ctx.moveTo(x-s*.55,y-s*.55);
  ctx.lineTo(x+s*.15,y-s*.65);
  ctx.lineTo(x+s*.05,y-s*.35);
  ctx.lineTo(x-s*.25,y-s*.30);
  ctx.closePath();
  ctx.fill();
}

function drawAllRocks(){
  rocks
    .slice()
    .sort((a,b)=>a.p-b.p)
    .forEach(drawRock);
}

/* =========================================================
   TRAFFIC
   ========================================================= */

const carTypes=[
  "sedan",
  "van",
  "truck",
  "sport",
  "suv"
];

function spawnTraffic(){

  let lane=Math.floor(Math.random()*3);

  /*
    Çok yakın iki aracı aynı şeride koyma.
  */

  const blocked=traffic.some(c=>
    c.lane===lane && c.p<.28
  );

  if(blocked) return;

  traffic.push({
    lane:lane,
    p:.015,
    type:carTypes[
      Math.floor(Math.random()*carTypes.length)
    ],
    color:[
      "#d7d7d1",
      "#15191c",
      "#b5241b",
      "#e0aa32",
      "#2c6eaa",
      "#ededdf"
    ][Math.floor(Math.random()*6)],
    speed:.35+Math.random()*.35
  });
}

let trafficTimer=0;

function updateTraffic(dt){

  trafficTimer-=dt;

  if(trafficTimer<=0){

    if(traffic.length<7){
      spawnTraffic();
    }

    trafficTimer=
      Math.max(
        500,
        1300-speed*4
      );
  }

  for(const c of traffic){

    c.p+=
      (speed*.0000075*c.speed)*dt;
  }

  for(let i=traffic.length-1;i>=0;i--){

    if(traffic[i].p>1.15){
      traffic.splice(i,1);
      score+=20;
      money+=1;
    }
  }
}

/* =========================================================
   TRAFFIC CAR DRAW
   ========================================================= */

function drawTrafficCar(c){

  const y=depthY(c.p);
  const road=roadBounds(c.p);

  const laneX=
    road.left+
    road.width*((c.lane+.5)/3);

  const scale=.16+Math.pow(c.p,1.6)*.84;

  const w=
    Math.max(
      10,
      Math.min(
        85,
        W*.115*scale
      )
    );

  let h=w*1.58;

  ctx.save();
  ctx.translate(laneX,y);

  /* gölge */

  ctx.fillStyle="rgba(0,0,0,.32)";
  ctx.beginPath();
  ctx.ellipse(
    0,
    h*.35,
    w*.55,
    h*.18,
    0,0,Math.PI*2
  );
  ctx.fill();

  /* lastikler */

  ctx.fillStyle="#111";

  ctx.fillRect(-w*.51,-h*.18,w*.13,h*.30);
  ctx.fillRect(w*.38,-h*.18,w*.13,h*.30);
  ctx.fillRect(-w*.51,h*.08,w*.13,h*.25);
  ctx.fillRect(w*.38,h*.08,w*.13,h*.25);

  /* gövde */

  ctx.fillStyle=c.color;

  if(c.type==="truck"){

    ctx.fillRect(
      -w*.39,
      -h*.55,
      w*.78,
      h*.95
    );

    ctx.fillStyle="#d6d0bd";
    ctx.fillRect(
      -w*.35,
      -h*.50,
      w*.70,
      h*.45
    );

  }else{

    ctx.beginPath();

    ctx.roundRect(
      -w*.43,
      -h*.55,
      w*.86,
      h*.98,
      w*.12
    );

    ctx.fill();

    /* arka cam */

    ctx.fillStyle="rgba(18,25,29,.90)";

    ctx.beginPath();

    ctx.roundRect(
      -w*.31,
      -h*.43,
      w*.62,
      h*.28,
      w*.06
    );

    ctx.fill();

    /* arka stop */

    ctx.fillStyle="#d22a21";

    ctx.fillRect(
      -w*.31,
      h*.24,
      w*.16,
      h*.055
    );

    ctx.fillRect(
      w*.15,
      h*.24,
      w*.16,
      h*.055
    );
  }

  ctx.restore();
}

/* =========================================================
   PLAYER MUSTANG
   ========================================================= */

function drawPlayer(){

  const p=.92;
  const road=roadBounds(p);

  const x=
    road.left+
    road.width*((playerLane+.5)/3)+
    playerX*road.width*.18;

  const y=H*.82;

  const w=Math.min(W*.18,112);
  const h=w*1.63;

  ctx.save();
  ctx.translate(x,y);

  /* gölge */

  ctx.fillStyle="rgba(0,0,0,.42)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.38,
    w*.60,
    h*.16,
    0,0,Math.PI*2
  );

  ctx.fill();

  /* lastikler */

  ctx.fillStyle="#090909";

  ctx.fillRect(
    -w*.54,
    -h*.18,
    w*.14,
    h*.34
  );

  ctx.fillRect(
    w*.40,
    -h*.18,
    w*.14,
    h*.34
  );

  ctx.fillRect(
    -w*.54,
    h*.08,
    w*.14,
    h*.29
  );

  ctx.fillRect(
    w*.40,
    h*.08,
    w*.14,
    h*.29
  );

  /* Mustang gövde */

  const body=ctx.createLinearGradient(
    -w/2,0,w/2,0
  );

  body.addColorStop(0,"#71100d");
  body.addColorStop(.20,"#c71e18");
  body.addColorStop(.48,"#f03a28");
  body.addColorStop(.72,"#c51d18");
  body.addColorStop(1,"#67100e");

  ctx.fillStyle=body;

  ctx.beginPath();

  ctx.moveTo(-w*.35,-h*.56);

  ctx.quadraticCurveTo(
    -w*.47,
    -h*.24,
    -w*.44,
    h*.31
  );

  ctx.quadraticCurveTo(
    0,
    h*.56,
    w*.44,
    h*.31
  );

  ctx.quadraticCurveTo(
    w*.47,
    -h*.24,
    w*.35,
    -h*.56
  );

  ctx.quadraticCurveTo(
    0,
    -h*.72,
    -w*.35,
    -h*.56
  );

  ctx.closePath();
  ctx.fill();

  /* arka cam */

  ctx.fillStyle="#182127";

  ctx.beginPath();

  ctx.moveTo(-w*.29,-h*.46);
  ctx.quadraticCurveTo(
    0,-h*.60,
    w*.29,-h*.46
  );

  ctx.lineTo(w*.25,-h*.12);
  ctx.lineTo(-w*.25,-h*.12);
  ctx.closePath();
  ctx.fill();

  /* cam parlaması */

  ctx.fillStyle="rgba(255,255,255,.13)";

  ctx.beginPath();
  ctx.moveTo(-w*.20,-h*.42);
  ctx.lineTo(-w*.03,-h*.51);
  ctx.lineTo(-w*.03,-h*.18);
  ctx.lineTo(-w*.18,-h*.18);
  ctx.closePath();
  ctx.fill();

  /* bagaj çizgisi */

  ctx.strokeStyle="rgba(30,10,10,.55)";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(-w*.32,h*.12);
  ctx.lineTo(w*.32,h*.12);
  ctx.stroke();

  /* Mustang stopları */

  ctx.fillStyle="#ff4737";

  for(let i=-1;i<=1;i++){

    ctx.fillRect(
      i*w*.16-w*.045,
      h*.29,
      w*.08,
      h*.055
    );
  }

  /* tampon */

  ctx.fillStyle="#25282a";

  ctx.fillRect(
    -w*.31,
    h*.37,
    w*.62,
    h*.055
  );

  /* egzoz */

  ctx.fillStyle="#aaa";

  ctx.fillRect(
    -w*.26,
    h*.39,
    w*.09,
    h*.035
  );

  ctx.fillRect(
    w*.17,
    h*.39,
    w*.09,
    h*.035
  );

  ctx.restore();
}

/* =========================================================
   COLLISION
   ========================================================= */

function collisionCheck(){

  for(const c of traffic){

    if(c.p<.76 || c.p>.99) continue;

    const laneDiff=Math.abs(
      c.lane-playerLane
    );

    if(laneDiff===0){

      crashTimer=700;
      speed*=.45;

      playCrash();

      c.p+=.06;

      return;
    }
  }
}

/* =========================================================
   INPUT
   ========================================================= */

function steer(dir){

  if(!running || paused) return;

  if(dir<0){
    playerLane=Math.max(0,playerLane-1);
  }else{
    playerLane=Math.min(2,playerLane+1);
  }

  targetX=0;
}

function bindButton(el,dir){

  const action=e=>{
    e.preventDefault();
    steer(dir);
  };

  el.addEventListener("pointerdown",action);
}

bindButton(
  document.getElementById("left"),
  -1
);

bindButton(
  document.getElementById("right"),
  1
);

addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    steer(-1);
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    steer(1);
  }

  if(e.key===" "){
    paused=!paused;
  }
});

/* =========================================================
   AUDIO
   ========================================================= */

let audio=null;
let master=null;
let engineOsc=null;
let engineOsc2=null;
let engineGain=null;
let filter=null;

function initAudio(){

  if(audio) return;

  audio=new (window.AudioContext||
             window.webkitAudioContext)();

  master=audio.createGain();
  master.gain.value=volume;

  master.connect(audio.destination);

  engineOsc=audio.createOscillator();
  engineOsc2=audio.createOscillator();

  engineGain=audio.createGain();
  filter=audio.createBiquadFilter();

  engineOsc.type="sawtooth";
  engineOsc2.type="square";

  engineOsc.frequency.value=55;
  engineOsc2.frequency.value=27.5;

  filter.type="lowpass";
  filter.frequency.value=900;

  engineGain.gain.value=0;

  engineOsc.connect(filter);
  engineOsc2.connect(filter);

  filter.connect(engineGain);
  engineGain.connect(master);

  engineOsc.start();
  engineOsc2.start();
}

function updateEngine(){

  if(!audio || !engineGain) return;

  const rpm=
    42+
    speed*2.9;

  engineOsc.frequency.setTargetAtTime(
    rpm,
    audio.currentTime,
    .035
  );

  engineOsc2.frequency.setTargetAtTime(
    rpm*.5,
    audio.currentTime,
    .035
  );

  const gain=
    soundOn
    ? .018+(speed/220)*.055
    : 0;

  engineGain.gain.setTargetAtTime(
    gain,
    audio.currentTime,
    .06
  );

  filter.frequency.setTargetAtTime(
    550+speed*9,
    audio.currentTime,
    .05
  );
}

function playCrash(){

  if(!audio || !soundOn) return;

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type="sawtooth";
  osc.frequency.value=80;

  gain.gain.setValueAtTime(
    .16,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.22
  );

  osc.connect(gain);
  gain.connect(master);

  osc.start();
  osc.stop(audio.currentTime+.23);
}

/* =========================================================
   GAME UPDATE
   ========================================================= */

function update(dt){

  if(!running || paused) return;

  /* hızlanma */

  speed+=
    (128-speed)*.0007*dt;

  speed=Math.max(0,Math.min(155,speed));

  distance+=speed*dt;

  score+=speed*dt*.012;

  if(crashTimer>0){
    crashTimer-=dt;
  }

  updateTrees(dt);
  updateRocks(dt);
  updateTraffic(dt);

  collisionCheck();

  updateEngine();

  document.getElementById("speed").innerHTML=
    Math.round(speed)+
    ' <span>KM/H</span>';

  document.getElementById("score").textContent=
    "SKOR: "+Math.floor(score);

  document.getElementById("money").textContent=
    "💰 "+money;
}

/* =========================================================
   DRAW
   ========================================================= */

function draw(){

  drawBackground();

  /*
     Uzak objelerden yakına doğru:
     ağaçlar -> kayalar -> yol -> trafik -> Mustang
  */

  drawAllTrees();
  drawAllRocks();

  drawRoad();

  traffic
    .slice()
    .sort((a,b)=>a.p-b.p)
    .forEach(drawTrafficCar);

  drawPlayer();

  /* hız titreşimi */

  if(speed>110){

    ctx.fillStyle=
      "rgba(255,255,255,.025)";

    for(let i=0;i<8;i++){

      const y=
        Math.random()*H;

      ctx.fillRect(
        Math.random()*W,
        y,
        1+Math.random()*2,
        15+Math.random()*40
      );
    }
  }

  /* çarpışma efekti */

  if(crashTimer>0){

    ctx.fillStyle=
      "rgba(255,80,30,"+
      (crashTimer/700)*.12+
      ")";

    ctx.fillRect(0,0,W,H);
  }
}

/* =========================================================
   LOOP
   ========================================================= */

function loop(t){

  if(!lastTime) lastTime=t;

  const dt=Math.min(40,t-lastTime);

  lastTime=t;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   MENU
   ========================================================= */

document.getElementById("start")
.addEventListener("click",()=>{

  initAudio();

  if(audio.state==="suspended"){
    audio.resume();
  }

  running=true;
  paused=false;

  speed=45;
  score=0;
  distance=0;

  traffic.length=0;

  document.getElementById("menu").style.display="none";
  document.getElementById("pause").style.display="block";
});

document.getElementById("pause")
.addEventListener("click",()=>{

  paused=!paused;

  document.getElementById("pause").textContent=
    paused?"▶":"Ⅱ";
});

/* =========================================================
   SOUND BUTTON
   ========================================================= */

const soundBtn=document.getElementById("sound");

soundBtn.addEventListener("click",()=>{

  soundOn=!soundOn;

  soundBtn.textContent=
    soundOn
    ?"🔊 SES: AÇIK"
    :"🔇 SES: KAPALI";
});

/* =========================================================
   SETTINGS
   ========================================================= */

document.getElementById("settingsBtn")
.addEventListener("click",()=>{
  document.getElementById("settings").style.display="flex";
});

document.getElementById("closeSettings")
.addEventListener("click",()=>{
  document.getElementById("settings").style.display="none";
});

document.getElementById("volume")
.addEventListener("input",e=>{

  volume=parseFloat(e.target.value);

  if(master){
    master.gain.value=volume;
  }
});

/* =========================================================
   LOADING
   ========================================================= */

setTimeout(()=>{

  const loading=document.getElementById("loading");

  loading.style.opacity="0";

  setTimeout(()=>{
    loading.remove();
  },550);

},500);

/* =========================================================
   INITIAL DRAW
   ========================================================= */

draw();

</script>
