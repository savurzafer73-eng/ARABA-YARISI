<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mustang Road Racer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101820;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
}

#score{
  position:absolute;
  top:18px;
  left:18px;
  color:white;
  font-size:22px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#speed{
  position:absolute;
  top:18px;
  right:18px;
  color:white;
  font-size:18px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#message{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  text-align:center;
  font-size:30px;
  font-weight:bold;
  text-shadow:0 3px 10px #000;
  display:none;
}

#restart{
  margin-top:18px;
  padding:13px 28px;
  border:0;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  pointer-events:auto;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="score">Skor: 0</div>
  <div id="speed">Hız: 0 km/h</div>
  <div id="message">
    ÇARPIŞMA!
    <br>
    <button id="restart">TEKRAR OYNA</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H,dpr;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1,2);
  W = innerWidth;
  H = innerHeight;

  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();

/* =========================
   OYUN
========================= */

let gameOver=false;
let score=0;
let distance=0;
let speed=7;
let roadOffset=0;

const player={
  lane:1,
  x:0,
  y:0,
  targetX:0,
  width:62,
  height:112
};

let traffic=[];

const colors=[
  "#e53935",
  "#1565c0",
  "#f5c400",
  "#eeeeee",
  "#111111",
  "#7b1fa2",
  "#00897b"
];

/* =========================
   YOL GEOMETRİSİ
========================= */

function roadGeometry(){
  const horizonY = H*0.38;

  const bottomRoadW = Math.min(W*0.94,850);
  const topRoadW = Math.min(W*0.11,125);

  return {
    horizonY,
    bottomRoadW,
    topRoadW,
    bottomLeft:(W-bottomRoadW)/2,
    bottomRight:(W+bottomRoadW)/2,
    topLeft:(W-topRoadW)/2,
    topRight:(W+topRoadW)/2
  };
}

function roadX(y){
  const r=roadGeometry();

  let t=(y-r.horizonY)/(H-r.horizonY);
  t=Math.max(0,Math.min(1,t));

  return {
    left:r.topLeft+(r.bottomLeft-r.topLeft)*t,
    right:r.topRight+(r.bottomRight-r.topRight)*t
  };
}

function laneCenter(lane,y){
  const r=roadX(y);
  const width=(r.right-r.left)/3;

  return r.left+width*(lane+0.5);
}

/* =========================
   ÇİZİM
========================= */

function drawBackground(){
  /* Gökyüzü */
  const sky=ctx.createLinearGradient(0,0,0,H*0.5);
  sky.addColorStop(0,"#75c9ff");
  sky.addColorStop(1,"#dff4ff");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  /* Güneş */
  ctx.fillStyle="rgba(255,235,150,.9)";
  ctx.beginPath();
  ctx.arc(W*0.78,H*0.15,42,0,Math.PI*2);
  ctx.fill();

  /* Uzak tepeler */
  ctx.fillStyle="#739b55";
  ctx.beginPath();
  ctx.moveTo(0,H*.38);

  for(let x=0;x<=W;x+=60){
    const yy=H*.32+Math.sin(x*.008)*35;
    ctx.lineTo(x,yy);
  }

  ctx.lineTo(W,H*.45);
  ctx.lineTo(0,H*.45);
  ctx.closePath();
  ctx.fill();

  /* Çimen */
  ctx.fillStyle="#4d8a3b";
  ctx.fillRect(0,H*.38,W,H*.62);
}

function drawRoad(){
  const r=roadGeometry();

  /* Yol */
  const roadGrad=ctx.createLinearGradient(0,r.horizonY,0,H);
  roadGrad.addColorStop(0,"#555");
  roadGrad.addColorStop(1,"#262626");

  ctx.fillStyle=roadGrad;

  ctx.beginPath();
  ctx.moveTo(r.topLeft,r.horizonY);
  ctx.lineTo(r.topRight,r.horizonY);
  ctx.lineTo(r.bottomRight,H);
  ctx.lineTo(r.bottomLeft,H);
  ctx.closePath();
  ctx.fill();

  /* Yol kenar çizgileri */
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=5;

  ctx.beginPath();
  ctx.moveTo(r.topLeft,r.horizonY);
  ctx.lineTo(r.bottomLeft,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(r.topRight,r.horizonY);
  ctx.lineTo(r.bottomRight,H);
  ctx.stroke();

  /* 3 şerit için kesikli çizgiler */
  drawLaneLine(1);
  drawLaneLine(2);
}

function drawLaneLine(lane){
  const r=roadGeometry();

  const topX=r.topLeft+(r.topRight-r.topLeft)*(lane/3);
  const bottomX=r.bottomLeft+(r.bottomRight-r.bottomLeft)*(lane/3);

  const start=roadOffset%90;

  for(let y=r.horizonY+start;y<H;y+=90){
    const y2=Math.min(y+45,H);

    let t1=(y-r.horizonY)/(H-r.horizonY);
    let t2=(y2-r.horizonY)/(H-r.horizonY);

    const x1=topX+(bottomX-topX)*t1;
    const x2=topX+(bottomX-topX)*t2;

    const width=2+7*t1;

    ctx.strokeStyle="#f5f5f5";
    ctx.lineWidth=width;

    ctx.beginPath();
    ctx.moveTo(x1,y);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }
}

/* =========================
   AĞAÇLAR / YOL KENARI
========================= */

function drawTree(x,y,s){
  /* gölge */
  ctx.fillStyle="rgba(0,0,0,.18)";
  ctx.beginPath();
  ctx.ellipse(x,y+6*s,22*s,7*s,0,0,Math.PI*2);
  ctx.fill();

  /* gövde */
  ctx.fillStyle="#67442b";
  ctx.fillRect(x-5*s,y-45*s,10*s,45*s);

  /* yapraklar */
  ctx.fillStyle="#245f32";

  ctx.beginPath();
  ctx.arc(x,y-55*s,22*s,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x-15*s,y-43*s,17*s,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x+15*s,y-43*s,17*s,0,Math.PI*2);
  ctx.fill();
}

function drawRoadside(){
  const r=roadGeometry();

  for(let i=0;i<12;i++){
    let t=((i*0.13+roadOffset/900)%1);
    let y=r.horizonY+t*(H-r.horizonY);

    const road=roadX(y);
    const side=i%2===0?-1:1;

    const gap=25+70*t;

    const x=side<0
      ? road.left-gap
      : road.right+gap;

    const scale=.25+.8*t;

    drawTree(x,y,scale);
  }
}

/* =========================
   MUSTANG
========================= */

function drawMustang(x,y,w,h){
  ctx.save();
  ctx.translate(x,y);

  /* gölge */
  ctx.fillStyle="rgba(0,0,0,.4)";
  ctx.beginPath();
  ctx.ellipse(0,h*.43,w*.48,h*.12,0,0,Math.PI*2);
  ctx.fill();

  /* arka gövde */
  ctx.fillStyle="#b91c1c";

  ctx.beginPath();
  ctx.moveTo(-w*.43,h*.38);
  ctx.lineTo(-w*.38,-h*.05);
  ctx.lineTo(-w*.24,-h*.34);
  ctx.lineTo(w*.24,-h*.34);
  ctx.lineTo(w*.38,-h*.05);
  ctx.lineTo(w*.43,h*.38);
  ctx.closePath();
  ctx.fill();

  /* siyah tavan */
  ctx.fillStyle="#151515";

  ctx.beginPath();
  ctx.moveTo(-w*.25,-h*.32);
  ctx.lineTo(-w*.16,-h*.56);
  ctx.lineTo(w*.16,-h*.56);
  ctx.lineTo(w*.25,-h*.32);
  ctx.closePath();
  ctx.fill();

  /* cam */
  ctx.fillStyle="#79b7d6";

  ctx.beginPath();
  ctx.moveTo(-w*.19,-h*.30);
  ctx.lineTo(-w*.12,-h*.48);
  ctx.lineTo(w*.12,-h*.48);
  ctx.lineTo(w*.19,-h*.30);
  ctx.closePath();
  ctx.fill();

  /* kaput */
  ctx.fillStyle="#d62929";
  ctx.beginPath();
  ctx.moveTo(-w*.35,-h*.02);
  ctx.lineTo(w*.35,-h*.02);
  ctx.lineTo(w*.38,h*.25);
  ctx.lineTo(-w*.38,h*.25);
  ctx.closePath();
  ctx.fill();

  /* Mustang çizgileri */
  ctx.fillStyle="#f2f2f2";
  ctx.fillRect(-w*.08,-h*.01,w*.045,h*.28);
  ctx.fillRect(w*.035,-h*.01,w*.045,h*.28);

  /* farlar */
  ctx.fillStyle="#fff4b0";
  ctx.fillRect(-w*.33,h*.12,w*.12,h*.08);
  ctx.fillRect(w*.21,h*.12,w*.12,h*.08);

  /* ızgara */
  ctx.fillStyle="#111";
  ctx.fillRect(-w*.18,h*.22,w*.36,h*.08);

  /* tekerler */
  ctx.fillStyle="#101010";

  ctx.fillRect(-w*.49,-h*.05,w*.13,h*.30);
  ctx.fillRect(w*.36,-h*.05,w*.13,h*.30);

  ctx.restore();
}

/* =========================
   TRAFİK ARABALARI
========================= */

function drawTrafficCar(car){
  const scale=car.scale;
  const w=car.width*scale;
  const h=car.height*scale;

  ctx.save();
  ctx.translate(car.x,car.y);

  /* gölge */
  ctx.fillStyle="rgba(0,0,0,.3)";
  ctx.beginPath();
  ctx.ellipse(0,h*.43,w*.52,h*.1,0,0,Math.PI*2);
  ctx.fill();

  /* gövde */
  ctx.fillStyle=car.color;

  ctx.beginPath();
  ctx.roundRect(-w*.43,-h*.12,w*.86,h*.55,7*scale);
  ctx.fill();

  /* kabin */
  ctx.fillStyle="#202b31";

  ctx.beginPath();
  ctx.moveTo(-w*.27,-h*.10);
  ctx.lineTo(-w*.17,-h*.40);
  ctx.lineTo(w*.17,-h*.40);
  ctx.lineTo(w*.27,-h*.10);
  ctx.closePath();
  ctx.fill();

  /* cam */
  ctx.fillStyle="#8ab7c7";

  ctx.beginPath();
  ctx.moveTo(-w*.20,-h*.12);
  ctx.lineTo(-w*.13,-h*.32);
  ctx.lineTo(w*.13,-h*.32);
  ctx.lineTo(w*.20,-h*.12);
  ctx.closePath();
  ctx.fill();

  /* far */
  ctx.fillStyle="#fff3b0";
  ctx.fillRect(-w*.34,h*.20,w*.13,h*.08);
  ctx.fillRect(w*.21,h*.20,w*.13,h*.08);

  /* teker */
  ctx.fillStyle="#111";
  ctx.fillRect(-w*.49,-h*.03,w*.12,h*.28);
  ctx.fillRect(w*.37,-h*.03,w*.12,h*.28);

  ctx.restore();
}

/* =========================
   TRAFİK OLUŞTURMA
========================= */

function spawnTraffic(){
  const lane=Math.floor(Math.random()*3);

  const y=roadGeometry().horizonY-100;

  traffic.push({
    lane,
    y,
    x:laneCenter(lane,y),
    width:54,
    height:95,
    scale:.35,
    color:colors[Math.floor(Math.random()*colors.length)],
    speed:2.2+Math.random()*2
  });
}

/* =========================
   OYUNCU KONUMU
========================= */

function updatePlayer(){
  const target=laneCenter(player.lane,player.y);

  player.targetX=target;

  player.x+=(player.targetX-player.x)*.16;
}

/* =========================
   ÇARPIŞMA
========================= */

function collision(a,b){
  const aw=a.width*.32;
  const ah=a.height*.35;

  const bw=b.width*b.scale*.35;
  const bh=b.height*b.scale*.38;

  return Math.abs(a.x-b.x)<aw+bw &&
         Math.abs(a.y-b.y)<ah+bh;
}

/* =========================
   GÜNCELLEME
========================= */

let spawnTimer=0;

function update(){
  if(gameOver)return;

  speed=Math.min(15,7+distance/5000);

  roadOffset+=speed;

  distance+=speed;
  score=Math.floor(distance/10);

  updatePlayer();

  spawnTimer-=1;

  if(spawnTimer<=0){
    spawnTraffic();

    spawnTimer=Math.max(
      35,
      75-speed*2
    );
  }

  for(let i=traffic.length-1;i>=0;i--){
    const car=traffic[i];

    car.y += speed-car.speed+2;

    const road=roadX(car.y);

    car.x=laneCenter(car.lane,car.y);

    let t=(car.y-roadGeometry().horizonY)/
          (H-roadGeometry().horizonY);

    car.scale=.30+Math.max(0,Math.min(1,t))*.75;

    if(collision(player,car)){
      gameOver=true;
      showGameOver();
    }

    if(car.y>H+150){
      traffic.splice(i,1);
    }
  }

  document.getElementById("score").textContent=
    "Skor: "+score;

  document.getElementById("speed").textContent=
    "Hız: "+Math.floor(speed*20)+" km/h";
}

/* =========================
   OYUN BİTTİ
========================= */

function showGameOver(){
  document.getElementById("message").style.display="block";
}

document.getElementById("restart").addEventListener("click",()=>{
  gameOver=false;
  score=0;
  distance=0;
  speed=7;
  traffic=[];
  player.lane=1;

  document.getElementById("message").style.display="none";
});

/* =========================
   KONTROLLER
========================= */

function left(){
  if(gameOver)return;
  player.lane=Math.max(0,player.lane-1);
}

function right(){
  if(gameOver)return;
  player.lane=Math.min(2,player.lane+1);
}

/* Telefon:
   ekranın soluna bas = sol
   ekranın sağına bas = sağ
*/

let touchStartX=0;
let touchStartY=0;

canvas.addEventListener("touchstart",e=>{
  const t=e.touches[0];

  touchStartX=t.clientX;
  touchStartY=t.clientY;

  e.preventDefault();
},{passive:false});

canvas.addEventListener("touchend",e=>{
  const t=e.changedTouches[0];

  const dx=t.clientX-touchStartX;
  const dy=t.clientY-touchStartY;

  if(Math.abs(dx)>35){
    if(dx<0)left();
    else right();
  }else{
    if(t.clientX<W/2)left();
    else right();
  }

  e.preventDefault();
},{passive:false});

/* Klavye */
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft" || e.key==="a"){
    left();
  }

  if(e.key==="ArrowRight" || e.key==="d"){
    right();
  }
});

/* =========================
   ÇİZİM DÖNGÜSÜ
========================= */

function draw(){
  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawRoadside();
  drawRoad();

  /* trafik */
  traffic.sort((a,b)=>a.y-b.y);

  for(const car of traffic){
    drawTrafficCar(car);
  }

  /* oyuncu */
  if(!player.y){
    player.y=H*.80;
    player.x=laneCenter(1,player.y);
  }

  drawMustang(
    player.x,
    player.y,
    player.width,
    player.height
  );
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
