<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road - 1969 Mustang</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070a;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#111;
}

/* ================= SKY ================= */

#sky{
  position:absolute;
  inset:0;
  height:48%;
  background:
    linear-gradient(
      #06152a 0%,
      #316889 55%,
      #e38a4b 100%
    );
  transition:1s;
}

#sun{
  position:absolute;
  width:70px;
  height:70px;
  right:12%;
  top:10%;
  border-radius:50%;
  background:#fff0a0;
  box-shadow:0 0 45px #ffd66b;
}

#moon{
  display:none;
  position:absolute;
  width:62px;
  height:62px;
  right:13%;
  top:9%;
  border-radius:50%;
  background:#eee;
  box-shadow:0 0 30px white;
}

.stars{
  position:absolute;
  inset:0;
  opacity:0;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 6px white;
}

/* ================= CITY ================= */

#city{
  position:absolute;
  left:0;
  right:0;
  bottom:42%;
  height:18%;
  display:flex;
  align-items:flex-end;
  gap:4px;
  overflow:hidden;
}

.building{
  flex:1;
  min-width:28px;
  background:linear-gradient(#17212b,#080d12);
  border-top:2px solid #263746;
  position:relative;
}

.window{
  position:absolute;
  width:5px;
  height:7px;
  background:#ffd95b;
  box-shadow:0 0 5px #ffd95b;
}

/* ================= ROAD ================= */

#road{
  position:absolute;
  left:0;
  right:0;
  top:40%;
  bottom:0;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #5d5d5d 0%,
      #303030 5%,
      #202020 10%,
      #252525 90%,
      #303030 95%,
      #5d5d5d 100%
    );

  clip-path:polygon(
    25% 0,
    75% 0,
    100% 100%,
    0 100%
  );
}

/* road shoulder */

#road:before,
#road:after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:5px;
  background:#eee;
  box-shadow:0 0 7px #fff;
}

#road:before{
  left:25%;
}

#road:after{
  right:25%;
}

/* lane divider */

.roadLine{
  position:absolute;
  width:6px;
  height:90px;
  background:#f5f5f5;
  border-radius:5px;
  box-shadow:0 0 6px rgba(255,255,255,.8);
}

/* ================= HUD ================= */

#hud{
  position:absolute;
  z-index:100;
  top:10px;
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.hud{
  padding:7px 9px;
  border-radius:11px;
  color:white;
  font-size:12px;
  font-weight:bold;
  background:rgba(0,0,0,.58);
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(6px);
  text-shadow:0 2px 4px #000;
}

/* ================= PLAYER ================= */

#player{
  position:absolute;
  width:82px;
  height:135px;
  left:50%;
  bottom:55px;
  z-index:60;
  transform:translateX(-50%);
  transition:transform .08s linear;
  filter:drop-shadow(0 12px 8px rgba(0,0,0,.7));
}

.car{
  position:absolute;
  inset:0;
}

/* wheels */

.wheel{
  position:absolute;
  width:13px;
  height:34px;
  background:linear-gradient(#111,#020202);
  border-radius:5px;
  border:1px solid #555;
  z-index:20;
}

.wl1{left:-2px;top:35px}
.wl2{left:-2px;bottom:22px}
.wr1{right:-2px;top:35px}
.wr2{right:-2px;bottom:22px}

/* Mustang body */

.mustangBody{
  position:absolute;
  left:8px;
  top:14px;
  width:66px;
  height:112px;
  border-radius:18px 18px 10px 10px;

  background:
    linear-gradient(
      90deg,
      #520000,
      #b90000 16%,
      #ff2525 48%,
      #d90000 75%,
      #590000
    );

  border:2px solid #330000;
  box-shadow:
    inset 0 0 8px rgba(255,255,255,.2),
    inset 0 -10px 12px rgba(0,0,0,.3);
}

/* hood */

.mustangHood{
  position:absolute;
  left:13px;
  top:5px;
  width:56px;
  height:48px;
  border-radius:18px 18px 7px 7px;
  background:
    linear-gradient(
      90deg,
      #780000,
      #e31616,
      #ff3838,
      #9b0000
    );
  border-bottom:3px solid #690000;
}

/* windshield */

.mustangGlass{
  position:absolute;
  left:16px;
  top:39px;
  width:50px;
  height:34px;
  border-radius:12px 12px 4px 4px;
  background:
    linear-gradient(
      135deg,
      #d8f7ff,
      #32617d 40%,
      #071522 100%
    );
  border:2px solid #111;
  z-index:8;
}

/* roof */

.mustangRoof{
  position:absolute;
  left:15px;
  top:31px;
  width:52px;
  height:42px;
  border-radius:16px 16px 4px 4px;
  border-top:4px solid #a40000;
  z-index:7;
}

/* center divider */

.mustangDivider{
  position:absolute;
  left:40px;
  top:40px;
  width:3px;
  height:30px;
  background:#111;
  z-index:10;
}

/* grille */

.grille{
  position:absolute;
  left:17px;
  bottom:11px;
  width:48px;
  height:19px;
  background:#080808;
  border:2px solid #777;
  border-radius:4px;
  z-index:12;
}

.grille i{
  position:absolute;
  top:2px;
  bottom:2px;
  width:2px;
  background:#888;
}

.grille i:nth-child(1){left:8px}
.grille i:nth-child(2){left:17px}
.grille i:nth-child(3){left:26px}
.grille i:nth-child(4){left:35px}

/* headlights */

.light{
  position:absolute;
  bottom:13px;
  width:12px;
  height:9px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 15px #fff;
  z-index:15;
}

.lightL{left:12px}
.lightR{right:12px}

/* bumper */

.bumper{
  position:absolute;
  left:12px;
  bottom:5px;
  width:58px;
  height:7px;
  border-radius:4px;
  background:linear-gradient(#eee,#777);
  z-index:16;
}

/* badge */

.horse{
  position:absolute;
  left:34px;
  bottom:33px;
  color:white;
  font-size:12px;
  z-index:17;
}

/* ================= OTHER CARS ================= */

.enemy{
  position:absolute;
  width:62px;
  height:100px;
  z-index:40;
  border-radius:14px 14px 10px 10px;
  box-shadow:
    0 7px 12px rgba(0,0,0,.75),
    inset 0 0 5px rgba(255,255,255,.25);
}

.enemy.red{
  background:linear-gradient(
    90deg,#4c0000,#f21c1c,#ff4747,#6b0000
  );
}

.enemy.blue{
  background:linear-gradient(
    90deg,#06215a,#126ee8,#4ca6ff,#061c50
  );
}

.enemy.yellow{
  background:linear-gradient(
    90deg,#5b4100,#e5b900,#ffe04c,#725100
  );
}

.enemy.green{
  background:linear-gradient(
    90deg,#04391f,#08a855,#43df8b,#03401f
  );
}

.enemyGlass{
  position:absolute;
  left:10px;
  top:14px;
  width:42px;
  height:31px;
  border-radius:9px;
  background:linear-gradient(
    135deg,
    #d9f8ff,
    #24536c,
    #071722
  );
  border:2px solid #111;
}

.enemyWheel{
  position:absolute;
  width:10px;
  height:27px;
  background:#050505;
  border:1px solid #444;
  border-radius:4px;
}

.enemyWL{left:-4px;top:30px}
.enemyWR{right:-4px;top:30px}

/* ================= COINS ================= */

.coin{
  position:absolute;
  width:28px;
  height:28px;
  z-index:42;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      #fff9a5 0 18%,
      #ffd000 20% 65%,
      #a66b00 66%
    );
  border:2px solid #fff0a0;
  box-shadow:0 0 16px #ffd000;
  animation:spin .5s linear infinite;
}

@keyframes spin{
  from{transform:rotateY(0)}
  to{transform:rotateY(360deg)}
}

/* ================= NITRO ================= */

#nitro{
  position:absolute;
  z-index:100;
  left:12px;
  bottom:17px;
  width:145px;
}

#nitroText{
  color:white;
  font-size:11px;
  font-weight:bold;
  margin-bottom:4px;
  text-shadow:0 2px 4px #000;
}

#nitroBar{
  height:15px;
  background:#111;
  border:1px solid #666;
  border-radius:10px;
  overflow:hidden;
}

#nitroFill{
  width:100%;
  height:100%;
  background:linear-gradient(
    90deg,#00c8ff,#426cff,#bdb7ff
  );
}

/* ================= CONTROLS ================= */

.touch{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:20;
}

#leftTouch{left:0}
#rightTouch{right:0}

#controlHint{
  position:absolute;
  bottom:93px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  color:rgba(255,255,255,.65);
  font-size:11px;
  white-space:nowrap;
}

/* ================= BUTTONS ================= */

#pauseBtn,
#soundBtn{
  position:absolute;
  z-index:110;
  top:55px;
  width:43px;
  height:43px;
  border:0;
  border-radius:12px;
  background:rgba(0,0,0,.62);
  color:white;
  font-size:18px;
}

#pauseBtn{right:10px}
#soundBtn{right:60px}

/* ================= DAMAGE ================= */

#damage{
  position:absolute;
  inset:0;
  z-index:90;
  pointer-events:none;
  background:rgba(255,0,0,.38);
  opacity:0;
}

/* ================= RAIN ================= */

#rain{
  display:none;
  position:absolute;
  inset:0;
  z-index:80;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      105deg,
      transparent 0 20px,
      rgba(190,220,255,.4) 21px,
      transparent 23px 48px
    );
  animation:rain .25s linear infinite;
}

@keyframes rain{
  from{background-position:0 0}
  to{background-position:-50px 120px}
}

/* ================= SCREENS ================= */

.screen{
  position:absolute;
  inset:0;
  z-index:300;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  text-align:center;
  background:
    radial-gradient(
      circle at center,
      rgba(50,20,10,.35),
      rgba(0,0,0,.9)
    );
  padding:20px;
}

.screen h1{
  font-size:38px;
  margin-bottom:12px;
  text-shadow:
    0 0 10px #ff2b00,
    0 0 25px #ff4500;
}

.screen p{
  line-height:1.65;
  color:#ddd;
  margin-bottom:20px;
}

.btn{
  border:0;
  border-radius:14px;
  padding:14px 25px;
  color:white;
  font-size:17px;
  font-weight:bold;
  background:
    linear-gradient(135deg,#d50000,#ff6100);
  box-shadow:0 7px 25px rgba(255,60,0,.4);
  margin:5px;
}

.secondary{
  background:linear-gradient(135deg,#333,#666);
}

/* ================= MENU ================= */

#menuScreen{
  z-index:250;
}

.menuButtons{
  display:flex;
  flex-direction:column;
  width:min(310px,90vw);
}

.money{
  margin-bottom:15px;
  padding:10px 18px;
  background:rgba(255,180,0,.12);
  border:1px solid rgba(255,210,70,.4);
  border-radius:12px;
  color:#ffd83d;
  font-weight:bold;
}

#garageScreen{
  z-index:260;
  overflow:auto;
  justify-content:flex-start;
  padding-top:30px;
}

.garageGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  width:min(420px,95vw);
  margin:10px auto;
}

.carCard{
  padding:12px;
  border-radius:15px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
}

.carPreview{
  height:70px;
  position:relative;
  transform:scale(.75);
}

.carName{
  font-weight:bold;
  margin:3px;
}

.carPrice{
  color:#ffd53b;
  font-size:13px;
  margin-bottom:6px;
}

.carBtn{
  border:0;
  padding:8px 12px;
  border-radius:9px;
  background:#d71919;
  color:#fff;
  font-weight:bold;
}

.locked{
  background:#555;
}

/* ================= HIDDEN ================= */

.hidden{
  display:none!important;
}

/* ================= MOBILE ================= */

@media(max-width:400px){

  .hud{
    padding:6px 6px;
    font-size:10px;
  }

  .screen h1{
    font-size:32px;
  }

  #player{
    transform:translateX(-50%) scale(.9);
  }
}
</style>
</head>

<body>

<script>

/* ==========================================
   TURBO ROAD
   COMPLETE SINGLE FILE VERSION
========================================== */

const game=document.getElementById("game");
const road=document.getElementById("road");
const player=document.getElementById("player");

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const livesEl=document.getElementById("lives");
const speedEl=document.getElementById("speed");

const nitroFill=document.getElementById("nitroFill");

const menuScreen=document.getElementById("menuScreen");
const garageScreen=document.getElementById("garageScreen");
const startScreen=document.getElementById("startScreen");
const pauseScreen=document.getElementById("pauseScreen");
const gameOver=document.getElementById("gameOver");

let running=false;
let paused=false;

let playerX=innerWidth/2;
let direction=0;

let score=0;
let coins=0;
let lives=3;

let speed=5;
let nitro=100;
let turbo=false;

let enemies=[];
let coinList=[];
let lines=[];

let enemyTimer=0;
let coinTimer=0;

let best=Number(
  localStorage.getItem("turboBest") || 0
);

let bank=Number(
  localStorage.getItem("turboMoney") || 0
);

let owned=JSON.parse(
  localStorage.getItem("turboOwned") ||
  '["mustang"]'
);

let selected=
  localStorage.getItem("turboSelected") ||
  "mustang";

let soundOn=
  localStorage.getItem("turboSound")!=="off";

let audio=null;

let lastTime=0;

/* ==========================================
   CARS
========================================== */

const cars={

  mustang:{
    name:"1969 Mustang",
    price:0,
    color:"red"
  },

  charger:{
    name:"Muscle Charger",
    price:500,
    color:"blue"
  },

  cobra:{
    name:"Street Cobra",
    price:1000,
    color:"green"
  },

  super:{
    name:"Turbo Supercar",
    price:2000,
    color:"yellow"
  }

};

/* ==========================================
   AUDIO
========================================== */

function startAudio(){

  if(!soundOn)return;

  if(!audio){

    try{

      audio=new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    }catch(e){}

  }

  if(audio &&
     audio.state==="suspended"){
    audio.resume();
  }
}

function sound(
  frequency,
  duration=.1,
  type="sine"
){

  if(!soundOn || !audio)return;

  try{

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.type=type;
    osc.frequency.value=frequency;

    gain.gain.setValueAtTime(
      .05,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(
      audio.currentTime+duration
    );

  }catch(e){}
}

/* ==========================================
   COLLISION SOUND
========================================== */

function crashSound(){

  if(!soundOn)return;

  sound(75,.18,"sawtooth");

  setTimeout(
    ()=>sound(48,.28,"square"),
    100
  );

  setTimeout(
    ()=>sound(32,.35,"sawtooth"),
    220
  );
}

/* ==========================================
   CITY
========================================== */

function createCity(){

  const city=
    document.getElementById("city");

  city.innerHTML="";

  for(let i=0;i<40;i++){

    const b=
      document.createElement("div");

    b.className="building";

    b.style.height=
      (35+Math.random()*120)+"px";

    for(let j=0;j<7;j++){

      const w=
        document.createElement("i");

      w.className="window";

      w.style.left=
        (10+Math.random()*75)+"%";

      w.style.top=
        (5+Math.random()*80)+"%";

      b.appendChild(w);
    }

    city.appendChild(b);
  }
}

/* ==========================================
   ROAD LINES
========================================== */

function createRoadLines(){

  lines.forEach(
    x=>x.el.remove()
  );

  lines=[];

  for(let i=0;i<15;i++){

    const el=
      document.createElement("div");

    el.className="roadLine";

    const obj={
      el:el,
      y:i*105-100
    };

    el.style.left="50%";
    el.style.top=obj.y+"px";

    road.appendChild(el);

    lines.push(obj);
  }
}

/* ==========================================
   ROAD POSITION
========================================== */

function roadBoundsAtY(y){

  const top=innerHeight*.40;
  const bottom=innerHeight;

  const p=
    Math.max(
      0,
      Math.min(
        1,
        (y-top)/(bottom-top)
      )
    );

  const left=
    innerWidth*(.25*(1-p));

  const right=
    innerWidth*(1-.25*(1-p));

  return{
    left:left,
    right:right
  };
}

/* ==========================================
   PLAYER
========================================== */

function updatePlayer(){

  player.style.left=
    playerX+"px";

  player.style.transform=
    `translateX(-50%) rotate(${direction*7}deg)`;

}

/* ==========================================
   CONTROL
========================================== */

function setDirection(x){

  if(!running || paused)return;

  direction=
    x<innerWidth/2 ? -1 : 1;
}

function stopDirection(){
  direction=0;
}

document
.getElementById("leftTouch")
.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    startAudio();
    setDirection(innerWidth*.2);
  },
  {passive:false}
);

document
.getElementById("rightTouch")
.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    startAudio();
    setDirection(innerWidth*.8);
  },
  {passive:false}
);

game.addEventListener(
  "touchmove",
  e=>{

    if(!running || paused)return;

    e.preventDefault();

    if(e.touches.length){
      setDirection(
        e.touches[0].clientX
      );
    }

  },
  {passive:false}
);

game.addEventListener(
  "touchend",
  e=>{
    e.preventDefault();
    stopDirection();
  },
  {passive:false}
);

/* mouse */

game.addEventListener(
  "mousedown",
  e=>{
    startAudio();
    setDirection(e.clientX);
  }
);

game.addEventListener(
  "mouseup",
  stopDirection
);

/* keyboard */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){
      direction=-1;
    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){
      direction=1;
    }

    if(e.code==="Space"){
      nitroActive(true);
    }

    if(e.key==="Escape"){
      togglePause();
    }

  }
);

document.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="a" ||
      e.key.toLowerCase()==="d"
    ){
      direction=0;
    }

    if(e.code==="Space"){
      nitroActive(false);
    }

  }
);

/* ==========================================
   NITRO
========================================== */

function nitroActive(value){

  if(!running || paused)return;

  turbo=
    value &&
    nitro>0;

}

/* ==========================================
   CREATE ENEMY
========================================== */

function createEnemy(){

  const el=
    document.createElement("div");

  const colors=[
    "red",
    "blue",
    "yellow",
    "green"
  ];

  el.className=
    "enemy "+
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];

  const glass=
    document.createElement("div");

  glass.className="enemyGlass";

  const wl=
    document.createElement("div");

  wl.className=
    "enemyWheel enemyWL";

  const wr=
    document.createElement("div");

  wr.className=
    "enemyWheel enemyWR";

  el.appendChild(glass);
  el.appendChild(wl);
  el.appendChild(wr);

  const lane=
    Math.floor(Math.random()*3);

  const x=
    innerWidth*
    (
      .25+
      lane*.166
    )+
    innerWidth*.083;

  const enemy={
    el:el,
    x:x,
    y:-130,
    speed:
      .75+
      Math.random()*.45
  };

  el.style.left=
    x+"px";

  el.style.top="-130px";

  game.appendChild(el);

  enemies.push(enemy);
}

/* ==========================================
   CREATE COIN
========================================== */

function createCoin(){

  const el=
    document.createElement("div");

  el.className="coin";

  const lane=
    Math.floor(Math.random()*3);

  const x=
    innerWidth*
    (
      .25+
      lane*.166
    )+
    innerWidth*.083;

  const obj={
    el:el,
    x:x,
    y:-40
  };

  el.style.left=x+"px";
  el.style.top="-40px";

  game.appendChild(el);

  coinList.push(obj);
}

/* ==========================================
   COLLISION
========================================== */

function collision(a,b){

  const r1=
    a.getBoundingClientRect();

  const r2=
    b.getBoundingClientRect();

  return !(
    r1.right<r2.left ||
    r1.left>r2.right ||
    r1.bottom<r2.top ||
    r1.top>r2.bottom
  );
}

/* ==========================================
   CRASH
========================================== */

function crash(enemy){

  if(enemy.hit)return;

  enemy.hit=true;

  lives--;

  livesEl.textContent=
    lives;

  score=
    Math.max(
      0,
      score-100
    );

  scoreEl.textContent=
    score;

  crashSound();

  if(navigator.vibrate){

    navigator.vibrate([
      180,
      80,
      180,
      80,
      250
    ]);

  }

  const damage=
    document.getElementById("damage");

  damage.animate(
    [
      {opacity:0},
      {opacity:1},
      {opacity:0}
    ],
    {
      duration:600
    }
  );

  enemy.el.remove();

  if(lives<=0){

    endGame();

  }

}

/* ==========================================
   UPDATE ROAD
========================================== */

function updateRoad(delta){

  const move=
    speed*
    (turbo?1.8:1)*
    delta*
    .08;

  lines.forEach(
    obj=>{

      obj.y+=move;

      if(
        obj.y>
        innerHeight
      ){

        obj.y=-110;

      }

      obj.el.style.top=
        obj.y+"px";

    }
  );

}

/* ==========================================
   UPDATE ENEMIES
========================================== */

function updateEnemies(delta){

  const move=
    speed*
    (turbo?1.65:1)*
    delta*
    .08;

  enemies.forEach(
    enemy=>{

      enemy.y+=
        move+
        enemy.speed*delta*.05;

      enemy.el.style.top=
        enemy.y+"px";

      if(
        collision(
          player,
          enemy.el
        )
      ){

        crash(enemy);

      }

    }
  );

  enemies=
    enemies.filter(
      enemy=>{

        if(
          enemy.y>
          innerHeight+150
        ){

          enemy.el.remove();

          score+=10;

          return false;

        }

        return true;

      }
    );

}

/* ==========================================
   UPDATE COINS
========================================== */

function updateCoins(delta){

  const move=
    speed*
    (turbo?1.65:1)*
    delta*
    .08;

  coinList.forEach(
    coin=>{

      coin.y+=move;

      coin.el.style.top=
        coin.y+"px";

      if(
        collision(
          player,
          coin.el
        )
      ){

        coins++;
        bank++;

        score+=50;

        coinsEl.textContent=
          coins;

        scoreEl.textContent=
          score;

        saveData();

        sound(850,.08,"sine");

        coin.el.remove();

        coin.collected=true;

      }

    }
  );

  coinList=
    coinList.filter(
      coin=>{

        if(
          coin.collected ||
          coin.y>
          innerHeight+50
        ){

          if(coin.el.parentNode)
            coin.el.remove();

          return false;

        }

        return true;

      }
    );

}

/* ==========================================
   PLAYER MOVEMENT
========================================== */

function movePlayer(delta){

  if(!running || paused)return;

  const amount=
    5.5*
    delta;

  playerX+=
    direction*
    amount;

  const y=
    innerHeight-100;

  const bounds=
    roadBoundsAtY(y);

  const minX=
    bounds.left+35;

  const maxX=
    bounds.right-35;

  playerX=
    Math.max(
      minX,
      Math.min(
        maxX,
        playerX
      )
    );

  updatePlayer();

}

/* ==========================================
   GAME LOOP
========================================== */

function loop(time){

  const delta=
    Math.min(
      40,
      time-lastTime
    );

  lastTime=time;

  if(
    running &&
    !paused
  ){

    movePlayer(delta);

    updateRoad(delta);

    updateEnemies(delta);

    updateCoins(delta);

    enemyTimer+=delta;
    coinTimer+=delta;

    if(
      enemyTimer>
      Math.max(
        550,
        1250-
        score*.5
      )
    ){

      createEnemy();

      enemyTimer=0;

    }

    if(
      coinTimer>850
    ){

      createCoin();

      coinTimer=0;

    }

    score+=
      delta*.012;

    scoreEl.textContent=
      Math.floor(score);

    speed=
      5+
      Math.min(
        9,
        score/900
      );

    if(turbo){

      nitro-=
        delta*.025;

      if(nitro<=0){

        nitro=0;
        turbo=false;

      }

    }else{

      nitro+=
        delta*.007;

      if(nitro>100)
        nitro=100;

    }

    nitroFill.style.width=
      nitro+"%";

    speedEl.textContent=
      Math.floor(
        speed*
        (turbo?1.8:1)*
        12
      );

  }

  requestAnimationFrame(loop);

}

/* ==========================================
   START GAME
========================================== */

function prepareGame(){

  enemies.forEach(
    e=>e.el.remove()
  );

  coinList.forEach(
    c=>c.el.remove()
  );

  enemies=[];
  coinList=[];

  score=0;
  coins=0;
  lives=3;
  speed=5;
  nitro=100;

  scoreEl.textContent="0";
  coinsEl.textContent="0";
  livesEl.textContent="3";
  speedEl.textContent="60";

  nitroFill.style.width="100%";

  playerX=
    innerWidth/2;

  direction=0;

  updatePlayer();

  createRoadLines();

}

function startGame(){

  startAudio();

  prepareGame();

  menuScreen.classList.add("hidden");
  garageScreen.classList.add("hidden");
  startScreen.classList.add("hidden");
  pauseScreen.classList.add("hidden");
  gameOver.classList.add("hidden");

  running=true;
  paused=false;

  lastTime=
    performance.now();

  weather();

}

/* ==========================================
   END GAME
========================================== */

function endGame(){

  running=false;
  paused=false;

  const final=
    Math.floor(score);

  if(final>best){

    best=final;

    localStorage.setItem(
      "turboBest",
      best
    );

  }

  bank+=coins;

  saveData();

  document.getElementById(
    "finalScore"
  ).textContent=final;

  document.getElementById(
    "finalCoins"
  ).textContent=coins;

  document.getElementById(
    "bestScore"
  ).textContent=best;

  gameOver.classList.remove(
    "hidden"
  );

}

/* ==========================================
   PAUSE
========================================== */

function togglePause(){

  if(!running)return;

  paused=!paused;

  if(paused){

    pauseScreen.classList.remove(
      "hidden"
    );

  }else{

    pauseScreen.classList.add(
      "hidden"
    );

  }

}

/* ==========================================
   WEATHER
========================================== */

function weather(){

  const night=
    Math.random()<.35;

  const rain=
    Math.random()<.22;

  const sky=
    document.getElementById("sky");

  const sun=
    document.getElementById("sun");

  const moon=
    document.getElementById("moon");

  const stars=
    document.querySelector(".stars");

  const rainEl=
    document.getElementById("rain");

  if(night){

    sky.style.background=
      "linear-gradient(#02040b,#111c30)";

    sun.style.display="none";
    moon.style.display="block";
    stars.style.opacity="1";

  }else{

    sky.style.background=
      "linear-gradient(#06152a,#316889,#e38a4b)";

    sun.style.display="block";
    moon.style.display="none";
    stars.style.opacity="0";

  }

  rainEl.style.display=
    rain ? "block" : "none";

}

/* ==========================================
   GARAGE
========================================== */

function renderGarage(){

  const grid=
    document.getElementById(
      "garageGrid"
    );

  grid.innerHTML="";

  Object.entries(cars)
  .forEach(
    ([id,car])=>{

      const card=
        document.createElement("div");

      card.className="carCard";

      const preview=
        document.createElement("div");

      preview.className=
        "carPreview";

      preview.innerHTML=`
        <div class="enemy ${car.color}"
             style="
               width:45px;
               height:70px;
               left:50%;
               transform:translateX(-50%);
             ">
          <div class="enemyGlass"></div>
        </div>
      `;

      const name=
        document.createElement("div");

      name.className="carName";
      name.textContent=
        car.name;

      const price=
        document.createElement("div");

      price.className="carPrice";

      if(car.price===0){

        price.textContent=
          "BAŞLANGIÇ ARABASI";

      }else{

        price.textContent=
          "🪙 "+car.price;

      }

      const btn=
        document.createElement("button");

      btn.className="carBtn";

      if(selected===id){

        btn.textContent=
          "✓ SEÇİLİ";

        btn.disabled=true;

      }else if(
        owned.includes(id)
      ){

        btn.textContent=
          "SEÇ";

        btn.onclick=()=>{

          selected=id;

          localStorage.setItem(
            "turboSelected",
            selected
          );

          renderGarage();

          sound(600,.1);

        };

      }else{

        btn.textContent=
          "🪙 SATIN AL";

        if(bank<car.price){

          btn.classList.add(
            "locked"
          );

          btn.textContent=
            "🔒 YETERSİZ";

        }else{

          btn.onclick=()=>{

            bank-=car.price;

            owned.push(id);

            selected=id;

            saveData();

            renderGarage();

            sound(
              1000,
              .15
            );

          };

        }

      }

      card.appendChild(preview);
      card.appendChild(name);
      card.appendChild(price);
      card.appendChild(btn);

      grid.appendChild(card);

    }
  );

  document.getElementById(
    "garageMoney"
  ).textContent=bank;

}

/* ==========================================
   SAVE
========================================== */

function saveData(){

  localStorage.setItem(
    "turboMoney",
    bank
  );

  localStorage.setItem(
    "turboOwned",
    JSON.stringify(owned)
  );

  localStorage.setItem(
    "turboSelected",
    selected
  );

  localStorage.setItem(
    "turboSound",
    soundOn ?
      "on" :
      "off"
  );

  document.getElementById(
    "menuMoney"
  ).textContent=bank;

}

/* ==========================================
   SOUND BUTTON
========================================== */

function updateSoundButton(){

  document.getElementById(
    "soundBtn"
  ).textContent=
    soundOn ?
      "🔊" :
      "🔇";

}

document.getElementById(
  "soundBtn"
).onclick=()=>{

  soundOn=!soundOn;

  saveData();

  updateSoundButton();

  if(soundOn){

    startAudio();
    sound(700,.1);

  }

};

/* ==========================================
   BUTTONS
========================================== */

document.getElementById(
  "playBtn"
).onclick=()=>{

  startAudio();

  menuScreen.classList.add(
    "hidden"
  );

  startScreen.classList.remove(
    "hidden"
  );

};

document.getElementById(
  "startRaceBtn"
).onclick=()=>{
  startGame();
};

document.getElementById(
  "startBackBtn"
).onclick=()=>{

  startScreen.classList.add(
    "hidden"
  );

  menuScreen.classList.remove(
    "hidden"
  );

};

document.getElementById(
  "garageBtn"
).onclick=()=>{

  menuScreen.classList.add(
    "hidden"
  );

  garageScreen.classList.remove(
    "hidden"
  );

  renderGarage();

};

document.getElementById(
  "backGarage"
).onclick=()=>{

  garageScreen.classList.add(
    "hidden"
  );

  menuScreen.classList.remove(
    "hidden"
  );

  saveData();

};

document.getElementById(
  "pauseBtn"
).onclick=()=>{
  togglePause();
};

document.getElementById(
  "continueBtn"
).onclick=()=>{
  togglePause();
};

document.getElementById(
  "pauseMenuBtn"
).onclick=()=>{

  running=false;
  paused=false;

  pauseScreen.classList.add(
    "hidden"
  );

  menuScreen.classList.remove(
    "hidden"
  );

};

document.getElementById(
  "restartBtn"
).onclick=()=>{
  startGame();
};

document.getElementById(
  "gameMenuBtn"
).onclick=()=>{

  gameOver.classList.add(
    "hidden"
  );

  menuScreen.classList.remove(
    "hidden"
  );

  saveData();

};

/* ==========================================
   RESIZE
========================================== */

window.addEventListener(
  "resize",
  ()=>{

    if(!running){

      playerX=
        innerWidth/2;

    }

    updatePlayer();

  }
);

/* ==========================================
   INIT
========================================== */

createCity();
createRoadLines();
saveData();
updateSoundButton();

requestAnimationFrame(
  loop
);

</script>

</body>
</html>
