<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#080b10}
button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

#game{
 width:100vw;height:100vh;position:relative;overflow:hidden;
 background:linear-gradient(#58a5d0,#d98b50 55%,#242424 56%);
 touch-action:none;
}

/* SKY */
#sky{
 position:absolute;inset:0;
 background:linear-gradient(#58a5d0,#d98b50);
 transition:.4s;
}
#sun{
 position:absolute;width:65px;height:65px;border-radius:50%;
 right:12%;top:10%;background:#fff1a0;
 box-shadow:0 0 40px #ffd15a;
}
#moon{
 display:none;position:absolute;width:58px;height:58px;
 right:13%;top:10%;border-radius:50%;background:#eee;
 box-shadow:0 0 30px white;
}
.stars{display:none;position:absolute;inset:0}
.star{
 position:absolute;width:3px;height:3px;background:white;border-radius:50%;
}

/* CITY */
#city{
 position:absolute;bottom:40%;left:0;width:100%;height:20%;
 display:flex;align-items:flex-end;gap:4px;overflow:hidden;
}
.building{
 min-width:38px;background:#15202b;position:relative;
 border-top:2px solid #324251;
}
.win{
 position:absolute;width:5px;height:7px;background:#ffd85a;
 box-shadow:0 0 5px #ffd85a;
}

/* ROAD */
#road{
 position:absolute;left:6%;right:6%;top:0;bottom:0;
 background:#242424;
 clip-path:polygon(39% 0,61% 0,96% 100%,4% 100%);
 overflow:hidden;
}
.roadEdge{
 position:absolute;top:0;bottom:0;width:5px;background:white;
 z-index:10;box-shadow:0 0 6px white;
}
.roadEdge.left{left:12%;transform:rotate(7deg)}
.roadEdge.right{right:12%;transform:rotate(-7deg)}
.line{
 position:absolute;width:7px;height:90px;background:white;
 border-radius:5px;left:50%;transform:translateX(-50%);
}

/* HUD */
#hud{
 position:absolute;z-index:80;top:8px;left:8px;right:8px;
 display:flex;justify-content:space-between;gap:4px;
}
.hud{
 color:white;background:rgba(0,0,0,.6);padding:7px 8px;
 border-radius:10px;font-size:12px;font-weight:bold;
}

/* PLAYER */
#player{
 position:absolute;width:76px;height:125px;
 left:50%;bottom:58px;z-index:50;
 transform:translateX(-50%);
}
.body{
 position:absolute;left:6px;top:10px;width:64px;height:108px;
 border-radius:17px 17px 9px 9px;
 background:linear-gradient(90deg,#650000,#d90000,#ff3030,#c00000,#600);
 border:2px solid #300;
}
.hood{
 position:absolute;left:10px;top:4px;width:56px;height:45px;
 border-radius:18px 18px 7px 7px;
 background:linear-gradient(90deg,#850000,#ef1717,#ff4141,#a00000);
}
.glass{
 position:absolute;left:13px;top:36px;width:48px;height:30px;
 border-radius:10px 10px 3px 3px;
 background:linear-gradient(135deg,#d9f8ff,#28536b,#07121c);
 border:2px solid #111;
}
.divider{
 position:absolute;left:36px;top:37px;width:3px;height:27px;background:#111;
}
.grille{
 position:absolute;left:13px;bottom:8px;width:48px;height:19px;
 background:#090909;border:2px solid #777;border-radius:3px;
}
.grille i{
 position:absolute;top:2px;bottom:2px;width:2px;background:#777;
}
.grille i:nth-child(1){left:8px}
.grille i:nth-child(2){left:17px}
.grille i:nth-child(3){left:26px}
.grille i:nth-child(4){left:35px}
.light{
 position:absolute;width:12px;height:9px;bottom:11px;
 border-radius:50%;background:white;box-shadow:0 0 13px white;
}
.light.l{left:9px}.light.r{right:9px}
.bumper{
 position:absolute;left:9px;bottom:3px;width:56px;height:7px;
 background:linear-gradient(#eee,#777);border-radius:3px;
}
.wheel{
 position:absolute;width:12px;height:32px;background:#050505;
 border-radius:5px;box-shadow:inset 0 0 0 2px #333;
}
.w1{left:-1px;top:26px}.w2{left:-1px;bottom:22px}
.w3{right:-1px;top:26px}.w4{right:-1px;bottom:22px}
#flame{
 display:none;position:absolute;left:25px;bottom:-42px;width:26px;height:48px;
 background:linear-gradient(#fff,#36dfff,#0755ff);
 clip-path:polygon(25% 0,75% 0,100% 100%,50% 75%,0 100%);
 filter:drop-shadow(0 0 10px #00aaff);
}

/* TRAFFIC */
.enemy{
 position:absolute;width:55px;height:90px;border-radius:13px;
 z-index:35;box-shadow:0 5px 10px #000;
}
.enemy.red{background:linear-gradient(90deg,#600,#f33,#700)}
.enemy.blue{background:linear-gradient(90deg,#034,#39f,#034)}
.enemy.yellow{background:linear-gradient(90deg,#765,#fd2,#765)}
.enemy.green{background:linear-gradient(90deg,#063,#1b6,#063)}
.enemy:before{
 content:"";position:absolute;left:8px;top:12px;width:39px;height:28px;
 border-radius:8px;background:linear-gradient(135deg,#dff,#174050);
}

/* COIN */
.coin{
 position:absolute;width:27px;height:27px;border-radius:50%;z-index:34;
 background:radial-gradient(circle,#fff,#ffd000 45%,#996000);
 border:2px solid #fff1a0;box-shadow:0 0 14px #ffd000;
}

/* NITRO */
#nitro{
 position:absolute;left:10px;bottom:15px;z-index:90;width:150px;
 color:white;font-size:11px;font-weight:bold;
}
#bar{height:14px;background:#111;border:1px solid #777;border-radius:10px;overflow:hidden}
#fill{height:100%;width:100%;background:linear-gradient(90deg,#00aaff,#5757ff)}

/* CONTROLS */
.touch{
 position:absolute;top:0;bottom:0;width:50%;z-index:40;
}
#left{left:0}#right{right:0}
#pause{
 position:absolute;z-index:100;right:10px;top:52px;
 padding:9px 13px;border-radius:10px;
 background:rgba(0,0,0,.7);color:white;font-size:18px;
}

/* SCREENS */
.screen{
 position:absolute;inset:0;z-index:200;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;color:white;background:rgba(0,0,0,.88);padding:20px;
}
.screen h1{
 font-size:36px;margin-bottom:12px;text-shadow:0 0 18px #f30;
}
.screen p{color:#ddd;line-height:1.6;margin-bottom:15px}
.btn{
 width:min(320px,90%);padding:14px;margin:5px;border-radius:13px;
 color:white;font-size:17px;font-weight:bold;
 background:linear-gradient(135deg,#d40000,#ff6400);
}
.btn.dark{background:linear-gradient(135deg,#222,#555)}
.hidden{display:none!important}

/* GARAGE */
.cards{
 display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
 max-width:500px;max-height:62vh;overflow:auto;
}
.card{
 width:140px;padding:10px;background:#1c1c1c;border-radius:14px;
 border:1px solid #555;
}
.preview{
 width:45px;height:70px;margin:5px auto;border-radius:12px;
}
.card h3{font-size:14px;margin:5px}
.card small{display:block;margin:4px;color:#bbb}
.card button{
 padding:8px 12px;border-radius:8px;color:white;background:#e22;
 font-weight:bold;
}
.card button.ok{background:#168c4a}

/* TRACK */
.tracks{
 display:grid;grid-template-columns:1fr 1fr;gap:8px;
 width:min(350px,90%);
}
.track{
 padding:15px;background:#222;color:white;border:1px solid #666;
 border-radius:12px;
}
.track.selected{border:2px solid #ff4b00;background:#512000}

/* SETTINGS */
.setting{
 width:min(350px,90%);padding:14px;margin:6px;
 border-radius:12px;background:#222;
 display:flex;justify-content:space-between;align-items:center;
}
.toggle{
 padding:9px 15px;border-radius:9px;color:white;background:#777;
}
.toggle.on{background:#159447}

@media(max-width:380px){
 .hud{font-size:10px;padding:6px}
 .screen h1{font-size:29px}
}
</style>
</head>

<body>

<div id="game">

<div id="sky">
 <div id="sun"></div>
 <div id="moon"></div>
 <div class="stars">
  <i class="star" style="left:10%;top:15%"></i>
  <i class="star" style="left:25%;top:8%"></i>
  <i class="star" style="left:42%;top:20%"></i>
  <i class="star" style="left:65%;top:12%"></i>
  <i class="star" style="left:82%;top:22%"></i>
 </div>
</div>

<div id="city"></div>
<div id="road"></div>
<div class="roadEdge left"></div>
<div class="roadEdge right"></div>

<div id="hud">
 <div class="hud">🏆 <span id="score">0</span></div>
 <div class="hud">🪙 <span id="coins">0</span></div>
 <div class="hud">❤️ <span id="lives">3</span></div>
 <div class="hud">⚡ <span id="kmh">0</span></div>
</div>

<button id="pause">Ⅱ</button>

<div id="player">
 <div class="body"></div>
 <div class="hood"></div>
 <div class="glass"></div>
 <div class="divider"></div>
 <div class="light l"></div>
 <div class="light r"></div>
 <div class="grille"><i></i><i></i><i></i><i></i></div>
 <div class="bumper"></div>
 <div class="wheel w1"></div>
 <div class="wheel w2"></div>
 <div class="wheel w3"></div>
 <div class="wheel w4"></div>
 <div id="flame"></div>
</div>

<div id="nitro">
 🔥 NİTRO
 <div id="bar"><div id="fill"></div></div>
</div>

<div id="left" class="touch"></div>
<div id="right" class="touch"></div>

<!-- MENU -->
<div id="menu" class="screen">

 <h1>🏎️ TURBO ROAD</h1>

 <p>
  <b>1969 MUSTANG EDITION</b><br>
  Trafiği geç • Coin topla • Arabalarını geliştir
 </p>

 <p>🪙 Banka: <b id="bank">0</b></p>

 <button class="btn" id="start">🚦 YARIŞA BAŞLA</button>
 <button class="btn" id="garage">🏎️ GARAJ</button>
 <button class="btn" id="tracksBtn">🛣️ PİST SEÇ</button>
 <button class="btn" id="settings">⚙️ AYARLAR</button>

</div>

<!-- GARAGE -->
<div id="garageScreen" class="screen hidden">

 <h1>🏎️ GARAJ</h1>
 <p>🪙 Coin: <b id="garageBank">0</b></p>

 <div id="cards" class="cards"></div>

 <button class="btn dark" id="garageBack">↩ MENÜ</button>

</div>

<!-- TRACKS -->
<div id="trackScreen" class="screen hidden">

 <h1>🛣️ PİST SEÇ</h1>

 <div class="tracks">
  <button class="track" data-track="city">🌆<br>ŞEHİR</button>
  <button class="track" data-track="desert">🏜️<br>ÇÖL</button>
  <button class="track" data-track="night">🌙<br>GECE</button>
  <button class="track" data-track="rain">🌧️<br>YAĞMUR</button>
 </div>

 <button class="btn dark" id="trackBack">↩ MENÜ</button>

</div>

<!-- SETTINGS -->
<div id="settingsScreen" class="screen hidden">

 <h1>⚙️ AYARLAR</h1>

 <div class="setting">
  🔊 Ses
  <button id="sound" class="toggle">KAPALI</button>
 </div>

 <div class="setting">
  📳 Titreşim
  <button id="vibration" class="toggle">KAPALI</button>
 </div>

 <button class="btn dark" id="settingsBack">↩ MENÜ</button>

</div>

<!-- PAUSE -->
<div id="pauseScreen" class="screen hidden">
 <h1>⏸️ DURAKLATILDI</h1>
 <button class="btn" id="resume">▶ DEVAM ET</button>
 <button class="btn dark" id="pauseMenu">🏠 MENÜ</button>
</div>

<!-- GAME OVER -->
<div id="over" class="screen hidden">

 <h1>💥 KAZA!</h1>

 <p>
  🏆 Skor: <b id="finalScore">0</b><br>
  🪙 Kazandığın Coin: <b id="finalCoins">0</b><br>
  🥇 Rekor: <b id="best">0</b>
 </p>

 <button class="btn" id="again">🔄 TEKRAR OYNA</button>
 <button class="btn dark" id="overMenu">🏠 MENÜ</button>

</div>

</div>

<script>
"use strict";

/* =========================
   TURBO ROAD
========================= */

const $=id=>document.getElementById(id);

let running=false;
let paused=false;
let direction=0;
let turbo=false;

let playerX=innerWidth/2;

let score=0;
let coins=0;
let lives=3;
let nitro=100;

let enemies=[];
let coinItems=[];
let roadLines=[];

let enemyCounter=0;
let coinCounter=0;

let bankCoins=Number(localStorage.getItem("turboBank")||0);
let bestScore=Number(localStorage.getItem("turboBest")||0);

let selectedCar=localStorage.getItem("turboCar")||"mustang";
let selectedTrack=localStorage.getItem("turboTrack")||"city";

let soundOn=localStorage.getItem("turboSound")==="on";
let vibrationOn=localStorage.getItem("turboVibration")==="on";

let audio=null;

/* CARS */
const cars={
 mustang:{name:"1969 Mustang",price:0,color:"red",mult:1},
 blue:{name:"Blue Racer",price:100,color:"blue",mult:1.12},
 yellow:{name:"Golden GT",price:250,color:"yellow",mult:1.25},
 green:{name:"Green Beast",price:500,color:"green",mult:1.4},
 black:{name:"Black Thunder",price:1000,color:"black",mult:1.6}
};

/* TRACKS */
const trackData={
 city:{sky:"linear-gradient(#58a5d0,#d98b50)",speed:1},
 desert:{sky:"linear-gradient(#7c3d18,#f1a04c)",speed:1.15},
 night:{sky:"linear-gradient(#02040c,#101d38)",speed:1.05},
 rain:{sky:"linear-gradient(#26343e,#53616a)",speed:1.2}
};

/* AUDIO */
function initAudio(){

 if(!soundOn)return;

 try{
  if(!audio)
   audio=new (window.AudioContext||window.webkitAudioContext)();

  if(audio.state==="suspended")audio.resume();
 }catch(e){}
}

function beep(freq=500,duration=.08){

 if(!soundOn||!audio)return;

 try{
  const o=audio.createOscillator();
  const g=audio.createGain();

  o.frequency.value=freq;
  o.type="sine";

  g.gain.setValueAtTime(.035,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(
   .001,audio.currentTime+duration
  );

  o.connect(g);
  g.connect(audio.destination);

  o.start();
  o.stop(audio.currentTime+duration);
 }catch(e){}
}

/* SCREEN */
function show(id){

 document.querySelectorAll(".screen")
  .forEach(s=>s.classList.add("hidden"));

 $(id).classList.remove("hidden");
}

/* CITY */
function makeCity(){

 $("city").innerHTML="";

 for(let i=0;i<32;i++){

  const b=document.createElement("div");

  b.className="building";
  b.style.height=(40+Math.random()*110)+"px";

  for(let j=0;j<6;j++){

   const w=document.createElement("i");

   w.className="win";
   w.style.left=(10+Math.random()*75)+"%";
   w.style.top=(10+Math.random()*75)+"%";

   b.appendChild(w);
  }

  $("city").appendChild(b);
 }
}

/* ROAD LINES */
function makeLines(){

 roadLines.forEach(x=>x.el.remove());
 roadLines=[];

 for(let i=0;i<14;i++){

  const el=document.createElement("div");

  el.className="line";
  el.style.top=(i*110-100)+"px";

  $("road").appendChild(el);

  roadLines.push({
   el:el,
   y:i*110-100
  });
 }
}

/* TRACK */
function applyTrack(){

 const t=trackData[selectedTrack];

 $("sky").style.background=t.sky;

 $("city").style.display=
  selectedTrack==="city"?"flex":"none";

 $("sun").style.display=
  selectedTrack==="night"?"none":"block";

 $("moon").style.display=
  selectedTrack==="night"?"block":"none";

 document.querySelector(".stars").style.display=
  selectedTrack==="night"?"block":"none";
}

/* CAR */
function applyCar(){

 const c=cars[selectedCar];

 let bg;

 if(c.color==="red")
  bg="linear-gradient(90deg,#650000,#d90000,#ff3030,#c00000,#600)";

 if(c.color==="blue")
  bg="linear-gradient(90deg,#02336e,#087cff,#42b2ff,#087cff,#02336e)";

 if(c.color==="yellow")
  bg="linear-gradient(90deg,#765000,#d99b00,#ffe13b,#d99b00,#765000)";

 if(c.color==="green")
  bg="linear-gradient(90deg,#063d25,#079b55,#24d97c,#079b55,#063d25)";

 if(c.color==="black")
  bg="linear-gradient(90deg,#050505,#222,#777,#222,#050505)";

 $("player").querySelector(".body").style.background=bg;
 $("player").querySelector(".hood").style.background=bg;
}

/* GARAGE */
function renderGarage(){

 $("garageBank").textContent=bankCoins;

 const box=$("cards");

 box.innerHTML="";

 Object.keys(cars).forEach(key=>{

  const c=cars[key];

  const owned=
   key==="mustang"||
   localStorage.getItem("owned_"+key)==="1";

  const selected=selectedCar===key;

  let color="#e22";

  if(c.color==="blue")color="#168cff";
  if(c.color==="yellow")color="#e6b900";
  if(c.color==="green")color="#159447";
  if(c.color==="black")color="#444";

  const card=document.createElement("div");

  card.className="card";

  card.innerHTML=`
   <div class="preview" style="background:${color}"></div>
   <h3>${c.name}</h3>
   <small>⚡ x${c.mult}</small>
   <button>
    ${selected?"SEÇİLDİ":
      owned?"SEÇ":"🪙 "+c.price}
   </button>
  `;

  const btn=card.querySelector("button");

  if(owned)btn.classList.add("ok");

  btn.onclick=()=>{

   if(owned){

    selectedCar=key;

    localStorage.setItem(
     "turboCar",
     selectedCar
    );

    applyCar();
    renderGarage();

    beep(800);

    return;
   }

   if(bankCoins<c.price){

    alert(
     "Yeterli coin yok! "+
     (c.price-bankCoins)+
     " coin daha gerekiyor."
    );

    return;
   }

   bankCoins-=c.price;

   localStorage.setItem(
    "turboBank",
    bankCoins
   );

   localStorage.setItem(
    "owned_"+key,
    "1"
   );

   selectedCar=key;

   localStorage.setItem(
    "turboCar",
    key
   );

   applyCar();
   renderGarage();

   beep(1000,.15);
  };

  box.appendChild(card);
 });
}

/* HUD */
function hud(){

 $("score").textContent=Math.floor(score);
 $("coins").textContent=coins;
 $("lives").textContent=lives;

 const base=
  120*cars[selectedCar].mult*
  trackData[selectedTrack].speed;

 $("kmh").textContent=
  Math.floor(turbo?base*1.6:base);
}

/* START */
function startGame(){

 initAudio();

 running=true;
 paused=false;
 direction=0;

 score=0;
 coins=0;
 lives=3;
 nitro=100;

 playerX=innerWidth/2;

 enemies.forEach(e=>e.el.remove());
 coinItems.forEach(c=>c.el.remove());

 enemies=[];
 coinItems=[];

 enemyCounter=0;
 coinCounter=0;

 applyCar();
 applyTrack();

 $("fill").style.width="100%";

 document.querySelectorAll(".screen")
  .forEach(s=>s.classList.add("hidden"));

 beep(600,.15);
}

/* CONTROL */
function move(dir){

 if(!running||paused)return;

 direction=dir;
}

function stop(){
 direction=0;
}

$("left").addEventListener("touchstart",e=>{
 e.preventDefault();
 move(-1);
},{passive:false});

$("right").addEventListener("touchstart",e=>{
 e.preventDefault();
 move(1);
},{passive:false});

game.addEventListener("touchend",()=>{
 stop();
},{passive:false});

game.addEventListener("mousedown",e=>{
 if(e.clientX<innerWidth/2)move(-1);
 else move(1);
});

game.addEventListener("mouseup",stop);

document.addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
  move(-1);

 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
  move(1);

 if(e.code==="Space")
  turbo=true;

 if(e.key==="Escape")
  togglePause();
});

document.addEventListener("keyup",e=>{

 if(
  e.key==="ArrowLeft"||
  e.key==="ArrowRight"||
  e.key.toLowerCase()==="a"||
  e.key.toLowerCase()==="d"
 )
  stop();

 if(e.code==="Space")
  turbo=false;
});

/* MOBILE NITRO:
   ekranın alt-orta bölgesine dokun */
game.addEventListener("touchstart",e=>{

 if(!running||paused)return;

 const t=e.touches[0];

 if(
  t.clientY>innerHeight*.78&&
  Math.abs(t.clientX-innerWidth/2)<70
 ){
  turbo=true;
  $("flame").style.display="block";
 }
},{passive:false});

game.addEventListener("touchend",()=>{
 turbo=false;
 $("flame").style.display="none";
});

/* ENEMY */
function spawnEnemy(){

 const el=document.createElement("div");

 const colors=["red","blue","yellow","green"];

 el.className=
  "enemy "+
  colors[Math.floor(Math.random()*colors.length)];

 const x=
  innerWidth*.15+
  Math.random()*
  Math.max(20,innerWidth*.7-55);

 el.style.left=x+"px";
 el.style.top="-100px";

 game.appendChild(el);

 enemies.push({
  el:el,
  y:-100,
  speed:.8+Math.random()*.5
 });
}

/* COIN */
function spawnCoin(){

 const el=document.createElement("div");

 el.className="coin";

 const x=
  innerWidth*.15+
  Math.random()*
  Math.max(20,innerWidth*.7-27);

 el.style.left=x+"px";
 el.style.top="-30px";

 game.appendChild(el);

 coinItems.push({
  el:el,
  y:-30
 });
}

/* COLLISION */
function hit(a,b){

 const r1=a.getBoundingClientRect();
 const r2=b.getBoundingClientRect();

 return !(
  r1.right<r2.left||
  r1.left>r2.right||
  r1.bottom<r2.top||
  r1.top>r2.bottom
 );
}

/* CRASH */
function crash(enemy){

 enemy.el.remove();

 enemies=enemies.filter(x=>x!==enemy);

 lives--;

 if(vibrationOn&&navigator.vibrate)
  navigator.vibrate([100,50,100]);

 $("game").style.background=
  "#600";

 setTimeout(()=>{
  $("game").style.background="";
 },100);

 beep(90,.3);

 if(lives<=0){
  endGame();
 }
}

/* END */
function endGame(){

 running=false;
 paused=false;
 direction=0;
 turbo=false;

 $("flame").style.display="none";

 if(score>bestScore){

  bestScore=Math.floor(score);

  localStorage.setItem(
   "turboBest",
   bestScore
  );
 }

 bankCoins+=coins;

 localStorage.setItem(
  "turboBank",
  bankCoins
 );

 $("finalScore").textContent=Math.floor(score);
 $("finalCoins").textContent=coins;
 $("best").textContent=bestScore;

 show("over");
}

/* PAUSE */
function togglePause(){

 if(!running)return;

 paused=!paused;

 if(paused)
  show("pauseScreen");
 else
  document.querySelectorAll(".screen")
   .forEach(s=>s.classList.add("hidden"));
}

/* UPDATE */
function update(){

 if(!running||paused)return;

 const trackSpeed=trackData[selectedTrack].speed;
 const carMult=cars[selectedCar].mult;

 let gameSpeed=
  4.5*trackSpeed*carMult;

 if(turbo&&nitro>0){

  gameSpeed*=1.6;
  nitro-=.9;

  $("flame").style.display="block";

 }else{

  nitro=Math.min(100,nitro+.12);

  $("flame").style.display="none";
 }

 if(nitro<=0)
  turbo=false;

 /* PLAYER */
 playerX+=direction*(5+gameSpeed*.35);

 playerX=Math.max(
  innerWidth*.12,
  Math.min(innerWidth*.88,playerX)
 );

 $("player").style.left=playerX+"px";

 $("player").style.transform=
  `translateX(-50%) rotate(${direction*8}deg)`;

 /* ROAD */
 roadLines.forEach(line=>{

  line.y+=gameSpeed*2;

  if(line.y>innerHeight+100)
   line.y=-110;

  line.el.style.top=line.y+"px";
 });

 /* ENEMIES */
 enemyCounter++;

 const spawn=
  selectedTrack==="rain"?42:
  selectedTrack==="night"?50:60;

 if(enemyCounter>spawn){

  spawnEnemy();
  enemyCounter=0;
 }

 enemies.slice().forEach(enemy=>{

  enemy.y+=gameSpeed*enemy.speed;

  enemy.el.style.top=enemy.y+"px";

  if(hit($("player"),enemy.el))
   crash(enemy);

  if(enemy.y>innerHeight+120){

   enemy.el.remove();

   enemies=enemies.filter(
    x=>x!==enemy
   );

   score+=10;
  }
 });

 /* COINS */
 coinCounter++;

 if(coinCounter>75){

  spawnCoin();
  coinCounter=0;
 }

 coinItems.slice().forEach(c=>{

  c.y+=gameSpeed*1.7;

  c.el.style.top=c.y+"px";

  if(hit($("player"),c.el)){

   coins++;
   score+=50;

   c.el.remove();

   coinItems=coinItems.filter(
    x=>x!==c
   );

   beep(900);
  }

  if(c.y>innerHeight+50){

   c.el.remove();

   coinItems=coinItems.filter(
    x=>x!==c
   );
  }
 });

 score+=.15;

 $("fill").style.width=nitro+"%";

 hud();
}

/* LOOP */
function loop(){

 update();

 requestAnimationFrame(loop);
}

/* BUTTONS */
$("start").onclick=startGame;

$("garage").onclick=()=>{
 renderGarage();
 show("garageScreen");
};

$("tracksBtn").onclick=()=>{
 show("trackScreen");
};

$("settings").onclick=()=>{

 $("sound").textContent=
  soundOn?"AÇIK":"KAPALI";

 $("sound").classList.toggle("on",soundOn);

 $("vibration").textContent=
  vibrationOn?"AÇIK":"KAPALI";

 $("vibration").classList.toggle("on",vibrationOn);

 show("settingsScreen");
};

$("garageBack").onclick=()=>{
 show("menu");
};

$("trackBack").onclick=()=>{
 show("menu");
};

$("settingsBack").onclick=()=>{
 show("menu");
};

/* TRACK BUTTONS */
document.querySelectorAll(".track")
.forEach(btn=>{

 btn.onclick=()=>{

  selectedTrack=btn.dataset.track;

  localStorage.setItem(
   "turboTrack",
   selectedTrack
  );

  document.querySelectorAll(".track")
   .forEach(x=>x.classList.remove("selected"));

  btn.classList.add("selected");

  applyTrack();

  beep(650);
 };
});

/* SOUND */
$("sound").onclick=()=>{

 soundOn=!soundOn;

 localStorage.setItem(
  "turboSound",
  soundOn?"on":"off"
 );

 $("sound").textContent=
  soundOn?"AÇIK":"KAPALI";

 $("sound").classList.toggle(
  "on",soundOn
 );

 if(soundOn)
  initAudio();
};

/* VIBRATION */
$("vibration").onclick=()=>{

 vibrationOn=!vibrationOn;

 localStorage.setItem(
  "turboVibration",
  vibrationOn?"on":"off"
 );

 $("vibration").textContent=
  vibrationOn?"AÇIK":"KAPALI";

 $("vibration").classList.toggle(
  "on",vibrationOn
 );
};

/* PAUSE */
$("pause").onclick=togglePause;

$("resume").onclick=togglePause;

$("pauseMenu").onclick=()=>{

 running=false;
 paused=false;

 enemies.forEach(e=>e.el.remove());
 coinItems.forEach(c=>c.el.remove());

 enemies=[];
 coinItems=[];

 show("menu");
};

/* GAME OVER */
$("again").onclick=startGame;

$("overMenu").onclick=()=>{

 $("bank").textContent=bankCoins;

 show("menu");
};

/* INITIAL */
makeCity();
makeLines();
applyCar();
applyTrack();

document.querySelectorAll(".track")
.forEach(btn=>{
 btn.classList.toggle(
  "selected",
  btn.dataset.track===selectedTrack
 );
});

$("bank").textContent=bankCoins;

loop();
</script>

</body>
