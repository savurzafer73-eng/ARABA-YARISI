<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road Ultimate</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

body{
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#111;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ================= HUD ================= */

#hud{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(94vw,520px);
  display:flex;
  justify-content:space-between;
  gap:6px;
  z-index:10;
  pointer-events:none;
}

.hudBox{
  min-width:90px;
  padding:8px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.62);
  color:white;
  text-align:center;
  border:1px solid rgba(255,255,255,.15);
}

.hudSmall{
  font-size:11px;
  opacity:.7;
}

.hudValue{
  font-size:20px;
  font-weight:bold;
}

/* ================= MENU ================= */

#menu{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(
    rgba(0,0,0,.42),
    rgba(0,0,0,.80)
  );
}

.menuPanel{
  width:min(90vw,400px);
  padding:28px;
  border-radius:24px;
  background:rgba(15,15,18,.95);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 70px rgba(0,0,0,.65);
  text-align:center;
  color:white;
}

.logo{
  font-size:34px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#ff3838;
}

.subtitle{
  color:#aaa;
  font-size:13px;
  margin:5px 0 25px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:#24242a;
  border:1px solid rgba(255,255,255,.12);
}

button:active{
  transform:scale(.97);
}

.startBtn{
  background:linear-gradient(135deg,#ff3030,#b80000);
}

.info{
  margin-top:18px;
  font-size:12px;
  line-height:1.6;
  color:#888;
}

/* ================= DİREKSİYON ================= */

.touchZone{
  position:absolute;
  bottom:0;
  width:50%;
  height:55%;
  z-index:8;
  touch-action:none;
}

#leftZone{
  left:0;
}

#rightZone{
  right:0;
}

.touchHint{
  position:absolute;
  bottom:25px;
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  pointer-events:none;
  font-size:25px;
  z-index:9;
}

#leftHint{
  left:25px;
}

#rightHint{
  right:25px;
}

/* ================= SES ================= */

#soundBtn{
  position:absolute;
  right:12px;
  bottom:15px;
  width:48px;
  height:48px;
  padding:0;
  margin:0;
  border-radius:50%;
  z-index:15;
  background:rgba(0,0,0,.6);
}

/* ================= GAME OVER ================= */

#gameOver{
  position:absolute;
  inset:0;
  z-index:25;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
}

.overPanel{
  width:min(88vw,360px);
  padding:28px;
  border-radius:22px;
  background:#151519;
  color:white;
  text-align:center;
}

.overPanel h2{
  font-size:30px;
}

.result{
  color:#bbb;
  margin:12px 0 18px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .hudBox{
    min-width:0;
    flex:1;
    padding:6px 4px;
  }

  .hudValue{
    font-size:16px;
  }

  .logo{
    font-size:29px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

  <div class="hudBox">
    <div class="hudSmall">HIZ</div>
    <div class="hudValue">
      <span id="speedText">0</span> KM/H
    </div>
  </div>

  <div class="hudBox">
    <div class="hudSmall">SKOR</div>
    <div class="hudValue" id="scoreText">0</div>
  </div>

  <div class="hudBox">
    <div class="hudSmall">ALTIN</div>
    <div class="hudValue">
      🪙 <span id="coinText">0</span>
    </div>
  </div>

</div>

<!-- SADECE BUNLAR DİREKSİYON İÇİN KULLANILIYOR -->
<div id="leftZone" class="touchZone"></div>
<div id="rightZone" class="touchZone"></div>

<div id="leftHint" class="touchHint">‹</div>
<div id="rightHint" class="touchHint">›</div>

<button id="soundBtn">🔊</button>

<!-- MENU -->

<div id="menu">

  <div class="menuPanel">

    <div class="logo">
      TURBO <span>ROAD</span>
    </div>

    <div class="subtitle">
      Ultimate Racing
    </div>

    <button class="startBtn" id="startBtn">
      🏁 YARIŞA BAŞLA
    </button>

    <button id="helpBtn">
      ℹ️ NASIL OYNANIR?
    </button>

    <div class="info">
      Telefonunda ekranın soluna basılı tut → SOLA<br>
      Telefonunda ekranın sağına basılı tut → SAĞA<br>
      Parmağını kaldır → DÜZEL<br>
      Bilgisayarda ← → kullan
    </div>

  </div>

</div>

<!-- GAME OVER -->

<div id="gameOver">

  <div class="overPanel">

    <h2>YARIŞ BİTTİ</h2>

    <div class="result">
      Skor: <b id="finalScore">0</b><br>
      Toplanan altın: <b id="finalCoins">0</b>
    </div>

    <button class="startBtn" id="restartBtn">
      🔄 TEKRAR OYNA
    </button>

    <button id="menuBtn">
      🏠 ANA MENÜ
    </button>

  </div>

</div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let W=0;
let H=0;

let DPR=
  Math.min(
    window.devicePixelRatio || 1,
    2
  );

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  if(!running){

    player.x=W/2;
    player.targetX=W/2;
    player.y=H*.78;
  }
}

window.addEventListener(
  "resize",
  resize
);

resize();

/* =========================================================
   OYUN
========================================================= */

let running=false;
let lastTime=0;

let score=0;
let coins=0;

let speed=0;
let targetSpeed=0;

let roadOffset=0;

/* =========================================================
   DİREKSİYON
========================================================= */

/*
   steering:
   -1 = SOL
    0 = DÜZ
    1 = SAĞ
*/

let steering=0;

let touchLeft=false;
let touchRight=false;

let keyboardLeft=false;
let keyboardRight=false;

/*
   Dokunmatik ve klavye aynı anda çalışabilir.
*/

function calculateSteering(){

  if(keyboardLeft && !keyboardRight){
    steering=-1;
    return;
  }

  if(keyboardRight && !keyboardLeft){
    steering=1;
    return;
  }

  if(touchLeft && !touchRight){
    steering=-1;
    return;
  }

  if(touchRight && !touchLeft){
    steering=1;
    return;
  }

  steering=0;
}

/* =========================================================
   OYUNCU
========================================================= */

const player={

  x:0,
  y:0,

  width:54,
  height:105,

  targetX:0,

  color:"#e51f28",

  tilt:0
};

/* =========================================================
   TRAFİK
========================================================= */

let traffic=[];

let spawnTimer=0;

const trafficColors=[
  "#eeeeee",
  "#1769aa",
  "#f39c12",
  "#20252b",
  "#38a169",
  "#8e44ad",
  "#d35400"
];

/* =========================================================
   ALTIN
========================================================= */

let coinObjects=[];

let coinTimer=0;

/* =========================================================
   SES
========================================================= */

let audioCtx=null;
let engineOsc=null;
let engineGain=null;
let engineFilter=null;

let audioStarted=false;
let soundEnabled=true;

function initAudio(){

  if(audioStarted || !soundEnabled)
    return;

  try{

    audioCtx=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    engineOsc=
      audioCtx.createOscillator();

    engineGain=
      audioCtx.createGain();

    engineFilter=
      audioCtx.createBiquadFilter();

    engineOsc.type="sawtooth";

    engineFilter.type="lowpass";

    engineFilter.frequency.value=600;

    engineGain.gain.value=0;

    engineOsc
      .connect(engineFilter);

    engineFilter
      .connect(engineGain);

    engineGain
      .connect(audioCtx.destination);

    engineOsc.start();

    audioStarted=true;

  }catch(e){
    console.log(e);
  }
}

function updateEngineSound(){

  if(
    !audioStarted ||
    !audioCtx ||
    !soundEnabled
  )
    return;

  const now=
    audioCtx.currentTime;

  const normalized=
    Math.max(
      0,
      Math.min(
        1,
        speed/220
      )
    );

  /*
     Motor devri hızla birlikte yükseliyor.
  */

  const frequency=
    55+
    normalized*210;

  engineOsc.frequency
    .setTargetAtTime(
      frequency,
      now,
      .05
    );

  engineFilter.frequency
    .setTargetAtTime(
      450+
      normalized*1900,
      now,
      .06
    );

  const volume=
    running
      ?
      .008+
      normalized*.045
      :
      0;

  engineGain.gain
    .setTargetAtTime(
      volume,
      now,
      .08
    );
}

function collisionSound(){

  if(!soundEnabled)
    return;

  initAudio();

  if(!audioCtx)
    return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(
    120,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    40,
    audioCtx.currentTime+.25
  );

  gain.gain.setValueAtTime(
    .16,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.28
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime+.3
  );
}

function coinSound(){

  if(!soundEnabled)
    return;

  initAudio();

  if(!audioCtx)
    return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    600,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    1050,
    audioCtx.currentTime+.1
  );

  gain.gain.setValueAtTime(
    .08,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.18
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime+.2
  );
}

/* =========================================================
   YOL
========================================================= */

function roadWidthAt(y){

  const horizon=H*.20;

  const p=
    Math.max(
      0,
      Math.min(
        1,
        (y-horizon)/
        (H-horizon)
      )
    );

  return W*
    (.25+
     .70*p);
}

function roadCenterAt(y){

  const horizon=H*.20;

  const p=
    Math.max(
      0,
      Math.min(
        1,
        (y-horizon)/
        (H-horizon)
      )
    );

  return W/2+
    Math.sin(
      roadOffset*.00035
    )*
    W*.035*
    p*p;
}

/* =========================================================
   ARKA PLAN
========================================================= */

function drawBackground(){

  const sky=
    ctx.createLinearGradient(
      0,0,0,H*.55
    );

  sky.addColorStop(
    0,
    "#6eb6e8"
  );

  sky.addColorStop(
    .55,
    "#b9def2"
  );

  sky.addColorStop(
    1,
    "#dce8e9"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,W,H
  );

  /* Güneş */

  ctx.beginPath();

  ctx.arc(
    W*.78,
    H*.13,
    34,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,240,180,.9)";

  ctx.fill();

  /* Dağlar */

  ctx.fillStyle="#76938d";

  ctx.beginPath();

  ctx.moveTo(0,H*.36);

  ctx.lineTo(
    W*.12,
    H*.22
  );

  ctx.lineTo(
    W*.22,
    H*.34
  );

  ctx.lineTo(
    W*.36,
    H*.18
  );

  ctx.lineTo(
    W*.52,
    H*.34
  );

  ctx.lineTo(
    W*.68,
    H*.21
  );

  ctx.lineTo(
    W*.84,
    H*.34
  );

  ctx.lineTo(
    W,
    H*.22
  );

  ctx.lineTo(
    W,
    H*.48
  );

  ctx.lineTo(
    0,
    H*.48
  );

  ctx.closePath();

  ctx.fill();

  /* Çimen */

  ctx.fillStyle="#3c613c";

  ctx.fillRect(
    0,
    H*.35,
    W,
    H*.65
  );
}

/* =========================================================
   YOL
========================================================= */

function drawRoad(){

  const horizon=H*.20;

  const topCenter=
    roadCenterAt(horizon);

  const bottomCenter=
    roadCenterAt(H);

  const topWidth=
    roadWidthAt(horizon);

  const bottomWidth=
    roadWidthAt(H);

  /* Yol */

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.closePath();

  ctx.fillStyle="#33343a";

  ctx.fill();

  /* Kenarlar */

  ctx.strokeStyle="#eeeeee";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.stroke();

  /* Şeritler */

  const gap=85;
  const length=42;

  for(
    let lane=1;
    lane<3;
    lane++
  ){

    for(
      let y=
        horizon+
        ((roadOffset*1.2)%gap)-
        gap;

      y<H;

      y+=gap
    ){

      const y2=y+length;

      if(y2<horizon)
        continue;

      const c1=
        roadCenterAt(y);

      const c2=
        roadCenterAt(y2);

      const w1=
        roadWidthAt(y);

      const w2=
        roadWidthAt(y2);

      const x1=
        c1-w1/2+
        w1*(lane/3);

      const x2=
        c2-w2/2+
        w2*(lane/3);

      const p=
        Math.max(
          0,
          Math.min(
            1,
            (y-horizon)/
            (H-horizon)
          )
        );

      ctx.strokeStyle=
        "rgba(255,255,255,.72)";

      ctx.lineWidth=
        Math.max(
          1,
          4*p
        );

      ctx.beginPath();

      ctx.moveTo(
        x1,
        y
      );

      ctx.lineTo(
        x2,
        y2
      );

      ctx.stroke();
    }
  }
}

/* =========================================================
   YUVARLAK DİKDÖRTGEN
========================================================= */

function roundRect(
  ctx,
  x,
  y,
  w,
  h,
  r
){

  const rr=
    Math.min(
      r,
      Math.abs(w)/2,
      Math.abs(h)/2
    );

  ctx.beginPath();

  ctx.moveTo(
    x+rr,
    y
  );

  ctx.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    rr
  );

  ctx.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    rr
  );

  ctx.arcTo(
    x,
    y+h,
    x,
    y,
    rr
  );

  ctx.arcTo(
    x,
    y,
    x+w,
    y,
    rr
  );

  ctx.closePath();
}

/* =========================================================
   RENK
========================================================= */

function shadeColor(
  hex,
  amount
){

  let c=
    hex.replace("#","");

  let r=
    parseInt(
      c.substring(0,2),
      16
    );

  let g=
    parseInt(
      c.substring(2,4),
      16
    );

  let b=
    parseInt(
      c.substring(4,6),
      16
    );

  r=
    Math.max(
      0,
      Math.min(
        255,
        r+amount
      )
    );

  g=
    Math.max(
      0,
      Math.min(
        255,
        g+amount
      )
    );

  b=
    Math.max(
      0,
      Math.min(
        255,
        b+amount
      )
    );

  return "#"+
    r.toString(16).padStart(2,"0")+
    g.toString(16).padStart(2,"0")+
    b.toString(16).padStart(2,"0");
}

/* =========================================================
   ARABA
========================================================= */

function drawCar(
  x,
  y,
  w,
  h,
  color,
  isPlayer=false,
  tilt=0
){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(tilt);

  /* Gölge */

  ctx.fillStyle=
    "rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.48,
    w*.62,
    h*.13,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* Tekerlekler */

  ctx.fillStyle="#101010";

  const tw=w*.19;
  const th=h*.27;

  ctx.fillRect(
    -w*.57,
    -h*.30,
    tw,
    th
  );

  ctx.fillRect(
    w*.38,
    -h*.30,
    tw,
    th
  );

  ctx.fillRect(
    -w*.57,
    h*.12,
    tw,
    th
  );

  ctx.fillRect(
    w*.38,
    h*.12,
    tw,
    th
  );

  /* Gövde */

  const grad=
    ctx.createLinearGradient(
      -w/2,
      0,
      w/2,
      0
    );

  grad.addColorStop(
    0,
    shadeColor(color,-25)
  );

  grad.addColorStop(
    .5,
    color
  );

  grad.addColorStop(
    1,
    shadeColor(color,20)
  );

  ctx.fillStyle=grad;

  roundRect(
    ctx,
    -w/2,
    -h/2,
    w,
    h,
    w*.18
  );

  ctx.fill();

  /* Kaput */

  ctx.fillStyle=
    shadeColor(color,12);

  roundRect(
    ctx,
    -w*.39,
    -h*.40,
    w*.78,
    h*.24,
    w*.08
  );

  ctx.fill();

  /* Ön cam */

  ctx.fillStyle="#1c3039";

  roundRect(
    ctx,
    -w*.31,
    -h*.23,
    w*.62,
    h*.25,
    w*.08
  );

  ctx.fill();

  /* Arka cam */

  ctx.fillStyle="#16242b";

  roundRect(
    ctx,
    -w*.30,
    h*.07,
    w*.60,
    h*.20,
    w*.06
  );

  ctx.fill();

  /* Farlar */

  ctx.fillStyle="#fff3b0";

  roundRect(
    ctx,
    -w*.35,
    -h*.45,
    w*.22,
    h*.07,
    w*.025
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.13,
    -h*.45,
    w*.22,
    h*.07,
    w*.025
  );

  ctx.fill();

  /* Stoplar */

  ctx.fillStyle="#ff3030";

  ctx.fillRect(
    -w*.33,
    h*.39,
    w*.20,
    h*.055
  );

  ctx.fillRect(
    w*.13,
    h*.39,
    w*.20,
    h*.055
  );

  /* Mustang yazısı */

  if(isPlayer){

    ctx.fillStyle="#111";

    roundRect(
      ctx,
      -w*.28,
      -h*.48,
      w*.56,
      h*.07,
      w*.02
    );

    ctx.fill();

    ctx.fillStyle=
      "rgba(255,255,255,.75)";

    ctx.font=
      `bold ${Math.max(
        7,
        w*.13
      )}px Arial`;

    ctx.textAlign="center";

    ctx.fillText(
      "MUSTANG",
      0,
      h*.02
    );
  }

  ctx.restore();
}

/* =========================================================
   TRAFİK OLUŞTUR
========================================================= */

function spawnTraffic(){

  /*
     Trafik doğrudan ufuktan başlıyor.
     Gökten düşme efekti yok.
  */

  const lane=
    Math.floor(
      Math.random()*3
    );

  traffic.push({

    lane,

    progress:0,

    speed:
      .20+
      Math.random()*.13,

    width:42,
    height:80,

    color:
      trafficColors[
        Math.floor(
          Math.random()*
          trafficColors.length
        )
      ]
  });
}

/* =========================================================
   TRAFİK GÜNCELLE
========================================================= */

function updateTraffic(dt){

  for(
    let i=traffic.length-1;
    i>=0;
    i--
  ){

    const car=traffic[i];

    car.progress+=
      dt*
      car.speed*
      (.65+
       speed/180);

    if(car.progress>1.15){

      traffic.splice(i,1);

      score+=10;

      continue;
    }

    const p=
      Math.max(
        0,
        Math.min(
          1,
          car.progress
        )
      );

    car.y=
      H*.20+
      p*(H*.87);

    const roadW=
      roadWidthAt(car.y);

    const center=
      roadCenterAt(car.y);

    const laneW=
      roadW/3;

    car.x=
      center-
      roadW/2+
      laneW*
      (car.lane+.5);

    const scale=
      .35+
      p*.75;

    car.drawW=
      car.width*
      scale;

    car.drawH=
      car.height*
      scale;
  }
}

/* =========================================================
   ALTIN OLUŞTUR
========================================================= */

function spawnCoin(){

  const lane=
    Math.floor(
      Math.random()*3
    );

  coinObjects.push({

    lane,

    progress:0,

    spin:
      Math.random()*
      Math.PI*2
  });
}

/* =========================================================
   ALTIN GÜNCELLE
========================================================= */

function updateCoins(dt){

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    const c=
      coinObjects[i];

    c.progress+=
      dt*
      (.22+
       speed/700);

    c.spin+=dt*6;

    if(c.progress>1.1){

      coinObjects.splice(
        i,
        1
      );

      continue;
    }

    const p=
      Math.max(
        0,
        Math.min(
          1,
          c.progress
        )
      );

    c.y=
      H*.20+
      p*(H*.80);

    const roadW=
      roadWidthAt(c.y);

    const center=
      roadCenterAt(c.y);

    const laneW=
      roadW/3;

    c.x=
      center-
      roadW/2+
      laneW*
      (c.lane+.5);

    c.size=
      8+
      p*16;
  }
}

/* =========================================================
   ALTIN ÇİZ
========================================================= */

function drawCoins(){

  for(
    const c of coinObjects
  ){

    ctx.save();

    ctx.translate(
      c.x,
      c.y
    );

    const sx=
      Math.abs(
        Math.cos(c.spin)
      );

    ctx.scale(
      Math.max(.15,sx),
      1
    );

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      c.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#ffd83d";

    ctx.fill();

    ctx.strokeStyle="#b87900";

    ctx.lineWidth=2;

    ctx.stroke();

    ctx.fillStyle="#fff3a1";

    ctx.font=
      `bold ${c.size}px Arial`;

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "₺",
      0,
      1
    );

    ctx.restore();
  }
}

/* =========================================================
   ÇARPIŞMA
========================================================= */

function hitTest(a,b){

  const aw=
    a.width*.72;

  const ah=
    a.height*.72;

  const bw=
    b.drawW*.72;

  const bh=
    b.drawH*.72;

  return(
    Math.abs(a.x-b.x)<
    (aw+bw)/2
    &&
    Math.abs(a.y-b.y)<
    (ah+bh)/2
  );
}

function coinHit(c){

  return(
    Math.abs(
      player.x-c.x
    )<
    player.width*.65
    &&
    Math.abs(
      player.y-c.y
    )<
    player.height*.65
  );
}

/* =========================================================
   OYUNCU GÜNCELLE
========================================================= */

function updatePlayer(dt){

  /*
     ÇOK ÖNEMLİ:
     Burada steering artık
     tekrar sıfırlanmıyor.

     Direksiyon değerini yalnızca
     gerçek kontrol sistemi belirliyor.
  */

  const steeringPower=
    245+
    speed*1.55;

  player.targetX+=
    steering*
    steeringPower*
    dt;

  /*
     Yol sınırları.
  */

  const roadW=
    roadWidthAt(
      player.y
    );

  const center=
    roadCenterAt(
      player.y
    );

  const padding=
    player.width*.60;

  const minX=
    center-
    roadW/2+
    padding;

  const maxX=
    center+
    roadW/2-
    padding;

  player.targetX=
    Math.max(
      minX,
      Math.min(
        maxX,
        player.targetX
      )
    );

  /*
     Aracı hedef konuma
     yumuşak ama hızlı götür.
  */

  const follow=
    12+
    speed/35;

  player.x+=
    (
      player.targetX-
      player.x
    )*
    Math.min(
      1,
      dt*follow
    );

  /*
     Direksiyon animasyonu.
  */

  const wantedTilt=
    steering*.075;

  player.tilt+=
    (
      wantedTilt-
      player.tilt
    )*
    Math.min(
      1,
      dt*12
    );
}

/* =========================================================
   OYUN BAŞLAT
========================================================= */

function startGame(){

  initAudio();

  if(
    audioCtx &&
    audioCtx.state==="suspended"
  ){
    audioCtx.resume();
  }

  running=true;

  menu.style.display="none";

  gameOver.style.display="none";

  score=0;
  coins=0;

  speed=0;
  targetSpeed=0;

  roadOffset=0;

  traffic=[];
  coinObjects=[];

  spawnTimer=.4;
  coinTimer=.7;

  touchLeft=false;
  touchRight=false;

  keyboardLeft=false;
  keyboardRight=false;

  steering=0;

  player.x=W/2;
  player.targetX=W/2;
  player.y=H*.78;
  player.tilt=0;

  lastTime=
    performance.now();
}

/* =========================================================
   OYUN BİTİR
========================================================= */

function endGame(){

  if(!running)
    return;

  running=false;

  speed=0;

  steering=0;

  touchLeft=false;
  touchRight=false;

  updateEngineSound();

  collisionSound();

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(score);

  document.getElementById(
    "finalCoins"
  ).textContent=
    coins;

  gameOver.style.display="flex";
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(!running)
    return;

  /*
     Maksimum hız.
  */

  targetSpeed=
    Math.min(
      220,
      95+
      score*.025
    );

  speed+=
    (
      targetSpeed-
      speed
    )*
    Math.min(
      1,
      dt*1.6
    );

  roadOffset+=
    speed*
    dt*
    2.8;

  score+=
    speed*
    dt*
    .035;

  updatePlayer(dt);

  spawnTimer-=dt;

  coinTimer-=dt;

  if(spawnTimer<=0){

    spawnTraffic();

    spawnTimer=
      Math.max(
        .58,
        1.18-
        speed/500
      );
  }

  if(coinTimer<=0){

    spawnCoin();

    coinTimer=
      1.15+
      Math.random()*.9;
  }

  updateTraffic(dt);

  updateCoins(dt);

  /* Çarpışma */

  for(
    const car of traffic
  ){

    if(
      hitTest(
        player,
        car
      )
    ){

      endGame();

      return;
    }
  }

  /* Altın */

  for(
    let i=
      coinObjects.length-1;
    i>=0;
    i--
  ){

    if(
      coinHit(
        coinObjects[i]
      )
    ){

      coinObjects.splice(
        i,
        1
      );

      coins++;

      score+=25;

      coinSound();
    }
  }

  document.getElementById(
    "speedText"
  ).textContent=
    Math.floor(speed);

  document.getElementById(
    "scoreText"
  ).textContent=
    Math.floor(score);

  document.getElementById(
    "coinText"
  ).textContent=
    coins;

  updateEngineSound();
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawRoad();

  /*
     Trafik
  */

  for(
    const car of traffic
  ){

    drawCar(
      car.x,
      car.y,
      car.drawW,
      car.drawH,
      car.color,
      false,
      0
    );
  }

  drawCoins();

  /*
     Oyuncu
  */

  drawCar(
    player.x,
    player.y,
    player.width,
    player.height,
    player.color,
    true,
    player.tilt
  );
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

  const dt=
    Math.min(
      .035,
      (now-lastTime)/1000||0
    );

  lastTime=now;

  update(dt);

  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   DOKUNMATİK DİREKSİYON
========================================================= */

const leftZone=
  document.getElementById(
    "leftZone"
  );

const rightZone=
  document.getElementById(
    "rightZone"
  );

/*
   touchstart
*/

leftZone.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    touchLeft=true;

    calculateSteering();

    initAudio();

  },
  {passive:false}
);

rightZone.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    touchRight=true;

    calculateSteering();

    initAudio();

  },
  {passive:false}
);

/*
   touchend
*/

leftZone.addEventListener(
  "touchend",
  function(e){

    e.preventDefault();

    touchLeft=false;

    calculateSteering();

  },
  {passive:false}
);

rightZone.addEventListener(
  "touchend",
  function(e){

    e.preventDefault();

    touchRight=false;

    calculateSteering();

  },
  {passive:false}
);

/*
   Parmağı ekrandan kaldırınca
   mutlaka direksiyon sıfırlanır.
*/

leftZone.addEventListener(
  "touchcancel",
  function(){

    touchLeft=false;

    calculateSteering();

  },
  {passive:false}
);

rightZone.addEventListener(
  "touchcancel",
  function(){

    touchRight=false;

    calculateSteering();

  },
  {passive:false}
);

/* =========================================================
   POINTER DİREKSİYON
========================================================= */

leftZone.addEventListener(
  "pointerdown",
  function(e){

    if(e.pointerType==="mouse")
      return;

    e.preventDefault();

    touchLeft=true;

    calculateSteering();

    try{
      leftZone.setPointerCapture(
        e.pointerId
      );
    }catch(err){}

  }
);

rightZone.addEventListener(
  "pointerdown",
  function(e){

    if(e.pointerType==="mouse")
      return;

    e.preventDefault();

    touchRight=true;

    calculateSteering();

    try{
      rightZone.setPointerCapture(
        e.pointerId
      );
    }catch(err){}

  }
);

leftZone.addEventListener(
  "pointerup",
  function(e){

    if(e.pointerType==="mouse")
      return;

    touchLeft=false;

    calculateSteering();
  }
);

rightZone.addEventListener(
  "pointerup",
  function(e){

    if(e.pointerType==="mouse")
      return;

    touchRight=false;

    calculateSteering();
  }
);

leftZone.addEventListener(
  "pointercancel",
  function(){

    touchLeft=false;

    calculateSteering();

  }
);

rightZone.addEventListener(
  "pointercancel",
  function(){

    touchRight=false;

    calculateSteering();

  }
);

/*
   Sayfa/focus kaybolursa
   direksiyon takılı kalmasın.
*/

window.addEventListener(
  "blur",
  function(){

    touchLeft=false;
    touchRight=false;

    keyboardLeft=false;
    keyboardRight=false;

    steering=0;
  }
);

/* =========================================================
   KLAVYE
========================================================= */

window.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="ArrowLeft"
    ){

      keyboardLeft=true;

      calculateSteering();

      e.preventDefault();
    }

    if(
      e.key==="ArrowRight"
    ){

      keyboardRight=true;

      calculateSteering();

      e.preventDefault();
    }

    if(
      e.key===" " &&
      !running
    ){

      startGame();

      e.preventDefault();
    }
  }
);

window.addEventListener(
  "keyup",
  function(e){

    if(
      e.key==="ArrowLeft"
    ){

      keyboardLeft=false;

      calculateSteering();
    }

    if(
      e.key==="ArrowRight"
    ){

      keyboardRight=false;

      calculateSteering();
    }
  }
);

   BUTONLAR
========================================================= */

const menu=
  document.getElementById(
    "menu"
  );

const gameOver=
  document.getElementById(
    "gameOver"
  );

document.getElementById(
  "startBtn"
).addEventListener(
  "click",

);

document.getElementById(
  "restartBtn"
).addEventListener(

);

document.getElementById(
  "menuBtn"
).addEventListener(

    touchRight=false;

).addEventListener(

      "☝️ Parmağını kaldırınca araç düz gider\n\n"+
      "💻 Bilgisayar: ← →\n\n"+
      "🪙 Altınları topla\n"+
      "🚗 Trafiğe çarpma\n"+
      "🏎️ Hız arttıkça motor sesi yükselir."
    );
  }
);

/* =========================================================
   SES BUTONU
========================================================= */

document.getElementById(
  "soundBtn"
).addEventListener(
  "click",
  function(){

    soundEnabled=
      !soundEnabled;

    this.textContent=
      soundEnabled
        ? "🔊"
        : "🔇";

    if(!soundEnabled){

      if(
        engineGain &&
        audioCtx
      ){

        engineGain.gain.setTargetAtTime(
          0,
          audioCtx.currentTime,
          .05
        );
      }

    }else{

      initAudio();

      if(
        audioCtx &&
        audioCtx.state==="suspended"
      ){
        audioCtx.resume();
      }

      updateEngineSound();
    }
  }
);

/* =========================================================
   İLK POZİSYON
========================================================= */

player.x=W/2;
player.targetX=W/2;
player.y=H*.78;

</script>
