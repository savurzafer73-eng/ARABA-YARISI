<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Turbo Road - Ters Yön Trafik</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071018;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#1d4722;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:absolute;
  top:env(safe-area-inset-top,10px);
  left:0;
  right:0;
  padding:12px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:5;
}

.hudBox{
  min-width:95px;
  padding:8px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  font-weight:bold;
  font-size:14px;
  text-align:center;
  border:1px solid rgba(255,255,255,.12);
}

#speed{
  color:#5ee7ff;
}

#score{
  color:#ffd65a;
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  z-index:8;
  pointer-events:none;
}

.control{
  width:92px;
  height:92px;
  border-radius:50%;
  background:rgba(0,0,0,.38);
  border:2px solid rgba(255,255,255,.22);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:38px;
  font-weight:bold;
  pointer-events:auto;
  touch-action:none;
}

.control:active{
  background:rgba(255,255,255,.22);
  transform:scale(.94);
}

#menu,
#gameOver{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(rgba(3,9,13,.72),rgba(3,9,13,.9));
}

.panel{
  width:min(90%,390px);
  padding:28px 22px;
  border-radius:22px;
  background:rgba(10,20,27,.94);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  text-align:center;
  color:white;
}

.title{
  font-size:36px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:6px;
}

.subtitle{
  color:#9fb0ba;
  margin-bottom:24px;
  font-size:14px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:10px;
  background:#16a7d9;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#263640;
}

.hidden{
  display:none !important;
}

#hint{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:125px;
  z-index:6;
  color:rgba(255,255,255,.8);
  font-size:12px;
  text-align:center;
  pointer-events:none;
  white-space:nowrap;
}

@media(max-width:360px){
  .control{
    width:78px;
    height:78px;
    font-size:32px;
  }

  .title{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div id="game">

  <canvas id="canvas"></canvas>

  <div id="hud">

    <div class="hudBox">
      HIZ<br>
      <span id="speed">0 km/h</span>
    </div>

    <div class="hudBox">
      SKOR<br>
      <span id="score">0</span>
    </div>

  </div>

  <div id="hint">
    SOL / SAĞ düğmeleriyle aracı kontrol et
  </div>

  <div id="controls">

    <div class="control" id="left">
      ‹
    </div>

    <div class="control" id="right">
      ›
    </div>

  </div>

  <div id="menu">

    <div class="panel">

      <div class="title">
        TURBO ROAD
      </div>

      <div class="subtitle">
        Ters yönlü trafik yarışına hazır ol!
      </div>

      <button id="startBtn">
        OYUNA BAŞLA
      </button>

      <button class="secondary" id="soundBtn">
        🔊 SES AÇIK
      </button>

    </div>

  </div>

  <div id="gameOver" class="hidden">

    <div class="panel">

      <div class="title">
        ÇARPIŞMA!
      </div>

      <div class="subtitle">
        Skorun:
        <strong id="finalScore">0</strong>
      </div>

      <button id="restartBtn">
        TEKRAR OYNA
      </button>

      <button class="secondary" id="menuBtn">
        ANA MENÜ
      </button>

    </div>

  </div>

</div>

<script>
(() => {

"use strict";

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const menu =
  document.getElementById("menu");

const gameOver =
  document.getElementById("gameOver");

const startBtn =
  document.getElementById("startBtn");

const restartBtn =
  document.getElementById("restartBtn");

const menuBtn =
  document.getElementById("menuBtn");

const soundBtn =
  document.getElementById("soundBtn");

const scoreEl =
  document.getElementById("score");

const speedEl =
  document.getElementById("speed");

const finalScoreEl =
  document.getElementById("finalScore");

const leftBtn =
  document.getElementById("left");

const rightBtn =
  document.getElementById("right");


let W=0;
let H=0;
let dpr=1;

let running=false;
let lastTime=0;

let score=0;
let distance=0;

let soundEnabled=true;

let audioCtx=null;

let engineOsc=null;
let engineGain=null;

let roadNoiseSource=null;
let roadNoiseGain=null;

let windOsc=null;
let windGain=null;


const keys={
  left:false,
  right:false
};


const player={
  x:0,
  y:0,
  width:38,
  height:70,
  speed:6.2,
  targetSpeed:6.2,
  steer:0
};


let traffic=[];


const road={
  left:0,
  right:0,
  width:0,
  center:0
};


const trafficColors=[
  "#e53935",
  "#1976d2",
  "#f4c542",
  "#eeeeee",
  "#7b1fa2",
  "#ff7f27",
  "#26a69a",
  "#555555"
];


/* =========================
   EKRAN
========================= */

function resize(){

  dpr=
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=
    Math.floor(W*dpr);

  canvas.height=
    Math.floor(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  road.width=
    Math.min(
      W*.72,
      420
    );

  road.left=
    (W-road.width)/2;

  road.right=
    road.left+road.width;

  road.center=
    W/2;

  player.width=
    Math.max(
      32,
      road.width*.105
    );

  player.height=
    player.width*1.82;

  player.y=
    H-Math.max(
      135,
      H*.17
    );

  if(!running){

    player.x=
      road.center;

  }else{

    player.x=
      clamp(
        player.x,
        road.left+
        player.width/2+
        6,

        road.right-
        player.width/2-
        6
      );
  }
}

window.addEventListener(
  "resize",
  resize
);

resize();


function clamp(v,min,max){

  return Math.max(
    min,
    Math.min(max,v)
  );
}


function random(min,max){

  return Math.random()*
    (max-min)+min;
}


function laneX(lane){

  const lanes=3;

  const laneWidth=
    road.width/lanes;

  return road.left+
    laneWidth*(lane+.5);
}


/* =========================
   TRAFİK
========================= */

/*
  Aynı şeritteki araçların
  birbirine girmemesi için
  minimum dikey mesafe.
*/

function trafficSafeY(lane,y,height){

  const minimumGap=
    Math.max(
      95,
      player.height*1.45
    );

  for(const car of traffic){

    if(car.lane!==lane)
      continue;

    const required=
      (height+car.height)/2+
      minimumGap;

    if(Math.abs(y-car.y)<required){

      if(y<=car.y){

        y=
          car.y-
          required;

      }else{

        y=
          car.y+
          required;
      }
    }
  }

  return y;
}


function createTraffic(
  y=-120,
  preferredLane=null
){

  let lane;

  if(
    preferredLane!==null &&
    preferredLane>=0 &&
    preferredLane<3
  ){

    lane=preferredLane;

  }else{

    /*
      Mümkünse en az dolu şeridi seç.
    */

    const counts=[0,0,0];

    for(const car of traffic){

      if(car.lane>=0 &&
         car.lane<3){

        counts[car.lane]++;
      }
    }

    const minCount=
      Math.min(...counts);

    const available=[];

    for(let i=0;i<3;i++){

      if(counts[i]===minCount){

        available.push(i);
      }
    }

    lane=
      available[
        Math.floor(
          Math.random()*
          available.length
        )
      ];
  }


  const width=
    player.width*
    random(.82,1.02);

  const height=
    width*
    random(1.55,1.85);


  /*
    Yeni aracın aynı şeritteki
    başka araçlarla çakışmamasını sağla.
  */

  y=
    trafficSafeY(
      lane,
      y,
      height
    );


  traffic.push({

    x:laneX(lane),

    y:y,

    width:width,

    height:height,

    speed:random(2.5,4.4),

    color:
      trafficColors[
        Math.floor(
          Math.random()*
          trafficColors.length
        )
      ],

    lane:lane,

    wobble:random(-.035,.035)

  });
}


function resetTraffic(){

  traffic=[];

  const count=
    Math.max(
      4,
      Math.floor(H/250)
    );


  /*
    Araçları önce farklı şeritlere
    dağıtıyoruz.
  */

  for(let i=0;i<count;i++){

    const lane=
      i%3;

    const width=
      player.width*
      random(.82,1);

    const height=
      width*1.7;

    let y=
      -180-
      i*280;

    y=
      trafficSafeY(
        lane,
        y,
        height
      );


    traffic.push({

      x:laneX(lane),

      y:y,

      width:width,

      height:height,

      speed:random(2.5,4.3),

      color:
        trafficColors[
          Math.floor(
            Math.random()*
            trafficColors.length
          )
        ],

      lane:lane,

      wobble:random(-.035,.035)

    });
  }
}


/* =========================
   DOĞA
========================= */

function drawBackground(){

  ctx.fillStyle="#2c632b";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  for(
    let x=0;
    x<W;
    x+=55
  ){

    const offset=
      Math.sin(
        x*.08+
        distance*.001
      )*12;

    drawTree(
      x+offset,
      90+(x%90),
      25
    );
  }


  const sideGap=
    Math.max(
      35,
      (W-road.width)/2-8
    );


  for(
    let y=-40;
    y<H+100;
    y+=95
  ){

    const move=
      (distance*.7)%95;

    drawTree(
      road.left-
      sideGap*.45,

      y+move,

      18
    );

    drawTree(
      road.right+
      sideGap*.45,

      y+move+40,

      18
    );
  }
}


function drawTree(
  x,
  y,
  size
){

  ctx.save();

  ctx.fillStyle="#5a351d";

  ctx.fillRect(
    x-size*.12,
    y,
    size*.24,
    size*.65
  );


  ctx.beginPath();

  ctx.fillStyle="#174d24";

  ctx.arc(
    x,
    y,
    size*.45,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.fillStyle="#226d2d";

  ctx.arc(
    x-size*.22,
    y+size*.15,
    size*.38,
    0,
    Math.PI*2
  );

  ctx.arc(
    x+size*.22,
    y+size*.15,
    size*.38,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================
   YOL
========================= */

function drawRoad(){

  ctx.fillStyle="#25292c";

  ctx.fillRect(
    road.left,
    0,
    road.width,
    H
  );


  ctx.fillStyle="#d8d8d8";

  ctx.fillRect(
    road.left+4,
    0,
    4,
    H
  );

  ctx.fillRect(
    road.right-8,
    0,
    4,
    H
  );


  const laneWidth=
    road.width/3;

  ctx.fillStyle="#e9e9e9";

  const dash=52;
  const gap=42;

  const offset=
    (distance*1.25)%
    (dash+gap);


  for(
    let lane=1;
    lane<3;
    lane++
  ){

    const x=
      road.left+
      laneWidth*lane;


    for(
      let y=-dash+offset;
      y<H+dash;
      y+=dash+gap
    ){

      ctx.fillRect(
        x-2,
        y,
        4,
        dash
      );
    }
  }


  ctx.fillStyle=
    "rgba(0,0,0,.18)";

  ctx.fillRect(
    road.left,
    0,
    7,
    H
  );

  ctx.fillRect(
    road.right-7,
    0,
    7,
    H
  );
}


/* =========================
   ARAÇ
========================= */

function roundedRect(
  x,y,w,h,r
){

  ctx.beginPath();

  ctx.moveTo(
    x+r,
    y
  );

  ctx.lineTo(
    x+w-r,
    y
  );

  ctx.quadraticCurveTo(
    x+w,
    y,
    x+w,
    y+r
  );

  ctx.lineTo(
    x+w,
    y+h-r
  );

  ctx.quadraticCurveTo(
    x+w,
    y+h,
    x+w-r,
    y+h
  );

  ctx.lineTo(
    x+r,
    y+h
  );

  ctx.quadraticCurveTo(
    x,
    y+h,
    x,
    y+h-r
  );

  ctx.lineTo(
    x,
    y+r
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x+r,
    y
  );

  ctx.closePath();
}


function drawCar(
  car,
  isPlayer=false
){

  const x=car.x;
  const y=car.y;
  const w=car.width;
  const h=car.height;

  ctx.save();


  ctx.fillStyle=
    "rgba(0,0,0,.35)";

  roundedRect(
    x-w/2+4,
    y-h/2+6,
    w,
    h,
    w*.18
  );

  ctx.fill();


  ctx.fillStyle=
    isPlayer
      ? "#101820"
      : car.color;

  roundedRect(
    x-w/2,
    y-h/2,
    w,
    h,
    w*.18
  );

  ctx.fill();


  ctx.fillStyle=
    isPlayer
      ? "#c7c7c7"
      : "#222";

  roundedRect(
    x-w*.36,
    y-h*.36,
    w*.72,
    h*.28,
    w*.08
  );

  ctx.fill();


  ctx.fillStyle="#182c38";

  roundedRect(
    x-w*.32,
    y-h*.15,
    w*.64,
    h*.25,
    w*.06
  );

  ctx.fill();


  ctx.fillStyle=
    "rgba(255,255,255,.25)";

  ctx.fillRect(
    x-w*.25,
    y-h*.10,
    w*.12,
    h*.15
  );


  ctx.fillStyle="#fff3b0";

  ctx.fillRect(
    x-w*.34,
    y-h*.47,
    w*.18,
    h*.07
  );

  ctx.fillRect(
    x+w*.16,
    y-h*.47,
    w*.18,
    h*.07
  );


  ctx.fillStyle="#ff2424";

  ctx.fillRect(
    x-w*.34,
    y+h*.40,
    w*.18,
    h*.07
  );

  ctx.fillRect(
    x+w*.16,
    y+h*.40,
    w*.18,
    h*.07
  );


  if(isPlayer){

    ctx.fillStyle="#d7d7d7";

    ctx.fillRect(
      x-w*.34,
      y-h*.49,
      w*.68,
      h*.035
    );


    ctx.fillStyle="#ffffff";

    ctx.fillRect(
      x-w*.035,
      y-h*.48,
      w*.07,
      h*.94
    );
  }


  ctx.restore();
}


/* =========================
   OYUN GÜNCELLEME
========================= */

function update(dt){

  const frame=
    Math.min(
      dt/16.67,
      2
    );


  player.targetSpeed=
    6.0+
    Math.min(
      5.5,
      score/650
    );


  player.speed+=
    (
      player.targetSpeed-
      player.speed
    )*.025*frame;


  let steer=0;

  if(keys.left)
    steer-=1;

  if(keys.right)
    steer+=1;


  player.steer+=
    (
      steer-
      player.steer
    )*.22*frame;


  player.x+=
    player.steer*
    5.8*
    frame;


  player.x=
    clamp(
      player.x,

      road.left+
      player.width/2+
      8,

      road.right-
      player.width/2-
      8
    );


  /*
    Oyuncu yukarı gider.
    Dünya aşağı doğru akar.
  */

  distance+=
    player.speed*
    frame;


  score+=
    player.speed*
    .018*
    frame;


  /*
    KARŞIDAN GELEN TRAFİK
  */

  for(const car of traffic){

    car.y+=
      (
        car.speed+
        player.speed*.82
      )*
      frame;


    car.x+=
      Math.sin(
        distance*.01+
        car.y*.01
      )*
      car.wobble;


    car.x=
      clamp(
        car.x,

        road.left+
        car.width/2+
        8,

        road.right-
        car.width/2-
        8
      );
  }


  /*
    Trafik araçlarının aynı şeritte
    birbirine yaklaşmasını sürekli
    kontrol et.
  */

  for(let i=0;i<traffic.length;i++){

    for(
      let j=i+1;
      j<traffic.length;
      j++
    ){

      const a=traffic[i];
      const b=traffic[j];

      if(a.lane!==b.lane)
        continue;


      const minGap=
        (
          a.height+
          b.height
        )/2+
        Math.max(
          35,
          player.height*.48
        );


      const dy=
        b.y-a.y;


      if(Math.abs(dy)<minGap){

        if(dy>=0){

          b.y=
            a.y+
            minGap;

        }else{

          a.y=
            b.y+
            minGap;
        }
      }
    }
  }


  /*
    Ekrandan çıkan araçların yerine
    yeni araç koy.
  */

  for(
    let i=traffic.length-1;
    i>=0;
    i--
  ){

    if(
      traffic[i].y>
      H+160
    ){

      const oldLane=
        traffic[i].lane;

      traffic.splice(i,1);

      /*
        Aynı şeride hemen araç koymak
        yerine önce güvenli mesafeyi
        kontrol eden sistem kullanılır.
      */

      createTraffic(
        -random(
          180,
          520
        ),
        oldLane
      );

      score+=8;
    }
  }


  while(traffic.length<4){

    createTraffic(
      -random(
        200,
        650
      )
    );
  }


  checkCollision();


  scoreEl.textContent=
    Math.floor(score);


  speedEl.textContent=
    Math.floor(
      80+
      player.speed*18
    )+
    " km/h";


  updateEngineSound();
  updateRoadSound();
}


/* =========================
   ÇARPIŞMA
========================= */

function checkCollision(){

  const px=player.x;
  const py=player.y;


  for(const car of traffic){

    const dx=
      Math.abs(
        px-car.x
      );

    const dy=
      Math.abs(
        py-car.y
      );


    const hitX=
      (
        player.width+
        car.width
      )*.38;


    const hitY=
      (
        player.height+
        car.height
      )*.40;


    if(
      dx<hitX &&
      dy<hitY
    ){

      endGame();

      return;
    }
  }
}


/* =========================
   ÇİZİM
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawBackground();

  drawRoad();


  for(const car of traffic){

    drawCar(
      car,
      false
    );
  }


  drawCar(
    player,
    true
  );
}


/* =========================
   OYUN DÖNGÜSÜ
========================= */

function loop(time){

  if(!running)
    return;


  const dt=
    time-lastTime;

  lastTime=time;


  update(dt);

  draw();


  requestAnimationFrame(
    loop
  );
}


/* =========================
   BAŞLAT
========================= */

function startGame(){

  initAudio();


  running=true;

  score=0;

  distance=0;


  menu.classList.add(
    "hidden"
  );

  gameOver.classList.add(
    "hidden"
  );


  resize();


  player.x=
    road.center;


  resetTraffic();


  lastTime=
    performance.now();


  requestAnimationFrame(
    loop
  );
}


function endGame(){

  running=false;


  finalScoreEl.textContent=
    Math.floor(score);


  gameOver.classList.remove(
    "hidden"
  );


  stopAllSounds();
}


function backMenu(){

  running=false;


  gameOver.classList.add(
    "hidden"
  );

  menu.classList.remove(
    "hidden"
  );


  stopAllSounds();
}


startBtn.addEventListener(

restartBtn.addEventListener(

/* =========================
   SES SİSTEMİ
========================= */

function initAudio(){

  if(!soundEnabled)
    return;


  try{

    if(!audioCtx){

      audioCtx=
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();
    }


    if(
      audioCtx.state===
      "suspended"
    ){

      audioCtx.resume();
    }


    if(!engineOsc){

      /* MOTOR SESİ */

      engineOsc=
        audioCtx.createOscillator();

      engineGain=
        audioCtx.createGain();


      engineOsc.type=
        "sawtooth";

      engineOsc.frequency.value=
        90;


      engineGain.gain.value=
        .028;


      engineOsc.connect(
        engineGain
      );

      engineGain.connect(
        audioCtx.destination
      );


      engineOsc.start();
    }


    /*
      YOL / FON SESİ
      Web Audio ile düşük seviyeli
      sürekli yol ambiyansı.
    */

    if(!roadNoiseSource){

      const bufferSize=
        audioCtx.sampleRate*2;

      const buffer=
        audioCtx.createBuffer(
          1,
          bufferSize,
          audioCtx.sampleRate
        );


      const data=
        buffer.getChannelData(0);


      for(
        let i=0;
        i<bufferSize;
        i++
      ){

        data[i]=
          (
            Math.random()*
            2-1
          )*.35;
      }


      roadNoiseSource=
        audioCtx.createBufferSource();


      roadNoiseSource.buffer=
        buffer;

      roadNoiseSource.loop=
        true;


      /*
        Yol sesini daha yumuşak
        hale getirmek için filtre.
      */

      const filter=
        audioCtx.createBiquadFilter();

      filter.type=
        "lowpass";

      filter.frequency.value=
        850;


      roadNoiseGain=
        audioCtx.createGain();

      roadNoiseGain.gain.value=
        .008;


      roadNoiseSource
        .connect(filter);

      filter
        .connect(
          roadNoiseGain
        );

      roadNoiseGain
        .connect(
          audioCtx.destination
        );


      roadNoiseSource.start();
    }


    /*
      Hafif rüzgar sesi.
    */

    if(!windOsc){

      windOsc=
        audioCtx.createOscillator();

      windGain=
        audioCtx.createGain();


      windOsc.type=
        "sine";

      windOsc.frequency.value=
        45;


      windGain.gain.value=
        .004;


      windOsc.connect(
        windGain
      );

      windGain.connect(
        audioCtx.destination
      );


      windOsc.start();
    }

  }catch(e){

    console.log(
      "Ses başlatılamadı:",
      e
    );
  }
}


/* =========================
   MOTOR SESİ
========================= */

function updateEngineSound(){

  if(
    !soundEnabled ||
    !audioCtx ||
    !engineOsc ||
    !engineGain
  )
    return;


  const freq=
    70+
    player.speed*25;


  engineOsc.frequency.setTargetAtTime(
    freq,
    audioCtx.currentTime,
    .04
  );


  engineGain.gain.setTargetAtTime(
    .022+
    player.speed*.0028,
    audioCtx.currentTime,
    .05
  );
}


/* =========================
   YOL SESİ
========================= */

function updateRoadSound(){

  if(
    !soundEnabled ||
    !audioCtx
  )
    return;


  if(roadNoiseGain){

    roadNoiseGain.gain.setTargetAtTime(
      .005+
      player.speed*.0012,
      audioCtx.currentTime,
      .08
    );
  }


  if(windGain){

    windGain.gain.setTargetAtTime(
      .002+
      player.speed*.0007,
      audioCtx.currentTime,
      .08
    );
  }


  if(windOsc){

    windOsc.frequency.setTargetAtTime(
      40+
      player.speed*2,
      audioCtx.currentTime,
      .08
    );
  }
}


/* =========================
   TÜM SESLERİ DURDUR
========================= */

function stopAllSounds(){

  if(
    !audioCtx
  ){

    return;
  }


  try{

    if(engineGain){

      engineGain.gain.setTargetAtTime(
        0,
        audioCtx.currentTime,
        .05
      );
    }


    if(roadNoiseGain){

      roadNoiseGain.gain.setTargetAtTime(
        0,
        audioCtx.currentTime,
        .05
      );
    }


    if(windGain){

      windGain.gain.setTargetAtTime(
        0,
        audioCtx.currentTime,
        .05
      );
    }


    setTimeout(
      ()=>{

        try{

          if(engineOsc)
            engineOsc.stop();

        }catch(e){}


        try{

          if(roadNoiseSource)
            roadNoiseSource.stop();

        }catch(e){}


        try{

          if(windOsc)
            windOsc.stop();

        }catch(e){}


        engineOsc=null;
        engineGain=null;

        roadNoiseSource=null;
        roadNoiseGain=null;

        windOsc=null;
        windGain=null;

      },
      120
    );

  }catch(e){

    engineOsc=null;
    engineGain=null;

    roadNoiseSource=null;
    roadNoiseGain=null;

    windOsc=null;
    windGain=null;
  }
}
