<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road - 1969 Mustang</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,sans-serif;
  touch-action:none;
}

button{font-family:inherit}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#111;
}

/* SKY */
#sky{
  position:absolute;
  inset:0;
  background:linear-gradient(#071426,#37647e,#d47b3e);
  transition:background .5s;
}

#sun{
  position:absolute;
  width:65px;
  height:65px;
  right:13%;
  top:10%;
  border-radius:50%;
  background:#fff0a0;
  box-shadow:0 0 45px #ffd35a;
}

#moon{
  display:none;
  position:absolute;
  width:58px;
  height:58px;
  right:14%;
  top:10%;
  border-radius:50%;
  background:#eee;
  box-shadow:0 0 30px white;
}

.stars{
  position:absolute;
  inset:0;
  display:none;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 5px white;
}

/* CITY */
#city{
  position:absolute;
  bottom:38%;
  left:0;
  width:100%;
  height:22%;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
  gap:4px;
}

.building{
  position:relative;
  min-width:35px;
  background:#101a25;
  border-top:2px solid #273545;
}

.window{
  position:absolute;
  width:5px;
  height:7px;
  background:#ffd965;
  box-shadow:0 0 5px #ffd965;
}

/* ROAD */
#road{
  position:absolute;
  left:7%;
  right:7%;
  top:0;
  bottom:0;
  background:linear-gradient(
    90deg,
    #555 0%,
    #292929 7%,
    #1b1b1b 14%,
    #292929 86%,
    #555 93%,
    #555 100%
  );
  clip-path:polygon(39% 0,61% 0,96% 100%,4% 100%);
  overflow:hidden;
}

.roadLine{
  position:absolute;
  width:7px;
  height:100px;
  background:#eee;
  border-radius:5px;
  box-shadow:0 0 5px white;
}

.edge{
  position:absolute;
  z-index:4;
  width:5px;
  height:100%;
  background:white;
  box-shadow:0 0 5px white;
}

.edge.left{
  left:12%;
  transform:rotate(7deg);
}

.edge.right{
  right:12%;
  transform:rotate(-7deg);
}

/* HUD */
#hud{
  position:absolute;
  z-index:80;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.hudBox{
  color:white;
  font-size:12px;
  font-weight:bold;
  padding:8px 9px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;
  text-shadow:0 2px 4px black;
}

/* PLAYER */
#player{
  position:absolute;
  width:76px;
  height:130px;
  bottom:55px;
  left:50%;
  z-index:50;
  transform:translateX(-50%);
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.7));
}

.car{
  position:absolute;
  inset:0;
}

/* default car */
.carBody{
  position:absolute;
  left:6px;
  top:10px;
  width:64px;
  height:110px;
  border-radius:17px 17px 10px 10px;
  background:linear-gradient(
    90deg,
    #590000,
    #d00000,
    #ff2929,
    #c00000,
    #560000
  );
  border:2px solid #300;
}

.carHood{
  position:absolute;
  left:10px;
  top:4px;
  width:56px;
  height:45px;
  border-radius:18px 18px 7px 7px;
  background:linear-gradient(
    90deg,#790000,#ef1717,#ff3b3b,#9d0000
  );
}

.windshield{
  position:absolute;
  left:13px;
  top:35px;
  width:48px;
  height:31px;
  border-radius:10px 10px 3px 3px;
  background:linear-gradient(135deg,#d8f7ff,#28546d,#08131d);
  border:2px solid #111;
}

.divider{
  position:absolute;
  left:36px;
  top:37px;
  width:3px;
  height:27px;
  background:#111;
}

.grille{
  position:absolute;
  left:13px;
  bottom:8px;
  width:48px;
  height:19px;
  background:#090909;
  border:2px solid #777;
  border-radius:3px;
}

.grille i{
  position:absolute;
  top:2px;
  bottom:2px;
  width:2px;
  background:#777;
}

.grille i:nth-child(1){left:8px}
.grille i:nth-child(2){left:17px}
.grille i:nth-child(3){left:26px}
.grille i:nth-child(4){left:35px}

.light{
  position:absolute;
  width:12px;
  height:9px;
  bottom:11px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 13px white;
}

.light.l{left:9px}
.light.r{right:9px}

.bumper{
  position:absolute;
  left:9px;
  bottom:3px;
  width:56px;
  height:7px;
  background:linear-gradient(#eee,#777);
  border-radius:3px;
}

.wheel{
  position:absolute;
  width:12px;
  height:32px;
  background:#070707;
  border-radius:5px;
  box-shadow:inset 0 0 0 2px #333;
}

.wheel.l1{left:-1px;top:26px}
.wheel.l2{left:-1px;bottom:22px}
.wheel.r1{right:-1px;top:26px}
.wheel.r2{right:-1px;bottom:22px}

.badge{
  position:absolute;
  left:28px;
  bottom:29px;
  color:white;
  font-size:10px;
}

/* NITRO */
#flame{
  display:none;
  position:absolute;
  left:25px;
  bottom:-37px;
  width:25px;
  height:45px;
  background:linear-gradient(#fff,#39dfff,#0755ff);
  clip-path:polygon(25% 0,75% 0,100% 100%,50% 75%,0 100%);
  filter:drop-shadow(0 0 10px #00aaff);
  animation:flame .08s infinite alternate;
}

@keyframes flame{
  from{transform:scaleY(.8)}
  to{transform:scaleY(1.2)}
}

/* ENEMIES */
.enemy{
  position:absolute;
  width:57px;
  height:94px;
  z-index:35;
  border-radius:14px;
  box-shadow:0 6px 12px #000;
}

.enemy.red{
  background:linear-gradient(90deg,#610000,#ff2424,#710000);
}

.enemy.blue{
  background:linear-gradient(90deg,#04347d,#2c91ff,#04347d);
}

.enemy.yellow{
  background:linear-gradient(90deg,#715300,#ffd31e,#715300);
}

.enemy.green{
  background:linear-gradient(90deg,#064629,#18bb68,#064629);
}

.enemyGlass{
  position:absolute;
  left:9px;
  top:13px;
  width:39px;
  height:28px;
  background:linear-gradient(135deg,#d7f7ff,#173b50);
  border-radius:8px;
}

/* COIN */
.coin{
  position:absolute;
  width:27px;
  height:27px;
  z-index:34;
  border-radius:50%;
  background:radial-gradient(
    circle,#fff7a0 0 18%,#ffd000 19% 65%,#9a6500 66%
  );
  border:2px solid #fff1a0;
  box-shadow:0 0 15px #ffd000;
  animation:spin .45s linear infinite;
}

@keyframes spin{
  from{transform:rotateY(0)}
  to{transform:rotateY(360deg)}
}

/* NITRO BAR */
#nitro{
  position:absolute;
  z-index:85;
  left:12px;
  bottom:17px;
  width:155px;
}

#nitroLabel{
  color:white;
  font-size:12px;
  font-weight:bold;
  margin-bottom:4px;
}

#nitroBar{
  height:15px;
  background:#111;
  border:1px solid #666;
  border-radius:10px;
  overflow:hidden;
}

#nitroFill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#00aaff,#5555ff,#b7aaff);
}

/* TOUCH */
.touch{
  position:absolute;
  z-index:45;
  top:0;
  bottom:0;
  width:50%;
}

#leftTouch{left:0}
#rightTouch{right:0}

#hint{
  position:absolute;
  z-index:47;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.7);
  font-size:11px;
}

/* DAMAGE */
#damage{
  position:absolute;
  inset:0;
  z-index:75;
  pointer-events:none;
  background:rgba(255,0,0,.35);
  opacity:0;
}

/* SCREENS */
.screen{
  position:absolute;
  inset:0;
  z-index:200;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:rgba(0,0,0,.86);
  padding:20px;
}

.screen h1{
  font-size:38px;
  margin-bottom:15px;
  text-shadow:0 0 20px #ff2500;
}

.screen p{
  line-height:1.6;
  color:#ddd;
  margin-bottom:18px;
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 24px;
  color:white;
  font-size:17px;
  font-weight:bold;
  background:linear-gradient(135deg,#d90000,#ff5a00);
  box-shadow:0 7px 25px rgba(255,50,0,.35);
  margin:5px;
}

.btn.dark{
  background:linear-gradient(135deg,#222,#555);
}

.hidden{
  display:none!important;
}

/* MENU */
.menuButtons{
  display:flex;
  flex-direction:column;
  width:min(320px,90%);
}

.menuButtons .btn{
  width:100%;
}

.smallInfo{
  color:#ffd43b;
  font-weight:bold;
  margin:8px;
}

/* GARAGE */
#garageScreen{
  justify-content:flex-start;
  overflow:auto;
  padding-top:30px;
}

.cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  max-width:500px;
  margin:10px auto;
}

.card{
  width:140px;
  min-height:135px;
  padding:10px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  border-radius:15px;
}

.card h3{
  font-size:15px;
  margin:5px;
}

.carMini{
  width:48px;
  height:75px;
  margin:5px auto;
  border-radius:13px;
  background:linear-gradient(90deg,#600,#f22,#600);
}

.card button{
  padding:8px 12px;
  border:0;
  border-radius:9px;
  background:#e22;
  color:white;
  font-weight:bold;
}

.card button.owned{
  background:#198754;
}

.card button.selected{
  background:#1769aa;
}

/* TRACK */
.trackButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  width:min(350px,90%);
}

.track{
  padding:14px;
  border:1px solid #777;
  border-radius:13px;
  background:#222;
  color:white;
}

.track.selected{
  border:2px solid #ff3b00;
  background:#542000;
}

/* SETTINGS */
.settingRow{
  width:min(350px,90%);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#222;
  padding:14px;
  border-radius:12px;
  margin:7px;
}

.toggle{
  border:0;
  border-radius:10px;
  padding:9px 15px;
  color:white;
  background:#777;
}

.toggle.on{
  background:#159447;
}

/* MOBILE */
@media(max-width:380px){
  .hudBox{
    font-size:10px;
    padding:6px;
  }

  .screen h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="sky">
    <div id="sun"></div>
    <div id="moon"></div>
    <div class="stars">
      <i class="star" style="left:10%;top:12%"></i>
      <i class="star" style="left:22%;top:20%"></i>
      <i class="star" style="left:35%;top:9%"></i>
      <i class="star" style="left:48%;top:18%"></i>
      <i class="star" style="left:63%;top:10%"></i>
      <i class="star" style="left:78%;top:22%"></i>
      <i class="star" style="left:90%;top:8%"></i>
    </div>
  </div>

  <div id="city"></div>

  <div id="road"></div>
  <div class="edge left"></div>
  <div class="edge right"></div>

  <div id="hud">
    <div class="hudBox">🏆 <span id="score">0</span></div>
    <div class="hudBox">🪙 <span id="coins">0</span></div>
    <div class="hudBox">❤️ <span id="lives">3</span></div>
    <div class="hudBox">⚡ <span id="speed">0</span></div>
  </div>

  <button id="pause" class="btn dark"
          style="position:absolute;z-index:100;right:10px;top:55px;padding:8px 12px">
    Ⅱ
  </button>

  <!-- PLAYER -->
  <div id="player">
    <div class="car">
      <div class="carBody"></div>
      <div class="carHood"></div>
      <div class="windshield"></div>
      <div class="divider"></div>

      <div class="light l"></div>
      <div class="light r"></div>

      <div class="grille">
        <i></i><i></i><i></i><i></i>
      </div>

      <div class="badge">🐎</div>
      <div class="bumper"></div>

      <div class="wheel l1"></div>
      <div class="wheel l2"></div>
      <div class="wheel r1"></div>
      <div class="wheel r2"></div>

      <div id="flame"></div>
    </div>
  </div>

  <div id="nitro">
    <div id="nitroLabel">🔥 NİTRO</div>
    <div id="nitroBar">
      <div id="nitroFill"></div>
    </div>
  </div>

  <div id="hint">👈 SOL &nbsp;&nbsp;&nbsp; SAĞ 👉</div>

  <div id="leftTouch" class="touch"></div>
  <div id="rightTouch" class="touch"></div>

  <div id="damage"></div>

  <!-- MAIN MENU -->
  <div id="menuScreen" class="screen">

    <h1>🏎️ TURBO ROAD</h1>

    <p>
      <b>1969 MUSTANG EDITION</b><br>
      Trafikte yarış, coin topla,<br>
      yeni arabaların kilidini aç!
    </p>

    <div class="smallInfo">
      🪙 Banka: <span id="bankCoins">0</span>
    </div>

    <div class="menuButtons">
      <button class="btn" id="playBtn">🚦 YARIŞA BAŞLA</button>
      <button class="btn" id="garageBtn">🏎️ GARAJ</button>
      <button class="btn" id="trackBtn">🛣️ PİST SEÇ</button>
      <button class="btn" id="settingsBtn">⚙️ AYARLAR</button>
    </div>

  </div>

  <!-- GARAGE -->
  <div id="garageScreen" class="screen hidden">

    <h1>🏎️ GARAJ</h1>

    <div class="smallInfo">
      🪙 <span id="garageCoins">0</span>
    </div>

    <div id="carCards" class="cards"></div>

    <button class="btn dark" onclick="showScreen('menuScreen')">
      ↩ MENÜ
    </button>

  </div>

  <!-- TRACK -->
  <div id="trackScreen" class="screen hidden">

    <h1>🛣️ PİST SEÇ</h1>

    <div class="trackButtons">

      <button class="track" data-track="city">
        🌆<br><b>ŞEHİR</b><br>Normal
      </button>

      <button class="track" data-track="desert">
        🏜️<br><b>ÇÖL</b><br>Hızlı
      </button>

      <button class="track" data-track="night">
        🌙<br><b>GECE</b><br>Zor
      </button>

      <button class="track" data-track="rain">
        🌧️<br><b>YAĞMUR</b><br>Çok zor
      </button>

    </div>

    <button class="btn dark" onclick="showScreen('menuScreen')">
      ↩ MENÜ
    </button>

  </div>

  <!-- SETTINGS -->
  <div id="settingsScreen" class="screen hidden">

    <h1>⚙️ AYARLAR</h1>

    <div class="settingRow">
      <b>🔊 Ses</b>
      <button id="soundBtn" class="toggle on">AÇIK</button>
    </div>

    <div class="settingRow">
      <b>📳 Titreşim</b>
      <button id="vibrationBtn" class="toggle on">AÇIK</button>
    </div>

    <button class="btn dark" onclick="showScreen('menuScreen')">
      ↩ MENÜ
    </button>

  </div>

  <!-- PAUSE -->
  <div id="pauseScreen" class="screen hidden">

    <h1>⏸️ DURAKLATILDI</h1>

    <button class="btn" id="continueBtn">▶ DEVAM</button>
    <button class="btn dark" id="pauseMenuBtn">🏠 MENÜ</button>

  </div>

  <!-- GAME OVER -->
  <div id="gameOver" class="screen hidden">

    <h1>💥 KAZA!</h1>

    <p>
      🏆 Skor: <b id="finalScore">0</b><br>
      🪙 Coin: <b id="finalCoins">0</b><br>
      🥇 Rekor: <b id="bestScore">0</b>
    </p>

    <button class="btn" id="restartBtn">🔄 TEKRAR OYNA</button>
    <button class="btn dark" id="gameOverMenu">🏠 MENÜ</button>

  </div>

</div>

<script>
/* =========================================
   TURBO ROAD
   TAM TEK DOSYA
========================================= */

const $=id=>document.getElementById(id);

let running=false;
let paused=false;
let direction=0;
let turbo=false;

let playerX=innerWidth/2;

let score=0;
let coins=0;
let lives=3;
let speed=5;
let nitro=100;

let enemies=[];
let coinList=[];
let lines=[];

let enemyTimer=0;
let coinTimer=0;

let selectedCar=localStorage.getItem("selectedCar")||"mustang";
let selectedTrack=localStorage.getItem("selectedTrack")||"city";

let bankCoins=Number(localStorage.getItem("turboCoins")||0);
let best=Number(localStorage.getItem("turboBest")||0);

let soundOn=localStorage.getItem("turboSound")!=="off";
let vibrationOn=localStorage.getItem("turboVibration")!=="off";

let audio=null;

/* CARS */
const cars={

  mustang:{
    name:"1969 Mustang",
    price:0,
    color:"red",
    speed:1
  },

  blue:{
    name:"Blue Racer",
    price:100,
    color:"blue",
    speed:1.15
  },

  yellow:{
    name:"Golden GT",
    price:250,
    color:"yellow",
    speed:1.3
  },

  green:{
    name:"Green Beast",
    price:500,
    color:"green",
    speed:1.45
  },

  black:{
    name:"Black Thunder",
    price:1000,
    color:"black",
    speed:1.65
  }
};

/* TRACKS */
const tracks={
  city:{
    name:"Şehir",
    bg:"linear-gradient(#071426,#37647e,#d47b3e)"
  },
  desert:{
    name:"Çöl",
    bg:"linear-gradient(#481d0b,#e27c32,#ffd16b)"
  },
  night:{
    name:"Gece",
    bg:"linear-gradient(#01030a,#0c1730,#151b32)"
  },
  rain:{
    name:"Yağmur",
    bg:"linear-gradient(#263442,#53616c,#18232c)"
  }
};

/* AUDIO */
function startAudio(){

  if(!soundOn)return;

  if(!audio){

    try{
      audio=new(
        window.AudioContext||
        window.webkitAudioContext
      )();
    }catch(e){}
  }

  if(audio&&audio.state==="suspended"){
    audio.resume();
  }
}

function sound(freq,duration=.1,type="sine"){

  if(!soundOn||!audio)return;

  try{

    const osc=audio.createOscillator();
    const gain=audio.createGain();

    osc.type=type;
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(.04,audio.currentTime);

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime+duration);

  }catch(e){}
}

/* CITY */
function createCity(){

  $("city").innerHTML="";

  for(let i=0;i<35;i++){

    const b=document.createElement("div");

    b.className="building";
    b.style.height=(35+Math.random()*110)+"px";

    for(let j=0;j<8;j++){

      const w=document.createElement("i");

      w.className="window";
      w.style.left=(5+Math.random()*80)+"%";
      w.style.top=(5+Math.random()*80)+"%";

      b.appendChild(w);
    }

    $("city").appendChild(b);
  }
}

/* ROAD LINES */
function createLines(){

  lines.forEach(x=>x.remove());

  lines=[];

  for(let i=0;i<14;i++){

    const el=document.createElement("div");

    el.className="roadLine";

    el.style.left="50%";

    road.appendChild(el);

    lines.push({
      el,
      y:i*115-100
    });
  }
}

/* SCREEN */
function showScreen(id){

  document.querySelectorAll(".screen")
    .forEach(x=>x.classList.add("hidden"));

  $(id).classList.remove("hidden");
}

/* GARAGE */
function renderGarage(){

  $("garageCoins").textContent=bankCoins;

  const box=$("carCards");

  box.innerHTML="";

  Object.keys(cars).forEach(key=>{

    const c=cars[key];

    const owned=
      key==="mustang"||
      localStorage.getItem("car_"+key)==="1";

    const selected=selectedCar===key;

    const div=document.createElement("div");

    div.className="card";

    div.innerHTML=`
      <div class="carMini"
           style="background:linear-gradient(
             90deg,
             ${c.color==="red"?"#600,#f22,#600":
               c.color==="blue"?"#063,#39f,#063":
               c.color==="yellow"?"#765,#ffd,#765":
               c.color==="green"?"#063,#1c6,#063":
               "#111,#555,#111"}
           )"></div>

      <h3>${c.name}</h3>

      <div style="font-size:12px;margin:4px">
        ⚡ x${c.speed}
      </div>

      <button
        class="${selected?"selected":owned?"owned":""}"
        data-car="${key}">
        ${
          selected
          ?"SEÇİLDİ"
          :owned
          ?"SEÇ"
          :"🪙 "+c.price
        }
      </button>
    `;

    box.appendChild(div);
  });

  box.querySelectorAll("button").forEach(btn=>{

    btn.onclick=()=>{

      const key=btn.dataset.car;
      const c=cars[key];

      const owned=
        key==="mustang"||
        localStorage.getItem("car_"+key)==="1";

      if(owned){

        selectedCar=key;

        localStorage.setItem(
          "selectedCar",
          selectedCar
        );

        applyCar();

        renderGarage();

        sound(700,.08);

        return;
      }

      if(bankCoins>=c.price){

        bankCoins-=c.price;

        localStorage.setItem(
          "turboCoins",
          bankCoins
        );

        localStorage.setItem(
          "car_"+key,
          "1"
        );

        selectedCar=key;

        localStorage.setItem(
          "selectedCar",
          key
        );

        applyCar();
        renderGarage();

        sound(1000,.15,"square");

      }else{

        sound(100,.2);

        alert(
          "Bu arabayı almak için "+
          (c.price-bankCoins)+
          " coin daha gerekiyor."
        );
      }
    };
  });
}

/* CAR */
function applyCar(){

  const c=cars[selectedCar];

  let color;

  if(c.color==="red")
    color="linear-gradient(90deg,#590000,#d00000,#ff2929,#c00000,#560000)";

  if(c.color==="blue")
    color="linear-gradient(90deg,#032d70,#087cff,#39a8ff,#087cff,#032d70)";

  if(c.color==="yellow")
    color="linear-gradient(90deg,#765500,#d99b00,#ffe13a,#d99b00,#765500)";

  if(c.color==="green")
    color="linear-gradient(90deg,#063c25,#079b55,#21d47b,#079b55,#063c25)";

  if(c.color==="black")
    color="linear-gradient(90deg,#050505,#333,#777,#222,#050505)";

  $("player").querySelector(".carBody").style.background=color;
  $("player").querySelector(".carHood").style.background=color;
}

/* TRACK */
function applyTrack(){

  $("sky").style.background=
    tracks[selectedTrack].bg;

  $("moon").style.display=
    selectedTrack==="night"?"block":"none";

  $("sun").style.display=
    selectedTrack==="night"?"none":"block";

  document.querySelector(".stars").style.display=
    selectedTrack==="night"?"block":"none";

  $("city").style.display=
    selectedTrack==="city"?"flex":"none";
}

/* START */
function startGame(){

  startAudio();

  running=true;
  paused=false;

  score=0;
  coins=0;
  lives=3;
  speed=5;
  nitro=100;

  playerX=innerWidth/2;

  enemies.forEach(e=>e.el.remove());
  coinList.forEach(c=>c.el.remove());

  enemies=[];
  coinList=[];

  enemyTimer=0;
  coinTimer=0;

  applyCar();
  applyTrack();
  updateHUD();

  showScreen("menuScreen");

  document.querySelectorAll(".screen")
    .forEach(x=>x.classList.add("hidden"));

  $("pauseScreen").classList.add("hidden");
}

/* REAL RACE START */
function beginRace(){

  startAudio();

  running=true;
  paused=false;

  score=0;
  coins=0;
  lives=3;
  nitro=100;

  speed=5*cars[selectedCar].speed;

  playerX=innerWidth/2;

  enemies.forEach(e=>e.el.remove());
  coinList.forEach(c=>c.el.remove());

  enemies=[];
  coinList=[];

  updateHUD();

  document.querySelectorAll(".screen")
    .forEach(x=>x.classList.add("hidden"));

  sound(500,.15);
}

/* HUD */
function updateHUD(){

  $("score").textContent=Math.floor(score);
  $("coins").textContent=coins;
  $("lives").textContent=lives;
  $("speed").textContent=Math.floor(speed*25);

  $("bankCoins").textContent=bankCoins;
}

/* CONTROL */
function setDirection(x){

  if(!running||paused)return;

  direction=
    x<innerWidth/2?-1:1;
}

function stopDirection(){
  direction=0;
}

$("leftTouch").addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    setDirection(innerWidth*.2);
  },
  {passive:false}
);

$("rightTouch").addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    setDirection(innerWidth*.8);
  },
  {passive:false}
);

game.addEventListener(
  "touchmove",
  e=>{
    if(!running)return;

    e.preventDefault();

    if(e.touches.length)
      setDirection(e.touches[0].clientX);
  },
  {passive:false}
);

game.addEventListener(
  "touchend",
  e=>{
    if(e.touches.length===0)
      stopDirection();
  },
  {passive:false}
);

game.addEventListener(
  "mousedown",
  e=>setDirection(e.clientX)
);

game.addEventListener(
  "mouseup",
  stopDirection
);

/* KEYBOARD */
document.addEventListener("keydown",e=>{

  if(
    e.key==="ArrowLeft"||
    e.key.toLowerCase()==="a"
  )
    direction=-1;

  if(
    e.key==="ArrowRight"||
    e.key.toLowerCase()==="d"
  )
    direction=1;

  if(e.code==="Space")
    nitroActive(true);

  if(e.key==="Escape"&&running)
    togglePause();
});

document.addEventListener("keyup",e=>{

  if(
    ["ArrowLeft","ArrowRight","a","d"]
      .includes(e.key)
  )
    direction=0;

  if(e.code==="Space")
    nitroActive(false);
});

/* NITRO */
function nitroActive(value){

  if(!running||paused)return;

  turbo=value&&nitro>0;

  $("flame").style.display=
    turbo?"block":"none";
}

game.addEventListener(
  "touchstart",
  e=>{

    if(!e.touches.length)return;

    const t=e.touches[0];

    if(
      t.clientY>innerHeight*.78&&
      Math.abs(t.clientX-innerWidth/2)<75
    ){
      nitroActive(true);
    }
  },
  {passive:false}
);

game.addEventListener(
  "touchend",
  ()=>nitroActive(false)
);

/* ENEMY */
function createEnemy(){

  const el=document.createElement("div");

  const colors=["red","blue","yellow","green"];

  el.className=
    "enemy "+
    colors[Math.floor(Math.random()*colors.length)];

  const glass=document.createElement("div");

  glass.className="enemyGlass";

  el.appendChild(glass);

  const left=innerWidth*.15;
  const right=innerWidth*.85;

  const x=
    left+25+
    Math.random()*
    Math.max(20,right-left-80);

  el.style.left=x+"px";
  el.style.top="-120px";

  game.appendChild(el);

  enemies.push({
    el,
    x,
    y:-120,
    speed:.7+Math.random()*.5
  });
}

/* COIN */
function createCoin(){

  const el=document.createElement("div");

  el.className="coin";

  const left=innerWidth*.15;
  const right=innerWidth*.85;

  const x=
    left+35+
    Math.random()*
    Math.max(20,right-left-90);

  el.style.left=x+"px";
  el.style.top="-40px";

  game.appendChild(el);

  coinList.push({
    el,
    x,
    y:-40
  });
}

/* COLLISION */
function collision(a,b){

  const r1=a.getBoundingClientRect();
  const r2=b.getBoundingClientRect();

  return !(
    r1.right<r2.left||
    r1.left>r2.right||
    r1.bottom<r2.top||
    r1.top>r2.bottom
  );
}

/* CRASH */
function crash(enemy){

  lives--;

  lives=Math.max(0,lives);

  $("lives").textContent=lives;

  enemy.el.remove();

  enemies=enemies.filter(e=>e!==enemy);

  $("damage").animate(
    [
      {opacity:0},
      {opacity:1},
      {opacity:0}
    ],
    {duration:400}
  );

  sound(80,.3,"sawtooth");

  if(vibrationOn&&navigator.vibrate)
    navigator.vibrate([100,50,100]);

  if(lives<=0)
    endGame();
}

/* GAME OVER */
function endGame(){

  running=false;
  paused=false;
  direction=0;
  turbo=false;

  $("flame").style.display="none";

  if(score>best){

    best=Math.floor(score);

    localStorage.setItem(
      "turboBest",
      best
    );
  }

  bankCoins+=coins;

  localStorage.setItem(
    "turboCoins",
    bankCoins
  );

  $("finalScore").textContent=Math.floor(score);
  $("finalCoins").textContent=coins;
  $("bestScore").textContent=best;

  showScreen("gameOver");

  sound(120,.4,"sawtooth");
}

/* PAUSE */
function togglePause(){

  if(!running)return;

  paused=!paused;

  if(paused){

    showScreen("pauseScreen");
    sound(300,.08);

  }else{

    document.querySelectorAll(".screen")
      .forEach(x=>x.classList.add("hidden"));
  }
}

/* UPDATE */
function update(){

  if(!running||paused)return;

  /* player */
  const move=
    direction*
    (4.5+(speed*.25));

  playerX+=move;

  const minX=innerWidth*.12;
  const maxX=innerWidth*.88;

  playerX=
    Math.max(minX,Math.min(maxX,playerX));

  $("player").style.left=
    playerX+"px";

  $("player").style.transform=
    `translateX(-50%) rotate(${direction*8}deg)`;

  /* nitro */
  if(turbo&&nitro>0){

    nitro-=.8;

    speed=
      8*cars[selectedCar].speed;

  }else{

    nitro=Math.min(100,nitro+.08);

    speed=
      5*cars[selectedCar].speed;
  }

  $("nitroFill").style.width=
    nitro+"%";

  /* road */
  lines.forEach(line=>{

    line.y+=speed*1.8;

    if(line.y>innerHeight+100)
      line.y=-120;

    line.el.style.top=
      line.y+"px";
  });

  /* enemies */
  enemyTimer++;

  const spawnRate=
    selectedTrack==="rain"?42:
    selectedTrack==="night"?48:
    58;

  if(enemyTimer>spawnRate){

    createEnemy();

    enemyTimer=0;
  }

  enemies.forEach(enemy=>{

    enemy.y+=
      speed*
      enemy.speed*
      (selectedTrack==="rain"?1.05:1);

    enemy.el.style.top=
      enemy.y+"px";

    if(
      collision(
        $("player"),
        enemy.el
      )
    ){
      crash(enemy);
    }

    if(enemy.y>innerHeight+130){

      enemy.el.remove();

      score+=10;

      enemies=enemies.filter(
        e=>e!==enemy
      );
    }
  });

  /* coins */
  coinTimer++;

  if(coinTimer>75){

    createCoin();

    coinTimer=0;
  }

  coinList.forEach(c=>{

    c.y+=speed*1.6;

    c.el.style.top=
      c.y+"px";

    if(
      collision(
        $("player"),
        c.el
      )
    ){

      coins++;
      score+=50;

      sound(900,.08,"square");

      c.el.remove();

      coinList=coinList.filter(
        x=>x!==c
      );
    }

    if(c.y>innerHeight+50){

      c.el.remove();

      coinList=coinList.filter(
        x=>x!==c
      );
    }
  });

  /* score */
  score+=.12;

  updateHUD();
}

/* LOOP */
function loop(){
  update();
  requestAnimationFrame(loop);
}

/* BUTTONS */
$("playBtn").onclick=()=>{
  beginRace();
};

$("garageBtn").onclick=()=>{
  renderGarage();
  showScreen("garageScreen");
};

$("trackBtn").onclick=()=>{
  showScreen("trackScreen");
};

$("settingsBtn").onclick=()=>{
  $("soundBtn").textContent=
    soundOn?"AÇIK":"KAPALI";

  $("soundBtn").classList.toggle(
    "on",soundOn
  );

  $("vibrationBtn").textContent=
    vibrationOn?"AÇIK":"KAPALI";

  $("vibrationBtn").classList.toggle(
    "on",vibrationOn
  );

  showScreen("settingsScreen");
};

/* TRACK BUTTONS */
document.querySelectorAll(".track")
.forEach(btn=>{

  btn.onclick=()=>{

    selectedTrack=
      btn.dataset.track;

    localStorage.setItem(
      "selectedTrack",
      selectedTrack
    );

    document.querySelectorAll(".track")
      .forEach(x=>
        x.classList.remove("selected")
      );

    btn.classList.add("selected");

    applyTrack();

    sound(600,.07);
  };
});

/* SOUND */
$("soundBtn").onclick=()=>{

  soundOn=!soundOn;

  localStorage.setItem(
    "turboSound",
    soundOn?"on":"off"
  );

  $("soundBtn").textContent=
    soundOn?"AÇIK":"KAPALI";

  $("soundBtn").classList.toggle(
    "on",soundOn
  );

  if(soundOn)startAudio();
};

/* VIBRATION */
$("vibrationBtn").onclick=()=>{

  vibrationOn=!vibrationOn;

  localStorage.setItem(
    "turboVibration",
    vibrationOn?"on":"off"
  );

  $("vibrationBtn").textContent=
    vibrationOn?"AÇIK":"KAPALI";

  $("vibrationBtn").classList.toggle(
    "on",vibrationOn
  );
};

/* PAUSE */
$("pause").onclick=togglePause;
$("continueBtn").onclick=togglePause;

$("pauseMenuBtn").onclick=()=>{

  running=false;
  paused=false;
  direction=0;

  enemies.forEach(e=>e.el.remove());
  coinList.forEach(c=>c.el.remove());

  enemies=[];
  coinList=[];

  showScreen("menuScreen");
};

/* RESTART */
$("restartBtn").onclick=()=>{
  beginRace();
};

$("gameOverMenu").onclick=()=>{

  showScreen("menuScreen");

  $("bankCoins").textContent=
    bankCoins;
};

/* TRACK SELECTED */
function refreshTrack(){

  document.querySelectorAll(".track")
    .forEach(btn=>{

      btn.classList.toggle(
        "selected",
        btn.dataset.track===selectedTrack
      );
    });
}

/* RESIZE */
window.addEventListener("resize",()=>{

  if(!running)
    playerX=innerWidth/2;

});

/* INIT */
createCity();
createLines();
applyCar();
applyTrack();
refreshTrack();

$("bankCoins").textContent=bankCoins;

loop();
</script>

</body>
</html>
