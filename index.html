<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road - Ultimate</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#111;
}

/* SKY */

#sky{
  position:absolute;
  inset:0;
  height:58%;
  background:
    linear-gradient(
      #071426 0%,
      #24506e 52%,
      #d27a42 100%
    );
}

.sun{
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  right:12%;
  top:12%;
  background:#fff2a0;
  box-shadow:0 0 45px #ffd35a;
}

.moon{
  display:none;
  position:absolute;
  width:58px;
  height:58px;
  right:13%;
  top:12%;
  border-radius:50%;
  background:#eee;
  box-shadow:0 0 30px white;
}

/* CITY */

#city{
  position:absolute;
  z-index:3;
  left:0;
  right:0;
  bottom:39%;
  height:20%;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
}

.building{
  flex:0 0 35px;
  margin-right:5px;
  background:#101923;
  border-top:2px solid #2c3947;
  position:relative;
}

.window{
  position:absolute;
  width:5px;
  height:7px;
  background:#ffd967;
  box-shadow:0 0 5px #ffd967;
}

/* ROAD */

#roadArea{
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  top:43%;
  bottom:0;
  overflow:hidden;
  background:#151515;
}

#road{
  position:absolute;
  left:0;
  right:0;
  top:0;
  bottom:0;

  background:
    linear-gradient(
      90deg,
      #565656 0%,
      #292929 8%,
      #1c1c1c 15%,
      #252525 50%,
      #1c1c1c 85%,
      #292929 92%,
      #565656 100%
    );

  clip-path:polygon(
    45% 0,
    55% 0,
    100% 100%,
    0 100%
  );
}

/* road shoulders */

.shoulder{
  position:absolute;
  top:0;
  bottom:0;
  width:7px;
  background:#eee;
  box-shadow:0 0 8px #fff;
  z-index:10;
}

.shoulder.left{
  left:calc(45% - 3px);
  transform:rotate(-18deg);
  transform-origin:top;
}

.shoulder.right{
  left:calc(55% - 3px);
  transform:rotate(18deg);
  transform-origin:top;
}

/* lane markings */

.lane{
  position:absolute;
  top:0;
  width:5px;
  height:100%;
  background:repeating-linear-gradient(
    to bottom,
    #eee 0 45px,
    transparent 45px 90px
  );
  transform-origin:top;
  z-index:8;
}

.lane.left{
  left:50%;
  transform:translateX(-50%) rotate(-7deg);
}

.lane.right{
  left:50%;
  transform:translateX(-50%) rotate(7deg);
}

/* HORIZON */

#horizon{
  position:absolute;
  z-index:9;
  top:-2px;
  left:0;
  right:0;
  height:12px;
  background:linear-gradient(
    rgba(255,255,255,.12),
    transparent
  );
}

/* HUD */

#hud{
  position:absolute;
  z-index:100;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.hudBox{
  color:#fff;
  padding:8px 10px;
  border-radius:11px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.18);
  font-size:13px;
  font-weight:bold;
  text-shadow:0 2px 4px #000;
}

/* PLAYER */

#player{
  position:absolute;
  z-index:60;
  width:92px;
  height:145px;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  transition:transform .08s linear;
  filter:drop-shadow(0 12px 8px rgba(0,0,0,.8));
}

/* realistic-ish Mustang */

.carBody{
  position:absolute;
  left:7px;
  top:15px;
  width:78px;
  height:120px;
  border-radius:25px 25px 12px 12px;

  background:
    linear-gradient(
      90deg,
      #470000 0%,
      #a60000 10%,
      #ed1717 35%,
      #ff3939 50%,
      #d60000 72%,
      #580000 100%
    );

  border:2px solid #300000;
  box-shadow:
    inset 0 0 8px rgba(255,255,255,.25),
    inset 0 -12px 15px rgba(0,0,0,.35);
}

.hood{
  position:absolute;
  left:13px;
  top:6px;
  width:66px;
  height:49px;
  border-radius:22px 22px 8px 8px;
  background:
    linear-gradient(
      90deg,
      #820000,
      #e81616,
      #ff4444,
      #ad0000
    );
  border-bottom:3px solid #640000;
}

.hoodLine{
  position:absolute;
  left:45px;
  top:7px;
  width:3px;
  height:42px;
  background:rgba(70,0,0,.6);
}

/* windshield */

.windshield{
  position:absolute;
  left:18px;
  top:42px;
  width:56px;
  height:37px;
  border-radius:15px 15px 5px 5px;

  background:
    linear-gradient(
      135deg,
      #cceeff,
      #31566d 40%,
      #081725 100%
    );

  border:2px solid #080b0e;
}

.windshieldLine{
  position:absolute;
  left:45px;
  top:44px;
  width:3px;
  height:31px;
  background:#090909;
  z-index:4;
}

/* grille */

.grille{
  position:absolute;
  left:18px;
  bottom:13px;
  width:56px;
  height:22px;
  background:#090909;
  border:2px solid #777;
  border-radius:5px;
  overflow:hidden;
}

.grilleLine{
  position:absolute;
  top:2px;
  bottom:2px;
  width:2px;
  background:#777;
}

.grilleLine:nth-child(1){left:9px}
.grilleLine:nth-child(2){left:19px}
.grilleLine:nth-child(3){left:29px}
.grilleLine:nth-child(4){left:39px}
.grilleLine:nth-child(5){left:49px}

.headlight{
  position:absolute;
  bottom:17px;
  width:14px;
  height:10px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 15px #fff;
  z-index:10;
}

.headlight.l{left:11px}
.headlight.r{right:11px}

.bumper{
  position:absolute;
  left:13px;
  bottom:5px;
  width:66px;
  height:8px;
  border-radius:5px;
  background:linear-gradient(#eee,#666);
}

.wheel{
  position:absolute;
  width:14px;
  height:35px;
  border-radius:6px;
  background:#050505;
  box-shadow:
    inset 0 0 0 3px #252525,
    0 2px 4px #000;
  z-index:20;
}

.wheel.l1{left:-2px;top:39px}
.wheel.l2{left:-2px;bottom:27px}
.wheel.r1{right:-2px;top:39px}
.wheel.r2{right:-2px;bottom:27px}

.horse{
  position:absolute;
  z-index:30;
  left:40px;
  bottom:39px;
  color:#fff;
  font-size:14px;
}

/* enemy cars */

.enemy{
  position:absolute;
  z-index:45;
  width:62px;
  height:100px;
  border-radius:17px 17px 10px 10px;
  transform-origin:center center;
  box-shadow:0 8px 14px rgba(0,0,0,.7);
}

.enemy.red{
  background:linear-gradient(
    90deg,
    #410000,
    #d51414,
    #ff3c3c,
    #790000
  );
}

.enemy.blue{
  background:linear-gradient(
    90deg,
    #031d48,
    #1673d5,
    #4da5ff,
    #06255c
  );
}

.enemy.yellow{
  background:linear-gradient(
    90deg,
    #604800,
    #e8ad00,
    #ffe24b,
    #8a6200
  );
}

.enemy.green{
  background:linear-gradient(
    90deg,
    #02351f,
    #079454,
    #27d77e,
    #034c2c
  );
}

.enemyTop{
  position:absolute;
  left:9px;
  top:14px;
  width:44px;
  height:30px;
  border-radius:10px 10px 4px 4px;
  background:linear-gradient(
    135deg,
    #c8edff,
    #23475d,
    #081724
  );
  border:2px solid #111;
}

.enemyLine{
  position:absolute;
  left:30px;
  top:15px;
  width:3px;
  height:27px;
  background:#111;
}

.enemyLight{
  position:absolute;
  width:9px;
  height:7px;
  bottom:11px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 8px #fff;
}

.enemyLight.l{left:8px}
.enemyLight.r{right:8px}

.enemyWheel{
  position:absolute;
  width:10px;
  height:28px;
  background:#050505;
  border-radius:5px;
  box-shadow:inset 0 0 0 2px #333;
}

.enemyWheel.l1{left:-4px;top:31px}
.enemyWheel.l2{left:-4px;bottom:18px}
.enemyWheel.r1{right:-4px;top:31px}
.enemyWheel.r2{right:-4px;bottom:18px}

/* coins */

.coin{
  position:absolute;
  z-index:42;
  width:30px;
  height:30px;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      #fff8a5 0 15%,
      #ffd000 20% 65%,
      #9b6500 70%
    );
  border:2px solid #fff0a0;
  box-shadow:0 0 18px #ffd000;
  transform-origin:center;
}

/* NITRO */

#nitro{
  position:absolute;
  z-index:105;
  left:12px;
  bottom:18px;
  width:155px;
}

#nitroTitle{
  color:white;
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
  text-shadow:0 2px 4px #000;
}

#nitroBar{
  height:15px;
  border:1px solid #777;
  border-radius:10px;
  background:#111;
  overflow:hidden;
}

#nitroFill{
  width:100%;
  height:100%;
  background:linear-gradient(
    90deg,
    #00bfff,
    #315cff,
    #c6baff
  );
}

/* controls */

.touch{
  position:absolute;
  z-index:75;
  top:45%;
  bottom:0;
  width:50%;
}

#leftTouch{left:0}
#rightTouch{right:0}

#hint{
  position:absolute;
  z-index:76;
  bottom:88px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.6);
  font-size:11px;
}

/* pause */

#pause{
  position:absolute;
  z-index:120;
  right:12px;
  top:58px;
  width:43px;
  height:43px;
  border:0;
  border-radius:12px;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:19px;
}

/* DAMAGE */

#damage{
  position:absolute;
  inset:0;
  z-index:110;
  pointer-events:none;
  background:rgba(255,0,0,.4);
  opacity:0;
}

/* MENU */

.screen{
  position:absolute;
  inset:0;
  z-index:500;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  background:
    radial-gradient(
      circle at center,
      rgba(50,20,15,.7),
      rgba(0,0,0,.94)
    );
  padding:22px;
}

.screen h1{
  font-size:40px;
  margin-bottom:10px;
  text-shadow:
    0 0 8px #ff3b00,
    0 0 25px #ff1800;
}

.screen p{
  color:#ddd;
  line-height:1.6;
  margin-bottom:20px;
}

.btn{
  border:0;
  border-radius:14px;
  padding:14px 24px;
  margin:5px;
  color:white;
  background:linear-gradient(135deg,#c90000,#ff6100);
  font-weight:bold;
  font-size:17px;
  box-shadow:0 8px 25px rgba(255,40,0,.35);
}

.menuBtn{
  width:230px;
}

.hidden{
  display:none!important;
}

/* SHOP */

#shopScreen{
  justify-content:flex-start;
  padding-top:25px;
  overflow:auto;
}

.shopTitle{
  font-size:28px;
  margin-bottom:10px;
}

.carGrid{
  display:grid;
  grid-template-columns:repeat(2, minmax(120px,1fr));
  gap:10px;
  width:min(440px,95vw);
}

.carCard{
  padding:10px;
  border-radius:15px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
}

.miniCar{
  width:55px;
  height:85px;
  margin:0 auto 5px;
  position:relative;
  border-radius:15px;
  background:linear-gradient(
    90deg,
    #550000,
    #f22,
    #800000
  );
  box-shadow:0 5px 10px #000;
}

.miniCar.blue{
  background:linear-gradient(90deg,#06275c,#168cff,#06275c);
}

.miniCar.black{
  background:linear-gradient(90deg,#050505,#555,#080808);
}

.miniCar.green{
  background:linear-gradient(90deg,#034b2d,#1bd77d,#034b2d);
}

.carName{
  font-weight:bold;
  margin-bottom:4px;
}

.carPrice{
  font-size:12px;
  color:#ffd84d;
  margin-bottom:5px;
}

.smallBtn{
  border:0;
  padding:8px 12px;
  border-radius:9px;
  color:#fff;
  background:#b60000;
  font-weight:bold;
}

#shopCoins{
  margin-bottom:12px;
  color:#ffd83d;
  font-weight:bold;
}

/* settings */

.settingRow{
  width:min(350px,90vw);
  padding:15px;
  margin:8px;
  border-radius:13px;
  background:rgba(255,255,255,.1);
}

.toggle{
  margin-left:15px;
}

/* responsive */

@media(max-width:380px){
  .hudBox{
    padding:6px 7px;
    font-size:11px;
  }

  #player{
    transform:translateX(-50%) scale(.88);
  }

  .screen h1{
    font-size:32px;
  }
}
</style>
</head>

<body>

<script>

/* ==========================================
   TURBO ROAD ULTIMATE
========================================== */

const game=document.getElementById("game");
const player=document.getElementById("player");

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const livesEl=document.getElementById("lives");
const speedEl=document.getElementById("speed");

const nitroFill=document.getElementById("nitroFill");

const startScreen=document.getElementById("startScreen");
const shopScreen=document.getElementById("shopScreen");
const settingsScreen=document.getElementById("settingsScreen");
const pauseScreen=document.getElementById("pauseScreen");
const gameOver=document.getElementById("gameOver");

let running=false;
let paused=false;

let playerX=innerWidth/2;
let direction=0;

let score=0;
let coins=0;
let lives=3;

let gameSpeed=5;
let nitro=100;
let turbo=false;

let enemies=[];
let coinObjects=[];

let spawnTimer=0;
let coinTimer=0;

let soundEnabled=true;
let nightMode=false;

let best=Number(
  localStorage.getItem("turboRoadBest") || 0
);

let wallet=Number(
  localStorage.getItem("turboRoadCoins") || 0
);

let selectedCar=
  localStorage.getItem("turboSelectedCar") || "mustang";

let ownedCars=
  JSON.parse(
    localStorage.getItem("turboOwnedCars") ||
    '["mustang"]'
  );

let audio=null;

/* ==========================================
   AUDIO
========================================== */

function initAudio(){

  if(audio)return;

  try{

    audio=new(
      window.AudioContext ||
      window.webkitAudioContext
    )();

  }catch(e){}

}

function beep(freq,duration=.12,type="sine"){

  if(!soundEnabled)return;

  initAudio();

  if(!audio)return;

  try{

    if(audio.state==="suspended")
      audio.resume();

    const oscillator=
      audio.createOscillator();

    const gain=
      audio.createGain();

    oscillator.type=type;
    oscillator.frequency.value=freq;

    gain.gain.setValueAtTime(
      .045,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+duration
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
      audio.currentTime+duration
    );

  }catch(e){}
}

function crashSound(){

  if(!soundEnabled)return;

  initAudio();

  if(!audio)return;

  try{

    const osc=audio.createOscillator();
    const gain=audio.createGain();

    osc.type="sawtooth";
    osc.frequency.setValueAtTime(
      110,
      audio.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      35,
      audio.currentTime+.5
    );

    gain.gain.setValueAtTime(
      .08,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+.5
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime+.5);

  }catch(e){}

}

/* ==========================================
   CITY
========================================== */

function createCity(){

  const city=
    document.getElementById("city");

  city.innerHTML="";

  for(let i=0;i<45;i++){

    const b=
      document.createElement("div");

    b.className="building";

    b.style.height=
      (30+Math.random()*110)+"px";

    for(let j=0;j<10;j++){

/* ==========================================
   CONTROL
========================================== */

function setDirection(value){

  if(!running || paused)return;

  direction=value;

}

function moveLeft(){
  setDirection(-1);
}

function moveRight(){
  setDirection(1);
}

function stopMove(){
  direction=0;
}

document
.getElementById("leftTouch")
.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    moveLeft();
  },
  {passive:false}
);

document
.getElementById("rightTouch")
.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    moveRight();
  },
  {passive:false}
);

game.addEventListener(
  "touchend",
  e=>{
    if(e.target.closest(".screen"))return;
    stopMove();
  },
  {passive:false}
);

game.addEventListener(
  "mousedown",
  e=>{

    if(e.clientX<innerWidth/2)
      moveLeft();
    else
      moveRight();

  }
);

game.addEventListener(
  "mouseup",
  stopMove
);

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    )
      moveLeft();

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    )
      moveRight();

    if(e.code==="Space")
      nitroActive(true);

  }
);

document.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="a" ||
      e.key.toLowerCase()==="d"
    )
      stopMove();

    if(e.code==="Space")
      nitroActive(false);

  }
);

/* ==========================================
   NITRO
========================================== */

function nitroActive(value){

  if(!running || paused)return;

  turbo=
    value &&
    nitro>0;

}

game.addEventListener(
  "touchstart",
  e=>{

    if(!e.touches.length)return;

    const t=e.touches[0];

    if(
      t.clientY>innerHeight*.78 &&
      Math.abs(
        t.clientX-innerWidth/2
      )<70
    ){

      nitroActive(true);

    }

  },
  {passive:false}
);

game.addEventListener(
  "touchend",
  ()=>{
    turbo=false;
  }
);

/* ==========================================
   ROAD POSITION
========================================== */

function lanePosition(lane,progress){

  /*
    Ufuk:
    yol yaklaşık 45-55%

    Alt:
    0-100%

    Böylece araçlar yolun içinden
    gerçek bir perspektifle geliyor.
  */

  const horizonY=
    innerHeight*.43;

  const bottomY=
    innerHeight-80;

  const y=
    horizonY+
    (bottomY-horizonY)*
    progress;

  const center=
    innerWidth/2;

  const spread=
    innerWidth*.43;

  const laneOffset=
    [-1,0,1][lane]*
    spread*
    (0.10+
     progress*.90);

  const x=
    center+laneOffset;

  return {x,y};

}

/* ==========================================
   COLLISION
========================================== */

function collision(a,b){

  const r1=
    a.getBoundingClientRect();

  const r2=
    b.getBoundingClientRect();

  return !(
    r1.right<r2.left ||
    r1.left>r2.right ||
    r1.bottom<r2.top ||
    r1.top>r2.bottom
  );

}

/* ==========================================
   CRASH
========================================== */

function crash(enemy){

  lives--;

  livesEl.textContent=
    lives;

  crashSound();

  if(navigator.vibrate){

    navigator.vibrate(
      [120,50,150]
    );

  }

  const damage=
    document.getElementById("damage");

  damage.animate(
    [
      {opacity:0},
      {opacity:1},
      {opacity:0}
    ],
    {
      duration:550
    }
  );

  if(enemy){

    enemy.el.remove();

    enemies=
      enemies.filter(
        x=>x!==enemy
      );

  }

  playerX=
    innerWidth/2;

  if(lives<=0)
    endGame();

}

/* ==========================================
   GAME LOOP
========================================== */

let lastTime=0;

function loop(time){

  if(!running){

    requestAnimationFrame(loop);
    return;

  }

  if(paused){

    requestAnimationFrame(loop);
    return;

  }

  const dt=
    Math.min(
      35,
      time-lastTime
    );

  lastTime=time;

  /* speed */

  if(turbo && nitro>0){

    nitro-=.75;

    gameSpeed=
      Math.min(
        12,
        gameSpeed+.025
      );

  }else{

    nitro+=.12;

    gameSpeed=
      Math.min(
        8,
        gameSpeed+.003
      );

  }

  nitro=
    Math.max(
      0,
      Math.min(
        100,
        nitro
      )
    );

  nitroFill.style.width=
    nitro+"%";

  speedEl.textContent=
    Math.floor(
      gameSpeed*22
    );

  /* player */

  playerX+=
    direction*
    (6+
     gameSpeed*.55);

  const margin=
    innerWidth*.12;

  playerX=
    Math.max(
      margin,
      Math.min(
        innerWidth-margin,
        playerX
      )
    );

  updatePlayer();

  /* score */

  score+=
    .025*
    gameSpeed;

  scoreEl.textContent=
    Math.floor(score);

  /* spawn */

  spawnTimer+=dt;

  if(
    spawnTimer>
    Math.max(
      550,
      1200-
      gameSpeed*70
    )
  ){

    createEnemy();

    spawnTimer=0;

  }

  coinTimer+=dt;

  if(coinTimer>850){

    createCoin();

    coinTimer=0;

  }

  /* enemies */

  enemies.forEach(
    enemy=>{

      enemy.progress+=
        (gameSpeed/1000)*dt;

      const p=
        Math.min(
          1,
          enemy.progress
        );

      const pos=
        lanePosition(
          enemy.lane,
          p
        );

      const scale=
        .18+
        p*1.05;

      enemy.el.style.left=
        pos.x+"px";

      enemy.el.style.top=
        pos.y+"px";

      enemy.el.style.transform=
        `translateX(-50%) scale(${scale})`;

      /*
        Çarpışmayı yalnızca araç
        oyuncuya yaklaştığında kontrol ediyoruz.
      */

      if(
        p>.72 &&
        collision(
          player,
          enemy.el
        )
      ){

        crash(enemy);

      }

      if(p>=1.15){

        enemy.el.remove();

      }

    }
  );

  enemies=
    enemies.filter(
      e=>e.progress<1.15
    );

  /* coins */

  coinObjects.forEach(
    coin=>{

      coin.progress+=
        (gameSpeed/1100)*dt;

      const p=
        Math.min(
          1,
          coin.progress
        );

      const pos=
        lanePosition(
          coin.lane,
          p
        );

      const scale=
        .2+
        p*.85;

      coin.rotate+=12;

      coin.el.style.left=
        pos.x+"px";

      coin.el.style.top=
        pos.y+"px";

      coin.el.style.transform=
        `translateX(-50%)
         scale(${scale})
         rotateY(${coin.rotate}deg)`;

      if(
        p>.72 &&
        collision(
          player,
          coin.el
        )
      ){

        wallet++;

        coins++;

        score+=100;

        localStorage.setItem(
          "turboRoadCoins",
          wallet
        );

        coinsEl.textContent=
          coins;

        beep(
          900,
          .08,
          "sine"
        );

        coin.el.remove();

        coin.progress=2;

      }

      if(p>=1.1){

        coin.el.remove();

      }

    }
  );

  coinObjects=
    coinObjects.filter(
      c=>c.progress<1.1
    );

  requestAnimationFrame(loop);

}

/* ==========================================

========================================== */

function startGame(){

  initAudio();

  running=true;
  paused=false;

  score=0;
  coins=0;
  lives=3;

  gameSpeed=5;
  nitro=100;

  playerX=
    innerWidth/2;

  direction=0;

  scoreEl.textContent="0";
  coinsEl.textContent="0";
  livesEl.textContent="3";

  enemies.forEach(
    e=>e.el.remove()
  );

  coinObjects.forEach(
    c=>c.el.remove()
  );

  enemies=[];
  coinObjects=[];

  spawnTimer=0;
  coinTimer=0;

  startScreen.classList.add("hidden");
  gameOver.classList.add("hidden");
  pauseScreen.classList.add("hidden");

  beep(
    440,
    .15,
    "square"
  );

}

/* ==========================================
   GAME OVER
========================================== */

function endGame(){

  running=false;
  paused=false;

  if(
    Math.floor(score)>best
  ){

    best=
      Math.floor(score);

    localStorage.setItem(
      "turboRoadBest",
      best
    );

  }

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(score);

  document.getElementById(
    "finalCoins"
  ).textContent=
    coins;

  document.getElementById(
    "bestScore"
  ).textContent=
    best;

  gameOver.classList.remove(
    "hidden"
  );

}

/* ==========================================
   GARAGE
========================================== */

const cars=[

  {
    id:"mustang",
    name:"1969 Mustang",
    price:0,
    className:""
  },

  {
    id:"blue",
    name:"Blue Thunder",
    price:500,
    className:"blue"
  },

  {
    id:"black",
    name:"Black Beast",
    price:1000,
    className:"black"
  },

  {
    id:"green",
    name:"Green GT",
    price:2000,
    className:"green"
  }

];

function renderGarage(){

  const grid=
    document.getElementById(
      "carGrid"
    );

  document.getElementById(
    "garageCoins"
  ).textContent=
    wallet;

  grid.innerHTML="";

  cars.forEach(
    car=>{

      const card=
        document.createElement("div");

      card.className="carCard";

      const mini=
        document.createElement("div");

      mini.className=
        "miniCar "+
        car.className;

      const name=
        document.createElement("div");

      name.className="carName";
      name.textContent=
        car.name;

      const price=
        document.createElement("div");

      price.className="carPrice";

      if(
        ownedCars.includes(car.id)
      ){

        price.textContent=
          selectedCar===car.id
          ?"✅ SEÇİLİ"
          :"✅ SAHİP";

      }else{

        price.textContent=
          "🪙 "+car.price;

      }

      const btn=
        document.createElement("button");

      btn.className="smallBtn";

      if(
        ownedCars.includes(car.id)
      ){

        btn.textContent=
          selectedCar===car.id
          ?"SEÇİLİ"
          :"SEÇ";

        btn.onclick=()=>{

          selectedCar=
            car.id;

          localStorage.setItem(
            "turboSelectedCar",
            selectedCar
          );

          renderGarage();

        };

      }else{

        btn.textContent=
          "SATIN AL";

        btn.onclick=()=>{

          if(wallet>=car.price){

            wallet-=car.price;

            ownedCars.push(
              car.id
            );

            selectedCar=
              car.id;

            localStorage.setItem(
              "turboRoadCoins",
              wallet
            );

            localStorage.setItem(
              "turboOwnedCars",
              JSON.stringify(
                ownedCars
              )
            );

            localStorage.setItem(
              "turboSelectedCar",
              selectedCar
            );

            beep(
              1000,
              .15,
              "square"
            );

            renderGarage();

          }else{

            beep(
              100,
              .25,
              "sawtooth"
            );

            alert(
              "Bu arabayı almak için daha fazla coin gerekiyor."
            );

          }

        };

      }

      card.appendChild(mini);
      card.appendChild(name);
      card.appendChild(price);
      card.appendChild(btn);

      grid.appendChild(card);

    }
  );

}
