<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Turbo Road X</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#top{
 position:absolute;top:12px;left:12px;right:12px;
 display:flex;gap:8px;justify-content:space-between
}
.stat{
 min-width:75px;padding:8px 11px;border-radius:12px;
 background:rgba(5,8,13,.78);color:#fff;
 border:1px solid rgba(255,255,255,.12);font-size:10px;
 text-align:center
}
.stat b{display:block;font-size:17px;margin-top:2px}
#pause{
 pointer-events:auto;width:44px;height:44px;border:0;border-radius:12px;
 background:rgba(5,8,13,.82);color:#fff;font-size:17px
}
#controls{
 position:absolute;left:0;right:0;bottom:22px;
 display:flex;justify-content:space-between;padding:0 22px
}
.control{
 pointer-events:auto;width:78px;height:78px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 color:#fff;font-size:35px;
 background:rgba(5,8,13,.62);
 border:1px solid rgba(255,255,255,.2)
}
#nitro{
 pointer-events:auto;position:absolute;right:25px;bottom:118px;
 width:78px;height:78px;border-radius:50%;
 background:rgba(0,120,255,.28);border:2px solid #42b9ff;
 color:white;font-size:11px;font-weight:bold;
 display:flex;align-items:center;justify-content:center
}
#screen{
 position:fixed;inset:0;z-index:20;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(180deg,#080c13,#020305)
}
.card{
 width:min(92vw,430px);padding:28px;border-radius:25px;
 background:rgba(12,17,25,.96);
 border:1px solid rgba(255,255,255,.12);
 color:white;text-align:center;
 box-shadow:0 25px 90px #000
}
.logo{font-size:40px;font-weight:900;letter-spacing:2px}
.logo span{color:#ff4324}
.sub{font-size:11px;color:#8290a0;letter-spacing:3px;margin:6px 0 22px}
.carPreview{
 width:110px;height:190px;margin:0 auto 20px;
 position:relative
}
.carBody{
 position:absolute;left:12px;right:12px;top:18px;bottom:18px;
 background:linear-gradient(90deg,#8e120c,#f34b26,#9c130e);
 border-radius:28px 28px 18px 18px;
 box-shadow:0 10px 30px rgba(255,50,20,.3)
}
.carRoof{
 position:absolute;left:27px;right:27px;top:40px;height:55px;
 background:#171d24;
 border-radius:28px 28px 8px 8px;
 border:3px solid #a92a19
}
.carGlass{
 position:absolute;left:34px;right:34px;top:48px;height:36px;
 background:#182b3b;border-radius:16px 16px 4px 4px
}
.w{
 position:absolute;width:18px;height:48px;background:#050608;border-radius:8px
}
.w1{left:0;top:48px}.w2{right:0;top:48px}
.w3{left:0;bottom:48px}.w4{right:0;bottom:48px}
button.start{
 width:100%;padding:16px;border:0;border-radius:15px;
 color:white;background:linear-gradient(135deg,#ff582b,#d51d13);
 font-size:16px;font-weight:900
}
.help{margin-top:15px;color:#758191;font-size:11px;line-height:1.6}
#gameover{display:none}
.result{color:#aab5c2;line-height:1.8;margin:15px 0}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
 <div id="top">
  <div class="stat">SKOR<b id="score">0</b></div>
  <div class="stat">PARA<b id="money">0</b></div>
  <div class="stat">SEVİYE<b id="level">1</b></div>
  <div class="stat">HIZ<b id="speed">0</b></div>
  <button id="pause">Ⅱ</button>
 </div>

 <div id="nitro">NITRO</div>

 <div id="controls">
  <div class="control" id="left">‹</div>
  <div class="control" id="right">›</div>
 </div>
</div>

<div id="screen">
 <div class="card" id="menu">
  <div class="logo">TURBO <span>ROAD</span></div>
  <div class="sub">MUSTANG X</div>

  <div class="carPreview">
   <div class="carBody"></div>
   <div class="carRoof"></div>
   <div class="carGlass"></div>
   <div class="w w1"></div><div class="w w2"></div>
   <div class="w w3"></div><div class="w w4"></div>
  </div>

  <button class="start" id="start">YARIŞA BAŞLA</button>

  <div class="help">
   PC: ← → veya A / D<br>
   Telefon: alt soldan / sağdan dokun<br>
   Nitro: SPACE veya NITRO tuşu
  </div>
 </div>

 <div class="card" id="gameover">
  <div class="logo">KAZA!</div>
  <div class="result" id="result"></div>
  <button class="start" id="again">TEKRAR OYNA</button>
  <button class="start" id="back" style="background:#202833;margin-top:10px">
   ANA MENÜ
  </button>
 </div>
</div>

<script>
"use strict";

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

/* SAVE */
let best=+localStorage.getItem("tr_best")||0;
let bank=+localStorage.getItem("tr_money")||0;

/* GAME */
let playing=false;
let paused=false;
let last=0;
let score=0;
let earned=0;
let level=1;
let worldSpeed=6;
let roadMove=0;
let spawn=0;
let targetLane=1;
let cars=[];
let nitro=100;
let nitroOn=false;

/*
  TÜM ARAÇLARIN TEMEL BOYUTU AYNI.
  Perspektif sadece uzaklık nedeniyle görsel olarak küçültür.
*/
const CAR_W=58;
const CAR_H=96;

const player={
 x:0,
 lane:1,
 y:0,
 w:CAR_W,
 h:CAR_H
};

/* ROAD */
function horizon(){
 return H*.22;
}

function roadWidth(z){
 return W*(.16+.76*z);
}

function roadY(z){
 return horizon()+z*(H*.82-horizon());
}

function laneX(lane,z){
 const rw=roadWidth(z);
 return W/2-rw/2+rw*(lane+.5)/3;
}

/* DRAW BACKGROUND */
function background(){

 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#142337");
 g.addColorStop(.45,"#5d7180");
 g.addColorStop(1,"#304c2d");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 /* sun */
 ctx.fillStyle="rgba(255,235,170,.65)";
 ctx.beginPath();
 ctx.arc(W*.78,H*.16,35,0,Math.PI*2);
 ctx.fill();

 /* mountains */
 ctx.fillStyle="#263936";
 ctx.beginPath();
 ctx.moveTo(0,H*.43);
 ctx.lineTo(W*.14,H*.27);
 ctx.lineTo(W*.27,H*.4);
 ctx.lineTo(W*.42,H*.25);
 ctx.lineTo(W*.57,H*.39);
 ctx.lineTo(W*.72,H*.24);
 ctx.lineTo(W,H*.39);
 ctx.lineTo(W,H*.55);
 ctx.lineTo(0,H*.55);
 ctx.fill();

 ctx.fillStyle="#34552f";
 ctx.fillRect(0,H*.43,W,H*.57);
}

/* TREES */
function tree(x,y,s){

 ctx.fillStyle="#493a2b";
 ctx.fillRect(x-s*.07,y-s*.45,s*.14,s*.45);

 ctx.fillStyle="#1c3922";
 ctx.beginPath();
 ctx.arc(x,y-s*.58,s*.28,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(x-s*.17,y-s*.45,s*.22,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(x+s*.17,y-s*.45,s*.22,0,Math.PI*2);
 ctx.fill();
}

function nature(){

 for(let i=0;i<12;i++){

  let z=(i/12+roadMove*.002)%1;
  let y=roadY(z);
  let rw=roadWidth(z);

  let size=12+z*43;

  tree(W/2-rw/2-size*.8,y,size);
  tree(W/2+rw/2+size*.8,y,size);
 }
}

/* ROAD */
function road(){

 let top=roadWidth(0);
 let bottom=roadWidth(1);
 let hy=roadY(0);
 let by=roadY(1);

 /* shoulders */
 ctx.fillStyle="#55564d";
 ctx.beginPath();
 ctx.moveTo(W/2-top/2,hy);
 ctx.lineTo(W/2+top/2,hy);
 ctx.lineTo(W/2+bottom/2,by);
 ctx.lineTo(W/2-bottom/2,by);
 ctx.closePath();
 ctx.fill();

 /* asphalt */
 ctx.fillStyle="#282c31";
 ctx.beginPath();
 ctx.moveTo(W/2-top/2+7,hy);
 ctx.lineTo(W/2+top/2-7,hy);
 ctx.lineTo(W/2+bottom/2-7,by);
 ctx.lineTo(W/2-bottom/2+7,by);
 ctx.closePath();
 ctx.fill();

 /* edges */
 ctx.strokeStyle="#f0f0ed";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(W/2-top/2,hy);
 ctx.lineTo(W/2-bottom/2,by);
 ctx.moveTo(W/2+top/2,hy);
 ctx.lineTo(W/2+bottom/2,by);
 ctx.stroke();

 /* lane marks */
 for(let lane=1;lane<3;lane++){

  for(let i=0;i<16;i++){

   let a=(i/16+roadMove*.018)%1;
   let b=Math.min(1,a+.025+.035*a);

   let x1=laneX(lane,a);
   let x2=laneX(lane,b);

   ctx.strokeStyle="rgba(255,255,255,.72)";
   ctx.lineWidth=2+3*b;

   ctx.beginPath();
   ctx.moveTo(x1,roadY(a));
   ctx.lineTo(x2,roadY(b));
   ctx.stroke();
  }
 }
}

/* CAR */
function car(x,y,w,h,color,playerCar){

 ctx.save();
 ctx.translate(x,y);

 /* shadow */
 ctx.fillStyle="rgba(0,0,0,.35)";
 ctx.beginPath();
 ctx.ellipse(0,h*.43,w*.48,h*.09,0,0,Math.PI*2);
 ctx.fill();

 /* wheels */
 ctx.fillStyle="#050609";

 ctx.fillRect(-w*.53,-h*.25,w*.18,h*.35);
 ctx.fillRect(w*.35,-h*.25,w*.18,h*.35);
 ctx.fillRect(-w*.53,h*.08,w*.18,h*.35);
 ctx.fillRect(w*.35,h*.08,w*.18,h*.35);

 /* body */
 let grad=ctx.createLinearGradient(-w/2,0,w/2,0);

 if(playerCar){
  grad.addColorStop(0,"#8d100c");
  grad.addColorStop(.5,"#f34a24");
  grad.addColorStop(1,"#8d100c");
 }else{
  grad.addColorStop(0,"#111820");
  grad.addColorStop(.5,color);
  grad.addColorStop(1,"#111820");
 }

 ctx.fillStyle=grad;

 ctx.beginPath();
 ctx.roundRect(-w*.43,-h*.48,w*.86,h*.9,w*.17);
 ctx.fill();

 /* roof */
 ctx.fillStyle=playerCar?"#161b21":"#10161d";

 ctx.beginPath();
 ctx.moveTo(-w*.30,-h*.30);
 ctx.lineTo(-w*.22,-h*.43);
 ctx.quadraticCurveTo(0,-h*.52,w*.22,-h*.43);
 ctx.lineTo(w*.30,-h*.30);
 ctx.closePath();
 ctx.fill();

 /* glass */
 ctx.fillStyle="#173044";

 ctx.beginPath();
 ctx.moveTo(-w*.22,-h*.31);
 ctx.lineTo(-w*.15,-h*.41);
 ctx.lineTo(w*.15,-h*.41);
 ctx.lineTo(w*.22,-h*.31);
 ctx.closePath();
 ctx.fill();

 /* center stripe on Mustang */
 if(playerCar){
  ctx.fillStyle="rgba(255,255,255,.13)";
  ctx.fillRect(-w*.035,-h*.48,w*.07,h*.84);
 }

 /* headlights */
 ctx.fillStyle="#fff4bd";
 ctx.fillRect(-w*.31,-h*.03,w*.14,h*.07);
 ctx.fillRect(w*.17,-h*.03,w*.14,h*.07);

 /* grille */
 ctx.fillStyle="#080a0d";
 ctx.fillRect(-w*.22,h*.24,w*.44,h*.07);

 ctx.restore();
}

/* PLAYER */
function drawPlayer(){

 player.y=H*.78;

 player.x+=(laneX(targetLane,.91)-player.x)*.17;

 car(
  player.x,
  player.y,
  CAR_W,
  CAR_H,
  "#e43620",
  true
 );

 if(nitroOn && nitro>0){

  ctx.fillStyle="#32bfff";

  for(let side of [-1,1]){
   ctx.beginPath();
   ctx.moveTo(
    player.x+side*CAR_W*.13,
    player.y+CAR_H*.42
   );
   ctx.lineTo(
    player.x+side*CAR_W*.08,
    player.y+CAR_H*.75+Math.random()*15
   );
   ctx.lineTo(
    player.x+side*CAR_W*.03,
    player.y+CAR_H*.42
   );
   ctx.fill();
  }
 }
}

/* TRAFFIC */

/*
  Aynı şeritte araçlar arasında güvenli Z mesafesi.
  Yeni araç doğrudan başka aracın üstüne doğmaz.
*/
function canSpawn(lane){

 return !cars.some(c=>
  c.lane===lane && c.z<.28
 );
}

function spawnCar(){

 let lanes=[0,1,2]
  .sort(()=>Math.random()-.5);

 for(let lane of lanes){

  if(!canSpawn(lane))continue;

  cars.push({
   lane:lane,
   z:.01,
   color:[
    "#e9e9e9",
    "#1976b9",
    "#d82c25",
    "#e0a51c",
    "#35a35d",
    "#7d49b8"
   ][Math.floor(Math.random()*6)],
   speed:.19+Math.random()*.055
  });

  return;
 }
}

function trafficSize(z){

 /*
   Uzak araçlar perspektifte küçülür.
   Ancak oyuncu ile trafik aynı z mesafesinde
   aynı temel boyut oranını kullanır.
 */
 let scale=.24+.76*z;

 return {
  w:CAR_W*scale,
  h:CAR_H*scale
 };
}

function updateCars(dt){

 for(let i=cars.length-1;i>=0;i--){

  let a=cars[i];

  a.z+=a.speed*dt*(worldSpeed/6);

  /*
    Aynı şeritteki araçların birbirine yaklaşmasını engelle.
  */
  for(let j=0;j<cars.length;j++){

   if(i===j)continue;

   let b=cars[j];

   if(a.lane===b.lane){

    let dz=b.z-a.z;

    if(dz>0 && dz<.105){
     a.z=b.z-.105;
    }
   }
  }

  if(a.z>1.18){

   cars.splice(i,1);
   score+=25;
   earned++;
  }
 }
}

/* COLLISION */
function collision(){

 for(let c of cars){

  /*
    Çarpışma yalnızca araçlar fiziksel olarak
    oyuncuya yakın olduğunda kontrol edilir.
  */
  if(c.z<.76 || c.z>1.03)continue;

  let s=trafficSize(c.z);

  let x=laneX(c.lane,c.z);
  let y=roadY(c.z);

  let dx=Math.abs(x-player.x);
  let dy=Math.abs(y-player.y);

  if(
   dx<(s.w+CAR_W)*.42 &&
   dy<(s.h+CAR_H)*.42
  ){
   finish();
   return;
  }
 }
}

/* INPUT */
function leftMove(){
 if(!playing||paused)return;
 targetLane=Math.max(0,targetLane-1);
}

function rightMove(){
 if(!playing||paused)return;
 targetLane=Math.min(2,targetLane+1);
}

document.getElementById("left").onpointerdown=e=>{
 e.preventDefault();leftMove();
};

document.getElementById("right").onpointerdown=e=>{
 e.preventDefault();rightMove();
};

document.getElementById("nitro").onpointerdown=e=>{
 e.preventDefault();nitroOn=true;
};

document.getElementById("nitro").onpointerup=()=>{
 nitroOn=false;
};

document.getElementById("nitro").onpointercancel=()=>{
 nitroOn=false;
};

addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a"){
  e.preventDefault();leftMove();
 }

 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d"){
  e.preventDefault();rightMove();
 }

 if(e.code==="Space"){
  e.preventDefault();nitroOn=true;
 }

 if(e.key==="Escape")pauseGame();
});

addEventListener("keyup",e=>{
 if(e.code==="Space")nitroOn=false;
});

/* PAUSE */
function pauseGame(){

 if(!playing)return;

 paused=!paused;

 document.getElementById("pause").textContent=
  paused?"▶":"Ⅱ";

 if(!paused){
  last=performance.now();
  requestAnimationFrame(loop);
 }
}

document.getElementById("pause").onclick=pauseGame;

/* START */
function startGame(){

 playing=true;
 paused=false;

 score=0;
 earned=0;
 level=1;
 worldSpeed=6;
 roadMove=0;
 spawn=0;
 targetLane=1;
 nitro=100;
 nitroOn=false;
 cars=[];

 player.x=laneX(1,.91);

 document.getElementById("screen").style.display="none";
 document.getElementById("menu").style.display="block";
 document.getElementById("gameover").style.display="none";

 last=performance.now();
 requestAnimationFrame(loop);
}

/* FINISH */
function finish(){

 if(!playing)return;

 playing=false;

 bank+=earned;

 if(score>best)best=Math.floor(score);

 localStorage.setItem("tr_best",best);
 localStorage.setItem("tr_money",bank);

 document.getElementById("result").innerHTML=
  "Skor: <b>"+Math.floor(score)+"</b><br>"+
  "Kazanılan para: <b>"+earned+" ₺</b><br>"+
  "En yüksek skor: <b>"+best+"</b><br>"+
  "Toplam para: <b>"+bank+" ₺</b>";

 document.getElementById("screen").style.display="flex";
 document.getElementById("menu").style.display="none";
 document.getElementById("gameover").style.display="block";
}

/* UPDATE */
function update(dt){

 if(paused)return;

 level=1+Math.floor(score/600);

 if(nitroOn && nitro>0){
  nitro-=45*dt;
  worldSpeed=10;
 }else{
  nitroOn=false;
  nitro=Math.min(100,nitro+9*dt);
  worldSpeed=6+Math.min(3.5,level*.22);
 }

 score+=worldSpeed*dt*2;
 roadMove+=worldSpeed*dt;

 spawn-=dt;

 let delay=Math.max(.48,1.0-level*.02);

 if(spawn<=0){
  spawnCar();
  spawn=delay;
 }

 updateCars(dt);
 collision();

 document.getElementById("score").textContent=Math.floor(score);
 document.getElementById("money").textContent=earned;
 document.getElementById("level").textContent=level;
 document.getElementById("speed").textContent=Math.floor(worldSpeed*24);
}

/* DRAW */
function draw(){

 ctx.clearRect(0,0,W,H);

 background();
 nature();
 road();

 /*
   Uzak araçları önce,
   yakın araçları sonra çiziyoruz.
   Böylece görsel olarak doğru perspektif oluşur.
 */
 cars
  .slice()
  .sort((a,b)=>a.z-b.z)
  .forEach(c=>{

   if(c.z<0||c.z>1.2)return;

   let s=trafficSize(c.z);

   car(
    laneX(c.lane,c.z),
    roadY(c.z),
    s.w,
    s.h,
    c.color,
    false
   );
  });

 drawPlayer();
}

/* LOOP */
function loop(now){

 if(!playing||paused)return;

 let dt=Math.min(.035,(now-last)/1000);
 last=now;

 update(dt);
 draw();

 requestAnimationFrame(loop);
}

/* BUTTONS */
document.getElementById("start").onclick=startGame;
document.getElementById("again").onclick=startGame;

document.getElementById("back").onclick=()=>{

 playing=false;
 paused=false;

 document.getElementById("screen").style.display="flex";
 document.getElementById("menu").style.display="block";
 document.getElementById("gameover").style.display="none";
};

/* INITIAL */
draw();

</script>
</body>
</html>
