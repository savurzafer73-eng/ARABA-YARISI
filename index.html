<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road Ultimate</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
 width:100%;height:100%;overflow:hidden;
 background:#111;color:#fff;
 font-family:Arial,sans-serif;
 user-select:none;
 -webkit-user-select:none;
 touch-action:none
}
#game{
 position:fixed;inset:0;
 width:100%;height:100%;
 background:#151515
}
canvas{display:block;width:100%;height:100%}

#hud{
 position:absolute;top:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;
 pointer-events:none;z-index:5
}
.hudBox{
 background:rgba(0,0,0,.62);
 border:1px solid rgba(255,255,255,.15);
 border-radius:12px;padding:8px 12px;
 font-weight:bold;font-size:14px;
 box-shadow:0 4px 15px #0008
}

#menu{
 position:absolute;inset:0;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(#0008,#000b);
 z-index:20
}
.panel{
 width:min(92%,420px);
 padding:26px 20px;
 border-radius:24px;
 background:rgba(18,20,25,.96);
 border:1px solid #ffffff18;
 box-shadow:0 20px 60px #000;
 text-align:center
}
.logo{
 font-size:34px;font-weight:900;
 letter-spacing:2px;
 margin-bottom:5px
}
.logo span{color:#ff3030}
.subtitle{color:#aaa;margin-bottom:22px}

button{
 width:100%;border:0;border-radius:14px;
 padding:14px;margin:6px 0;
 color:#fff;background:#252932;
 font-size:16px;font-weight:bold
}
button:active{transform:scale(.97)}
.primary{
 background:linear-gradient(135deg,#e51d2a,#ff5b28)
}
.smallButtons{
 display:grid;grid-template-columns:1fr 1fr;gap:8px
}
.smallButtons button{margin:0}

#touch{
 position:absolute;inset:0;z-index:8;
 pointer-events:none
}
.touchSide{
 position:absolute;top:0;bottom:0;width:50%;
 pointer-events:auto
}
#leftTouch{left:0}
#rightTouch{right:0}

#pause{
 position:absolute;right:12px;top:58px;
 z-index:10;width:44px;height:44px;
 border-radius:50%;padding:0;
 background:#0009
}

#gameOver{
 position:absolute;inset:0;
 display:none;align-items:center;justify-content:center;
 background:#0009;z-index:30
}

.stat{
 display:flex;justify-content:space-between;
 padding:8px 0;border-bottom:1px solid #ffffff12;
 color:#ddd
}
</style>
</head>

<body>

<div id="game">
<canvas id="canvas"></canvas>

<div id="hud">
 <div class="hudBox">🏁 <span id="score">0</span></div>
 <div class="hudBox">💰 <span id="coins">0</span></div>
 <div class="hudBox">⚡ <span id="speed">0</span> km/h</div>
</div>

<button id="pause">Ⅱ</button>

<div id="touch">
 <div class="touchSide" id="leftTouch"></div>
 <div class="touchSide" id="rightTouch"></div>
</div>

<div id="menu">
 <div class="panel">
  <div class="logo">TURBO <span>ROAD</span></div>
  <div class="subtitle">Ultimate Edition</div>

  <button class="primary" id="startBtn">🏁 YARIŞA BAŞLA</button>

  <div class="smallButtons">
   <button id="garageBtn">🚗 GARaj</button>
   <button id="missionBtn">🎯 GÖREVLER</button>
  </div>

  <button id="settingsBtn">⚙️ AYARLAR</button>
 </div>
</div>

<div id="gameOver">
 <div class="panel">
  <div class="logo">YARIŞ <span>BİTTİ</span></div>
  <div class="stat"><span>Skor</span><b id="finalScore">0</b></div>
  <div class="stat"><span>Kazanılan para</span><b id="finalCoins">0</b></div>
  <button class="primary" id="againBtn">🔄 TEKRAR OYNA</button>
  <button id="menuBtn">🏠 ANA MENÜ</button>
 </div>
</div>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);

function resize(){
 W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

/* ---------------- AUDIO ---------------- */

let audioCtx=null;
let engineOsc=null;
let engineGain=null;

function initAudio(){
 if(audioCtx)return;
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();

 engineOsc=audioCtx.createOscillator();
 engineGain=audioCtx.createGain();

 engineOsc.type="sawtooth";
 engineOsc.frequency.value=70;
 engineGain.gain.value=.025;

 engineOsc.connect(engineGain);
 engineGain.connect(audioCtx.destination);
 engineOsc.start();
}

function beep(freq,duration=.08,type="square"){
 if(!audioCtx)return;
 const o=audioCtx.createOscillator();
 const g=audioCtx.createGain();
 o.type=type;
 o.frequency.value=freq;
 g.gain.setValueAtTime(.06,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
 o.connect(g);g.connect(audioCtx.destination);
 o.start();o.stop(audioCtx.currentTime+duration);
}

function crashSound(){
 beep(70,.4,"sawtooth");
 setTimeout(()=>beep(45,.3,"square"),80);
}

/* ---------------- GAME ---------------- */

let running=false;
let paused=false;
let score=0;
let money=0;
let speed=220;
let distance=0;
let roadScroll=0;
let spawnTimer=0;
let lastTime=performance.now();

const player={
 lane:1,
 x:0,
 targetX:0,
 y:0
};

const enemies=[];

const lanePositions=[-.31,0,.31];

function roadXAt(y){
 const horizon=H*.30;
 const bottom=H*1.05;
 const t=Math.max(0,Math.min(1,(y-horizon)/(bottom-horizon)));
 return W/2 + lanePositions[1]*W*t;
}

function laneX(lane,y){
 const horizon=H*.30;
 const bottom=H*1.05;
 const t=Math.max(0,Math.min(1,(y-horizon)/(bottom-horizon)));
 const roadHalf=(W*.17)+(W*.43*t);
 return W/2 + lanePositions[lane]*roadHalf;
}

function roadWidthAt(y){
 const horizon=H*.30;
 const bottom=H*1.05;
 const t=Math.max(0,Math.min(1,(y-horizon)/(bottom-horizon)));
 return W*.34 + W*.86*t;
}

/*
 IMPORTANT:
 Rakip araçlar artık gökten düşmüyor.
 Her araç yolun ufuk çizgisinin hemen altında,
 yol yüzeyinde küçük boyutla doğuyor ve
 perspektifle büyüyerek aşağı geliyor.
*/
function spawnEnemy(){
 const lane=Math.floor(Math.random()*3);

 // Aynı anda aynı şeritte üst üste araç oluşmasını engelle
 if(enemies.some(e=>e.lane===lane && e.y< H*.48))return;

 const types=["sport","sedan","suv"];

 enemies.push({
  lane,
  y:H*.305,
  z:0,
  type:types[Math.floor(Math.random()*types.length)],
  speed:.62+Math.random()*.3,
  seed:Math.random()*10
 });
}

function startGame(){
 initAudio();
 if(audioCtx.state==="suspended")audioCtx.resume();

 score=0;
 money=0;
 speed=220;
 distance=0;
 roadScroll=0;
 spawnTimer=.7;
 enemies.length=0;

 player.lane=1;
 player.targetX=laneX(1,H*.83);
 player.x=player.targetX;
 player.y=H*.82;

 running=true;
 paused=false;

 document.getElementById("menu").style.display="none";
 document.getElementById("gameOver").style.display="none";
}

function endGame(){
 running=false;
 crashSound();

 document.getElementById("finalScore").textContent=Math.floor(score);
 document.getElementById("finalCoins").textContent=Math.floor(money);
 document.getElementById("gameOver").style.display="flex";
}

function move(dir){
 if(!running||paused)return;
 player.lane=Math.max(0,Math.min(2,player.lane+dir));
 player.targetX=laneX(player.lane,player.y);
 beep(dir<0?260:330,.055);
}

function update(dt){
 if(!running||paused)return;

 speed=Math.min(430,220+distance*.018);
 distance+=speed*dt*.035;
 score+=speed*dt*.018;
 roadScroll+=speed*dt;

 if(engineOsc){
  engineOsc.frequency.setTargetAtTime(55+speed*.45,audioCtx.currentTime,.05);
 }

 spawnTimer-=dt;
 if(spawnTimer<=0){
  spawnEnemy();
  spawnTimer=.72+Math.random()*.75-(speed-220)/1200;
 }

 // Oyuncu hareketi
 player.x+=(player.targetX-player.x)*Math.min(1,dt*10);

 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];

  /*
   z ile yol perspektifi:
   0 = ufukta
   1 = oyuncuya yakın
  */
  e.z+=dt*(e.speed*.23+speed/950);

  const t=Math.min(1,e.z);
  const horizon=H*.305;
  const targetY=H*.88;

  // Düzgün yol üzerinde yaklaşma
  e.y=horizon+(targetY-horizon)*Math.pow(t,1.35);

  if(e.z>1.08){
   enemies.splice(i,1);
   money++;
   continue;
  }

  const ex=laneX(e.lane,e.y);

  // Çarpışma sadece oyuncuya yakınken kontrol edilir
  if(e.z>.72){
   const dx=Math.abs(ex-player.x);
   const scale=.48+e.z*.55;
   const enemyW=40*scale;
   const playerW=48;

   if(dx<(enemyW+playerW)*.42){
    endGame();
    return;
   }
  }
 }
}

/* ---------------- DRAWING ---------------- */

function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#68b9ff");
 g.addColorStop(.28,"#ccecff");
 g.addColorStop(.29,"#557b39");
 g.addColorStop(1,"#263d20");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 // uzak dağlar
 ctx.fillStyle="#45633a";
 ctx.beginPath();
 ctx.moveTo(0,H*.31);
 for(let x=0;x<=W;x+=80){
  ctx.lineTo(x,H*.28-Math.sin(x*.018)*30);
 }
 ctx.lineTo(W,H*.40);
 ctx.lineTo(0,H*.40);
 ctx.fill();

 // yol dışı
 ctx.fillStyle="#31502b";
 ctx.fillRect(0,H*.30,W,H*.70);
}

function drawRoad(){
 const horizon=H*.30;
 const bottom=H*1.08;

 const topW=W*.10;
 const botW=W*.94;

 ctx.fillStyle="#27292d";
 ctx.beginPath();
 ctx.moveTo(W/2-topW/2,horizon);
 ctx.lineTo(W/2+topW/2,horizon);
 ctx.lineTo(W/2+botW/2,bottom);
 ctx.lineTo(W/2-botW/2,bottom);
 ctx.closePath();
 ctx.fill();

 // yol kenarları
 ctx.strokeStyle="#e7e7e7";
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.moveTo(W/2-topW/2,horizon);
 ctx.lineTo(W/2-botW/2,bottom);
 ctx.moveTo(W/2+topW/2,horizon);
 ctx.lineTo(W/2+botW/2,bottom);
 ctx.stroke();

 // kırmızı-beyaz kenar çizgileri
 const offset=(roadScroll%80);

 for(let y=horizon+offset-80;y<bottom;y+=80){
  const t=(y-horizon)/(bottom-horizon);
  const rw=topW+(botW-topW)*t;

  ctx.fillStyle="#e33";
  ctx.fillRect(W/2-rw/2-8,y,8,Math.max(4,12*t));
  ctx.fillRect(W/2+rw/2,y,8,Math.max(4,12*t));
 }

 // şerit çizgileri
 ctx.strokeStyle="#ffffffaa";
 ctx.lineCap="round";

 for(let lane=1;lane<3;lane++){
  const lxTop=W/2+lanePositions[lane-1]*topW;
  const lxBottom=W/2+lanePositions[lane-1]*botW;

  for(let y=horizon+(roadScroll%100)-100;y<bottom;y+=100){
   const t=(y-horizon)/(bottom-horizon);
   const x=lxTop+(lxBottom-lxTop)*t;
   const len=Math.max(5,32*t);

   ctx.lineWidth=Math.max(1,5*t);
   ctx.beginPath();
   ctx.moveTo(x,y);
   ctx.lineTo(x,y+len);
   ctx.stroke();
  }
 }
}

function roundedRect(x,y,w,h,r){
 ctx.beginPath();
 ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);
 ctx.arcTo(x,y,x+w,y,r);
 ctx.closePath();
}

function drawCar(x,y,scale,type,playerCar=false){
 let w=50*scale;
 let h=92*scale;

 if(type==="suv"){
  w*=1.03;h*=1.02;
 }else if(type==="sport"){
  w*=.96;h*=.9;
 }

 ctx.save();
 ctx.translate(x,y);
 ctx.shadowColor="#000";
 ctx.shadowBlur=10*scale;
 ctx.shadowOffsetY=5*scale;

 // gölge
 ctx.fillStyle="#0007";
 ctx.beginPath();
 ctx.ellipse(0,h*.46,w*.7,h*.16,0,0,Math.PI*2);
 ctx.fill();

 ctx.shadowBlur=0;

 // lastikler
 ctx.fillStyle="#101010";
 roundedRect(-w*.57,-h*.28,w*.20,h*.48,5*scale);
 ctx.fill();
 roundedRect(w*.37,-h*.28,w*.20,h*.48,5*scale);
 ctx.fill();

 // gövde
 let body="#d52b32";
 if(playerCar)body="#b91d26";
 else if(type==="sport")body=["#1976d2","#e53935","#f2c300"][Math.floor(score+scale)%3];
 else if(type==="sedan")body=["#eeeeee","#22a05a","#555b65"][Math.floor(score*2+scale)%3];
 else body=["#ff8c00","#6c4ab6","#208b78"][Math.floor(score*3+scale)%3];

 ctx.fillStyle=body;
 roundedRect(-w*.43,-h*.48,w*.86,h*.92,9*scale);
 ctx.fill();

 // tampon
 ctx.fillStyle="#17191c";
 roundedRect(-w*.36,h*.31,w*.72,h*.12,4*scale);
 ctx.fill();

 // kabin
 ctx.fillStyle="#101b25";
 roundedRect(-w*.31,-h*.30,w*.62,h*.38,8*scale);
 ctx.fill();

 // ön cam
 ctx.fillStyle="#7ec9e9";
 ctx.globalAlpha=.75;
 roundedRect(-w*.26,-h*.26,w*.52,h*.16,5*scale);
 ctx.fill();

 // arka cam
 ctx.globalAlpha=.55;
 roundedRect(-w*.25,-h*.05,w*.50,h*.10,3*scale);
 ctx.fill();
 ctx.globalAlpha=1;

 // kaput çizgisi
 ctx.strokeStyle="#ffffff55";
 ctx.lineWidth=1.5*scale;
 ctx.beginPath();
 ctx.moveTo(-w*.35,h*.13);
 ctx.lineTo(w*.35,h*.13);
 ctx.stroke();

 // farlar
 ctx.fillStyle="#fff7b0";
 roundedRect(-w*.34,h*.18,w*.19,h*.09,3*scale);
 ctx.fill();
 roundedRect(w*.15,h*.18,w*.19,h*.09,3*scale);
 ctx.fill();

 // stoplar
 ctx.fillStyle="#ff2020";
 roundedRect(-w*.34,-h*.39,w*.18,h*.07,2*scale);
 ctx.fill();
 roundedRect(w*.16,-h*.39,w*.18,h*.07,2*scale);
 ctx.fill();

 // jantlar
 ctx.fillStyle="#aaa";
 ctx.beginPath();
 ctx.arc(-w*.47,h*.08,w*.08,0,Math.PI*2);
 ctx.arc(w*.47,h*.08,w*.08,0,Math.PI*2);
 ctx.fill();

 if(playerCar){
  // Mustang şeridi
  ctx.fillStyle="#ffffffcc";
  ctx.fillRect(-w*.045,-h*.45,w*.09,h*.78);
 }

 ctx.restore();
}

function draw(){
 drawBackground();
 drawRoad();

 // uzak rakipler önce çizilir
 const sorted=[...enemies].sort((a,b)=>a.y-b.y);

 for(const e of sorted){
  const scale=.30+e.z*.78;
  const x=laneX(e.lane,e.y);
  drawCar(x,e.y,scale,e.type,false);
 }

 // oyuncu
 drawCar(player.x,player.y,1.0,"sport",true);

 document.getElementById("score").textContent=Math.floor(score);
 document.getElementById("coins").textContent=Math.floor(money);
 document.getElementById("speed").textContent=Math.floor(speed);
}

function loop(now){
 const dt=Math.min(.035,(now-lastTime)/1000);
 lastTime=now;

 update(dt);
 draw();

 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------------- TOUCH ---------------- */

document.getElementById("leftTouch").addEventListener("pointerdown",e=>{
 e.preventDefault();
 move(-1);
});

document.getElementById("rightTouch").addEventListener("pointerdown",e=>{
 e.preventDefault();
 move(1);
});

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move(-1);
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move(1);
 if(e.key===" "){
  paused=!paused;
 }
});

/* ---------------- BUTTONS ---------------- */

document.getElementById("startBtn").onclick=startGame;
document.getElementById("againBtn").onclick=startGame;

document.getElementById("menuBtn").onclick=()=>{
 document.getElementById("gameOver").style.display="none";
 document.getElementById("menu").style.display="flex";
};

document.getElementById("pause").onclick=()=>{
 if(!running)return;
 paused=!paused;
 document.getElementById("pause").textContent=paused?"▶":"Ⅱ";
};

document.getElementById("garageBtn").onclick=()=>{
 alert("GARaj\n\n🚘 1969 Mustang\n\nRakip araçlar:\n🏎️ Sport\n🚗 Sedan\n🚙 SUV");
};

document.getElementById("missionBtn").onclick=()=>{
 alert("GÖREVLER\n\n🎯 1000 puan kazan\n💰 50 para topla\n🏁 5 yarış tamamla");
};

document.getElementById("settingsBtn").onclick=()=>{
 alert("AYARLAR\n\n🔊 Ses: Açık\n🎮 Kontrol: Dokunmatik\n🚗 Kamera: Yol görünümü");
};

</script>
</body>
</html>
