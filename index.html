<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road Ultimate</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

body{
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#111;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ================= HUD ================= */

#hud{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(94vw,520px);
  display:flex;
  justify-content:space-between;
  gap:6px;
  z-index:10;
  pointer-events:none;
}

.hudBox{
  min-width:90px;
  padding:8px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.62);
  color:white;
  text-align:center;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(5px);
}

.hudSmall{
  font-size:11px;
  opacity:.7;
}

.hudValue{
  font-size:20px;
  font-weight:bold;
}

/* ================= MENU ================= */

#menu{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(
    rgba(0,0,0,.42),
    rgba(0,0,0,.80)
  );
}

.menuPanel{
  width:min(90vw,400px);
  padding:28px;
  border-radius:24px;
  background:rgba(15,15,18,.95);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 70px rgba(0,0,0,.65);
  text-align:center;
  color:white;
}

.logo{
  font-size:34px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#ff3838;
}

.subtitle{
  color:#aaa;
  font-size:13px;
  margin:5px 0 25px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:#24242a;
  border:1px solid rgba(255,255,255,.12);
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.startBtn{
  background:linear-gradient(135deg,#ff3030,#b80000);
}

.info{
  margin-top:18px;
  font-size:12px;
  line-height:1.6;
  color:#888;
}

/* ================= DOKUNMATİK ================= */

.touchZone{
  position:absolute;
  bottom:0;
  width:50%;
  height:55%;
  z-index:8;
  touch-action:none;
}

#leftZone{
  left:0;
}

#rightZone{
  right:0;
}

.touchHint{
  position:absolute;
  bottom:25px;
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  pointer-events:none;
  font-size:25px;
  z-index:9;
}

#leftHint{
  left:25px;
}

#rightHint{
  right:25px;
}

/* ================= SES ================= */

#soundBtn{
  position:absolute;
  right:12px;
  bottom:15px;
  width:48px;
  height:48px;
  padding:0;
  margin:0;
  border-radius:50%;
  z-index:15;
  background:rgba(0,0,0,.6);
}

/* ================= GAME OVER ================= */

#gameOver{
  position:absolute;
  inset:0;
  z-index:25;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
}

.overPanel{
  width:min(88vw,360px);
  padding:28px;
  border-radius:22px;
  background:#151519;
  color:white;
  text-align:center;
  border:1px solid rgba(255,255,255,.12);
}

.overPanel h2{
  font-size:30px;
}

.result{
  color:#bbb;
  margin:12px 0 18px;
  line-height:1.8;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .hudBox{
    min-width:0;
    flex:1;
    padding:6px 4px;
  }

  .hudValue{
    font-size:16px;
  }

  .logo{
    font-size:29px;
  }

  .menuPanel{
    padding:24px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- HUD -->
<div id="hud">

  <div class="hudBox">
    <div class="hudSmall">HIZ</div>
    <div class="hudValue">
      <span id="speedText">0</span> KM/H
    </div>
  </div>

  <div class="hudBox">
    <div class="hudSmall">SKOR</div>
    <div class="hudValue" id="scoreText">0</div>
  </div>

  <div class="hudBox">
    <div class="hudSmall">ALTIN</div>
    <div class="hudValue">
      🪙 <span id="coinText">0</span>
    </div>
  </div>

</div>

<!-- KONTROL -->
<div id="leftZone" class="touchZone"></div>
<div id="rightZone" class="touchZone"></div>

<div id="leftHint" class="touchHint">‹</div>
<div id="rightHint" class="touchHint">›</div>

<!-- SES -->
<button id="soundBtn">🔊</button>

<!-- MENÜ -->
<div id="menu">

  <div class="menuPanel">

    <div class="logo">
      TURBO <span>ROAD</span>
    </div>

    <div class="subtitle">
      Ultimate Racing
    </div>

    <button class="startBtn" id="startBtn">
      🏁 YARIŞA BAŞLA
    </button>

    <button id="helpBtn">
      ℹ️ NASIL OYNANIR?
    </button>

    <div class="info">
      📱 Sol tarafa basılı tut → SOLA<br>
      📱 Sağ tarafa basılı tut → SAĞA<br>
      Parmağını kaldır → DÜZ<br>
      💻 Bilgisayarda ← →
    </div>

  </div>

</div>

<!-- GAME OVER -->
<div id="gameOver">

  <div class="overPanel">

    <h2>YARIŞ BİTTİ</h2>

    <div class="result">
      Skor: <b id="finalScore">0</b><br>
      Toplanan altın: <b id="finalCoins">0</b>
    </div>

    <button class="startBtn" id="restartBtn">
      🔄 TEKRAR OYNA
    </button>

    <button id="menuBtn">
      🏠 ANA MENÜ
    </button>

  </div>

</div>

</div>

<script>
"use strict";

/* =========================================================
   ELEMENTLER
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const menu=document.getElementById("menu");
const gameOver=document.getElementById("gameOver");

const leftZone=document.getElementById("leftZone");
const rightZone=document.getElementById("rightZone");

const speedText=document.getElementById("speedText");
const scoreText=document.getElementById("scoreText");
const coinText=document.getElementById("coinText");

/* =========================================================
   CANVAS
========================================================= */

let W=0;
let H=0;

let DPR=Math.min(
  window.devicePixelRatio || 1,
  2
);

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  if(typeof player!=="undefined"){
    player.y=getPlayerY();

    if(!running){
      player.x=W/2;
      player.targetX=W/2;
    }
  }
}

window.addEventListener(
  "resize",
  resize
);

/* =========================================================
   OYUN
========================================================= */

let running=false;
let lastTime=0;

let score=0;
let coins=0;

let speed=0;
let targetSpeed=0;

let roadOffset=0;

/* =========================================================
   PERSPEKTİF
========================================================= */

/*
  KRİTİK DÜZELTME:

  Trafik artık gökyüzünde doğmuyor.

  Araçlar perspektifin gerçek yol başlangıcından
  başlıyor ve sadece yol yüzeyinde hareket ediyor.
*/

function getHorizon(){

  return H*.34;
}

function getRoadTopY(){

  return getHorizon()+3;
}

function roadProgress(y){

  const horizon=getHorizon();

  return Math.max(
    0,
    Math.min(
      1,
      (y-horizon)/
      (H-horizon)
    )
  );
}

function roadWidthAt(y){

  const p=roadProgress(y);

  return W*(
    .12+
    .92*Math.pow(p,.78)
  );
}

function roadCenterAt(y){

  const p=roadProgress(y);

  return W/2+
    Math.sin(
      roadOffset*.00065
    )*
    W*.035*
    Math.pow(p,1.7);
}

/* Oyuncu her zaman yolun alt bölümünde */

function getPlayerY(){

  return H*.81;
}

/* =========================================================
   DİREKSİYON
========================================================= */

let steering=0;

let touchLeft=false;
let touchRight=false;

let keyboardLeft=false;
let keyboardRight=false;

function calculateSteering(){

  if(keyboardLeft && !keyboardRight){
    steering=-1;
    return;
  }

  if(keyboardRight && !keyboardLeft){
    steering=1;
    return;
  }

  if(touchLeft && !touchRight){
    steering=-1;
    return;
  }

  if(touchRight && !touchLeft){
    steering=1;
    return;
  }

  steering=0;
}

/* =========================================================
   PLAYER
========================================================= */

const player={

  x:0,
  y:0,

  width:52,
  height:100,

  targetX:0,

  color:"#d71920",

  tilt:0
};

/* =========================================================
   TRAFİK
========================================================= */

let traffic=[];
let spawnTimer=0;

const trafficColors=[
  "#eeeeee",
  "#1769aa",
  "#f39c12",
  "#20252b",
  "#38a169",
  "#8e44ad",
  "#d35400"
];

/*
  Yeni trafik araçları:

  progress 0.08 ile başlıyor.
  Bu değer yolun üzerinde.

  Ayrıca spawn anında araçların görünmesi
  kesinlikle engelleniyor.
*/

function spawnTraffic(){

  const lane=
    Math.floor(
      Math.random()*3
    );

  traffic.push({

    lane:lane,

    progress:.08,

    speed:
      .20+
      Math.random()*.09,

    width:42,
    height:82,

    color:
      trafficColors[
        Math.floor(
          Math.random()*
          trafficColors.length
        )
      ],

    y:0,
    x:0,
    drawW:0,
    drawH:0
  });
}

/* =========================================================
   ALTIN
========================================================= */

let coinObjects=[];
let coinTimer=0;

function spawnCoin(){

  const lane=
    Math.floor(
      Math.random()*3
    );

  coinObjects.push({

    lane:lane,

    progress:.12,

    spin:
      Math.random()*
      Math.PI*2,

    x:0,
    y:0,
    size:8
  });
}

/* =========================================================
   SES
========================================================= */

let audioCtx=null;
let engineOsc=null;
let engineGain=null;
let engineFilter=null;

let audioStarted=false;
let soundEnabled=true;

function initAudio(){

  if(
    audioStarted ||
    !soundEnabled
  ){
    return;
  }

  try{

    audioCtx=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    engineOsc=
      audioCtx.createOscillator();

    engineGain=
      audioCtx.createGain();

    engineFilter=
      audioCtx.createBiquadFilter();

    engineOsc.type="sawtooth";

    engineFilter.type="lowpass";

    engineFilter.frequency.value=600;

    engineGain.gain.value=0;

    engineOsc.connect(
      engineFilter
    );

    engineFilter.connect(
      engineGain
    );

    engineGain.connect(
      audioCtx.destination
    );

    engineOsc.start();

    audioStarted=true;

  }catch(e){
    console.log(e);
  }
}

function updateEngineSound(){

  if(
    !audioStarted ||
    !audioCtx ||
    !soundEnabled
  ){
    return;
  }

  const now=
    audioCtx.currentTime;

  const normalized=
    Math.max(
      0,
      Math.min(
        1,
        speed/220
      )
    );

  engineOsc.frequency.setTargetAtTime(
    55+
    normalized*210,
    now,
    .05
  );

  engineFilter.frequency.setTargetAtTime(
    450+
    normalized*1900,
    now,
    .06
  );

  const volume=
    running
      ?
      .008+
      normalized*.045
      :
      0;

  engineGain.gain.setTargetAtTime(
    volume,
    now,
    .08
  );
}

function collisionSound(){

  if(!soundEnabled)return;

  initAudio();

  if(!audioCtx)return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(
    120,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    40,
    audioCtx.currentTime+.25
  );

  gain.gain.setValueAtTime(
    .16,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.28
  );

  osc.connect(gain);
  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime+.3
  );
}

function coinSound(){

  if(!soundEnabled)return;

  initAudio();

  if(!audioCtx)return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    600,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    1050,
    audioCtx.currentTime+.1
  );

  gain.gain.setValueAtTime(
    .08,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.18
  );

  osc.connect(gain);
  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime+.2
  );
}

/* =========================================================
   ARKA PLAN
========================================================= */

function drawBackground(){

  const horizon=
    getHorizon();

  const sky=
    ctx.createLinearGradient(
      0,
      0,
      0,
      horizon+100
    );

  sky.addColorStop(
    0,
    "#62addf"
  );

  sky.addColorStop(
    .55,
    "#a9d7ed"
  );

  sky.addColorStop(
    1,
    "#dce8e9"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /* Güneş */

  ctx.beginPath();

  ctx.arc(
    W*.80,
    H*.12,
    Math.max(
      25,
      W*.055
    ),
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,240,180,.9)";

  ctx.fill();

  /* Dağlar */

  ctx.fillStyle="#708d88";

  ctx.beginPath();

  ctx.moveTo(
    0,
    horizon+.08*H
  );

  ctx.lineTo(
    W*.10,
    H*.20
  );

  ctx.lineTo(
    W*.22,
    H*.29
  );

  ctx.lineTo(
    W*.36,
    H*.17
  );

  ctx.lineTo(
    W*.51,
    H*.29
  );

  ctx.lineTo(
    W*.66,
    H*.18
  );

  ctx.lineTo(
    W*.82,
    H*.29
  );

  ctx.lineTo(
    W,
    H*.19
  );

  ctx.lineTo(
    W,
    horizon+.10*H
  );

  ctx.closePath();

  ctx.fill();

  /* Zemin */

  ctx.fillStyle="#557b4d";

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );
}

/* =========================================================
   YOL
========================================================= */

function drawRoad(){

  const horizon=
    getHorizon();

  const topCenter=
    roadCenterAt(
      horizon
    );

  const bottomCenter=
    roadCenterAt(H);

  const topWidth=
    roadWidthAt(
      horizon
    );

  const bottomWidth=
    roadWidthAt(H);

  /* Yol */

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.closePath();

  const roadGradient=
    ctx.createLinearGradient(
      0,
      horizon,
      0,
      H
    );

  roadGradient.addColorStop(
    0,
    "#47484e"
  );

  roadGradient.addColorStop(
    1,
    "#25262b"
  );

  ctx.fillStyle=
    roadGradient;

  ctx.fill();

  /* Yol kenarları */

  ctx.strokeStyle="#f4f4f4";

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.stroke();

  /* Kırmızı beyaz kenar */

  const dashCount=20;

  const moving=
    (roadOffset*.0015)%1;

  for(
    let i=0;
    i<dashCount;
    i++
  ){

    const p1=
      (i/dashCount+
      moving/dashCount);

    const p2=
      p1+.022;

    const y1=
      horizon+
      Math.min(
        1,
        p1
      )*
      (H-horizon);

    const y2=
      horizon+
      Math.min(
        1,
        p2
      )*
      (H-horizon);

    if(
      y1>=H ||
      y2<=horizon
    ){
      continue;
    }

    const c1=
      roadCenterAt(y1);

    const c2=
      roadCenterAt(y2);

    const w1=
      roadWidthAt(y1);

    const w2=
      roadWidthAt(y2);

    ctx.strokeStyle=
      i%2===0
        ?
        "#ffffff"
        :
        "#d52a2a";

    ctx.lineWidth=
      Math.max(
        2,
        8*
        roadProgress(y1)
      );

    ctx.beginPath();

    ctx.moveTo(
      c1-w1/2,
      y1
    );

    ctx.lineTo(
      c2-w2/2,
      y2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      c1+w1/2,
      y1
    );

    ctx.lineTo(
      c2+w2/2,
      y2
    );

    ctx.stroke();
  }

  /* 3 şerit */

  const gap=70;
  const dashLength=34;

  for(
    let lane=1;
    lane<3;
    lane++
  ){

    for(
      let y=
        horizon-
        gap+
        (roadOffset*1.5)%gap;

      y<H;

      y+=gap
    ){

      const y1=
        Math.max(
          horizon,
          y
        );

      const y2=
        Math.min(
          H,
          y+dashLength
        );

      if(y2<=horizon){
        continue;
      }

      const c1=
        roadCenterAt(y1);

      const c2=
        roadCenterAt(y2);

      const w1=
        roadWidthAt(y1);

      const w2=
        roadWidthAt(y2);

      const x1=
        c1-w1/2+
        w1*(lane/3);

      const x2=
        c2-w2/2+
        w2*(lane/3);

      const p=
        roadProgress(y1);

      ctx.strokeStyle=
        "rgba(255,255,255,.78)";

      ctx.lineWidth=
        Math.max(
          1,
          4*p
        );

      ctx.beginPath();

      ctx.moveTo(
        x1,
        y1
      );

      ctx.lineTo(
        x2,
        y2
      );

      ctx.stroke();
    }
  }
}

/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
  ctx,
  x,
  y,
  w,
  h,
  r
){

  const rr=
    Math.min(
      r,
      Math.abs(w)/2,
      Math.abs(h)/2
    );

  ctx.beginPath();

  ctx.moveTo(
    x+rr,
    y
  );

  ctx.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    rr
  );

  ctx.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    rr
  );

  ctx.arcTo(
    x,
    y+h,
    x,
    y,
    rr
  );

  ctx.arcTo(
    x,
    y,
    x+w,
    y,
    rr
  );

  ctx.closePath();
}

/* =========================================================
   RENK
========================================================= */

function shadeColor(
  hex,
  amount
){

  let c=
    hex.replace("#","");

  let r=parseInt(
    c.substring(0,2),
    16
  );

  let g=parseInt(
    c.substring(2,4),
    16
  );

  let b=parseInt(
    c.substring(4,6),
    16
  );

  r=Math.max(
    0,
    Math.min(
      255,
      r+amount
    )
  );

  g=Math.max(
    0,
    Math.min(
      255,
      g+amount
    )
  );

  b=Math.max(
    0,
    Math.min(
      255,
      b+amount
    )
  );

  return "#"+
    r.toString(16).padStart(2,"0")+
    g.toString(16).padStart(2,"0")+
    b.toString(16).padStart(2,"0");
}

/* =========================================================
   ARABA
========================================================= */

function drawCar(
  x,
  y,
  w,
  h,
  color,
  isPlayer=false,
  tilt=0
){

  if(w<=0 || h<=0)return;

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(tilt);

  /* Gölge */

  ctx.fillStyle=
    "rgba(0,0,0,.40)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.47,
    w*.62,
    h*.12,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* Tekerlekler */

  ctx.fillStyle="#0b0b0c";

  const tw=w*.18;
  const th=h*.25;

  roundRect(
    ctx,
    -w*.57,
    -h*.31,
    tw,
    th,
    3
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.39,
    -h*.31,
    tw,
    th,
    3
  );

  ctx.fill();

  roundRect(
    ctx,
    -w*.57,
    h*.12,
    tw,
    th,
    3
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.39,
    h*.12,
    tw,
    th,
    3
  );

  ctx.fill();

  /* Gövde */

  const grad=
    ctx.createLinearGradient(
      -w/2,
      0,
      w/2,
      0
    );

  grad.addColorStop(
    0,
    shadeColor(
      color,
      -35
    )
  );

  grad.addColorStop(
    .25,
    shadeColor(
      color,
      -8
    )
  );

  grad.addColorStop(
    .5,
    color
  );

  grad.addColorStop(
    .80,
    shadeColor(
      color,
      15
    )
  );

  grad.addColorStop(
    1,
    shadeColor(
      color,
      -15
    )
  );

  ctx.fillStyle=grad;

  roundRect(
    ctx,
    -w/2,
    -h/2,
    w,
    h,
    w*.17
  );

  ctx.fill();

  /* Kaput */

  ctx.fillStyle=
    shadeColor(
      color,
      10
    );

  roundRect(
    ctx,
    -w*.38,
    -h*.42,
    w*.76,
    h*.22,
    w*.07
  );

  ctx.fill();

  /* Ön cam */

  const glass=
    ctx.createLinearGradient(
      0,
      -h*.25,
      0,
      0
    );

  glass.addColorStop(
    0,
    "#38545f"
  );

  glass.addColorStop(
    1,
    "#111c22"
  );

  ctx.fillStyle=glass;

  roundRect(
    ctx,
    -w*.31,
    -h*.24,
    w*.62,
    h*.25,
    w*.07
  );

  ctx.fill();

  /* Cam ışığı */

  ctx.fillStyle=
    "rgba(255,255,255,.16)";

  ctx.beginPath();

  ctx.moveTo(
    -w*.23,
    -h*.20
  );

  ctx.lineTo(
    -w*.08,
    -h*.20
  );

  ctx.lineTo(
    -w*.20,
    -h*.04
  );

  ctx.closePath();

  ctx.fill();

  /* Arka cam */

  ctx.fillStyle="#15262e";

  roundRect(
    ctx,
    -w*.30,
    h*.07,
    w*.60,
    h*.19,
    w*.06
  );

  ctx.fill();

  /* Ön tampon */

  ctx.fillStyle=
    shadeColor(
      color,
      -30
    );

  roundRect(
    ctx,
    -w*.38,
    -h*.47,
    w*.76,
    h*.07,
    w*.025
  );

  ctx.fill();

  /* Farlar */

  ctx.fillStyle="#fff4bd";

  roundRect(
    ctx,
    -w*.35,
    -h*.46,
    w*.22,
    h*.075,
    w*.025
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.13,
    -h*.46,
    w*.22,
    h*.075,
    w*.025
  );

  ctx.fill();

  /* Stop */

  ctx.fillStyle="#ff2929";

  roundRect(
    ctx,
    -w*.34,
    h*.39,
    w*.21,
    h*.06,
    2
  );

  ctx.fill();

  roundRect(
    ctx,
    w*.13,
    h*.39,
    w*.21,
    h*.06,
    2
  );

  ctx.fill();

  /* Mustang */

  if(isPlayer){

    /* Siyah orta şerit */

    ctx.fillStyle="#151515";

    roundRect(
      ctx,
      -w*.075,
      -h*.46,
      w*.15,
      h*.92,
      w*.025
    );

    ctx.fill();

    /* Yan çizgiler */

    ctx.fillStyle=
      "rgba(255,255,255,.12)";

    ctx.fillRect(
      -w*.27,
      -h*.44,
      w*.025,
      h*.88
    );

    ctx.fillRect(
      w*.245,
      -h*.44,
      w*.025,
      h*.88
    );

    /* Yazı */

    ctx.fillStyle=
      "rgba(255,255,255,.9)";

    ctx.font=
      `bold ${Math.max(
        6,
        w*.115
      )}px Arial`;

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      "MUSTANG",
      0,
      h*.035
    );

    /* Logo */

    ctx.fillStyle="#ddd";

    ctx.beginPath();

    ctx.arc(
      0,
      -h*.425,
      Math.max(
        2,
        w*.045
      ),
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}

/* =========================================================
   TRAFİK GÜNCELLE
========================================================= */

function updateTraffic(dt){

  for(
    let i=traffic.length-1;
    i>=0;
    i--
  ){

    const car=
      traffic[i];

    /*
      Araç yalnızca yol boyunca ilerliyor.
      Gökyüzüne çıkma ihtimali yok.
    */

    car.progress+=
      dt*
      car.speed*
      (
        .70+
        speed/190
      );

    if(car.progress>1.08){

      traffic.splice(
        i,
        1
      );

      score+=10;

      continue;
    }

    /*
      Görsel perspektif.
    */

    const p=
      Math.max(
        .08,
        Math.min(
          1,
          car.progress
        )
      );

    const visualP=
      Math.pow(
        p,
        1.08
      );

    car.y=
      getHorizon()+
      visualP*
      (
        H-
        getHorizon()
      );

    /*
      Kritik:

      Araç X konumu yolun gerçek
      geometrisinden hesaplanıyor.
    */

    const roadW=
      roadWidthAt(
        car.y
      );

    const center=
      roadCenterAt(
        car.y
      );

    const laneW=
      roadW/3;

    car.x=
      center-
      roadW/2+
      laneW*
      (
        car.lane+.5
      );

    /*
      Ufukta çok küçük,
      yaklaştıkça büyüyor.
    */

    const scale=
      .10+
      Math.pow(
        p,
        .72
      )*
      .92;

    car.drawW=
      Math.max(
        5,
        car.width*scale
      );

    car.drawH=
      Math.max(
        10,
        car.height*scale
      );
  }
}

/* =========================================================
   ALTIN GÜNCELLE
========================================================= */

function updateCoins(dt){

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    const c=
      coinObjects[i];

    c.progress+=
      dt*
      (
        .22+
        speed/700
      );

    c.spin+=
      dt*6;

    if(c.progress>1.08){

      coinObjects.splice(
        i,
        1
      );

      continue;
    }

    const p=
      Math.max(
        .10,
        Math.min(
          1,
          c.progress
        )
      );

    c.y=
      getHorizon()+
      Math.pow(
        p,
        1.03
      )*
      (
        H-
        getHorizon()
      );

    const roadW=
      roadWidthAt(
        c.y
      );

    const center=
      roadCenterAt(
        c.y
      );

    const laneW=
      roadW/3;

    c.x=
      center-
      roadW/2+
      laneW*
      (
        c.lane+.5
      );

    c.size=
      4+
      Math.pow(
        p,
        .65
      )*
      17;
  }
}

/* =========================================================
   ALTIN ÇİZ
========================================================= */

function drawCoins(){

  for(
    const c of coinObjects
  ){

    ctx.save();

    ctx.translate(
      c.x,
      c.y
    );

    const sx=
      Math.abs(
        Math.cos(
          c.spin
        )
      );

    ctx.scale(
      Math.max(
        .18,
        sx
      ),
      1
    );

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      c.size,
      0,
      Math.PI*2
    );

    const coinGrad=
      ctx.createRadialGradient(
        -c.size*.25,
        -c.size*.25,
        1,
        0,
        0,
        c.size
      );

    coinGrad.addColorStop(
      0,
      "#fff3a1"
    );

    coinGrad.addColorStop(
      .45,
      "#ffd83d"
    );

    coinGrad.addColorStop(
      1,
      "#d39100"
    );

    ctx.fillStyle=
      coinGrad;

    ctx.fill();

    ctx.strokeStyle=
      "#a66b00";

    ctx.lineWidth=2;

    ctx.stroke();

    ctx.fillStyle=
      "#8d5d00";

    ctx.font=
      `bold ${Math.max(
        6,
        c.size*.9
      )}px Arial`;

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      "₺",
      0,
      1
    );

    ctx.restore();
  }
}

/* =========================================================
   ÇARPIŞMA
========================================================= */

function hitTest(a,b){

  const aw=
    a.width*.70;

  const ah=
    a.height*.66;

  const bw=
    b.drawW*.70;

  const bh=
    b.drawH*.66;

  /*
    Çok küçük uzaktaki araçlar
    çarpışma yapmasın.
  */

  if(b.drawW<15){
    return false;
  }

  return(
    Math.abs(
      a.x-b.x
    )<
    (aw+bw)/2

    &&

    Math.abs(
      a.y-b.y
    )<
    (ah+bh)/2
  );
}

function coinHit(c){

  return(
    Math.abs(
      player.x-c.x
    )<
    player.width*.62

    &&

    Math.abs(
      player.y-c.y
    )<
    player.height*.60
  );
}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

  const steeringPower=
    240+
    speed*1.45;

  player.targetX+=
    steering*
    steeringPower*
    dt;

  const roadW=
    roadWidthAt(
      player.y
    );

  const center=
    roadCenterAt(
      player.y
    );

  const padding=
    player.width*.62;

  const minX=
    center-
    roadW/2+
    padding;

  const maxX=
    center+
    roadW/2-
    padding;

  player.targetX=
    Math.max(
      minX,
      Math.min(
        maxX,
        player.targetX
      )
    );

  const follow=
    12+
    speed/36;

  player.x+=
    (
      player.targetX-
      player.x
    )*
    Math.min(
      1,
      dt*follow
    );

  const wantedTilt=
    steering*.065;

  player.tilt+=
    (
      wantedTilt-
      player.tilt
    )*
    Math.min(
      1,
      dt*11
    );
}

/* =========================================================
   START
========================================================= */

function startGame(){

  initAudio();

  if(
    audioCtx &&
    audioCtx.state==="suspended"
  ){
    audioCtx.resume();
  }

  running=true;

  menu.style.display="none";
  gameOver.style.display="none";

  score=0;
  coins=0;

  speed=0;
  targetSpeed=0;

  roadOffset=0;

  traffic=[];
  coinObjects=[];

  spawnTimer=.85;
  coinTimer=1.2;

  touchLeft=false;
  touchRight=false;

  keyboardLeft=false;
  keyboardRight=false;

  steering=0;

  player.x=W/2;
  player.targetX=W/2;
  player.y=getPlayerY();
  player.tilt=0;

  speedText.textContent="0";
  scoreText.textContent="0";
  coinText.textContent="0";

  lastTime=
    performance.now();
}

/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  if(!running)return;

  running=false;

  speed=0;

  steering=0;

  touchLeft=false;
  touchRight=false;

  keyboardLeft=false;
  keyboardRight=false;

  updateEngineSound();

  collisionSound();

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(score);

  document.getElementById(
    "finalCoins"
  ).textContent=
    coins;

  gameOver.style.display="flex";
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(!running)return;

  targetSpeed=
    Math.min(
      220,
      95+
      score*.025
    );

  speed+=
    (
      targetSpeed-
      speed
    )*
    Math.min(
      1,
      dt*1.6
    );

  roadOffset+=
    speed*
    dt*
    2.8;

  score+=
    speed*
    dt*
    .035;

  updatePlayer(dt);

  spawnTimer-=dt;
  coinTimer-=dt;

  if(spawnTimer<=0){

    spawnTraffic();

    /*
      Daha doğal araç aralığı.
    */

    spawnTimer=
      Math.max(
        .72,
        1.35-
        speed/560
      );
  }

  if(coinTimer<=0){

    spawnCoin();

    coinTimer=
      1.10+
      Math.random()*.85;
  }

  updateTraffic(dt);
  updateCoins(dt);

  /* Çarpışma */

  for(
    const car of traffic
  ){

    if(
      hitTest(
        player,
        car
      )
    ){

      endGame();
      return;
    }
  }

  /* Altın */

  for(
    let i=
      coinObjects.length-1;
    i>=0;
    i--
  ){

    if(
      coinHit(
        coinObjects[i]
      )
    ){

      coinObjects.splice(
        i,
        1
      );

      coins++;

      score+=25;

      coinSound();
    }
  }

  speedText.textContent=
    Math.floor(speed);

  scoreText.textContent=
    Math.floor(score);

  coinText.textContent=
    coins;

  updateEngineSound();
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawRoad();

  /*
    Uzak araç önce,
    yakın araç sonra.
  */

  const sortedTraffic=
    [...traffic].sort(
      (a,b)=>
        a.y-b.y
    );

  for(
    const car of sortedTraffic
  ){

    drawCar(
      car.x,
      car.y,
      car.drawW,
      car.drawH,
      car.color,
      false,
      0
    );
  }

  drawCoins();

  /*
    Oyuncu en üstte.
  */

  drawCar(
    player.x,
    player.y,
    player.width,
    player.height,
    player.color,
    true,
    player.tilt
  );
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

  const dt=
    Math.min(
      .035,
      (now-lastTime)/1000||0
    );

  lastTime=now;

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );
}

resize();

player.x=W/2;
player.targetX=W/2;
player.y=getPlayerY();

lastTime=
  performance.now();

requestAnimationFrame(
  loop
);

      );

);

========================================================= */

   KLAVYE
========================================================= */

window.addEventListener(
  "keydown",
  function(e){

    if(e.key==="ArrowLeft"){

      keyboardLeft=true;

      calculateSteering();

      e.preventDefault();
    }

    if(e.key==="ArrowRight"){

      keyboardRight=true;

      calculateSteering();

      e.preventDefault();

    if(
      e.key===" " &&
      !running
    ){

      startGame();

      e.preventDefault();
    }
  }
);

  function(e){

    if(e.key==="ArrowLeft"){

      keyboardLeft=false;

      calculateSteering();
    }

    if(e.key==="ArrowRight"){

      keyboardRight=false;

      calculateSteering();

);

========================================================= */

document.getElementById(

  function(){

        );

  }
