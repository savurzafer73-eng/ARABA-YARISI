<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Turbo Road Ultimate</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101820;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#101820;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  width:min(94vw,520px);
  display:flex;
  gap:7px;
  z-index:10;
  pointer-events:none;
}

.hudBox{
  flex:1;
  padding:7px 8px;
  border-radius:13px;
  background:rgba(4,8,12,.72);
  color:#fff;
  text-align:center;
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 5px 16px rgba(0,0,0,.2);
}

.hudSmall{
  font-size:9px;
  letter-spacing:1px;
  opacity:.62;
}

.hudValue{
  font-size:17px;
  font-weight:900;
}

#menu,
#gameOver{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.82));
}

#gameOver{
  display:none;
}

.menuPanel,
.overPanel{
  width:min(90vw,400px);
  padding:27px;
  border-radius:24px;
  background:rgba(13,16,21,.96);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 25px 70px rgba(0,0,0,.65);
  text-align:center;
  color:#fff;
}

.logo{
  font-size:34px;
  font-weight:1000;
  letter-spacing:2px;
}

.logo span{
  color:#ef3131;
}

.subtitle{
  color:#aaa;
  font-size:13px;
  margin:5px 0 22px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  color:#fff;
  background:#252a30;
  border:1px solid rgba(255,255,255,.12);
}

button:active{
  transform:scale(.97);
}

.startBtn{
  background:linear-gradient(135deg,#ef3636,#9b0000);
}

.info{
  margin-top:17px;
  font-size:12px;
  line-height:1.65;
  color:#858b91;
}

.touchZone{
  position:absolute;
  bottom:0;
  width:50%;
  height:62%;
  z-index:8;
  touch-action:none;
}

#leftZone{left:0}
#rightZone{right:0}

.touchHint{
  position:absolute;
  bottom:23px;
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.3);
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  pointer-events:none;
  font-size:25px;
  z-index:9;
}

#leftHint{left:22px}
#rightHint{right:22px}

#soundBtn{
  position:absolute;
  right:12px;
  bottom:calc(13px + env(safe-area-inset-bottom));
  width:46px;
  height:46px;
  padding:0;
  margin:0;
  border-radius:50%;
  z-index:15;
  background:rgba(0,0,0,.6);
}

.overPanel h2{
  font-size:29px;
}

.result{
  color:#bbb;
  margin:12px 0 18px;
  line-height:1.8;
}

@media(max-width:600px){
  .hudBox{
    padding:6px 3px;
  }

  .hudValue{
    font-size:14px;
  }

  .logo{
    font-size:29px;
  }

  .menuPanel,
  .overPanel{
    padding:23px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="hudBox">
    <div class="hudSmall">HIZ</div>
    <div class="hudValue"><span id="speedText">0</span> KM/H</div>
  </div>

  <div class="hudBox">
    <div class="hudSmall">SKOR</div>
    <div class="hudValue" id="scoreText">0</div>
  </div>

  <div class="hudBox">
    <div class="hudSmall">ALTIN</div>
    <div class="hudValue">🪙 <span id="coinText">0</span></div>
  </div>
</div>

<div id="leftZone" class="touchZone"></div>
<div id="rightZone" class="touchZone"></div>

<div id="leftHint" class="touchHint">‹</div>
<div id="rightHint" class="touchHint">›</div>

<button id="soundBtn">🔊</button>

<div id="menu">
  <div class="menuPanel">

    <div class="logo">TURBO <span>ROAD</span></div>
    <div class="subtitle">Ultimate Racing</div>

    <button class="startBtn" id="startBtn">
      🏁 YARIŞA BAŞLA
    </button>

    <button id="helpBtn">
      ℹ️ NASIL OYNANIR?
    </button>

    <div class="info">
      📱 Sol tarafa basılı tut → SOLA<br>
      📱 Sağ tarafa basılı tut → SAĞA<br>
      Parmağını kaldır → DÜZ<br>
      💻 Bilgisayar: ← →
    </div>

  </div>
</div>

<div id="gameOver">
  <div class="overPanel">

    <h2>YARIŞ BİTTİ</h2>

    <div class="result">
      Skor: <b id="finalScore">0</b><br>
      Toplanan altın: <b id="finalCoins">0</b>
    </div>

    <button class="startBtn" id="restartBtn">
      🔄 TEKRAR OYNA
    </button>

    <button id="menuBtn">
      🏠 ANA MENÜ
    </button>

  </div>
</div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});

let W=0;
let H=0;
let DPR=1;

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  DPR=Math.min(window.devicePixelRatio||1,1.5);

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);

  if(player){
    player.y=getPlayerY();

    if(!running){
      player.x=W/2;
      player.targetX=W/2;
    }
  }
}

window.addEventListener("resize",resize,{passive:true});

/* =========================================================
   ELEMENTLER
========================================================= */

const menu=document.getElementById("menu");
const gameOver=document.getElementById("gameOver");

const speedText=document.getElementById("speedText");
const scoreText=document.getElementById("scoreText");
const coinText=document.getElementById("coinText");

/* =========================================================
   OYUN
========================================================= */

let running=false;
let lastTime=0;

let score=0;
let coins=0;

let speed=0;
let targetSpeed=0;

let roadOffset=0;

let steering=0;

let touchLeft=false;
let touchRight=false;

let keyboardLeft=false;
let keyboardRight=false;

/* =========================================================
   PERFORMANS
========================================================= */

let lowPower=false;

function detectPerformance(){

  const cores=navigator.hardwareConcurrency||4;

  lowPower=
    cores<=4 ||
    W<390 ||
    (navigator.deviceMemory && navigator.deviceMemory<=2);

}

function qualityMultiplier(){

  return lowPower ? .72 : 1;

}

/* =========================================================
   YOL / PERSPEKTİF
========================================================= */

function getHorizon(){
  return H*.33;
}

function roadProgress(y){

  const h=getHorizon();

  return Math.max(
    0,
    Math.min(1,(y-h)/(H-h))
  );

}

function roadWidthAt(y){

  const p=roadProgress(y);

  return W*(
    .15+
    .88*Math.pow(p,.80)
  );

}

function roadCenterAt(y){

  const p=roadProgress(y);

  return W/2+
    Math.sin(roadOffset*.00038)*
    W*.025*
    Math.pow(p,1.6);

}

function getPlayerY(){
  return H*.815;
}

/* =========================================================
   PLAYER
========================================================= */

const player={

  x:0,
  y:0,

  /* Daha küçük oyuncu aracı */
  width:43,
  height:81,

  targetX:0,

  color:"#c71922",

  tilt:0

};

/* =========================================================
   TRAFİK
========================================================= */

let traffic=[];
let spawnTimer=0;

const trafficColors=[
  "#f1f1f1",
  "#2876aa",
  "#e09a18",
  "#24282d",
  "#368c62",
  "#7049a0",
  "#bd501b",
  "#697078"
];

function spawnTraffic(){

  let lane=Math.floor(Math.random()*3);

  const recent=traffic
    .filter(c=>c.progress<.30)
    .some(c=>c.lane===lane);

  if(recent){

    const available=[0,1,2]
      .filter(l=>
        !traffic.some(c=>
          c.lane===l &&
          c.progress<.30
        )
      );

    if(available.length){
      lane=
        available[
          Math.floor(
            Math.random()*available.length
          )
        ];
    }

  }

  traffic.push({

    lane,

    progress:.055,

    speed:.20+Math.random()*.06,

    width:37,
    height:72,

    color:
      trafficColors[
        Math.floor(
          Math.random()*trafficColors.length
        )
      ],

    y:0,
    x:0,
    drawW:0,
    drawH:0

  });

}

/* =========================================================
   ALTIN
========================================================= */

let coinObjects=[];
let coinTimer=0;

function spawnCoin(){

  coinObjects.push({

    lane:Math.floor(Math.random()*3),

    progress:.07,

    spin:Math.random()*Math.PI*2,

    x:0,
    y:0,
    size:8

  });

}

/* =========================================================
   SES MOTORU
========================================================= */

let audioCtx=null;

let engineOsc=null;
let engineGain=null;

let audioStarted=false;
let soundEnabled=true;

function initAudio(){

  if(audioStarted || !soundEnabled)return;

  try{

    const AC=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AC)return;

    audioCtx=new AC();

    engineOsc=
      audioCtx.createOscillator();

    engineGain=
      audioCtx.createGain();

    /*
      Daha tok motor sesi.
      Sawtooth yerine iki osilatör yerine
      tek oscillator + düşük filtre kullanıyoruz.
    */

    engineOsc.type="triangle";

    engineOsc.frequency.value=70;

    engineGain.gain.value=0;

    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);

    engineOsc.start();

    audioStarted=true;

  }catch(e){

    audioStarted=false;

  }

}

function updateEngineSound(){

  if(
    !audioStarted||
    !audioCtx||
    !soundEnabled
  )return;

  const now=audioCtx.currentTime;

  const n=Math.max(
    0,
    Math.min(1,speed/220)
  );

  /*
    Ses artık çok tiz değil.
    Hız arttıkça frekans kontrollü yükseliyor.
  */

  const freq=
    58+
    n*125;

  engineOsc.frequency.setTargetAtTime(
    freq,
    now,
    .035
  );

  engineGain.gain.setTargetAtTime(
    running
      ? .012+n*.035
      : 0,
    now,
    .08
  );

}

function soundEffect(freq1,freq2,duration,volume,type){

  if(!soundEnabled)return;

  initAudio();

  if(!audioCtx)return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type||"sine";

  const now=audioCtx.currentTime;

  osc.frequency.setValueAtTime(
    freq1,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    freq2,
    now+duration
  );

  gain.gain.setValueAtTime(
    volume,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(now+duration+.02);

}

function collisionSound(){

  soundEffect(
    95,
    38,
    .28,
    .13,
    "square"
  );

}

function coinSound(){

  soundEffect(
    420,
    780,
    .13,
    .055,
    "sine"
  );

}

/* =========================================================
   ARKA PLAN
========================================================= */

function drawBackground(){

  const horizon=getHorizon();

  /* Gökyüzü */

  const sky=
    ctx.createLinearGradient(
      0,0,0,horizon
    );

  sky.addColorStop(0,"#65a9d8");
  sky.addColorStop(.65,"#acd7e5");
  sky.addColorStop(1,"#d9e7df");

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,W,horizon+2
  );

  /* Güneş */

  ctx.beginPath();

  ctx.arc(
    W*.80,
    H*.13,
    Math.max(22,W*.052),
    0,
    Math.PI*2
  );

  ctx.fillStyle="rgba(255,238,170,.9)";
  ctx.fill();

  /* Uzak dağlar */

  ctx.fillStyle="#78918b";

  ctx.beginPath();

  ctx.moveTo(0,horizon);

  ctx.lineTo(W*.10,H*.235);
  ctx.lineTo(W*.23,H*.31);
  ctx.lineTo(W*.36,H*.20);
  ctx.lineTo(W*.49,H*.31);
  ctx.lineTo(W*.62,H*.18);
  ctx.lineTo(W*.76,H*.30);
  ctx.lineTo(W*.89,H*.21);
  ctx.lineTo(W,H*.28);

  ctx.lineTo(W,horizon);

  ctx.closePath();
  ctx.fill();

  /* uzak ikinci katman */

  ctx.fillStyle="#668079";

  ctx.beginPath();

  ctx.moveTo(0,horizon+.02*H);
  ctx.lineTo(W*.17,H*.30);
  ctx.lineTo(W*.31,H*.25);
  ctx.lineTo(W*.47,H*.32);
  ctx.lineTo(W*.66,H*.24);
  ctx.lineTo(W*.82,H*.31);
  ctx.lineTo(W,horizon+.03*H);

  ctx.closePath();
  ctx.fill();

  /* Çimen */

  ctx.fillStyle="#477648";

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );

  /* Basit doğa detayları */

  const count=lowPower?10:18;

  for(let i=0;i<count;i++){

    const seed=
      i*83.7+
      Math.floor(roadOffset*.035);

    const y=
      horizon+
      ((seed*17)%(H-horizon));

    const p=roadProgress(y);

    const rw=roadWidthAt(y);
    const rc=roadCenterAt(y);

    const side=i%2?-1:1;

    const x=
      rc+
      side*(rw/2+18+p*55);

    drawTree(
      x,
      y,
      0.35+p*.85
    );

  }

}

/* =========================================================
   AĞAÇ
========================================================= */

function drawTree(x,y,s){

  if(x<-50||x>W+50)return;

  ctx.save();

  ctx.translate(x,y);

  const trunk=12*s;

  ctx.fillStyle="#60442d";

  ctx.fillRect(
    -trunk*.25,
    -25*s,
    trunk*.5,
    25*s
  );

  ctx.fillStyle="#285a32";

  ctx.beginPath();
  ctx.arc(
    0,
    -32*s,
    17*s,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.fillStyle="#36723b";

  ctx.beginPath();
  ctx.arc(
    -9*s,
    -25*s,
    12*s,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    9*s,
    -25*s,
    12*s,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.restore();

}

/* =========================================================
   YOL
========================================================= */

function drawRoad(){

  const horizon=getHorizon();

  const tc=roadCenterAt(horizon);
  const bc=roadCenterAt(H);

  const tw=roadWidthAt(horizon);
  const bw=roadWidthAt(H);

  /* yol gövdesi */

  ctx.beginPath();

  ctx.moveTo(
    tc-tw/2,
    horizon
  );

  ctx.lineTo(
    tc+tw/2,
    horizon
  );

  ctx.lineTo(
    bc+bw/2,
    H
  );

  ctx.lineTo(
    bc-bw/2,
    H
  );

  ctx.closePath();

  const grad=
    ctx.createLinearGradient(
      0,horizon,0,H
    );

  grad.addColorStop(0,"#5b5d60");
  grad.addColorStop(.5,"#3e4044");
  grad.addColorStop(1,"#27292d");

  ctx.fillStyle=grad;
  ctx.fill();

  /* dış çizgiler */

  ctx.strokeStyle="#f3f3f3";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(tc-tw/2,horizon);
  ctx.lineTo(bc-bw/2,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(tc+tw/2,horizon);
  ctx.lineTo(bc+bw/2,H);
  ctx.stroke();

  /* kırmızı beyaz kenar */

  const segments=lowPower?14:20;

  const offset=
    (roadOffset*.0015)%1;

  for(let i=0;i<segments;i++){

    let p1=
      (i/segments+
      offset/segments)%1;

    let p2=
      Math.min(
        1,
        p1+.028
      );

    const y1=
      horizon+
      p1*(H-horizon);

    const y2=
      horizon+
      p2*(H-horizon);

    const c1=roadCenterAt(y1);
    const c2=roadCenterAt(y2);

    const w1=roadWidthAt(y1);
    const w2=roadWidthAt(y2);

    ctx.strokeStyle=
      i%2
        ? "#d52d2d"
        : "#fff";

    ctx.lineWidth=
      Math.max(
        2,
        5*roadProgress(y1)
      );

    ctx.beginPath();
    ctx.moveTo(c1-w1/2,y1);
    ctx.lineTo(c2-w2/2,y2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(c1+w1/2,y1);
    ctx.lineTo(c2+w2/2,y2);
    ctx.stroke();

  }

  /* şerit çizgileri */

  const gap=lowPower?75:62;

  for(let lane=1;lane<3;lane++){

    for(
      let y=
        horizon-gap+
        (roadOffset*1.32)%gap;

      y<H;

      y+=gap
    ){

      const y1=Math.max(horizon,y);
      const y2=Math.min(H,y+30);

      const c1=roadCenterAt(y1);
      const c2=roadCenterAt(y2);

      const w1=roadWidthAt(y1);
      const w2=roadWidthAt(y2);

      const x1=
        c1-w1/2+
        w1*lane/3;

      const x2=
        c2-w2/2+
        w2*lane/3;

      ctx.strokeStyle="rgba(255,255,255,.65)";

      ctx.lineWidth=
        Math.max(
          1,
          2.8*roadProgress(y1)
        );

      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();

    }

  }

}

/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(x,y,w,h,r){

  const rr=
    Math.min(
      r,
      Math.abs(w)/2,
      Math.abs(h)/2
    );

  ctx.beginPath();

  ctx.moveTo(x+rr,y);

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    rr
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    rr
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    rr
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    rr
  );

  ctx.closePath();

}

/* =========================================================
   RENK
========================================================= */

function shadeColor(hex,amount){

  let c=hex.replace("#","");

  let r=parseInt(c.substring(0,2),16);
  let g=parseInt(c.substring(2,4),16);
  let b=parseInt(c.substring(4,6),16);

  r=Math.max(0,Math.min(255,r+amount));
  g=Math.max(0,Math.min(255,g+amount));
  b=Math.max(0,Math.min(255,b+amount));

  return "#"+
    r.toString(16).padStart(2,"0")+
    g.toString(16).padStart(2,"0")+
    b.toString(16).padStart(2,"0");

}

/* =========================================================
   ARABA
   ÖN TARAF YUKARIDA
   ARAÇLAR ASLA YAN ÇEVRİLMİYOR
========================================================= */

function drawCar(
  x,
  y,
  w,
  h,
  color,
  isPlayer,
  tilt
){

  if(w<4||h<7)return;

  ctx.save();

  ctx.translate(x,y);

  /*
    Oyuncu çok az yatıyor.
    Trafik araçları 0 derece.
    Böylece yan gidiyor hissi oluşmuyor.
  */

  ctx.rotate(
    isPlayer ? tilt : 0
  );

  /* gölge */

  ctx.fillStyle="rgba(0,0,0,.30)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.46,
    w*.54,
    h*.08,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* lastikler */

  ctx.fillStyle="#090a0c";

  const tw=Math.max(3,w*.17);
  const th=Math.max(6,h*.22);

  roundRect(
    -w*.55,
    -h*.30,
    tw,
    th,
    2
  );
  ctx.fill();

  roundRect(
    w*.38,
    -h*.30,
    tw,
    th,
    2
  );
  ctx.fill();

  roundRect(
    -w*.55,
    h*.10,
    tw,
    th,
    2
  );
  ctx.fill();

  roundRect(
    w*.38,
    h*.10,
    tw,
    th,
    2
  );
  ctx.fill();

  /* gövde */

  const body=
    ctx.createLinearGradient(
      -w/2,
      0,
      w/2,
      0
    );

  body.addColorStop(
    0,
    shadeColor(color,-38)
  );

  body.addColorStop(
    .27,
    shadeColor(color,-8)
  );

  body.addColorStop(
    .5,
    color
  );

  body.addColorStop(
    .73,
    shadeColor(color,14)
  );

  body.addColorStop(
    1,
    shadeColor(color,-30)
  );

  ctx.fillStyle=body;

  roundRect(
    -w/2,
    -h/2,
    w,
    h,
    w*.15
  );

  ctx.fill();

  /* tavan */

  ctx.fillStyle=
    shadeColor(color,-10);

  roundRect(
    -w*.34,
    -h*.25,
    w*.68,
    h*.47,
    w*.10
  );

  ctx.fill();

  /* cam */

  const glass=
    ctx.createLinearGradient(
      0,
      -h*.25,
      0,
      0
    );

  glass.addColorStop(0,"#55727d");
  glass.addColorStop(.55,"#263b44");
  glass.addColorStop(1,"#111b20");

  ctx.fillStyle=glass;

  roundRect(
    -w*.275,
    -h*.225,
    w*.55,
    h*.21,
    w*.045
  );

  ctx.fill();

  /* cam yansıması */

  ctx.fillStyle="rgba(255,255,255,.16)";

  ctx.beginPath();

  ctx.moveTo(-w*.21,-h*.19);
  ctx.lineTo(-w*.06,-h*.19);
  ctx.lineTo(-w*.17,-h*.065);

  ctx.closePath();

  ctx.fill();

  /* arka cam */

  ctx.fillStyle="#15262d";

  roundRect(
    -w*.275,
    h*.045,
    w*.55,
    h*.18,
    w*.045
  );

  ctx.fill();

  /* ön tampon */

  ctx.fillStyle=
    shadeColor(color,-40);

  roundRect(
    -w*.38,
    -h*.475,
    w*.76,
    h*.065,
    2
  );

  ctx.fill();

  /* ızgara */

  ctx.fillStyle="#101112";

  roundRect(
    -w*.25,
    -h*.45,
    w*.50,
    h*.032,
    1
  );

  ctx.fill();

  /* farlar */

  ctx.fillStyle="#fff2b7";

  roundRect(
    -w*.34,
    -h*.45,
    w*.19,
    h*.058,
    2
  );

  ctx.fill();

  roundRect(
    w*.15,
    -h*.45,
    w*.19,
    h*.058,
    2
  );

  ctx.fill();

  /* stoplar */

  ctx.fillStyle="#ff2828";

  roundRect(
    -w*.34,
    h*.39,
    w*.20,
    h*.055,
    2
  );

  ctx.fill();

  roundRect(
    w*.14,
    h*.39,
    w*.20,
    h*.055,
    2
  );

  ctx.fill();

  /* PLAYER MUSTANG */

  if(isPlayer){

    /* siyah orta şerit */

    ctx.fillStyle="#161616";

    roundRect(
      -w*.065,
      -h*.47,
      w*.13,
      h*.94,
      1
    );

    ctx.fill();

    /* yan çizgiler */

    ctx.fillStyle="rgba(255,255,255,.14)";

    ctx.fillRect(
      -w*.25,
      -h*.43,
      w*.022,
      h*.86
    );

    ctx.fillRect(
      w*.228,
      -h*.43,
      w*.022,
      h*.86
    );

    /* Mustang yazısı */

    if(w>22){

      ctx.fillStyle="#f0f0f0";

      ctx.font=
        "900 "+
        Math.max(5,w*.105)+
        "px Arial";

      ctx.textAlign="center";
      ctx.textBaseline="middle";

      ctx.fillText(
        "MUSTANG",
        0,
        h*.045
      );

    }

    /* amblem */

    ctx.fillStyle="#d8d8d8";

    ctx.beginPath();

    ctx.arc(
      0,
      -h*.425,
      Math.max(1.5,w*.04),
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.restore();

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function calculateSteering(){

  if(keyboardLeft&&!keyboardRight){
    steering=-1;
    return;
  }

  if(keyboardRight&&!keyboardLeft){
    steering=1;
    return;
  }

  if(touchLeft&&!touchRight){
    steering=-1;
    return;
  }

  if(touchRight&&!touchLeft){
    steering=1;
    return;
  }

  steering=0;

}

function updatePlayer(dt){

  const power=
    235+
    speed*1.25;

  player.targetX+=
    steering*
    power*
    dt;

  const rw=
    roadWidthAt(player.y);

  const center=
    roadCenterAt(player.y);

  const padding=
    player.width*.62;

  const minX=
    center-rw/2+padding;

  const maxX=
    center+rw/2-padding;

  player.targetX=
    Math.max(
      minX,
      Math.min(
        maxX,
        player.targetX
      )
    );

  const follow=
    11+
    speed/45;

  player.x+=
    (player.targetX-player.x)*
    Math.min(1,dt*follow);

  const wantedTilt=
    steering*.035;

  player.tilt+=
    (wantedTilt-player.tilt)*
    Math.min(1,dt*9);

}

/* =========================================================
   TRAFİK UPDATE
========================================================= */

function updateTraffic(dt){

  for(
    let i=traffic.length-1;
    i>=0;
    i--
  ){

    const car=traffic[i];

    car.progress+=
      dt*
      car.speed*
      (.72+speed/200);

    if(car.progress>1.08){

      traffic.splice(i,1);

      score+=10;

      continue;
    }

    const p=
      Math.max(
        .055,
        Math.min(
          1,
          car.progress
        )
      );

    /*
      Perspektif doğru:
      ufukta küçük,
      aşağı indikçe büyüyor.
    */

    car.y=
      getHorizon()+
      Math.pow(p,1.08)*
      (H-getHorizon());

    const rw=
      roadWidthAt(car.y);

    const center=
      roadCenterAt(car.y);

    const laneW=rw/3;

    car.x=
      center-rw/2+
      laneW*(car.lane+.5);

    const scale=
      .105+
      Math.pow(p,.73)*.80;

    car.drawW=
      Math.max(
        5,
        car.width*scale
      );

    car.drawH=
      Math.max(
        10,
        car.height*scale
      );

  }

}

/* =========================================================
   COIN UPDATE
========================================================= */

function updateCoins(dt){

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    const c=coinObjects[i];

    c.progress+=
      dt*(.22+speed/720);

    c.spin+=dt*5;

    if(c.progress>1.08){

      coinObjects.splice(i,1);

      continue;

    }

    const p=
      Math.max(
        .07,
        Math.min(
          1,
          c.progress
        )
      );

    c.y=
      getHorizon()+
      Math.pow(p,1.03)*
      (H-getHorizon());

    const rw=roadWidthAt(c.y);
    const center=roadCenterAt(c.y);
    const laneW=rw/3;

    c.x=
      center-rw/2+
      laneW*(c.lane+.5);

    c.size=
      4+
      Math.pow(p,.65)*16;

  }

}

/* =========================================================
   COIN DRAW
========================================================= */

function drawCoins(){

  for(const c of coinObjects){

    ctx.save();

    ctx.translate(c.x,c.y);

    const sx=
      Math.abs(
        Math.cos(c.spin)
      );

    ctx.scale(
      Math.max(.22,sx),
      1
    );

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      c.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#f7c62e";

    ctx.fill();

    ctx.strokeStyle="#a87500";
    ctx.lineWidth=1.5;

    ctx.stroke();

    ctx.fillStyle="#8a5c00";

    ctx.font=
      "bold "+
      Math.max(6,c.size*.85)+
      "px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText("₺",0,1);

    ctx.restore();

  }

}

/* =========================================================
   ÇARPIŞMA
========================================================= */

function hitTest(a,b){

  if(
    b.drawW<13||
    b.drawH<22
  )return false;

  /*
    Daha gerçekçi tampon çarpışması.
    Araçların üst üste binmiş gibi görünmesini engeller.
  */

  const aw=a.width*.55;
  const ah=a.height*.48;

  const bw=b.drawW*.52;
  const bh=b.drawH*.50;

  return(
    Math.abs(a.x-b.x)<
      (aw+bw)/2
    &&
    Math.abs(a.y-b.y)<
      (ah+bh)/2
  );

}

function coinHit(c){

  return(
    Math.abs(player.x-c.x)<
      player.width*.58
    &&
    Math.abs(player.y-c.y)<
      player.height*.55
  );

}

/* =========================================================
   START
========================================================= */

function startGame(){

  initAudio();

  if(
    audioCtx &&
    audioCtx.state==="suspended"
  ){
    audioCtx.resume();
  }

  running=true;

  menu.style.display="none";
  gameOver.style.display="none";

  score=0;
  coins=0;

  speed=0;
  targetSpeed=0;

  roadOffset=0;

  traffic=[];
  coinObjects=[];

  spawnTimer=.9;
  coinTimer=1.2;

  touchLeft=false;
  touchRight=false;

  keyboardLeft=false;
  keyboardRight=false;

  steering=0;

  player.x=W/2;
  player.targetX=W/2;
  player.y=getPlayerY();
  player.tilt=0;

  speedText.textContent="0";
  scoreText.textContent="0";
  coinText.textContent="0";

  lastTime=performance.now();

}

/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  if(!running)return;

  running=false;

  speed=0;
  steering=0;

  touchLeft=false;
  touchRight=false;

  keyboardLeft=false;
  keyboardRight=false;

  updateEngineSound();

  collisionSound();

  document.getElementById(
    "finalScore"
  ).textContent=Math.floor(score);

  document.getElementById(
    "finalCoins"
  ).textContent=coins;

  gameOver.style.display="flex";

}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(!running)return;

  targetSpeed=
    Math.min(
      220,
      95+score*.025
    );

  speed+=
    (targetSpeed-speed)*
    Math.min(
      1,
      dt*1.5
    );

  roadOffset+=
    speed*dt*2.65;

  score+=
    speed*dt*.035;

  updatePlayer(dt);

  spawnTimer-=dt;
  coinTimer-=dt;

  if(spawnTimer<=0){

    spawnTraffic();

    spawnTimer=
      Math.max(
        .68,
        1.22-speed/620
      );

  }

  if(coinTimer<=0){

    spawnCoin();

    coinTimer=
      1.05+
      Math.random()*.8;

  }

  updateTraffic(dt);
  updateCoins(dt);

  for(const car of traffic){

    if(hitTest(player,car)){

      endGame();

      return;

    }

  }

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    if(coinHit(coinObjects[i])){

      coinObjects.splice(i,1);

      coins++;

      score+=25;

      coinSound();

    }

  }

  speedText.textContent=
    Math.floor(speed);

  scoreText.textContent=
    Math.floor(score);

  coinText.textContent=
    coins;

  updateEngineSound();

}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,0,W,H
  );

  drawBackground();

  drawRoad();

  /*
    Arkadaki araçlar önce.
    Öndeki araçlar sonra.
    Oyuncu en son çizilir.
  */

  traffic.sort(
    (a,b)=>a.y-b.y
  );

  for(const car of traffic){

    drawCar(
      car.x,
      car.y,
      car.drawW,
      car.drawH,
      car.color,
      false,
      0
    );

  }

  drawCoins();

  drawCar(
    player.x,
    player.y,
    player.width,
    player.height,
    player.color,
    true,
    player.tilt
  );

}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

  let dt=
    (now-lastTime)/1000;

  lastTime=now;

  /*
    Donma / sekme olduğunda büyük zaman
    sıçramasını engelliyoruz.
  */

  dt=Math.min(.035,Math.max(0,dt));

  update(dt);
  draw();

  requestAnimationFrame(loop);

}

/* =========================================================
   TOUCH
========================================================= */

const leftZone=
  document.getElementById("leftZone");

const rightZone=
  document.getElementById("rightZone");

leftZone.addEventListener(
  "pointerdown",
  e=>{

    if(e.pointerType==="mouse")return;

    e.preventDefault();

    touchLeft=true;

    calculateSteering();

    initAudio();

    try{
      leftZone.setPointerCapture(
        e.pointerId
      );
    }catch(err){}

  }
);

rightZone.addEventListener(
  "pointerdown",
  e=>{

    if(e.pointerType==="mouse")return;

    e.preventDefault();

    touchRight=true;

    calculateSteering();

    initAudio();

    try{
      rightZone.setPointerCapture(
        e.pointerId
      );
    }catch(err){}

  }
);

leftZone.addEventListener(
  "pointerup",
  e=>{

    if(e.pointerType==="mouse")return;

    touchLeft=false;

    calculateSteering();

  }
);

rightZone.addEventListener(
  "pointerup",
  e=>{

    if(e.pointerType==="mouse")return;

    touchRight=false;

    calculateSteering();

  }
);

leftZone.addEventListener(
  "pointercancel",
  ()=>{
    touchLeft=false;
    calculateSteering();
  }
);

rightZone.addEventListener(
  "pointercancel",
  ()=>{
    touchRight=false;
    calculateSteering();
  }
);

/* =========================================================
   KLAVYE
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft"){

      keyboardLeft=true;

      calculateSteering();

      e.preventDefault();

    }

    if(e.key==="ArrowRight"){

      keyboardRight=true;

      calculateSteering();

      e.preventDefault();

    }

    if(
      e.key===" " &&
      !running
    ){

      startGame();

      e.preventDefault();

    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowLeft"){

      keyboardLeft=false;

      calculateSteering();

    }

    if(e.key==="ArrowRight"){

      keyboardRight=false;

      calculateSteering();

    }

  }
);

/* =========================================================
   BLUR
========================================================= */

window.addEventListener(
  "blur",
  ()=>{
    touchLeft=false;
    touchRight=false;
    keyboardLeft=false;
    keyboardRight=false;
    steering=0;
  }
);

/* =========================================================
   BUTONLAR
========================================================= */

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  startGame
);

document.getElementById(
  "restartBtn"
).addEventListener(
  "click",
  startGame
);

document.getElementById(
  "menuBtn"
).addEventListener(
  "click",
  ()=>{

    running=false;

    speed=0;

    gameOver.style.display="none";
    menu.style.display="flex";

    touchLeft=false;
    touchRight=false;

    keyboardLeft=false;
    keyboardRight=false;

    steering=0;

    updateEngineSound();

  }
);

document.getElementById(
  "helpBtn"
).addEventListener(
  "click",
  ()=>{

    alert(
      "TURBO ROAD\n\n"+
      "📱 Sol tarafa basılı tut → SOL\n"+
      "📱 Sağ tarafa basılı tut → SAĞ\n"+
      "☝️ Parmağını kaldır → DÜZ\n"+
      "💻 Bilgisayar: ← →\n\n"+
      "🪙 Altınları topla\n"+
      "🚗 Trafiğe çarpma\n"+
      "🏎️ Hız arttıkça motor sesi değişir.\n\n"+
      "İyi yarışlar!"
    );

  }
);

/* =========================================================
   SES BUTONU
========================================================= */

document.getElementById(
  "soundBtn"
).addEventListener(
  "click",
  function(){

    soundEnabled=!soundEnabled;

    this.textContent=
      soundEnabled
        ? "🔊"
        : "🔇";

    if(!soundEnabled){

      if(
        engineGain &&
        audioCtx
      ){

        engineGain.gain.setTargetAtTime(
          0,
          audioCtx.currentTime,
          .04
        );

      }

    }else{

      initAudio();

      if(
        audioCtx &&
        audioCtx.state==="suspended"
      ){
        audioCtx.resume();
      }

      updateEngineSound();

    }

  }
);

/* =========================================================
   BAŞLAT
========================================================= */

resize();

detectPerformance();

player.x=W/2;
player.targetX=W/2;
player.y=getPlayerY();

lastTime=performance.now();

requestAnimationFrame(loop);

</script>
