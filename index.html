<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araba Yarışı Oyunu</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            user-select: none;
        }
        #puan-tabelasi {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #oyun-alani {
            position: relative;
            width: 300px;
            height: 500px;
            background: #444;
            border-left: 8px dashed #fff;
            border-right: 8px dashed #fff;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .yol-cizgisi {
            position: absolute;
            left: 145px;
            width: 10px;
            height: 40px;
            background: #fff;
        }
        #oyuncu-arabasi {
            position: absolute;
            bottom: 20px;
            left: 130px;
            width: 40px;
            height: 70px;
            background: #e74c3c;
            border-radius: 8px;
            box-shadow: 0 0 5px #000;
        }
        #oyuncu-arabasi::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 5px;
            width: 30px;
            height: 20px;
            background: #333;
            border-radius: 3px;
        }
        .engel {
            position: absolute;
            top: -80px;
            width: 40px;
            height: 70px;
            background: #3498db;
            border-radius: 8px;
            box-shadow: 0 0 5px #000;
        }
        .engel::after {
            content: '';
            position: absolute;
            bottom: 15px;
            left: 5px;
            width: 30px;
            height: 20px;
            background: #333;
            border-radius: 3px;
        }
        #oyun-bitti {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>

    <div id="puan-tabelasi">Skor: <span id="skor">0</span></div>
    
    <div id="oyun-alani">
        <div id="oyuncu-arabasi"></div>
        <div id="oyun-bitti">
            <h2>Kaza Yaptın!</h2>
            <p>Toplam Skor: <span id="son-skor">0</span></p>
            <button onclick="oyunuYenidenBaslat()">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        const oyunAlani = document.getElementById('oyun-alani');
        const oyuncu = document.getElementById('oyuncu-arabasi');
        const skorEkrani = document.getElementById('skor');
        const oyunBittiEkrani = document.getElementById('oyun-bitti');
        const sonSkorEkrani = document.getElementById('son-skor');

        let oyuncuX = 130;
        let skor = 0;
        let oyunDevamEdiyor = true;
        let hiz = 4;
        let engeller = [];
        let cizgiler = [];

        // Yol çizgilerini oluştur
        for (let i = 0; i < 5; i++) {
            let cizgi = document.createElement('div');
            cizgi.className = 'yol-cizgisi';
            cizgi.style.top = (i * 120) + 'px';
            oyunAlani.appendChild(cizgi);
            cizgiler.push(cizgi);
        }

        // Klavye Kontrolleri
        document.addEventListener('keydown', (e) => {
            if (!oyunDevamEdiyor) return;
            if (e.key === 'ArrowLeft' && oyuncuX > 10) {
                oyuncuX -= 20;
            } else if (e.key === 'ArrowRight' && oyuncuX < 250) {
                oyuncuX += 20;
            }
            oyuncu.style.left = oyuncuX + 'px';
        });

        // Yeni Engel Ekle
        function engelOlustur() {
            let engel = document.createElement('div');
            engel.className = 'engel';
            // Rastgele şerit pozisyonu (sol, orta, sağ)
            const pozisyonlar = [30, 130, 230];
            let rastgeleX = pozisyonlar[Math.floor(Math.random() * pozisyonlar.length)];
            engel.style.left = rastgeleX + 'px';
            engel.style.top = '-80px';
            oyunAlani.appendChild(engel);
            engeller.push(engel);
        }

        // Ana Oyun Döngüsü
        function oyunDongusu() {
            if (!oyunDevamEdiyor) return;

            // Çizgileri hareket ettir
            cizgiler.forEach(cizgi => {
                let y = parseInt(cizgi.style.top);
                y += hiz;
                if (y > 500) y = -40;
                cizgi.style.top = y + 'px';
            });

            // Engelleri hareket ettir ve Çarpışma Kontrolü
            for (let i = 0; i < engeller.length; i++) {
                let engel = engeller[i];
                let y = parseInt(engel.style.top);
                y += hiz;
                engel.style.top = y + 'px';

                // Çarpışma Algılama (Hitbox)
                let oyuncuRect = oyuncu.getBoundingClientRect();
                let engelRect = engel.getBoundingClientRect();

                if (!(oyuncuRect.right < engelRect.left || 
                      oyuncuRect.left > engelRect.right || 
                      oyuncuRect.bottom < engelRect.top || 
                      oyuncuRect.top > engelRect.bottom)) {
                    oyunuBitir();
                    return;
                }

                // Ekrandan çıkan engeli sil ve puan ekle
                if (y > 500) {
                    engel.remove();
                    engeller.splice(i, 1);
                    skor += 10;
                    skorEkrani.innerText = skor;
                    if (skor % 50 === 0) hiz += 0.5; // Gittikçe hızlandır
                    i--;
                }
            }

            requestAnimationFrame(oyunDongusu);
        }

        // Periyodik olarak engel çıkar
        let engelZamanlayici = setInterval(() => {
            if (oyunDevamEdiyor) engelOlustur();
        }, 1500);

        function oyunuBitir() {
            oyunDevamEdiyor = false;
            sonSkorEkrani.innerText = skor;
            oyunBittiEkrani.style.display = 'block';
        }

        function oyunuYenidenBaslat() {
            engeller.forEach(e => e.remove());
            engeller = [];
            skor = 0;
            hiz = 4;
            oyuncuX = 130;
            oyuncu.style.left = oyuncuX + 'px';
            skorEkrani.innerText = skor;
            oyunBittiEkrani.style.display = 'none';
            oyunDevamEdiyor = true;
            oyunDongusu();
        }

        // Oyunu Başlat
        oyunDongusu();
    </script>
</body>
</html>
