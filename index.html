<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Araba Yarışı</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #555;
}

/* Yol */
#road {
    position: absolute;
    left: 15%;
    width: 70%;
    height: 100%;
    background: #333;
    overflow: hidden;
}

/* Yol kenarları */
.roadEdge {
    position: absolute;
    top: 0;
    width: 6px;
    height: 100%;
    background: #fff;
}

.leftEdge {
    left: 15%;
}

.rightEdge {
    right: 15%;
}

/* Şerit çizgileri */
.lane {
    position: absolute;
    top: -120px;
    width: 8px;
    height: 90px;
    background: white;
    border-radius: 5px;
}

/* Araba */
#car {
    position: absolute;
    bottom: 70px;
    left: 50%;
    width: 48px;
    height: 82px;
    transform: translateX(-50%);
    z-index: 20;
}

.carBody {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        #8b0000,
        #ff2222,
        #8b0000
    );
    border-radius: 13px 13px 9px 9px;
    box-shadow: 0 4px 10px #000;
}

.window {
    position: absolute;
    left: 8px;
    top: 12px;
    width: 32px;
    height: 25px;
    background: linear-gradient(135deg,#bdefff,#24506b);
    border-radius: 8px 8px 4px 4px;
}

.window2 {
    position: absolute;
    left: 8px;
    top: 43px;
    width: 32px;
    height: 17px;
    background: #111;
    border-radius: 3px;
}

.light {
    position: absolute;
    width: 9px;
    height: 7px;
    background: #fff;
    border-radius: 3px;
    top: 4px;
}

.light.left {
    left: 6px;
}

.light.right {
    right: 6px;
}

.wheel {
    position: absolute;
    width: 8px;
    height: 22px;
    background: #111;
    border-radius: 4px;
}

.wheel.l1 {
    left: -5px;
    top: 15px;
}

.wheel.l2 {
    left: -5px;
    bottom: 15px;
}

.wheel.r1 {
    right: -5px;
    top: 15px;
}

.wheel.r2 {
    right: -5px;
    bottom: 15px;
}

/* Diğer araçlar */
.enemy {
    position: absolute;
    width: 44px;
    height: 75px;
    background: linear-gradient(
        90deg,
        #174b9b,
        #3185ff,
        #174b9b
    );
    border-radius: 11px;
    z-index: 10;
    box-shadow: 0 3px 8px #000;
}

.enemy::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 11px;
    width: 30px;
    height: 23px;
    background: #b8e8ff;
    border-radius: 6px;
}

.enemy::after {
    content: "";
    position: absolute;
    left: 7px;
    bottom: 10px;
    width: 30px;
    height: 15px;
    background: #111;
    border-radius: 3px;
}

/* Bilgi */
#hud {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 2px 2px 3px #000;
}

#hint {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 14px;
    z-index: 50;
    text-shadow: 1px 1px 3px #000;
    white-space: nowrap;
}

/* Oyun bitti */
#gameOver {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.75);
    color: white;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

#gameOver h1 {
    font-size: 40px;
    margin: 0 0 15px;
}

#restart {
    border: 0;
    padding: 14px 28px;
    border-radius: 10px;
    background: #e22;
    color: white;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="game">

    <div id="road"></div>

    <div class="roadEdge leftEdge"></div>
    <div class="roadEdge rightEdge"></div>

    <div id="hud">
        <div>🏆 Skor: <span id="score">0</span></div>
        <div>⚡ Hız: <span id="speedText">1</span></div>
    </div>

    <div id="car">
        <div class="carBody"></div>
        <div class="window"></div>
        <div class="window2"></div>

        <div class="light left"></div>
        <div class="light right"></div>

        <div class="wheel l1"></div>
        <div class="wheel l2"></div>
        <div class="wheel r1"></div>
        <div class="wheel r2"></div>
    </div>

    <div id="hint">
        👈 Sol tarafa dokun = SOL &nbsp;&nbsp; SAĞ tarafa dokun = SAĞ 👉
    </div>

    <div id="gameOver">
        <h1>💥 Oyun Bitti</h1>
        <p>Skorun: <span id="finalScore">0</span></p>
        <button id="restart">🔄 Tekrar Oyna</button>
    </div>

</div>

<script>
const game = document.getElementById("game");
const car = document.getElementById("car");
const road = document.getElementById("road");

const scoreText = document.getElementById("score");
const speedText = document.getElementById("speedText");

const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const restartButton = document.getElementById("restart");

let carX = window.innerWidth / 2;
let direction = 0;
let score = 0;
let speed = 5;
let gameRunning = true;

let laneLines = [];
let enemies = [];

/* Yol çizgileri oluştur */
for (let i = 0; i < 8; i++) {
    const line = document.createElement("div");
    line.className = "lane";

    line.style.left = "50%";
    line.style.transform = "translateX(-50%)";
    line.style.top = (i * 130 - 100) + "px";

    road.appendChild(line);
    laneLines.push({
        el: line,
        y: i * 130 - 100
    });
}

/* Düşman oluştur */
function createEnemy() {
    const enemy = document.createElement("div");
    enemy.className = "enemy";

    const roadLeft = window.innerWidth * 0.15;
    const roadWidth = window.innerWidth * 0.70;

    const minX = roadLeft + 20;
    const maxX = roadLeft + roadWidth - 65;

    const x = minX + Math.random() * (maxX - minX);

    enemy.style.left = x + "px";
    enemy.style.top = "-100px";

    game.appendChild(enemy);

    enemies.push({
        el: enemy,
        x: x,
        y: -100,
        speed: speed * 0.75
    });
}

/* Dokunmatik kontrol */
function handleTouch(x) {

    if (!gameRunning) return;

    const screenMiddle = window.innerWidth / 2;

    if (x < screenMiddle) {
        direction = -1;
    } else {
        direction = 1;
    }
}

/* Dokunma */
game.addEventListener("touchstart", function(e) {

    e.preventDefault();

    if (e.touches.length > 0) {
        handleTouch(e.touches[0].clientX);
    }

}, { passive: false });

/* Parmağı ekranda sürükleme */
game.addEventListener("touchmove", function(e) {

    e.preventDefault();

    if (e.touches.length > 0) {
        handleTouch(e.touches[0].clientX);
    }

}, { passive: false });

/* Parmağı kaldırınca düz git */
game.addEventListener("touchend", function(e) {
    e.preventDefault();
    direction = 0;
}, { passive: false });

/* Bilgisayar için mouse */
game.addEventListener("mousedown", function(e) {
    handleTouch(e.clientX);
});

game.addEventListener("mouseup", function() {
    direction = 0;
});

/* Klavye */
document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        direction = -1;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        direction = 1;
    }
});

document.addEventListener("keyup", function(e) {

    if (
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "a" ||
        e.key.toLowerCase() === "d"
    ) {
        direction = 0;
    }
});

/* Çarpışma kontrolü */
function collision(a, b) {

    const r1 = a.getBoundingClientRect();
    const r2 = b.getBoundingClientRect();

    return !(
        r1.right < r2.left ||
        r1.left > r2.right ||
        r1.bottom < r2.top ||
        r1.top > r2.bottom
    );
}

/* Oyun döngüsü */
function gameLoop() {

    if (!gameRunning) return;

    /* Araba hareketi */
    carX += direction * 7;

    const roadLeft = window.innerWidth * 0.15;
    const roadRight = window.innerWidth * 0.85;

    const carWidth = car.offsetWidth;

    if (carX < roadLeft + carWidth / 2) {
        carX = roadLeft + carWidth / 2;
    }

    if (carX > roadRight - carWidth / 2) {
        carX = roadRight - carWidth / 2;
    }

    car.style.left = carX + "px";

    /* Hafif dönme efekti */
    if (direction < 0) {
        car.style.transform =
            "translateX(-50%) rotate(-8deg)";
    } else if (direction > 0) {
        car.style.transform =
            "translateX(-50%) rotate(8deg)";
    } else {
        car.style.transform =
            "translateX(-50%) rotate(0deg)";
    }

    /* Yol çizgileri */
    laneLines.forEach(line => {

        line.y += speed;

        if (line.y > window.innerHeight) {
            line.y = -100;
        }

        line.el.style.top = line.y + "px";
    });

    /* Düşman araçlar */
    enemies.forEach((enemy, index) => {

        enemy.y += enemy.speed;

        enemy.el.style.top = enemy.y + "px";

        if (collision(car, enemy.el)) {
            endGame();
        }

        if (enemy.y > window.innerHeight + 100) {
            enemy.el.remove();
            enemies.splice(index, 1);

            score++;
            scoreText.textContent = score;

            if (score % 10 === 0) {
                speed += 0.5;
                speedText.textContent =
                    Math.floor(speed);
            }
        }
    });

    /* Yeni araç */
    if (Math.random() < 0.025) {
        createEnemy();
    }

    requestAnimationFrame(gameLoop);
}

/* Oyun bitir */
function endGame() {

    gameRunning = false;
    direction = 0;

    finalScore.textContent = score;
    gameOverScreen.style.display = "flex";
}

/* Yeniden başlat */
restartButton.addEventListener("click", function() {

    enemies.forEach(e => e.el.remove());

    enemies = [];

    carX = window.innerWidth / 2;
    score = 0;
    speed = 5;
    direction = 0;
    gameRunning = true;

    scoreText.textContent = "0";
    speedText.textContent = "5";

    car.style.left = carX + "px";
    car.style.transform =
        "translateX(-50%) rotate(0deg)";

    gameOverScreen.style.display = "none";

    gameLoop();
});

/* Başlat */
gameLoop();
</script>

</body>
</html>
