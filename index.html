<!DOCTYPE html>
<html lang="tr">
<head>

<title>Turbo Road - Ultimate</title>

<style>

    </div>
</div>

<canvas id="game"></canvas>

<div id="startScreen">
    <div class="menu">
        <div class="logo">TURBO ROAD</div>
        <div class="sub">
            COAST HIGHWAY • 3 ŞERİT
        </div>

            YARIŞI BAŞLAT
        </button>

        <div class="info">
            <span>← SOL</span>

        </div>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   TURBO ROAD
   Tek dosya / Canvas / Mobil
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", {
    alpha:false,
    desynchronized:true
});

const rotateBox = document.getElementById("rotate");
const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");

let W=innerWidth;
let H=innerHeight;
let DPR=1;

function resize(){

    W=innerWidth;
    H=innerHeight;

    DPR=Math.min(devicePixelRatio || 1,1.5);

    canvas.width=Math.floor(W*DPR);
    canvas.height=Math.floor(H*DPR);

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);

    checkOrientation();
}

function checkOrientation(){

    const portrait=H>W;

    rotateBox.style.display=portrait ? "flex":"none";
}

addEventListener("resize",resize);
addEventListener("orientationchange",resize);

resize();

/* =========================================================
   GAME STATE
========================================================= */

let running=false;
let paused=false;
let gameOver=false;

let score=0;
let highScore=Number(localStorage.getItem("turboHigh")||0);

let speed=85;
let targetSpeed=85;
let maxSpeed=260;

let distance=0;

let playerLane=1;
let playerX=0;

let traffic=[];
let scenery=[];

let spawnTimer=0;
let sceneryTimer=0;

let last=performance.now();

const lanes=[-1,0,1];

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;
let engineOsc=null;
let engineGain=null;

function initAudio(){

    if(audioCtx) return;

    try{

        audioCtx=new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        engineOsc=audioCtx.createOscillator();
        engineGain=audioCtx.createGain();

        engineOsc.type="sawtooth";
        engineOsc.frequency.value=70;

        engineGain.gain.value=0.0001;

        engineOsc.connect(engineGain);
        engineGain.connect(audioCtx.destination);

        engineOsc.start();

    }catch(e){}
}

function updateEngine(){

    if(!audioCtx || !engineOsc || !engineGain)
        return;

    const normalized=(speed-50)/(maxSpeed-50);

    engineOsc.frequency.setTargetAtTime(
        65+normalized*125,
        audioCtx.currentTime,
        .05
    );

    engineGain.gain.setTargetAtTime(
        running && !paused ? .035 : .0001,
        audioCtx.currentTime,
        .08
    );
}

function crashSound(){

    if(!audioCtx) return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="square";
    osc.frequency.setValueAtTime(110,audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(
        35,
        audioCtx.currentTime+.3
    );

    gain.gain.setValueAtTime(.14,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+.3
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+.3);
}

/* =========================================================
   WORLD
========================================================= */

function roadCenterAt(y){

    /*
      Hafif viraj.
      Alt tarafta yol daha geniş,
      üst tarafta daha dar.
    */

    const t=1-y;

    return W/2 +
        Math.sin(distance*.0008 + y*2.7)*W*.055*t;
}

function roadWidthAt(y){

    const t=1-y;

    return W*.16 + W*.72*Math.pow(t,.88);
}

function horizonY(){

    return H*.08;
}

/* =========================================================
   BACKGROUND
========================================================= */

function drawSky(){

    const sky=ctx.createLinearGradient(0,0,0,H*.55);

    sky.addColorStop(0,"#79c9e9");
    sky.addColorStop(.55,"#b8e2ef");
    sky.addColorStop(1,"#d8eddf");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H*.6);
}

function drawGround(){

    const y=horizonY();

    const g=ctx.createLinearGradient(0,y,0,H);

    g.addColorStop(0,"#9bc96b");
    g.addColorStop(.45,"#78ad52");
    g.addColorStop(1,"#54853d");

    ctx.fillStyle=g;
    ctx.fillRect(0,y,W,H-y);

    /*
      Kumlu sahil alanları
    */

    ctx.fillStyle="#cbb77a";

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W*.27,y);
    ctx.lineTo(W*.37,H);
    ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(W*.73,y);
    ctx.lineTo(W,y);
    ctx.lineTo(W,H);
    ctx.lineTo(W*.63,H);
    ctx.closePath();
    ctx.fill();
}

/* =========================================================
   PALM TREE
========================================================= */

function drawPalm(x,y,size){

    const trunk=size*.12;

    ctx.save();

    ctx.translate(x,y);

    /*
      gölge
    */

    ctx.fillStyle="rgba(0,0,0,.16)";
    ctx.beginPath();
    ctx.ellipse(
        0,
        size*.05,
        size*.32,
        size*.08,
        0,0,Math.PI*2
    );
    ctx.fill();

    /*
      gövde
    */

    const trunkGrad=ctx.createLinearGradient(
        -trunk,0,trunk,0
    );

    trunkGrad.addColorStop(0,"#6b4a25");
    trunkGrad.addColorStop(.5,"#a87339");
    trunkGrad.addColorStop(1,"#513719");

    ctx.fillStyle=trunkGrad;

    ctx.beginPath();

    ctx.moveTo(-trunk,0);
    ctx.lineTo(-trunk*.7,-size*.68);
    ctx.lineTo(trunk*.7,-size*.68);
    ctx.lineTo(trunk,0);

    ctx.closePath();
    ctx.fill();

    /*
      yapraklar
    */

    const top=-size*.68;

    ctx.translate(0,top);

    for(let i=0;i<9;i++){

        const a=i*Math.PI*2/9;

        ctx.save();
        ctx.rotate(a);

        ctx.fillStyle=
            i%2===0 ? "#24702e":"#358b38";

        ctx.beginPath();

        ctx.moveTo(0,0);
        ctx.quadraticCurveTo(
            size*.24,
            -size*.08,
            size*.53,
            -size*.03
        );

        ctx.quadraticCurveTo(
            size*.28,
            size*.09,
            0,0
        );

        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    ctx.restore();
}

/* =========================================================
   ROCK
========================================================= */

function drawRock(x,y,size){

    ctx.save();

    ctx.translate(x,y);

    ctx.fillStyle="rgba(0,0,0,.18)";

    ctx.beginPath();
    ctx.ellipse(
        0,
        size*.13,
        size*.55,
        size*.19,
        0,0,Math.PI*2
    );
    ctx.fill();

    const g=ctx.createLinearGradient(
        -size*.4,
        -size*.3,
        size*.4,
        size*.3
    );

    g.addColorStop(0,"#b5aa83");
    g.addColorStop(.55,"#81785e");
    g.addColorStop(1,"#504a39");

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.moveTo(-size*.5,size*.12);
    ctx.lineTo(-size*.37,-size*.25);
    ctx.lineTo(-size*.05,-size*.48);
    ctx.lineTo(size*.35,-size*.34);
    ctx.lineTo(size*.5,size*.13);
    ctx.lineTo(size*.22,size*.34);
    ctx.lineTo(-size*.35,size*.29);

    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

/* =========================================================
   SCENERY
========================================================= */

function createScenery(){

    scenery=[];

    for(let i=0;i<35;i++){

        const side=Math.random()<.5?-1:1;

        scenery.push({
            side,
            depth:Math.random(),
            type:Math.random()<.72?"palm":"rock",
            offset:.08+Math.random()*.35,
            size:.7+Math.random()*.8
        });
    }
}

function updateScenery(dt){

    for(const s of scenery){

        s.depth += dt*(speed/420);

        if(s.depth>1){

            s.depth=0;
            s.side=Math.random()<.5?-1:1;
            s.type=Math.random()<.72?"palm":"rock";
            s.offset=.08+Math.random()*.35;
        }
    }
}

function drawScenery(){

    /*
      uzak nesneler önce,
      yakın nesneler sonra.
    */

    const sorted=[...scenery].sort(
        (a,b)=>a.depth-b.depth
    );

    for(const s of sorted){

        const d=s.depth;

        const y=
            horizonY()+
            Math.pow(d,1.55)*(H-horizonY());

        const rw=roadWidthAt(
            (y-horizonY())/(H-horizonY())
        );

        const cx=roadCenterAt(
            (y-horizonY())/(H-horizonY())
        );

        const x=
            cx+
            s.side*(rw*.5 + W*s.offset);

        const scale=.15+d*1.45;
        const size=22*scale*s.size;

        /*
          Yolun dışına kesin şekilde yerleştir.
        */

        if(s.type==="palm")
            drawPalm(x,y,size);

        else
            drawRock(x,y,size*.8);
    }
}

/* =========================================================
   ROAD
========================================================= */

function drawRoad(){

    const hy=horizonY();

    /*
      Yol gövdesi
    */

    const topCenter=roadCenterAt(0);
    const bottomCenter=roadCenterAt(1);

    const topW=roadWidthAt(0);
    const bottomW=roadWidthAt(1);

    const roadGrad=ctx.createLinearGradient(
        0,hy,0,H
    );

    roadGrad.addColorStop(0,"#696a63");
    roadGrad.addColorStop(.55,"#5c5d57");
    roadGrad.addColorStop(1,"#44453f");

    ctx.fillStyle=roadGrad;

    ctx.beginPath();

    ctx.moveTo(
        topCenter-topW/2,
        hy
    );

    ctx.lineTo(
        topCenter+topW/2,
        hy
    );

    ctx.lineTo(
        bottomCenter+bottomW/2,
        H
    );

    ctx.lineTo(
        bottomCenter-bottomW/2,
        H
    );

    ctx.closePath();
    ctx.fill();

    /*
      Yol kenarı asfalt şeridi
    */

    ctx.strokeStyle="#31322e";
    ctx.lineWidth=Math.max(2,W*.006);

    ctx.beginPath();

    ctx.moveTo(
        topCenter-topW/2,
        hy
    );

    ctx.lineTo(
        bottomCenter-bottomW/2,
        H
    );

    ctx.moveTo(
        topCenter+topW/2,
        hy
    );

    ctx.lineTo(
        bottomCenter+bottomW/2,
        H
    );

    ctx.stroke();

    /*
      beyaz kenar çizgileri
    */

    ctx.strokeStyle="rgba(240,240,225,.78)";
    ctx.lineWidth=Math.max(2,W*.004);

    ctx.beginPath();

    ctx.moveTo(
        topCenter-topW*.47,
        hy
    );

    ctx.lineTo(
        bottomCenter-bottomW*.47,
        H
    );

    ctx.moveTo(
        topCenter+topW*.47,
        hy
    );

    ctx.lineTo(
        bottomCenter+bottomW*.47,
        H
    );

    ctx.stroke();

    /*
      3 şerit = 2 kesikli çizgi
    */

    drawLaneLine(-1/6);
    drawLaneLine(1/6);
}

function drawLaneLine(lanePos){

    const hy=horizonY();

    const segments=28;

    for(let i=0;i<segments;i++){

        let p1=(i/segments);
        let p2=((i+.55)/segments);

        /*
          Hareket efekti
        */

        p1=(p1 + distance*.00013)%1;
        p2=(p2 + distance*.00013)%1;

        const y1=
            hy+
            Math.pow(p1,1.72)*(H-hy);

        const y2=
            hy+
            Math.pow(p2,1.72)*(H-hy);

        const t1=(y1-hy)/(H-hy);
        const t2=(y2-hy)/(H-hy);

        const c1=roadCenterAt(t1);
        const c2=roadCenterAt(t2);

        const w1=roadWidthAt(t1);
        const w2=roadWidthAt(t2);

        const x1=c1+w1*lanePos;
        const x2=c2+w2*lanePos;

        ctx.strokeStyle="rgba(245,245,235,.86)";
        ctx.lineWidth=
            Math.max(1.5,W*.004*t1+.7);

        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }
}

/* =========================================================
   GUARDRAILS
========================================================= */

function drawGuardRail(side){

    const hy=horizonY();

    const steps=30;

    /*
      Ana metal ray
    */

    ctx.strokeStyle="#202321";
    ctx.lineWidth=Math.max(3,W*.007);

    ctx.beginPath();

    for(let i=0;i<=steps;i++){

        const t=i/steps;

        const y=
            hy+
            Math.pow(t,1.45)*(H-hy);

        const c=roadCenterAt(t);
        const rw=roadWidthAt(t);

        const x=
            c+side*rw*.53;

        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);
    }

    ctx.stroke();

    /*
      Üst parlak metal
    */

    ctx.strokeStyle="#8d928b";
    ctx.lineWidth=Math.max(1.5,W*.003);

    ctx.beginPath();

    for(let i=0;i<=steps;i++){

        const t=i/steps;

        const y=
            hy+
            Math.pow(t,1.45)*(H-hy)-5;

        const c=roadCenterAt(t);
        const rw=roadWidthAt(t);

        const x=
            c+side*rw*.53;

        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);
    }

    ctx.stroke();

    /*
      Direkler
    */

    for(let i=2;i<steps;i+=3){

        const t=i/steps;

        const y=
            hy+
            Math.pow(t,1.45)*(H-hy);

        const c=roadCenterAt(t);
        const rw=roadWidthAt(t);

        const x=
            c+side*rw*.53;

        const h=7+25*t;

        ctx.strokeStyle="#292c29";
        ctx.lineWidth=Math.max(2,W*.004);

        ctx.beginPath();
        ctx.moveTo(x,y-h);
        ctx.lineTo(x,y+4);
        ctx.stroke();
    }
}

/* =========================================================
   CAR DRAWING
========================================================= */

function roundedRect(x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.arcTo(
        x+w,y,
        x+w,y+h,
        r
    );

    ctx.arcTo(
        x+w,y+h,
        x,y+h,
        r
    );

    ctx.arcTo(
        x,y+h,
        x,y,
        r
    );

    ctx.arcTo(
        x,y,
        x+w,y,
        r
    );

    ctx.closePath();
}

function drawCar(x,y,w,h,type,player=false){

    ctx.save();

    ctx.translate(x,y);

    /*
      gölge
    */

    ctx.fillStyle="rgba(0,0,0,.32)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        h*.38,
        w*.57,
        h*.18,
        0,0,Math.PI*2
    );

    ctx.fill();

    /*
      lastikler
    */

    const tireW=w*.13;
    const tireH=h*.28;

    ctx.fillStyle="#151515";

    roundedRect(
        -w*.52,
        -h*.15,
        tireW,
        tireH,
        tireW*.3
    );
    ctx.fill();

    roundedRect(
        w*.39,
        -h*.15,
        tireW,
        tireH,
        tireW*.3
    );
    ctx.fill();

    /*
      araç gövdesi
    */

    let body;

    if(player)
        body=ctx.createLinearGradient(
            -w/2,0,w/2,0
        );
    else
        body=ctx.createLinearGradient(
            -w/2,0,w/2,0
        );

    if(player){

        body.addColorStop(0,"#8d4c00");
        body.addColorStop(.28,"#e89a16");
        body.addColorStop(.52,"#ffc04a");
        body.addColorStop(.78,"#d67c08");
        body.addColorStop(1,"#713900");

    }else{

        const colors=[
            ["#bd2020","#ef5555","#791414"],
            ["#164c92","#3b80c9","#102d5c"],
            ["#dedede","#ffffff","#888888"],
            ["#242424","#555555","#111111"],
            ["#168054","#35b77a","#0c4931"]
        ];

        const c=colors[type%colors.length];

        body.addColorStop(0,c[2]);
        body.addColorStop(.45,c[1]);
        body.addColorStop(1,c[0]);
    }

    roundedRect(
        -w*.46,
        -h*.48,
        w*.92,
        h*.92,
        w*.15
    );

    ctx.fillStyle=body;
    ctx.fill();

    /*
      cam / tavan
    */

    ctx.fillStyle="#11181c";

    ctx.beginPath();

    ctx.moveTo(-w*.30,-h*.27);
    ctx.lineTo(-w*.17,-h*.43);
    ctx.lineTo(w*.17,-h*.43);
    ctx.lineTo(w*.30,-h*.27);
    ctx.lineTo(w*.25,-h*.04);
    ctx.lineTo(-w*.25,-h*.04);
    ctx.closePath();

    ctx.fill();

    /*
      cam yansıması
    */

    ctx.fillStyle="rgba(120,190,215,.32)";

    ctx.beginPath();

    ctx.moveTo(-w*.22,-h*.25);
    ctx.lineTo(-w*.12,-h*.37);
    ctx.lineTo(0,-h*.37);
    ctx.lineTo(0,-h*.08);
    ctx.lineTo(-w*.21,-h*.08);

    ctx.closePath();
    ctx.fill();

    /*
      arka cam
    */

    ctx.fillStyle="#151b1e";

    ctx.beginPath();

    ctx.moveTo(-w*.23,h*.02);
    ctx.lineTo(w*.23,h*.02);
    ctx.lineTo(w*.19,h*.20);
    ctx.lineTo(-w*.19,h*.20);

    ctx.closePath();
    ctx.fill();

    /*
      stop lambaları
    */

    ctx.fillStyle="#c51616";

    roundedRect(
        -w*.35,
        h*.18,
        w*.17,
        h*.07,
        3
    );
    ctx.fill();

    roundedRect(
        w*.18,
        h*.18,
        w*.17,
        h*.07,
        3
    );
    ctx.fill();

    /*
      plaka
    */

    ctx.fillStyle="#e6e6df";

    roundedRect(
        -w*.12,
        h*.28,
        w*.24,
        h*.055,
        2
    );

    ctx.fill();

    ctx.restore();
}

/* =========================================================
   TRAFFIC
========================================================= */

function spawnTraffic(){

    /*
      Oyuncunun bulunduğu şeride sürekli
      araç koyma.
    */

    let available=lanes.filter(
        l=>Math.abs(l-playerLane)>0
    );

    let lane=
        available[
            Math.floor(Math.random()*available.length)
        ];

    /*
      Bazen üç şeritli trafik oluştur.
    */

    const type=Math.floor(Math.random()*5);

    traffic.push({

        lane,
        z:.02,
        type,

        speed:
            45+
            Math.random()*85,

        width:
            W*.075+
            Math.random()*W*.018,

        passed:false
    });
}

function updateTraffic(dt){

    for(const car of traffic){

        const relative=
            speed-car.speed;

        car.z += dt*
            (.055 + relative/6000);

        if(car.z>1.15){

            if(!car.passed){

                score+=10;
                car.passed=true;
            }

            car.remove=true;
        }
    }

    traffic=traffic.filter(c=>!c.remove);

    /*
      trafik üretimi
    */

    spawnTimer-=dt;

    const interval=
        Math.max(.38,1.15-speed/420);

    if(spawnTimer<=0){

        spawnTraffic();

        spawnTimer=interval+
            Math.random()*.35;
    }
}

function drawTraffic(){

    for(const car of traffic){

        const z=car.z;

        const y=
            horizonY()+
            Math.pow(z,1.65)*(H-horizonY());

        const t=
            (y-horizonY())/
            (H-horizonY());

        const c=roadCenterAt(t);
        const rw=roadWidthAt(t);

        const x=
            c+
            car.lane*(rw/3);

        const scale=.22+z*1.02;

        const w=car.width*scale;
        const h=w*1.68;

        drawCar(
            x,
            y,
            w,
            h,
            car.type,
            false
        );
    }
}

/* =========================================================
   PLAYER
========================================================= */

function playerPosition(){

    const y=H*.83;

    const t=(y-horizonY())/
            (H-horizonY());

    const c=roadCenterAt(t);
    const rw=roadWidthAt(t);

    const desired=
        c+
        playerLane*(rw/3);

    playerX +=
        (desired-playerX)*.16;

    return {
        x:playerX,
        y
    };
}

function drawPlayer(){

    const p=playerPosition();

    const w=Math.min(W*.095,120);
    const h=w*1.62;

    drawCar(
        p.x,
        p.y,
        w,
        h,
        0,
        true
    );
}

/* =========================================================
   COLLISION
========================================================= */

function checkCollision(){

    const p=playerPosition();

    const playerW=Math.min(W*.095,120);
    const playerH=playerW*1.62;

    for(const car of traffic){

        if(car.z<.70 || car.z>1.05)
            continue;

        const y=
            horizonY()+
            Math.pow(car.z,1.65)*(H-horizonY());

        const t=
            (y-horizonY())/
            (H-horizonY());

        const c=roadCenterAt(t);
        const rw=roadWidthAt(t);

        const x=
            c+
            car.lane*(rw/3);

        const scale=.22+car.z*1.02;

        const w=car.width*scale;
        const h=w*1.68;

        const dx=Math.abs(p.x-x);
        const dy=Math.abs(p.y-y);

        if(
            dx <
            (playerW+w)*.42
            &&
            dy <
            (playerH+h)*.35
        ){

            crash();
            return;
        }
    }
}

function crash(){

    if(gameOver) return;

    gameOver=true;
    running=false;

    crashSound();

    if(score>highScore){

        highScore=score;

        localStorage.setItem(
            "turboHigh",
            highScore
        );
    }

    setTimeout(showGameOver,300);
}

/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(){

    startScreen.classList.remove("hidden");

    startScreen.querySelector(".logo")
        .textContent="KAZA!";

    startScreen.querySelector(".sub")
        .innerHTML=
        "SKOR: <b>"+Math.floor(score)+
        "</b><br>EN YÜKSEK: "+
        Math.floor(highScore);

    startBtn.textContent="TEKRAR OYNA";
}

/* =========================================================
   HUD
========================================================= */

function drawHUD(){

    /*
      Sol üst
    */

    ctx.textAlign="left";

    ctx.fillStyle="rgba(20,20,20,.35)";

    roundedRect(
        22,
        18,
        130,
        66,
        10
    );

    ctx.fill();

    ctx.fillStyle="#ffc400";

    ctx.font=
        "bold "+Math.max(16,W*.017)+"px Arial";

    ctx.fillText(
        "SKOR",
        35,
        42
    );

    ctx.font=
        "bold "+Math.max(23,W*.023)+"px Arial";

    ctx.fillText(
        Math.floor(score),
        35,
        70
    );

    /*
      Sağ hız
    */

    ctx.textAlign="right";

    ctx.fillStyle="rgba(20,20,20,.35)";

    roundedRect(
        W-185,
        18,
        145,
        66,
        10
    );

    ctx.fill();

    ctx.fillStyle="#ffc400";

    ctx.font=
        "bold "+Math.max(14,W*.016)+"px Arial";

    ctx.fillText(
        "HIZ",
        W-55,
        42
    );

    ctx.font=
        "bold "+Math.max(21,W*.022)+"px Arial";

    ctx.fillText(
        Math.floor(speed)+" KM/H",
        W-55,
        70
    );

    /*
      Sol altta kontrol göstergesi
    */

    ctx.textAlign="center";

    ctx.fillStyle="rgba(255,255,255,.18)";

    ctx.beginPath();
    ctx.arc(W*.10,H*.84,32,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(W*.90,H*.84,32,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="rgba(255,255,255,.65)";
    ctx.font="bold 28px Arial";

    ctx.fillText("‹",W*.10,H*.85+10);
    ctx.fillText("›",W*.90,H*.85+10);
}

/* =========================================================
   ROAD MOTION
========================================================= */

function update(dt){

    if(!running || paused || gameOver)
        return;

    /*
      hızın yumuşak değişmesi
    */

    targetSpeed=
        Math.min(
            maxSpeed,
            85+distance*.003
        );

    speed +=
        (targetSpeed-speed)*dt*.75;

    distance+=speed*dt;

    score+=speed*dt*.025;

    updateScenery(dt);
    updateTraffic(dt);

    checkCollision();

    updateEngine();
}

/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.setTransform(DPR,0,0,DPR,0,0);

    /*
      Arka plan
    */

    drawSky();
    drawGround();

    /*
      Doğa
    */

    drawScenery();

    /*
      Yol
    */

    drawRoad();

    /*
      Bariyerler
    */

    drawGuardRail(-1);
    drawGuardRail(1);

    /*
      Trafik
    */

    drawTraffic();

    /*
      Oyuncu
    */

    drawPlayer();

    /*
      HUD
    */

    drawHUD();

    /*
      Pause overlay
    */

    if(paused){

        ctx.fillStyle="rgba(0,0,0,.48)";
        ctx.fillRect(0,0,W,H);

        ctx.textAlign="center";
        ctx.fillStyle="#fff";

        ctx.font="bold 38px Arial";

        ctx.fillText(
            "DURAKLATILDI",
            W/2,
            H/2
        );
    }
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

    const dt=
        Math.min(
            .035,
            (now-last)/1000
        );

    last=now;

    update(dt);
    render();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   START
========================================================= */

function startGame(){

    initAudio();

    if(audioCtx &&
       audioCtx.state==="suspended"){

        audioCtx.resume();
    }

    score=0;
    distance=0;
    speed=85;
    targetSpeed=85;

    playerLane=1;

    traffic=[];

    createScenery();

    /*
      oyuncu ilk kez konumlandırılır
    */

    playerX=W/2;

    spawnTimer=.8;

    gameOver=false;
    paused=false;
    running=true;

    startScreen.classList.add("hidden");

    startScreen.querySelector(".logo")
        .textContent="TURBO ROAD";

    startScreen.querySelector(".sub")
        .textContent=
        "COAST HIGHWAY • 3 ŞERİT";

    startBtn.textContent="YARIŞI BAŞLAT";

    updateEngine();
}

startBtn.addEventListener("click",startGame);

/* =========================================================
   PAUSE
========================================================= */

pauseBtn.addEventListener("click",function(){

    if(!running || gameOver)
        return;

    paused=!paused;

    pauseBtn.textContent=
        paused ? "▶":"Ⅱ";

    updateEngine();
});

/* =========================================================
   TOUCH CONTROL
========================================================= */

let touchStartX=null;

canvas.addEventListener(
    "touchstart",
    function(e){

        if(!running || paused)
            return;

        const t=e.touches[0];

        touchStartX=t.clientX;

        e.preventDefault();

    },
    {passive:false}
);

canvas.addEventListener(
    "touchend",
    function(e){

        if(!running || paused)
            return;

        if(touchStartX===null)
            return;

        const endX=
            e.changedTouches[0].clientX;

        const dx=endX-touchStartX;

        /*
          Kaydırma ile direksiyon
        */

        if(Math.abs(dx)>25){

            if(dx<0)
                moveLeft();
            else
                moveRight();

        }else{

            /*
              Ekranın hangi tarafına basıldıysa
              o yöne dön.
            */

            if(endX<W/2)
                moveLeft();
            else
                moveRight();
        }

        touchStartX=null;

        e.preventDefault();

    },
    {passive:false}
);

/* =========================================================
   MOUSE / PC
========================================================= */

canvas.addEventListener("mousedown",e=>{

    if(!running || paused)
        return;

    if(e.clientX<W/2)
        moveLeft();
    else
        moveRight();
});

/* =========================================================
   KEYBOARD
========================================================= */

addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft" || e.key==="a")
        moveLeft();

    if(e.key==="ArrowRight" || e.key==="d")
        moveRight();

    if(e.key===" "){
        if(running)
            paused=!paused;
    }
});

function moveLeft(){

    if(playerLane>0)
        playerLane--;
}

function moveRight(){

    if(playerLane<2)
        playerLane++;
}

/* =========================================================
   FULLSCREEN
========================================================= */

async function fullScreen(){

    try{

        if(!document.fullscreenElement){

            await document.documentElement
                .requestFullscreen();
        }

    }catch(e){}
}

startBtn.addEventListener("click",fullScreen);

/* =========================================================
   SCREEN WAKE
========================================================= */

let wakeLock=null;

async function keepScreenOn(){

    try{

        if("wakeLock" in navigator){

            wakeLock=
                await navigator.wakeLock
                    .request("screen");
        }

    }catch(e){}
}

document.addEventListener(
    "visibilitychange",
    ()=>{
        if(
            document.visibilityState==="visible" &&
            running
        ){
            keepScreenOn();
        }
    }
);

startBtn.addEventListener(
    "click",
    keepScreenOn
);

/* =========================================================
   INITIAL
========================================================= */

createScenery();

/*
  Başlangıç ekranının arkasında da
  oyunun dünyası görünür.
*/

playerX=W/2;

</script>
