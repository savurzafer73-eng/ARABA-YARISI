<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>Turbo Road X</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

#menu{
position:fixed;inset:0;z-index:20;
display:flex;align-items:center;justify-content:center;
background:linear-gradient(#071019,#020305)
}
.box{
width:min(430px,92vw);padding:28px 22px;
border-radius:24px;background:rgba(9,14,21,.96);
border:1px solid #263341;text-align:center;
box-shadow:0 25px 80px #000
}
.logo{font-size:40px;font-weight:900;letter-spacing:4px}
.logo i{font-style:normal;color:#18bfff}
.small{font-size:11px;color:#71808e;letter-spacing:3px;margin:7px 0 20px}
.showcar{height:155px;display:flex;align-items:center;justify-content:center}
.showcar .c{
width:64px;height:128px;border-radius:22px;
background:linear-gradient(90deg,#500606,#e21b1b,#720808);
box-shadow:0 20px 40px #000;position:relative
}
.showcar .c:before{
content:"";position:absolute;left:9px;right:9px;top:24px;height:48px;
border-radius:16px;background:linear-gradient(#12212b,#6c8793,#172832)
}
.showcar .c:after{
content:"";position:absolute;left:12px;right:12px;bottom:18px;height:5px;
background:#ffdb9c;box-shadow:0 -47px 0 #ffdb9c
}
button{
width:100%;padding:16px;margin-top:9px;border:0;border-radius:14px;
background:linear-gradient(135deg,#0786bd,#16bfff);
color:white;font-size:16px;font-weight:900
}
button:active{transform:scale(.98)}
.alt{background:#111923;border:1px solid #263341;color:#aeb9c3}

#hud{
position:fixed;left:0;right:0;top:0;z-index:10;
padding:12px;pointer-events:none
}
.row{display:flex;gap:7px;justify-content:space-between}
.h{
background:rgba(3,7,11,.72);border:1px solid rgba(255,255,255,.12);
border-radius:12px;padding:8px 10px;min-width:82px
}
.lab{font-size:8px;color:#71808e;text-transform:uppercase}
.val{font-size:17px;font-weight:900;margin-top:2px}
#nitro{
width:135px;height:7px;background:#111923;border-radius:10px;
overflow:hidden;margin-top:5px
}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#00aaff,#8aeaff)}

#pause{
display:none;position:fixed;right:12px;top:92px;z-index:15;
width:44px;height:44px;border-radius:50%;padding:0;
background:rgba(5,8,12,.8);border:1px solid #34414c
}
#left,#right{
position:fixed;bottom:0;width:50%;height:43%;z-index:8;opacity:0
}
#left{left:0}#right{right:0}

#over{
display:none;position:fixed;inset:0;z-index:30;
align-items:center;justify-content:center;background:rgba(0,0,0,.75)
}
.overbox{
width:min(410px,90vw);padding:28px;border-radius:22px;
background:#090e14;border:1px solid #293744;text-align:center
}
.overbox h1{margin:0 0 18px}
.stat{
display:flex;justify-content:space-between;padding:12px 0;
border-bottom:1px solid #17212a;color:#8996a2
}
.stat b{color:#fff}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
<div class="box">
<div class="logo">TURBO <i>ROAD X</i></div>
<div class="small">HIGHWAY STREET RACING</div>

<div class="showcar"><div class="c"></div></div>

<button id="start">YARIŞA BAŞLA</button>
<button id="controls" class="alt">KONTROLLER</button>
</div>
</div>

<div id="hud">
<div class="row">
<div class="h"><div class="lab">Skor</div><div class="val" id="score">0</div></div>
<div class="h"><div class="lab">Para</div><div class="val" id="money">₺0</div></div>
<div class="h"><div class="lab">Hız</div><div class="val"><span id="speed">0</span></div></div>
</div>
<div class="h" style="margin-top:7px;width:160px">
<div class="lab">Nitro</div>
<div id="nitro"><div id="nitroFill"></div></div>
</div>
</div>

<button id="pause">Ⅱ</button>

<div id="left"></div>
<div id="right"></div>

<div id="over">
<div class="overbox">
<h1>YARIŞ BİTTİ</h1>
<div class="stat"><span>Skor</span><b id="finalScore">0</b></div>
<div class="stat"><span>Kazanılan</span><b id="finalMoney">₺0</b></div>
<button id="again">TEKRAR OYNA</button>
<button id="back" class="alt">ANA MENÜ</button>
</div>
</div>

<script>
(function(){

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var W,H,DPR;
function resize(){
DPR=Math.min(window.devicePixelRatio||1,2);
W=innerWidth;H=innerHeight;
canvas.width=W*DPR;
canvas.height=H*DPR;
canvas.style.width=W+"px";
canvas.style.height=H+"px";
ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

/* GAME */
var running=false,paused=false,last=0;
var score=0,money=0;
var speed=270;
var distance=0;
var nitro=100;
var nitroPressed=false;

var playerOffset=0;
var left=false,right=false;

var traffic=[];
var particles=[];
var spawnTimer=0;

/* ROAD */
var ROAD_LEFT=.17;
var ROAD_RIGHT=.83;

function roadLeft(){
return W*ROAD_LEFT;
}
function roadRight(){
return W*ROAD_RIGHT;
}
function roadWidth(){
return roadRight()-roadLeft();
}
function laneX(lane){
return roadLeft()+roadWidth()*(lane+.5)/3;
}

/* DRAW BACKGROUND */
function background(){

var g=ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,"#111a20");
g.addColorStop(.32,"#233c2b");
g.addColorStop(1,"#102016");

ctx.fillStyle=g;
ctx.fillRect(0,0,W,H);

/* distant buildings */
ctx.fillStyle="#10191e";

for(var i=0;i<25;i++){
var x=i*W/24;
var bw=12+(i%4)*10;
var bh=15+(i%6)*13;
ctx.fillRect(x,H*.20-bh,bw,bh);
}

/* grass strips */
ctx.fillStyle="#172b1c";
ctx.fillRect(0,H*.20,roadLeft(),H);
ctx.fillRect(roadRight(),H*.20,W-roadRight(),H);

/* grass texture */
ctx.strokeStyle="rgba(110,150,90,.18)";
ctx.lineWidth=1;

for(var n=0;n<100;n++){
var side=n%2;
var x=side?roadRight()+Math.random()*(W-roadRight()):Math.random()*roadLeft();
var y=H*.2+Math.random()*H;
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+(Math.random()-.5)*5,y-8);
ctx.stroke();
}
}

/* TREES */
function tree(x,y,s){

ctx.save();

ctx.fillStyle="rgba(0,0,0,.28)";
ctx.beginPath();
ctx.ellipse(x,y+8*s,15*s,5*s,0,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#533522";
ctx.fillRect(x-3*s,y+5*s,6*s,20*s);

ctx.fillStyle="#173d27";
ctx.beginPath();
ctx.arc(x,y,17*s,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#245a36";
ctx.beginPath();
ctx.arc(x-8*s,y+5*s,12*s,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.arc(x+8*s,y+5*s,12*s,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function environment(){

for(var i=0;i<22;i++){

var p=((i*.067+distance*.000035)%1);
var y=H*.20+p*H*.92;
var s=.25+p*1.1;

var side=i%2;
var x;

if(side){
x=roadRight()+28+s*15;
}else{
x=roadLeft()-28-s*15;
}

tree(x,y,s);
}
}

/* ROAD */
function road(){

/* shoulder */
ctx.fillStyle="#686c69";
ctx.fillRect(roadLeft()-18,0,18,H);
ctx.fillRect(roadRight(),0,18,H);

/* asphalt */
var asphalt=ctx.createLinearGradient(0,0,0,H);
asphalt.addColorStop(0,"#363c40");
asphalt.addColorStop(.5,"#292f33");
asphalt.addColorStop(1,"#202529");

ctx.fillStyle=asphalt;
ctx.fillRect(roadLeft(),0,roadWidth(),H);

/* road subtle texture */
ctx.strokeStyle="rgba(255,255,255,.025)";
ctx.lineWidth=1;

for(var i=0;i<100;i++){
var y=(i*137+distance*.25)%H;
ctx.beginPath();
ctx.moveTo(roadLeft()+Math.random()*roadWidth(),y);
ctx.lineTo(roadLeft()+Math.random()*roadWidth()+20,y);
ctx.stroke();
}

/* edges */
ctx.fillStyle="#e8e9e5";
ctx.fillRect(roadLeft(),0,4,H);
ctx.fillRect(roadRight()-4,0,4,H);

/* 3 equal lanes */
for(var l=1;l<3;l++){

var x=roadLeft()+roadWidth()*l/3;

ctx.strokeStyle="#e1e4e1";
ctx.lineWidth=3;

var dash=55;
var gap=48;

var offset=-(distance*.55)%(dash+gap);

for(var y=offset;y<H;y+=dash+gap){

ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x,y+dash);
ctx.stroke();
}
}

/* reflectors */
for(var r=0;r<35;r++){

var y=(r*83-distance*.7)%H;
if(y<0)y+=H;

ctx.fillStyle="#e9f4ef";
ctx.fillRect(roadLeft()-11,y,4,8);
ctx.fillRect(roadRight()+7,y,4,8);
}
}

/* CAR HELPERS */
function rr(x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);
ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);
ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);
ctx.lineTo(x,y+r);
ctx.quadraticCurveTo(x,y,x+r,y);
ctx.closePath();
}

function drawCar(x,y,s,type,color,player){

var w=56*s;
var h=106*s;

if(type=="suv"){w*=1.08;h*=1.02}
if(type=="truck"){w*=1.18;h*=1.17}

ctx.save();
ctx.translate(x,y);

/* shadow */
ctx.fillStyle="rgba(0,0,0,.5)";
ctx.beginPath();
ctx.ellipse(4*s,7*s,w*.56,h*.50,0,0,Math.PI*2);
ctx.fill();

/* wheels */
ctx.fillStyle="#080a0c";

rr(-w/2-4*s,-h*.28,9*s,h*.23,3*s);ctx.fill();
rr(w/2-5*s,-h*.28,9*s,h*.23,3*s);ctx.fill();
rr(-w/2-4*s,h*.07,9*s,h*.23,3*s);ctx.fill();
rr(w/2-5*s,h*.07,9*s,h*.23,3*s);ctx.fill();

/* wheel rims */
ctx.fillStyle="#9fa8ae";

var wh=[
[-w/2,-h*.17],
[w/2,-h*.17],
[-w/2,h*.18],
[w/2,h*.18]
];

for(var q=0;q<4;q++){
ctx.beginPath();
ctx.arc(wh[q][0],wh[q][1],2.5*s,0,Math.PI*2);
ctx.fill();
}

/* body */
var p=[
[-w*.31,-h*.50],
[w*.31,-h*.50],
[w*.43,-h*.32],
[w*.49,-h*.04],
[w*.43,h*.38],
[w*.29,h*.49],
[-w*.29,h*.49],
[-w*.43,h*.38],
[-w*.49,-h*.04],
[-w*.43,-h*.32]
];

if(type=="suv"){
p=[
[-w*.38,-h*.48],[w*.38,-h*.48],
[w*.47,-h*.30],[w*.49,h*.38],
[w*.38,h*.49],[-w*.38,h*.49],
[-w*.49,h*.38],[-w*.47,-h*.30]
];
}

if(type=="truck"){
p=[
[-w*.44,-h*.48],[w*.44,-h*.48],
[w*.49,-h*.12],[w*.48,h*.46],
[-w*.48,h*.46],[-w*.49,-h*.12]
];
}

polygon(p);

var cg=ctx.createLinearGradient(-w/2,0,w/2,0);

if(player){
cg.addColorStop(0,"#520505");
cg.addColorStop(.22,"#a50d0d");
cg.addColorStop(.50,"#ed2926");
cg.addColorStop(.75,"#a80d0d");
cg.addColorStop(1,"#4b0303");
}else{
cg.addColorStop(0,"#202326");
cg.addColorStop(.18,color);
cg.addColorStop(.50,"#f2f2f2");
cg.addColorStop(.58,color);
cg.addColorStop(.82,color);
cg.addColorStop(1,"#151719");
}

ctx.fillStyle=cg;
ctx.fill();
ctx.strokeStyle="rgba(255,255,255,.25)";
ctx.lineWidth=Math.max(1,s);
ctx.stroke();

/* hood highlight */
ctx.fillStyle="rgba(255,255,255,.12)";
polygon([
[-w*.27,-h*.46],
[w*.27,-h*.46],
[w*.33,-h*.25],
[-w*.33,-h*.25]
]);
ctx.fill();

/* windows */
polygon([
[-w*.29,-h*.22],
[w*.29,-h*.22],
[w*.34,h*.17],
[-w*.34,h*.17]
]);

var glass=ctx.createLinearGradient(0,-h*.22,0,h*.17);
glass.addColorStop(0,"#101b22");
glass.addColorStop(.45,"#78919d");
glass.addColorStop(.55,"#314751");
glass.addColorStop(1,"#101920");

ctx.fillStyle=glass;
ctx.fill();

/* window separator */
ctx.strokeStyle="rgba(255,255,255,.25)";
ctx.lineWidth=1*s;

ctx.beginPath();
ctx.moveTo(-w*.29,-h*.22);
ctx.lineTo(-w*.34,h*.17);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(w*.29,-h*.22);
ctx.lineTo(w*.34,h*.17);
ctx.stroke();

/* mirrors */
ctx.fillStyle=color;
ctx.fillRect(-w*.53,-h*.18,w*.11,h*.07);
ctx.fillRect(w*.42,-h*.18,w*.11,h*.07);

/* headlights */
ctx.shadowBlur=8*s;
ctx.shadowColor="#ffe58b";
ctx.fillStyle="#fff5bd";

ctx.beginPath();
ctx.ellipse(-w*.25,-h*.44,w*.085,h*.045,0,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.ellipse(w*.25,-h*.44,w*.085,h*.045,0,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;

/* taillights */
ctx.fillStyle="#ff1e1e";
ctx.fillRect(-w*.31,h*.39,w*.19,h*.045);
ctx.fillRect(w*.12,h*.39,w*.19,h*.045);

/* body reflection */
ctx.fillStyle="rgba(255,255,255,.13)";
ctx.fillRect(-w*.035,-h*.43,w*.07,h*.82);

/* mustang details */
if(player){

ctx.fillStyle="#0a0a0a";
ctx.fillRect(-w*.23,-h*.495,w*.46,h*.035);

ctx.fillStyle="#c8c8c8";
ctx.fillRect(-w*.23,h*.45,w*.46,h*.025);

/* dual round headlights */
ctx.fillStyle="#fff2ad";

ctx.beginPath();
ctx.arc(-w*.21,-h*.435,w*.055,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.arc(w*.21,-h*.435,w*.055,0,Math.PI*2);
ctx.fill();
}

ctx.restore();
}

function polygon(p){
ctx.beginPath();
ctx.moveTo(p[0][0],p[0][1]);
for(var i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);
ctx.closePath();
}

/* TRAFFIC */
var carColors=[
"#d9dcdd","#181a1d","#214e70","#bd2824",
"#d2a92a","#eeeeea","#3d4045","#356346"
];

function spawn(){

var lanes=[0,1,2];

for(var tries=0;tries<8;tries++){

var lane=lanes[Math.floor(Math.random()*3)];
var good=true;

for(var i=0;i<traffic.length;i++){
if(traffic[i].lane==lane && traffic[i].y<260){
good=false;break;
}
}

if(good){

traffic.push({
lane:lane,
y:-140-Math.random()*170,
speed:.82+Math.random()*.20,
type:["sedan","suv","truck"][Math.floor(Math.random()*3)],
color:carColors[Math.floor(Math.random()*carColors.length)],
passed:false
});

return;
}
}
}

function updateTraffic(dt){

for(var i=traffic.length-1;i>=0;i--){

var c=traffic[i];

c.y+=speed*dt*c.speed;

if(!c.passed && c.y>playerY()-80){
score+=12;
money+=2;
c.passed=true;
}

if(c.y>H+150){
traffic.splice(i,1);
}
}
}

/* PLAYER */
function playerY(){
return H*.80;
}

function playerX(){

return W/2+playerOffset*roadWidth()*.34;
}

function updatePlayer(dt){

var dir=0;

if(left)dir-=1;
if(right)dir+=1;

playerOffset+=dir*dt*1.65;

if(!dir){
playerOffset*=Math.pow(.0005,dt);
}

if(playerOffset<-1)playerOffset=-1;
if(playerOffset>1)playerOffset=1;
}

/* COLLISION */
function collision(){

var px=playerX();
var py=playerY();

for(var i=0;i<traffic.length;i++){

var c=traffic[i];
var cx=laneX(c.lane);

var s=.82+Math.max(0,(c.y/H))*0.25;

if(Math.abs(px-cx)<42*s && Math.abs(py-c.y)<75*s){
gameOver();
return;
}
}
}

/* NITRO */
function updateNitro(dt){

if(nitroPressed && nitro>0){

nitro-=35*dt;
speed=Math.min(470,speed+420*dt);

}else{

nitro=Math.min(100,nitro+9*dt);
speed=Math.max(270,speed-100*dt);
}
}

function particlesUpdate(dt){

for(var i=particles.length-1;i>=0;i--){

var p=particles[i];
p.y+=p.vy*dt;
p.x+=p.vx*dt;
p.life-=dt;

if(p.life<=0)particles.splice(i,1);
}
}

function particle(){

if(!nitroPressed)return;

particles.push({
x:playerX()+(Math.random()-.5)*13,
y:playerY()+45,
vx:(Math.random()-.5)*25,
vy:120+Math.random()*100,
life:.3
});
}

function drawParticles(){

for(var i=0;i<particles.length;i++){

var p=particles[i];

ctx.globalAlpha=p.life/.3;
ctx.fillStyle="#ffb52c";

ctx.beginPath();
ctx.arc(p.x,p.y,4,0,Math.PI*2);
ctx.fill();
}

ctx.globalAlpha=1;
}

/* PLAYER */
function drawPlayer(){

drawCar(playerX(),playerY(),1,"coupe","#d11c1c",true);

if(nitroPressed){

ctx.fillStyle="#ffb52b";

ctx.beginPath();
ctx.moveTo(playerX()-8,playerY()+48);
ctx.lineTo(playerX(),playerY()+98+Math.random()*12);
ctx.lineTo(playerX()+8,playerY()+48);
ctx.closePath();
ctx.fill();

ctx.fillStyle="#e8faff";

ctx.beginPath();
ctx.moveTo(playerX()-4,playerY()+50);
ctx.lineTo(playerX(),playerY()+83+Math.random()*7);
ctx.lineTo(playerX()+4,playerY()+50);
ctx.closePath();
ctx.fill();
}
}

/* UPDATE UI */
function ui(){

document.getElementById("score").innerHTML=Math.floor(score);
document.getElementById("money").innerHTML="₺"+Math.floor(money);
document.getElementById("speed").innerHTML=Math.floor(speed/2.05)+" KM/H";
document.getElementById("nitroFill").style.width=nitro+"%";
}

/* LOOP */
function update(dt){

if(!running||paused)return;

distance+=speed*dt;

updatePlayer(dt);
updateNitro(dt);
updateTraffic(dt);
particlesUpdate(dt);

spawnTimer-=dt;

if(spawnTimer<=0){
spawn();
spawnTimer=Math.max(.42,.82-speed/1100);
}

particle();
collision();

score+=speed*dt*.04;

ui();
}

function draw(){

background();
environment();
road();

traffic.sort(function(a,b){return a.y-b.y});

for(var i=0;i<traffic.length;i++){

var c=traffic[i];

var s=.42+Math.max(0,Math.min(1,c.y/H))*.65;

drawCar(
laneX(c.lane),
c.y,
s,
c.type,
c.color,
false
);
}

drawParticles();
drawPlayer();

/* speed effect */
if(nitroPressed){

var vg=ctx.createRadialGradient(
W/2,H*.55,100,
W/2,H*.55,Math.max(W,H)*.75
);

vg.addColorStop(0,"rgba(0,0,0,0)");
vg.addColorStop(1,"rgba(0,140,210,.18)");

ctx.fillStyle=vg;
ctx.fillRect(0,0,W,H);
}
}

function loop(t){

if(!last)last=t;

var dt=(t-last)/1000;
if(dt>.05)dt=.05;

last=t;

update(dt);
draw();

requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* START */
function start(){

score=0;
money=0;
distance=0;
speed=270;
nitro=100;
playerOffset=0;
traffic=[];
particles=[];
spawnTimer=.2;

running=true;
paused=false;

document.getElementById("menu").style.display="none";
document.getElementById("over").style.display="none";
document.getElementById("pause").style.display="block";

last=performance.now();
}

function gameOver(){

if(!running)return;

running=false;

document.getElementById("finalScore").innerHTML=Math.floor(score);
document.getElementById("finalMoney").innerHTML="₺"+Math.floor(money);

document.getElementById("over").style.display="flex";
document.getElementById("pause").style.display="none";
}

document.getElementById("start").onclick=start;
document.getElementById("again").onclick=start;

document.getElementById("back").onclick=function(){
document.getElementById("over").style.display="none";
document.getElementById("menu").style.display="flex";
};

document.getElementById("controls").onclick=function(){
alert(
"TELEFON\\n\\n"+
"Sol tarafa basılı tut = SOL\\n"+
"Sağ tarafa basılı tut = SAĞ\\n"+
"İki tarafa aynı anda bas = NİTRO\\n\\n"+
"PC\\n\\n"+
"A / ← = SOL\\n"+
"D / → = SAĞ\\n"+
"SPACE = NİTRO\\n"+
"P = DURAKLAT"
);
};

document.getElementById("pause").onclick=function(){

if(!running)return;

paused=!paused;
this.innerHTML=paused?"▶":"Ⅱ";
};

/* KEYBOARD */
addEventListener("keydown",function(e){

if(e.key=="ArrowLeft"||e.key=="a"||e.key=="A"){
left=true;e.preventDefault();
}

if(e.key=="ArrowRight"||e.key=="d"||e.key=="D"){
right=true;e.preventDefault();
}

if(e.key==" "){
nitroPressed=true;e.preventDefault();
}

if(e.key=="p"||e.key=="P"){
if(running){
paused=!paused;
document.getElementById("pause").innerHTML=paused?"▶":"Ⅱ";
}
}
});

addEventListener("keyup",function(e){

if(e.key=="ArrowLeft"||e.key=="a"||e.key=="A")left=false;
if(e.key=="ArrowRight"||e.key=="d"||e.key=="D")right=false;
if(e.key==" ")nitroPressed=false;
});

/* TOUCH */
var L=document.getElementById("left");
var R=document.getElementById("right");

L.addEventListener("touchstart",function(e){
left=true;e.preventDefault();
},{passive:false});

L.addEventListener("touchend",function(e){
left=false;e.preventDefault();
},{passive:false});

L.addEventListener("touchcancel",function(){
left=false;
},{passive:false});

R.addEventListener("touchstart",function(e){
right=true;e.preventDefault();
},{passive:false});

R.addEventListener("touchend",function(e){
right=false;e.preventDefault();
},{passive:false});

R.addEventListener("touchcancel",function(){
right=false;
},{passive:false});

/* TWO FINGER NITRO */
document.addEventListener("touchstart",function(e){
if(e.touches.length>=2)nitroPressed=true;
},{passive:false});

document.addEventListener("touchend",function(e){
if(e.touches.length<2)nitroPressed=false;
},{passive:false});

})();
</script>
</body>
</html>
