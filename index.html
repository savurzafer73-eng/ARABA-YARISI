<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Turbo Road - Ters Yön Trafik</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071018;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#1d4722;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:absolute;
  top:env(safe-area-inset-top,10px);
  left:0;
  right:0;
  padding:12px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:5;
}

.hudBox{
  min-width:95px;
  padding:8px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  font-weight:bold;
  font-size:14px;
  text-align:center;
  border:1px solid rgba(255,255,255,.12);
}

#speed{
  color:#5ee7ff;
}

#score{
  color:#ffd65a;
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  z-index:8;
  pointer-events:none;
}

.control{
  width:92px;
  height:92px;
  border-radius:50%;
  background:rgba(0,0,0,.38);
  border:2px solid rgba(255,255,255,.22);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:38px;
  font-weight:bold;
  pointer-events:auto;
  touch-action:none;
}

.control:active{
  background:rgba(255,255,255,.22);
  transform:scale(.94);
}

#menu,
#gameOver{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(rgba(3,9,13,.72),rgba(3,9,13,.9));
}

.panel{
  width:min(90%,390px);
  padding:28px 22px;
  border-radius:22px;
  background:rgba(10,20,27,.94);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  text-align:center;
  color:white;
}

.title{
  font-size:36px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:6px;
}

.subtitle{
  color:#9fb0ba;
  margin-bottom:24px;
  font-size:14px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:10px;
  background:#16a7d9;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#263640;
}

.hidden{
  display:none !important;
}

#hint{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:125px;
  z-index:6;
  color:rgba(255,255,255,.8);
  font-size:12px;
  text-align:center;
  pointer-events:none;
  white-space:nowrap;
}

@media(max-width:360px){
  .control{
    width:78px;
    height:78px;
    font-size:32px;
  }

  .title{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hudBox">
      HIZ<br>
      <span id="speed">0 km/h</span>
    </div>

    <div class="hudBox">
      SKOR<br>
      <span id="score">0</span>
    </div>
  </div>

  <div id="hint">SOL / SAĞ düğmeleriyle aracı kontrol et</div>

  <div id="controls">
    <div class="control" id="left">‹</div>
    <div class="control" id="right">›</div>
  </div>

  <div id="menu">
    <div class="panel">
      <div class="title">TURBO ROAD</div>
      <div class="subtitle">
        Ters yönlü trafik yarışına hazır ol!
      </div>

      <button id="startBtn">OYUNA BAŞLA</button>
      <button class="secondary" id="soundBtn">🔊 SES AÇIK</button>
    </div>
  </div>

  <div id="gameOver" class="hidden">
    <div class="panel">
      <div class="title">ÇARPIŞMA!</div>
      <div class="subtitle">
        Skorun: <strong id="finalScore">0</strong>
      </div>

      <button id="restartBtn">TEKRAR OYNA</button>
      <button class="secondary" id="menuBtn">ANA MENÜ</button>
    </div>
  </div>
</div>

<script>
(() => {

"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const gameOver = document.getElementById("gameOver");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const menuBtn = document.getElementById("menuBtn");
const soundBtn = document.getElementById("soundBtn");

const scoreEl = document.getElementById("score");
const speedEl = document.getElementById("speed");
const finalScoreEl = document.getElementById("finalScore");

const leftBtn = document.getElementById("left");
const rightBtn = document.getElementById("right");

let W = 0;
let H = 0;
let dpr = 1;

let running = false;
let lastTime = 0;

let score = 0;
let distance = 0;

let soundEnabled = true;
let audioCtx = null;
let engineOsc = null;
let engineGain = null;

const keys = {
  left:false,
  right:false
};

const player = {
  x:0,
  y:0,
  width:38,
  height:70,
  speed:6.2,
  targetSpeed:6.2,
  steer:0
};

let traffic = [];

let road = {
  left:0,
  right:0,
  width:0,
  center:0
};

const trafficColors = [
  "#e53935",
  "#1976d2",
  "#f4c542",
  "#eeeeee",
  "#7b1fa2",
  "#ff7f27",
  "#26a69a",
  "#555555"
];

function resize(){

  dpr = Math.min(window.devicePixelRatio || 1,2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.floor(W*dpr);
  canvas.height = Math.floor(H*dpr);

  canvas.style.width = W+"px";
  canvas.style.height = H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  road.width = Math.min(W * .72, 420);
  road.left = (W-road.width)/2;
  road.right = road.left + road.width;
  road.center = W/2;

  player.width = Math.max(32, road.width*.105);
  player.height = player.width*1.82;

  player.y = H - Math.max(135,H*.17);

  if(!running){
    player.x = road.center;
  }else{
    player.x = clamp(player.x, road.left+player.width/2+6,
                           road.right-player.width/2-6);
  }
}

window.addEventListener("resize",resize);
resize();

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function random(min,max){
  return Math.random()*(max-min)+min;
}

function laneX(lane){
  const lanes = 3;
  const laneWidth = road.width/lanes;

  return road.left + laneWidth*(lane+.5);
}

function createTraffic(y=-120){

  const lane = Math.floor(Math.random()*3);

  const width = player.width * random(.82,1.02);
  const height = width * random(1.55,1.85);

  traffic.push({
    x:laneX(lane),
    y,
    width,
    height,
    speed:random(2.5,4.4),
    color:trafficColors[
      Math.floor(Math.random()*trafficColors.length)
    ],
    lane,
    wobble:random(-.12,.12)
  });
}

function resetTraffic(){

  traffic = [];

  const count = Math.max(4,Math.floor(H/230));

  for(let i=0;i<count;i++){

    const lane = i%3;

    const width = player.width*random(.82,1);

    traffic.push({
      x:laneX(lane),
      y:-180-i*250,
      width,
      height:width*1.7,
      speed:random(2.5,4.3),
      color:trafficColors[
        Math.floor(Math.random()*trafficColors.length)
      ],
      lane,
      wobble:random(-.12,.12)
    });
  }
}

function drawBackground(){

  ctx.fillStyle="#2c632b";
  ctx.fillRect(0,0,W,H);

  // uzak doğa
  for(let x=0;x<W;x+=55){

    const offset=(Math.sin(x*0.08+distance*.001)*12);

    drawTree(
      x+offset,
      90+(x%90),
      25
    );
  }

  // yol dışındaki ağaçlar
  const sideGap = Math.max(35,(W-road.width)/2-8);

  for(let y=-40;y<H+100;y+=95){

    const move=(distance*0.7)%95;

    drawTree(
      road.left-sideGap*.45,
      y+move,
      18
    );

    drawTree(
      road.right+sideGap*.45,
      y+move+40,
      18
    );
  }
}

function drawTree(x,y,size){

  ctx.save();

  ctx.fillStyle="#5a351d";
  ctx.fillRect(x-size*.12,y,size*.24,size*.65);

  ctx.beginPath();
  ctx.fillStyle="#174d24";
  ctx.arc(x,y,size*.45,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.fillStyle="#226d2d";
  ctx.arc(x-size*.22,y+size*.15,size*.38,0,Math.PI*2);
  ctx.arc(x+size*.22,y+size*.15,size*.38,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawRoad(){

  // yol
  ctx.fillStyle="#25292c";
  ctx.fillRect(road.left,0,road.width,H);

  // kenar çizgileri
  ctx.fillStyle="#d8d8d8";

  ctx.fillRect(
    road.left+4,0,4,H
  );

  ctx.fillRect(
    road.right-8,0,4,H
  );

  // orta şerit çizgileri
  const laneWidth=road.width/3;

  ctx.fillStyle="#e9e9e9";

  const dash=52;
  const gap=42;
  const offset=(distance*1.25)%(dash+gap);

  for(let lane=1;lane<3;lane++){

    const x=road.left+laneWidth*lane;

    for(let y=-dash+offset;y<H+dash;y+=dash+gap){

      ctx.fillRect(x-2,y,4,dash);
    }
  }

  // yol kenarı asfalt gölgesi
  ctx.fillStyle="rgba(0,0,0,.18)";
  ctx.fillRect(road.left,0,7,H);
  ctx.fillRect(road.right-7,0,7,H);
}

function roundedRect(x,y,w,h,r){

  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawCar(car,isPlayer=false){

  const x=car.x;
  const y=car.y;
  const w=car.width;
  const h=car.height;

  ctx.save();

  // gölge
  ctx.fillStyle="rgba(0,0,0,.35)";
  roundedRect(
    x-w/2+4,
    y-h/2+6,
    w,
    h,
    w*.18
  );
  ctx.fill();

  // gövde
  ctx.fillStyle=isPlayer ? "#101820" : car.color;

  roundedRect(
    x-w/2,
    y-h/2,
    w,
    h,
    w*.18
  );
  ctx.fill();

  // Mustang benzeri kaput/ön bölüm
  ctx.fillStyle=isPlayer ? "#c7c7c7" : "#222";

  roundedRect(
    x-w*.36,
    y-h*.36,
    w*.72,
    h*.28,
    w*.08
  );
  ctx.fill();

  // cam
  ctx.fillStyle="#182c38";

  roundedRect(
    x-w*.32,
    y-h*.15,
    w*.64,
    h*.25,
    w*.06
  );
  ctx.fill();

  // cam yansıması
  ctx.fillStyle="rgba(255,255,255,.25)";
  ctx.fillRect(
    x-w*.25,
    y-h*.10,
    w*.12,
    h*.15
  );

  // farlar
  ctx.fillStyle="#fff3b0";

  ctx.fillRect(
    x-w*.34,
    y-h*.47,
    w*.18,
    h*.07
  );

  ctx.fillRect(
    x+w*.16,
    y-h*.47,
    w*.18,
    h*.07
  );

  // stoplar
  ctx.fillStyle="#ff2424";

  ctx.fillRect(
    x-w*.34,
    y+h*.40,
    w*.18,
    h*.07
  );

  ctx.fillRect(
    x+w*.16,
    y+h*.40,
    w*.18,
    h*.07
  );

  // oyuncu aracı için ön tampon
  if(isPlayer){

    ctx.fillStyle="#d7d7d7";

    ctx.fillRect(
      x-w*.34,
      y-h*.49,
      w*.68,
      h*.035
    );

    // orta Mustang şeridi
    ctx.fillStyle="#ffffff";

    ctx.fillRect(
      x-w*.035,
      y-h*.48,
      w*.07,
      h*.94
    );
  }

  ctx.restore();
}

function update(dt){

  const frame = Math.min(dt/16.67,2);

  // oyuncu hızı
  player.targetSpeed =
    6.0 + Math.min(5.5,score/650);

  player.speed +=
    (player.targetSpeed-player.speed)*.025*frame;

  let steer=0;

  if(keys.left) steer-=1;
  if(keys.right) steer+=1;

  player.steer +=
    (steer-player.steer)*.22*frame;

  player.x +=
    player.steer * 5.8 * frame;

  player.x = clamp(
    player.x,
    road.left+player.width/2+8,
    road.right-player.width/2-8
  );

  // dünya oyuncunun ilerlediği yönde aşağıya akar
  distance += player.speed*frame;

  score += player.speed*.018*frame;

  // TRAFİK
  // ÖNEMLİ:
  // Oyuncu aşağıdan yukarı ilerliyor.
  // Trafik araçları yukarıdan aşağı geliyor.
  for(const car of traffic){

    car.y +=
      (car.speed + player.speed*.82) * frame;

    car.x +=
      Math.sin(distance*.01+car.y*.01)*
      car.wobble;

    car.x=clamp(
      car.x,
      road.left+car.width/2+8,
      road.right-car.width/2-8
    );
  }

  for(let i=traffic.length-1;i>=0;i--){

    if(traffic[i].y > H+160){

      traffic.splice(i,1);

      createTraffic(-random(100,420));

      score += 8;
    }
  }

  if(traffic.length<4){
    createTraffic(-random(150,500));
  }

  checkCollision();

  scoreEl.textContent=Math.floor(score);
  speedEl.textContent=
    Math.floor(80+player.speed*18)+" km/h";

  updateEngineSound();
}

function checkCollision(){

  const px=player.x;
  const py=player.y;

  for(const car of traffic){

    const dx=Math.abs(px-car.x);
    const dy=Math.abs(py-car.y);

    const hitX=(player.width+car.width)*.38;
    const hitY=(player.height+car.height)*.40;

    if(dx<hitX && dy<hitY){

      endGame();
      return;
    }
  }
}

function draw(){

  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawRoad();

  // trafik
  for(const car of traffic){
    drawCar(car,false);
  }

  // oyuncu
  drawCar(player,true);
}

function loop(time){

  if(!running)return;

  const dt=time-lastTime;
  lastTime=time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

function startGame(){

  initAudio();

  running=true;
  score=0;
  distance=0;

  menu.classList.add("hidden");
  gameOver.classList.add("hidden");

  resize();

  player.x=road.center;

  resetTraffic();

  lastTime=performance.now();

  requestAnimationFrame(loop);
}

function endGame(){

  running=false;

  finalScoreEl.textContent=Math.floor(score);

  gameOver.classList.remove("hidden");

  stopEngineSound();
}

function backMenu(){

  running=false;

  gameOver.classList.add("hidden");
  menu.classList.remove("hidden");

  stopEngineSound();
}

startBtn.addEventListener("click",startGame);
restartBtn.addEventListener("click",startGame);
menuBtn.addEventListener("click",backMenu);

soundBtn.addEventListener("click",()=>{

  soundEnabled=!soundEnabled;

  soundBtn.textContent=
    soundEnabled
    ? "🔊 SES AÇIK"
    : "🔇 SES KAPALI";

  if(!soundEnabled){
    stopEngineSound();
  }else if(running){
    initAudio();
  }
});

function pressLeft(e){
  e.preventDefault();
  keys.left=true;
}

function releaseLeft(e){
  e.preventDefault();
  keys.left=false;
}

function pressRight(e){
  e.preventDefault();
  keys.right=true;
}

function releaseRight(e){
  e.preventDefault();
  keys.right=false;
}

leftBtn.addEventListener("pointerdown",pressLeft);
leftBtn.addEventListener("pointerup",releaseLeft);
leftBtn.addEventListener("pointercancel",releaseLeft);
leftBtn.addEventListener("pointerleave",releaseLeft);

rightBtn.addEventListener("pointerdown",pressRight);
rightBtn.addEventListener("pointerup",releaseRight);
rightBtn.addEventListener("pointercancel",releaseRight);
rightBtn.addEventListener("pointerleave",releaseRight);

window.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    keys.left=true;
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    keys.right=true;
  }
});

window.addEventListener("keyup",e=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    keys.left=false;
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    keys.right=false;
  }
});

window.addEventListener("blur",()=>{
  keys.left=false;
  keys.right=false;
});

/* SES */

function initAudio(){

  if(!soundEnabled)return;

  try{

    if(!audioCtx){
      audioCtx=
        new(window.AudioContext ||
        window.webkitAudioContext)();
    }

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    if(engineOsc)return;

    engineOsc=audioCtx.createOscillator();
    engineGain=audioCtx.createGain();

    engineOsc.type="sawtooth";
    engineOsc.frequency.value=90;

    engineGain.gain.value=.035;

    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);

    engineOsc.start();

  }catch(e){}
}

function updateEngineSound(){

  if(!soundEnabled ||
     !audioCtx ||
     !engineOsc ||
     !engineGain)return;

  const freq=
    70+player.speed*25;

  engineOsc.frequency.setTargetAtTime(
    freq,
    audioCtx.currentTime,
    .04
  );

  engineGain.gain.setTargetAtTime(
    .025+player.speed*.003,
    audioCtx.currentTime,
    .05
  );
}

function stopEngineSound(){

  if(!engineOsc)return;

  try{
    engineGain.gain.setTargetAtTime(
      0,
      audioCtx.currentTime,
      .05
    );

    setTimeout(()=>{

      try{
        engineOsc.stop();
      }catch(e){}

      engineOsc=null;
      engineGain=null;

    },100);

  }catch(e){
    engineOsc=null;
    engineGain=null;
  }
}

/* İlk ekran çizimi */

function preview(){

  drawBackground();
  drawRoad();

  player.x=road.center;
  player.y=H-Math.max(135,H*.17);

  drawCar(player,true);
}

preview();

})();
</script>

</body>
</html>
