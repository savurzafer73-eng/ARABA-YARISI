<script>
(function(){

"use strict";

/* =====================================================
   CANVAS
===================================================== */

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var W=0;
var H=0;

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  if(W<320) W=320;
  if(H<480) H=480;

  canvas.width=W;
  canvas.height=H;
}

resize();

window.addEventListener("resize",resize);


/* =====================================================
   OYUN
===================================================== */

var running=false;
var paused=false;

var score=0;
var money=0;

var playerOffset=0;
var steer=0;

var nitro=100;
var nitroActive=false;

var gameSpeed=300;
var roadScroll=0;

var traffic=[];
var spawnTimer=0;

var elapsed=0;


/* =====================================================
   YOL
===================================================== */

/* DAHA GENİŞ YOL */

var ROAD_LEFT=.15;
var ROAD_RIGHT=.85;

function roadLeft(){
  return W*ROAD_LEFT;
}

function roadRight(){
  return W*ROAD_RIGHT;
}

function roadWidth(){
  return roadRight()-roadLeft();
}

function laneWidth(){
  return roadWidth()/3;
}

function laneX(lane){
  return roadLeft()+laneWidth()*lane+laneWidth()/2;
}


/* =====================================================
   ARAÇ
===================================================== */

var CAR_SCALE=.70;

var CAR_W=48*CAR_SCALE;
var CAR_H=88*CAR_SCALE;

/* Kritik güvenlik mesafeleri */

var MIN_TRAFFIC_GAP=CAR_H*1.35;
var FOLLOW_DISTANCE=CAR_H*3.0;


/* =====================================================
   OYUNCU
===================================================== */

function playerX(){

  return W/2+
    playerOffset*
    roadWidth()*
    .39;
}

function playerY(){
  return H*.78;
}


/* =====================================================
   YARDIMCI
===================================================== */

function clamp(v,min,max){

  if(v<min) return min;
  if(v>max) return max;

  return v;
}

function random(min,max){
  return Math.random()*(max-min)+min;
}


/* =====================================================
   GÖKYÜZÜ / ÇEVRE
===================================================== */

function drawBackground(){

  var g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#162335");
  g.addColorStop(.42,"#526c49");
  g.addColorStop(1,"#35562f");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* Uzak dağlar */

  ctx.fillStyle="#3b543b";

  ctx.beginPath();
  ctx.moveTo(0,H*.32);
  ctx.lineTo(W*.12,H*.18);
  ctx.lineTo(W*.25,H*.31);
  ctx.lineTo(W*.42,H*.16);
  ctx.lineTo(W*.58,H*.30);
  ctx.lineTo(W*.75,H*.14);
  ctx.lineTo(W,H*.31);
  ctx.lineTo(W,H*.45);
  ctx.lineTo(0,H*.45);
  ctx.closePath();
  ctx.fill();
}


/* =====================================================
   AĞAÇ
===================================================== */

function drawTree(x,y,s){

  ctx.fillStyle="#4b3422";
  ctx.fillRect(
    x-3*s,
    y+8*s,
    6*s,
    25*s
  );

  ctx.fillStyle="#183c25";

  ctx.beginPath();
  ctx.arc(x,y,18*s,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#24552c";

  ctx.beginPath();
  ctx.arc(
    x-8*s,
    y+3*s,
    12*s,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    x+9*s,
    y+4*s,
    11*s,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =====================================================
   YOL
===================================================== */

function drawRoad(){

  drawBackground();

  var left=roadLeft();
  var right=roadRight();

  /* Çim */

  ctx.fillStyle="#45683b";
  ctx.fillRect(0,0,left,H);
  ctx.fillRect(right,0,W-right,H);

  /* Çim hareket detayları */

  var i;

  for(i=0;i<28;i++){

    var tx=(i*137)%W;
    var ty=(i*211+roadScroll*.32)%H;

    ctx.fillStyle=i%2===0
      ? "#64804d"
      : "#385a34";

    ctx.fillRect(tx,ty,2,7);
  }


  /* Ağaçlar */

  var treeOffset=roadScroll%190;

  for(i=0;i<9;i++){

    var ty=-100+i*190+treeOffset;

    drawTree(
      left-42-(i%2)*15,
      ty,
      .75+(i%3)*.1
    );

    drawTree(
      right+42+(i%2)*15,
      ty+80,
      .72+(i%3)*.1
    );
  }


  /* ANA YOL */

  ctx.fillStyle="#24292e";

  ctx.fillRect(
    left,
    0,
    right-left,
    H
  );


  /* Yol hafif merkez ışığı */

  var roadGrad=ctx.createLinearGradient(
    left,
    0,
    right,
    0
  );

  roadGrad.addColorStop(0,"rgba(0,0,0,.16)");
  roadGrad.addColorStop(.5,"rgba(255,255,255,.025)");
  roadGrad.addColorStop(1,"rgba(0,0,0,.16)");

  ctx.fillStyle=roadGrad;

  ctx.fillRect(
    left,
    0,
    right-left,
    H
  );


  /* Kenar asfalt çizgileri */

  ctx.fillStyle="#c9c9c9";

  ctx.fillRect(left-6,0,6,H);
  ctx.fillRect(right,0,6,H);

  ctx.fillStyle="#fff";

  ctx.fillRect(left+4,0,3,H);
  ctx.fillRect(right-7,0,3,H);


  /* Şeritler */

  var lw=laneWidth();

  var dashH=58;
  var gap=38;

  var offset=roadScroll%(dashH+gap);

  ctx.fillStyle="rgba(255,255,255,.86)";

  var lane;

  for(lane=1;lane<=2;lane++){

    var x=left+lw*lane;

    var y=-dashH+offset;

    while(y<H){

      ctx.fillRect(
        x-2,
        y,
        4,
        dashH
      );

      y+=dashH+gap;
    }
  }


  /* Yol kenarı direkleri */

  var postGap=180;
  var postOffset=roadScroll%postGap;

  var py=-postGap+postOffset;

  while(py<H){

    drawRoadPost(left-25,py);
    drawRoadPost(right+25,py);

    py+=postGap;
  }
}


/* =====================================================
   DİREK
===================================================== */

function drawRoadPost(x,y){

  ctx.fillStyle="#c9c9c9";
  ctx.fillRect(x-2,y,4,29);

  ctx.fillStyle="#f5f5f5";
  ctx.fillRect(x-8,y,16,8);

  ctx.fillStyle="#ffe98a";
  ctx.fillRect(x-5,y+2,10,4);
}


/* =====================================================
   ROUNDED RECT
===================================================== */

function roundedRect(x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(
    x+w,y,
    x+w,y+r
  );

  ctx.lineTo(
    x+w,
    y+h-r
  );

  ctx.quadraticCurveTo(
    x+w,
    y+h,
    x+w-r,
    y+h
  );

  ctx.lineTo(
    x+r,
    y+h
  );

  ctx.quadraticCurveTo(
    x,
    y+h,
    x,
    y+h-r
  );

  ctx.lineTo(x,y+r);

  ctx.quadraticCurveTo(
    x,y,
    x+r,y
  );

  ctx.closePath();
}


/* =====================================================
   ARABA
===================================================== */

function drawCar(x,y,color,isPlayer){

  var w=CAR_W;
  var h=CAR_H;

  var left=x-w/2;
  var top=y-h/2;

  ctx.save();


  /* Gölge */

  ctx.fillStyle="rgba(0,0,0,.42)";

  roundedRect(
    left+4,
    top+6,
    w,
    h,
    9
  );

  ctx.fill();


  /* Gövde */

  ctx.fillStyle=color;

  roundedRect(
    left,
    top,
    w,
    h,
    9
  );

  ctx.fill();


  /* Gövde parlaklığı */

  if(isPlayer){

    var bodyGrad=ctx.createLinearGradient(
      left,
      top,
      left+w,
      top
    );

    bodyGrad.addColorStop(0,"#9f1020");
    bodyGrad.addColorStop(.45,"#ef2038");
    bodyGrad.addColorStop(1,"#a70f21");

    ctx.fillStyle=bodyGrad;

    roundedRect(
      left,
      top,
      w,
      h,
      9
    );

    ctx.fill();
  }


  /* Kaput */

  ctx.fillStyle=isPlayer
    ? "#a90f21"
    : "rgba(0,0,0,.25)";

  roundedRect(
    left+5,
    top+5,
    w-10,
    h*.25,
    6
  );

  ctx.fill();


  /* Ön cam */

  ctx.fillStyle="#111d28";

  roundedRect(
    left+6,
    top+h*.29,
    w-12,
    h*.27,
    5
  );

  ctx.fill();


  /* Cam ışığı */

  ctx.fillStyle="rgba(180,235,255,.32)";

  ctx.fillRect(
    left+9,
    top+h*.32,
    w-18,
    4
  );


  /* Cam bölmesi */

  ctx.fillStyle="rgba(255,255,255,.12)";

  ctx.fillRect(
    x-1,
    top+h*.30,
    2,
    h*.25
  );


  /* Orta Mustang şeritleri */

  if(isPlayer){

    ctx.fillStyle="rgba(255,255,255,.88)";

    ctx.fillRect(
      left+7,
      top+h*.61,
      w-14,
      3
    );

    ctx.fillStyle="#f2b52d";

    ctx.fillRect(
      left+8,
      top+h*.71,
      w-16,
      3
    );
  }


  /* Far */

  ctx.fillStyle="#fff6bc";

  ctx.fillRect(
    left+5,
    top+4,
    8,
    4
  );

  ctx.fillRect(
    left+w-13,
    top+4,
    8,
    4
  );


  /* Far ışığı oyuncuda */

  if(isPlayer){

    ctx.fillStyle="rgba(255,245,170,.12)";

    ctx.beginPath();

    ctx.moveTo(left+7,top);
    ctx.lineTo(left-8,top-35);
    ctx.lineTo(left+16,top-35);
    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(left+w-7,top);
    ctx.lineTo(left+w+8,top-35);
    ctx.lineTo(left+w-16,top-35);
    ctx.closePath();

    ctx.fill();
  }


  /* Stop lambaları */

  ctx.fillStyle="#ff1730";

  ctx.fillRect(
    left+5,
    top+h-8,
    9,
    4
  );

  ctx.fillRect(
    left+w-14,
    top+h-8,
    9,
    4
  );


  /* Lastikler */

  ctx.fillStyle="#080a0d";

  ctx.fillRect(
    left-3,
    top+17,
    5,
    17
  );

  ctx.fillRect(
    left+w-2,
    top+17,
    5,
    17
  );

  ctx.fillRect(
    left-3,
    top+h-34,
    5,
    17
  );

  ctx.fillRect(
    left+w-2,
    top+h-34,
    5,
    17
  );


  ctx.restore();
}


/* =====================================================
   TRAFİK ŞERİT LİSTESİ
===================================================== */

function getLaneCars(lane){

  var list=[];
  var i;

  for(i=0;i<traffic.length;i++){

    if(traffic[i].lane===lane){

      list.push(traffic[i]);
    }
  }

  list.sort(function(a,b){
    return a.y-b.y;
  });

  return list;
}


/* =====================================================
   TRAFİK SPAWN
===================================================== */

function laneBlocked(lane,y,gap){

  var i;

  for(i=0;i<traffic.length;i++){

    if(
      traffic[i].lane===lane &&
      Math.abs(traffic[i].y-y)<gap
    ){

      return true;
    }
  }

  return false;
}


function chooseLane(){

  var available=[];
  var i;

  for(i=0;i<3;i++){

    if(
      !laneBlocked(
        i,
        -CAR_H-80,
        CAR_H*3.1
      )
    ){

      available.push(i);
    }
  }

  if(available.length===0){

    return -1;
  }

  return available[
    Math.floor(
      Math.random()*available.length
    )
  ];
}


function spawnTraffic(){

  /* Ekranda aşırı trafik oluşmasını önle */

  if(traffic.length>=10){
    return;
  }

  var lane=chooseLane();

  if(lane===-1){
    return;
  }

  var colors=[
    "#f1f1f1",
    "#171b20",
    "#1686d9",
    "#e3aa22",
    "#329b5b",
    "#c52b39",
    "#7445c5",
    "#b8b8b8"
  ];

  var car={
    lane:lane,

    x:laneX(lane),

    y:-CAR_H-80,

    /*
      Daha geniş hız çeşitliliği.
      Büyük speed = dünyada daha hızlı araç.
    */

    speed:random(245,335),

    color:
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ],

    passed:false
  };

  traffic.push(car);
}


/* =====================================================
   TRAFİK FİZİĞİ
===================================================== */

/*
   ÖNEMLİ:

   Ekrandaki hareket:
   y += (gameSpeed - car.speed) * dt

   Bu nedenle arkadaki araç öndekine
   yetişiyorsa speed değeri yükseltilmelidir.

   Eski sistemde ters mantık kullanılıyordu.
   Burada güvenli takip sistemi uygulanıyor.
*/

function controlTrafficSpeeds(){

  var lane;
  var list;
  var i;
  var front;
  var back;
  var gap;

  for(lane=0;lane<3;lane++){

    list=getLaneCars(lane);

    for(i=1;i<list.length;i++){

      front=list[i-1];
      back=list[i];

      gap=back.y-front.y;

      /*
        Araçlar yaklaşmaya başladığında
        arkadaki araç öndeki kadar hızlı olur.
      */

      if(gap<FOLLOW_DISTANCE){

        if(back.speed<front.speed){

          back.speed=front.speed;
        }
      }
    }
  }
}


/* =====================================================
   TRAFİK HAREKET
===================================================== */

function updateTraffic(dt){

  var i;
  var lane;
  var list;
  var j;
  var front;
  var back;
  var allowedY;

  /*
    1. ÖNCE TAKİP HIZLARINI AYARLA
  */

  controlTrafficSpeeds();


  /*
    2. HAREKET
  */

  for(i=0;i<traffic.length;i++){

    traffic[i].y +=
      (gameSpeed-traffic[i].speed)*dt;
  }


  /*
    3. FİZİKSEL ÇARPMA ÖNLEME

    Hiçbir araç minimum mesafenin
    altına düşemez.
  */

  for(lane=0;lane<3;lane++){

    list=getLaneCars(lane);

    for(j=1;j<list.length;j++){

      front=list[j-1];
      back=list[j];

      allowedY=
        front.y+
        MIN_TRAFFIC_GAP;

      if(back.y<allowedY){

        back.y=allowedY;

        /*
          Arkadaki araç asla öndekinden
          daha yavaş hale gelmesin.
        */

        if(back.speed<front.speed){

          back.speed=front.speed;
        }
      }
    }
  }


  /*
    4. SKOR
  */

  for(i=traffic.length-1;i>=0;i--){

    var c=traffic[i];

    if(
      !c.passed &&
      c.y>playerY()+CAR_H
    ){

      c.passed=true;

      score+=10;
      money+=1;
    }


    /*
      5. EKRANDAN ÇIKAN ARAÇLARI SİL
    */

    if(c.y>H+CAR_H*2){

      traffic.splice(i,1);
    }

    if(c.y<-CAR_H*3){

      traffic.splice(i,1);
    }
  }
}


/* =====================================================
   ÇARPIŞMA
===================================================== */

function collision(){

  var px=playerX();
  var py=playerY();

  var i;

  for(i=0;i<traffic.length;i++){

    var c=traffic[i];

    /*
      Daha doğal hitbox
    */

    if(
      Math.abs(px-c.x)<
      CAR_W*.64 &&

      Math.abs(py-c.y)<
      CAR_H*.62
    ){

      return true;
    }
  }

  return false;
}


/* =====================================================
   OYUNCU HAREKET
===================================================== */

function updatePlayer(dt){

  if(steer!==0){

    playerOffset +=
      steer*
      dt*
      1.75;
  }

  playerOffset=clamp(
    playerOffset,
    -.91,
    .91
  );


  /*
    NITRO
  */

  if(nitroActive && nitro>0){

    nitro-=38*dt;

    if(nitro<0){
      nitro=0;
    }

    gameSpeed=485;

  }else{

    if(nitro<100){

      nitro+=11*dt;

      if(nitro>100){
        nitro=100;
      }
    }

    /*
      Skor yükseldikçe maksimum hız artar.
    */

    gameSpeed=
      300+
      Math.min(score*.75,105);
  }
}

var audioContext=null;
var engineOsc=null;
var engineGain=null;

function initAudio(){

  if(audioContext){
    return;
  }

  try{

    audioContext=
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    engineOsc=
      audioContext.createOscillator();

    engineGain=
      audioContext.createGain();

    engineOsc.type="sawtooth";

    engineOsc.frequency.value=70;

    engineGain.gain.value=.025;

    engineOsc.connect(engineGain);
    engineGain.connect(
      audioContext.destination
    );

    engineOsc.start();

  }catch(e){}
}


function updateEngineSound(){

  if(!audioContext || !engineOsc){
    return;
  }

  try{

    var freq=
      55+
      gameSpeed*.20;

    engineOsc.frequency.value=freq;

  }catch(e){}
}


function beep(freq,duration){

  if(!audioContext){
    return;
  }

  try{

    var osc=
      audioContext.createOscillator();

    var gain=
      audioContext.createGain();

    osc.frequency.value=freq;

    gain.gain.value=.08;

    osc.connect(gain);
    gain.connect(
      audioContext.destination
    );

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime+duration
    );

    osc.stop(
      audioContext.currentTime+duration
    );

  }catch(e){}
}

function vibrate(ms){

  if(navigator.vibrate){

    navigator.vibrate(ms);
  }
}

function startGame(){

  if(audioContext &&
     audioContext.state==="suspended"){

  document.getElementById("menu")
    .style.display="none";

  document.getElementById("over")
    .style.display="none";

  document.getElementById("pauseScreen")
    .style.display="none";

  running=true;

  score=0;

  playerOffset=0;

  nitro=100;

  gameSpeed=300;

  traffic=[];

  spawnTimer=.35;

  steer=0;

  nitroActive=false;

  document.getElementById("pause")

  updateHUD();

  beep(520,.12);
}

var lastTime=Date.now();

function gameLoop(){

  var now=Date.now();

  var dt=
    (now-lastTime)/1000;

  lastTime=now;

  if(dt>.05){
    dt=.05;
  }


  if(running && !paused){

    elapsed+=dt;


    /* Direksiyon */

    if(
      keys.left &&
      !keys.right
    ){

      steer=-1;

    }else if(
      keys.right &&
      !keys.left
    ){

      steer=1;

    }else{

      steer=0;
    }


    /* Nitro */

    nitroActive=
      keys.nitro ||
      nitroActive;


    /*
      Mobilde tek parmak bırakıldığında
      nitro kapanır.
    */

    updatePlayer(dt);

    updateTraffic(dt);


    /* Trafik spawn */

    spawnTimer-=dt;

    if(spawnTimer<=0){

      spawnTraffic();

      /*
        Yüksek hızda biraz daha sık,
        fakat kontrollü trafik.
      */

      var difficulty=
        Math.min(score/500,1);

      spawnTimer=
        random(
          .72-.18*difficulty,
          1.18-.20*difficulty
        );
    }


    /* Yol */

    roadScroll+=
      gameSpeed*dt;


    /* Çarpışma */

    if(collision()){

      gameOver();
    }


    updateHUD();

    updateEngineSound();
  }


  /* =================================================
     ÇİZİM
  ================================================= */

  drawRoad();

  drawTraffic();

  if(running){

    drawPlayer();
  }


  window.requestAnimationFrame(
    gameLoop
  );
}

      );
    };
}
