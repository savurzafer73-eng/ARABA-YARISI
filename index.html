<!DOCTYPE html>
<html lang="tr">
<head>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070a;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
}

.top{
  position:absolute;
  top:max(10px,env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
}

.box{
  min-width:82px;
  padding:7px 10px;
  border-radius:12px;

  border:1px solid rgba(255,255,255,.13);

}

.box small{
  display:block;
  font-size:9px;
  opacity:.7;
  letter-spacing:1px;
}

.box b{

  font-size:17px;
}

#pauseBtn{
  position:absolute;

  right:14px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  color:white;
  font-size:18px;
  pointer-events:auto;
}

#controls{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
}

.touchZone{
  position:absolute;
  bottom:0;
  width:38%;
  height:48%;
  pointer-events:auto;
}

#left{left:0}
#right{right:0}

.controlIcon{
  position:absolute;
  bottom:22px;
  width:62px;
  height:62px;

  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.7);
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.13);
  font-size:30px;
  pointer-events:none;
}

#left .controlIcon{left:22px}
#right .controlIcon{right:22px}

#hint{
  position:absolute;
  bottom:17px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 13px;
  border-radius:18px;
  background:rgba(0,0,0,.3);
  font-size:10px;
  opacity:.6;
}

#menu,
#gameOver{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
}

#menu{
  background:
    radial-gradient(circle,rgba(255,70,20,.08),transparent 45%),
    rgba(0,0,0,.5);
}

.panel,
.gameOverPanel{
  width:min(92%,500px);
  padding:27px;
  border-radius:24px;
  text-align:center;
  background:rgba(9,13,19,.91);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.logo{
  font-size:42px;
  font-weight:900;
  font-style:italic;
  letter-spacing:3px;
}

.logo span{
  color:#ff4c24;
}

.subtitle{
  margin-top:6px;
  color:#999;
  font-size:11px;
  letter-spacing:2px;
}

.menuStats{
  display:flex;
  gap:10px;
  margin:23px 0;
}

.menuStat{
  flex:1;
  padding:12px 6px;
  border-radius:13px;
  background:rgba(255,255,255,.055);
}

.menuStat span{
  display:block;
  color:#888;
  font-size:9px;
}

.menuStat b{
  display:block;
  margin-top:4px;
  font-size:19px;
}

.mainBtn{
  width:100%;
  padding:16px;
  border:0;
  border-radius:15px;
  color:white;
  background:linear-gradient(135deg,#ff632d,#e72b18);
  font-size:17px;
  font-weight:800;
}

.secondary{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  color:white;
  background:rgba(255,255,255,.05);
  font-weight:bold;
}

#gameOver{
  display:none;
  background:rgba(0,0,0,.65);
}

.gameOverPanel h2{
  font-size:33px;
}

.result{
  display:flex;
  justify-content:space-around;
  margin:20px 0;
}

.result span{
  display:block;
  color:#888;
  font-size:10px;
}

.result b{
  font-size:24px;
}

#rotate{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:#07090d;
  color:white;

}

.rotateInner{

}

.rotateInner div{

.rotateInner h2{

.rotateInner p{

}

@media(max-width:700px){
  .box{
    min-width:65px;

  }

    font-size:14px;

  }

  .panel,

  }
}

@media(orientation:portrait){
  #rotate{
    display:flex;
  }
}
</style>

  <div class="rotateInner">

    <h2>Telefonu yatay çevir</h2>

<script>
"use strict";

/* ==========================================================
   TURBO ROAD 4.0
   ========================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{alpha:false});

let W=1280;
let H=720;
let DPR=1;

function resize(){

  DPR=Math.min(window.devicePixelRatio||1,1.5);

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();

/* ==========================================================
   STATE
   ========================================================== */

let running=false;
let paused=false;

let score=0;
let speed=0;
let targetSpeed=150;

let money=Number(localStorage.getItem("tr4money")||0);
let best=Number(localStorage.getItem("tr4best")||0);

let playerX=0;
let steer=0;

let roadOffset=0;
let worldDistance=0;

let traffic=[];
let scenery=[];
let particles=[];

let spawnTimer=0;
let sceneryTimer=0;

let lastTime=0;

/* ==========================================================
   UI
   ========================================================== */

const speedEl=document.getElementById("speed");
const scoreEl=document.getElementById("score");
const moneyEl=document.getElementById("money");

const menu=document.getElementById("menu");
const gameOver=document.getElementById("gameOver");

const bestMenu=document.getElementById("bestMenu");
const moneyMenu=document.getElementById("moneyMenu");

const finalScore=document.getElementById("finalScore");
const finalMoney=document.getElementById("finalMoney");

function updateMoneyUI(){

  moneyEl.textContent=money;
  moneyMenu.textContent=money;
  bestMenu.textContent=best;
}

updateMoneyUI();

/* ==========================================================
   AUDIO
   ========================================================== */

let audioCtx=null;
let engineOsc=null;
let engineGain=null;
let audioOn=true;

function initAudio(){

  if(!audioOn)return;

  if(!audioCtx){

    audioCtx=
      new(window.AudioContext||window.webkitAudioContext)();

    engineOsc=audioCtx.createOscillator();
    engineGain=audioCtx.createGain();

    engineOsc.type="sawtooth";
    engineGain.gain.value=0;

    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);

    engineOsc.start();
  }

  if(audioCtx.state==="suspended")
    audioCtx.resume();
}

function updateEngine(){

  if(!audioCtx||!engineOsc||!engineGain||!audioOn)
    return;

  const ratio=speed/245;

  engineOsc.frequency.setTargetAtTime(
    65+ratio*200,
    audioCtx.currentTime,
    .04
  );

  engineGain.gain.setTargetAtTime(
    .012+ratio*.035,
    audioCtx.currentTime,
    .05
  );
}

function crashSound(){

  if(!audioOn)return;

  initAudio();

  if(!audioCtx)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(
    130,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    35,
    audioCtx.currentTime+.35
  );

  gain.gain.setValueAtTime(
    .12,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.35
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+.35);
}

/* ==========================================================
   ROAD
   ========================================================== */

function horizon(){
  return H*.29;
}

function roadAt(y){

  const hz=horizon();

  let t=(y-hz)/(H-hz);

  t=Math.max(0,Math.min(1,t));

  const curve=
    Math.sin(worldDistance*.0011+t*2.7)*
    W*.045*
    t;

  const center=W/2+curve;

  const roadTop=W*.075;
  const roadBottom=W*.46;

  const width=
    roadTop+
    (roadBottom-roadTop)*
    Math.pow(t,.72);

  return{
    center,
    width,
    left:center-width/2,
    right:center+width/2,
    t
  };
}

/* ==========================================================
   BACKGROUND
   ========================================================== */

function drawSky(){

  const hz=horizon();

  const grd=ctx.createLinearGradient(0,0,0,hz);

  grd.addColorStop(0,"#5da7dc");
  grd.addColorStop(.55,"#91c7ea");
  grd.addColorStop(1,"#dceefa");

  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,hz);

  const sx=W*.78;
  const sy=H*.105;
  const sr=Math.min(W,H)*.06;

  const sun=ctx.createRadialGradient(
    sx,sy,0,
    sx,sy,sr
  );

  sun.addColorStop(
    0,
    "rgba(255,255,220,.8)"
  );

  sun.addColorStop(
    1,
    "rgba(255,255,220,0)"
  );

  ctx.fillStyle=sun;

  ctx.beginPath();
  ctx.arc(sx,sy,sr,0,Math.PI*2);
  ctx.fill();
}

function drawMountains(){

  const hz=horizon();

  ctx.fillStyle="#718d88";

  ctx.beginPath();

  ctx.moveTo(0,hz+45);

  for(let x=0;x<=W;x+=50){

    const y=
      hz+
      40+
      Math.sin(x*.009)*30+
      Math.sin(x*.023)*16;

    ctx.lineTo(x,y);
  }

  ctx.lineTo(W,hz+100);
  ctx.lineTo(0,hz+100);

  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#536f6b";

  ctx.beginPath();

  ctx.moveTo(0,hz+70);

  for(let x=0;x<=W;x+=40){

    const y=
      hz+
      60+
      Math.sin(x*.013+2)*28+
      Math.sin(x*.032)*14;

    ctx.lineTo(x,y);
  }

  ctx.lineTo(W,hz+125);
  ctx.lineTo(0,hz+125);

  ctx.closePath();
  ctx.fill();
}

function drawGround(){

  const hz=horizon();

  ctx.fillStyle="#568143";
  ctx.fillRect(0,hz,W,H-hz);

  ctx.fillStyle="#466d37";

  ctx.fillRect(0,hz,W*.12,H-hz);
  ctx.fillRect(W*.88,hz,W*.12,H-hz);

  const phase=roadOffset%90;

  for(let y=hz+phase;y<H;y+=90){

    ctx.strokeStyle="rgba(255,255,255,.035)";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
}

/* ==========================================================
   ROAD
   ========================================================== */

function drawRoad(){

  const hz=horizon();

  const p1=roadAt(hz);
  const p2=roadAt(H);

  ctx.beginPath();

  ctx.moveTo(p1.left,hz);
  ctx.lineTo(p1.right,hz);
  ctx.lineTo(p2.right,H);
  ctx.lineTo(p2.left,H);

  ctx.closePath();

  const roadGrad=
    ctx.createLinearGradient(0,hz,0,H);

  roadGrad.addColorStop(0,"#41474d");
  roadGrad.addColorStop(.5,"#30353a");
  roadGrad.addColorStop(1,"#272b2f");

  ctx.fillStyle=roadGrad;
  ctx.fill();

  ctx.strokeStyle="#e7e6dc";
  ctx.lineWidth=Math.max(2,W*.0028);

  ctx.beginPath();
  ctx.moveTo(p1.left,hz);
  ctx.lineTo(p2.left,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(p1.right,hz);
  ctx.lineTo(p2.right,H);
  ctx.stroke();

  for(let lane=1;lane<3;lane++){

    for(let i=0;i<19;i++){

      let a=
        ((i/19)+(roadOffset*.00055))%1;

      let b=a+.026+a*.035;

      if(b>1)continue;

      const y1=
        hz+
        Math.pow(a,1.8)*
        (H-hz);

      const y2=
        hz+
        Math.pow(b,1.8)*
        (H-hz);

      const r1=roadAt(y1);
      const r2=roadAt(y2);

      const x1=
        r1.left+
        r1.width*lane/3;

      const x2=
        r2.left+
        r2.width*lane/3;

      ctx.strokeStyle=
        "rgba(238,238,224,.82)";

      ctx.lineWidth=2+r1.t*4;

      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
    }
  }
}

/* ==========================================================
   TREES
   ========================================================== */

function addTree(side){

  scenery.push({
    side,
    z:Math.random()*.85,
    offset:.02+Math.random()*.17,
    scale:.65+Math.random()*.8,
    type:Math.random()>.28?"tree":"bush"
  });
}

function drawTree(item){

  const y=
    horizon()+
    Math.pow(item.z,1.75)*
    (H-horizon());

  const r=roadAt(y);

  const x=
    item.side<0
      ? r.left-item.offset*W*(.7+item.z)
      : r.right+item.offset*W*(.7+item.z);

  const s=(9+item.z*105)*item.scale;

  if(item.type==="bush"){

    ctx.fillStyle="#315a31";

    ctx.beginPath();

    ctx.ellipse(
      x,
      y-s*.15,
      s*.55,
      s*.35,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    return;
  }

  ctx.fillStyle="#60452c";

  ctx.fillRect(
    x-s*.08,
    y-s*.42,
    s*.16,
    s*.5
  );

  ctx.fillStyle="#2d6535";

  ctx.beginPath();

  ctx.moveTo(x,y-s*1.45);
  ctx.lineTo(x-s*.55,y-s*.25);
  ctx.lineTo(x+s*.55,y-s*.25);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(x,y-s*1.18);
  ctx.lineTo(x-s*.7,y-s*.05);
  ctx.lineTo(x+s*.7,y-s*.05);
  ctx.closePath();
  ctx.fill();
}

function updateScenery(dt){

  for(const item of scenery){

    item.z+=
      dt*.00023*
      (.7+speed/180);
  }

  scenery=scenery.filter(x=>x.z<1.08);

  sceneryTimer-=dt;

  if(sceneryTimer<=0){

    sceneryTimer=
      180+
      Math.random()*280;

    addTree(Math.random()<.5?-1:1);

    if(Math.random()>.45)
      addTree(Math.random()<.5?-1:1);
  }
}

/* ==========================================================
   TRAFFIC
   ========================================================== */

const carColors=[
  "#e7352d",
  "#1676bd",
  "#f0bd29",
  "#eeeeee",
  "#17191d",
  "#39a65a",
  "#9d42c5"
];

function spawnCar(){

  const lane=
    Math.floor(Math.random()*3);

  traffic.push({

    lane,

    z:-.05-
      Math.random()*.18,

    speed:.25+
      Math.random()*.45,

    color:
      carColors[
        Math.floor(
          Math.random()*carColors.length
        )
      ],

    type:
      Math.random()>.5?0:1
  });
}

function laneX(lane,z){

  const y=
    horizon()+
    Math.pow(Math.max(0,z),1.55)*
    (H-horizon());

  const r=roadAt(y);

  return r.left+
    r.width*(lane+.5)/3;
}

/*
   ÖNEMLİ:
   Trafik araçlarının temel ölçüsü artık
   oyuncu Mustang'in ölçüsüne bağlandı.
   Böylece bütün araçlar aynı genel büyüklükte
   görünür.
*/

function playerDimensions(){

  const w=Math.min(W*.085,112);
  const h=w*1.58;

  return {w,h};
}

function carSize(z){

  const zz=
    Math.max(0,Math.min(1,z));

  const player=
    playerDimensions();

  /*
    Aynı boyut ailesi.
    Perspektif yine korunuyor.
  */

  const perspective=
    .76+
    zz*.24;

  return{
    w:player.w*perspective,
    h:player.h*perspective
  };
}

function drawTrafficCar(car){

  const z=
    Math.max(0,car.z);

  const y=
    horizon()+
    Math.pow(z,1.55)*
    (H-horizon());

  const r=roadAt(y);

  const x=
    r.left+
    r.width*(car.lane+.5)/3;

  const size=carSize(car.z);

  const w=size.w;
  const h=size.h;

  ctx.save();

  ctx.translate(
    x,
    y-h*.52
  );

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.32)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.48,
    w*.58,
    h*.14,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* wheels */

  ctx.fillStyle="#090a0b";

  ctx.fillRect(
    -w*.52,
    -h*.20,
    w*.19,
    h*.43
  );

  ctx.fillRect(
    w*.33,
    -h*.20,
    w*.19,
    h*.43
  );

  /* body */

  const body=
    ctx.createLinearGradient(
      -w/2,
      0,
      w/2,
      0
    );

  body.addColorStop(0,"#15181b");
  body.addColorStop(.16,car.color);
  body.addColorStop(.5,"#f5f5f5");
  body.addColorStop(.56,car.color);
  body.addColorStop(.86,car.color);
  body.addColorStop(1,"#17191c");

  ctx.fillStyle=body;

  roundRect(
    -w*.46,
    -h*.45,
    w*.92,
    h*.9,
    w*.16
  );

  ctx.fill();

  /* windows */

  ctx.fillStyle="#16232c";

  roundRect(
    -w*.29,
    -h*.31,
    w*.58,
    h*.25,
    w*.08
  );

  ctx.fill();

  /* window reflection */

  ctx.fillStyle="rgba(255,255,255,.3)";

  ctx.fillRect(
    -w*.2,
    -h*.28,
    w*.18,
    h*.045
  );

  /* tail lights */

  ctx.fillStyle="#ff2929";

  ctx.fillRect(
    -w*.31,
    h*.29,
    w*.16,
    h*.06
  );

  ctx.fillRect(
    w*.15,
    h*.29,
    w*.16,
    h*.06
  );

  ctx.restore();
}

/* ==========================================================
   PLAYER MUSTANG
   ========================================================== */

function playerY(){
  return H*.84;
}

function playerRoadX(){

  const r=roadAt(playerY());

  return r.left+
    r.width*(playerX+.5)/3;
}

function drawPlayer(){

  const x=playerRoadX();
  const y=playerY();

  const dim=playerDimensions();

  const w=dim.w;
  const h=dim.h;

  ctx.save();

  ctx.translate(x,y);

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.42)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    7,
    w*.62,
    h*.18,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* wheels */

  ctx.fillStyle="#090a0b";

  ctx.fillRect(
    -w*.52,
    -h*.20,
    w*.19,
    h*.45
  );

  ctx.fillRect(
    w*.33,
    -h*.20,
    w*.19,
    h*.45
  );

  /* Mustang body */

  const body=
    ctx.createLinearGradient(
      -w/2,
      0,
      w/2,
      0
    );

  body.addColorStop(0,"#690e0d");
  body.addColorStop(.16,"#b51e18");
  body.addColorStop(.5,"#ed3a27");
  body.addColorStop(.72,"#bd1d17");
  body.addColorStop(1,"#5e0b0b");

  ctx.fillStyle=body;

  roundRect(
    -w*.45,
    -h*.5,
    w*.9,
    h,
    w*.17
  );

  ctx.fill();

  /* hood */

  ctx.fillStyle="rgba(255,255,255,.16)";

  roundRect(
    -w*.25,
    -h*.43,
    w*.5,
    h*.24,
    w*.08
  );

  ctx.fill();

  /* windshield */

  ctx.fillStyle="#111c25";

  ctx.beginPath();

  ctx.moveTo(-w*.29,-h*.15);
  ctx.lineTo(-w*.21,-h*.36);
  ctx.lineTo(w*.21,-h*.36);
  ctx.lineTo(w*.29,-h*.15);

  ctx.closePath();
  ctx.fill();

  /* rear glass */

  ctx.fillStyle="#17232c";

  ctx.beginPath();

  ctx.moveTo(-w*.29,.02);
  ctx.lineTo(-w*.2,.15);
  ctx.lineTo(w*.2,.15);
  ctx.lineTo(w*.29,.02);

  ctx.closePath();
  ctx.fill();

  /* stripe */

  ctx.fillStyle="rgba(245,245,245,.82)";

  ctx.fillRect(
    -w*.035,
    -h*.48,
    w*.07,
    h*.96
  );

  /* tail lights */

  ctx.fillStyle="#ff2929";

  ctx.fillRect(
    -w*.32,
    h*.32,
    w*.22,
    h*.07
  );

  ctx.fillRect(
    w*.10,
    h*.32,
    w*.22,
    h*.07
  );

  /* bumper */

  ctx.fillStyle="#202326";

  ctx.fillRect(
    -w*.35,
    h*.42,
    w*.7,
    h*.06
  );

  ctx.restore();
}

function roundRect(x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);

  ctx.closePath();
}

/* ==========================================================
   COLLISION
   ========================================================== */

function checkCollision(){

  const px=playerRoadX();
  const py=playerY();

  const player=
    playerDimensions();

  for(const car of traffic){

    if(car.z<.70||car.z>1)
      continue;

    const y=
      horizon()+
      Math.pow(car.z,1.55)*
      (H-horizon());

    const x=laneX(car.lane,car.z);

    const size=carSize(car.z);

    const dx=Math.abs(px-x);
    const dy=Math.abs(
      py-(y-size.h*.5)
    );

    if(
      dx<
      Math.min(
        player.w*.45,
        size.w*.45
      )&&
      dy<
      Math.min(
        player.h*.38,
        size.h*.38
      )
    ){
      return true;
    }
  }

  return false;
}

/* ==========================================================
   PARTICLES
   ========================================================== */

function createCrashParticles(){

  particles=[];

  for(let i=0;i<38;i++){

    particles.push({

      x:playerRoadX(),
      y:playerY(),

      vx:(Math.random()-.5)*9,
      vy:(Math.random()-.8)*9,

      life:.5+
        Math.random()*.7,

      size:3+
        Math.random()*7
    });
  }
}

function updateParticles(dt){

  for(const p of particles){

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=.15;

    p.life-=dt/1000;
  }

  particles=
    particles.filter(
      p=>p.life>0
    );
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(0,p.life);

    ctx.fillStyle=
      Math.random()>.5
        ? "#ff8a20"
        : "#fff";

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;
}

/* ==========================================================
   UPDATE
   ========================================================== */

function update(dt){

  if(!running||paused)
    return;

  const d=Math.min(dt,40);

  targetSpeed=
    150+
    Math.min(score*.018,95);

  speed+=
    (targetSpeed-speed)*
    d*.0014;

  speed=Math.min(speed,245);

  playerX+=
    steer*
    d*.0012*
    (.75+speed/220);

  playerX*=.998;

  playerX=
    Math.max(
      -1.42,
      Math.min(1.42,playerX)
    );

  const worldSpeed=
    speed*.0045*d;

  roadOffset+=worldSpeed;
  worldDistance+=worldSpeed;

  score+=
    d*.012*
    (speed/100);

  spawnTimer-=d;

  if(spawnTimer<=0){

    spawnTimer=
      Math.max(
        420,
        850-score*.03
      )+
      Math.random()*400;

    spawnCar();
  }

  for(const car of traffic){

    car.z+=
      d*.00023*
      (.75+speed/140)*
      car.speed;
  }

  traffic=
    traffic.filter(
      car=>car.z<1.12
    );

  updateScenery(d);

  if(checkCollision())
    crash();

  updateParticles(d);

  speedEl.textContent=
    Math.round(speed);

  scoreEl.textContent=
    Math.floor(score);

  updateEngine();
}

/* ==========================================================
   DRAW
   ========================================================== */

function draw(){

  drawSky();
  drawMountains();
  drawGround();

  const sortedScenery=
    [...scenery]
    .sort((a,b)=>a.z-b.z);

  for(const item of sortedScenery)
    drawTree(item);

  drawRoad();

  const sortedTraffic=
    [...traffic]
    .sort((a,b)=>a.z-b.z);

  for(const car of sortedTraffic)
    drawTrafficCar(car);

  drawPlayer();
  drawParticles();

  if(speed>185){

    ctx.strokeStyle=
      "rgba(255,255,255,.08)";

    ctx.lineWidth=1;

    for(let i=0;i<9;i++){

      const x=Math.random()*W;
      const y=
        H*.45+
        Math.random()*H*.4;

      ctx.beginPath();

      ctx.moveTo(x,y);

      ctx.lineTo(
        x+(x-W/2)*.08,
        y+30
      );

      ctx.stroke();
    }
  }
}

/* ==========================================================
   LOOP
   ========================================================== */

function loop(t){

  const dt=
    lastTime
      ? t-lastTime
      : 16;

  lastTime=t;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* ==========================================================
   START
   ========================================================== */

function startGame(){

  initAudio();

  running=true;
  paused=false;

  score=0;
  speed=0;
  targetSpeed=150;
  playerX=0;

  traffic=[];
  scenery=[];
  particles=[];

  spawnTimer=500;
  sceneryTimer=0;

  menu.style.display="none";
  gameOver.style.display="none";

  for(let i=0;i<12;i++){

    addTree(
      i%2===0?-1:1
    );

    scenery[
      scenery.length-1
    ].z=i/14;
  }

  for(let i=0;i<3;i++){

    spawnCar();

    traffic[i].z=
      -.25-i*.3;
  }

  updateMoneyUI();
}

/* ==========================================================
   CRASH
   ========================================================== */

function crash(){

  if(!running)
    return;

  running=false;

  crashSound();
  createCrashParticles();

  const earned=
    Math.max(
      5,
      Math.floor(score/35)
    );

  money+=earned;

  if(score>best){

    best=Math.floor(score);

    localStorage.setItem(
      "tr4best",
      best
    );
  }

  localStorage.setItem(
    "tr4money",
    money
  );

  finalScore.textContent=
    Math.floor(score);

  finalMoney.textContent=
    earned;

  gameOver.style.display="flex";

  updateMoneyUI();
}

/* ==========================================================
   PAUSE
   ========================================================== */

document
.getElementById("pauseBtn")
.addEventListener("click",()=>{

  if(!running)
    return;

  paused=!paused;

  document
  .getElementById("pauseBtn")
  .textContent=
    paused?"▶":"Ⅱ";
});

/* ==========================================================
   TOUCH
   ========================================================== */

const left=
  document.getElementById("left");

const right=
  document.getElementById("right");

left.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    steer=-1;
  }
);

right.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    steer=1;
  }
);

window.addEventListener(
  "pointerup",
  ()=>{
    steer=0;
  }
);

window.addEventListener(
  "pointercancel",
  ()=>{
    steer=0;
  }
);

/* ==========================================================
   KEYBOARD
   ========================================================== */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft"||
      e.key==="a"
    )
      steer=-1;

    if(
      e.key==="ArrowRight"||
      e.key==="d"
    )
      steer=1;

    if(e.key===" "&&running)
      paused=!paused;
  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft"||
      e.key==="ArrowRight"||
      e.key==="a"||
      e.key==="d"
    )
      steer=0;
  }
);

/* ==========================================================
   BUTTONS
   ========================================================== */

document
.getElementById("startBtn")
.addEventListener(
  "click",
  startGame
);

document
.getElementById("againBtn")
.addEventListener(
  "click",
  startGame
);

document
.getElementById("menuBtn")
.addEventListener(
  "click",
  ()=>{

    gameOver.style.display="none";
    menu.style.display="flex";

    updateMoneyUI();
  }
);

document
.getElementById("soundBtn")
.addEventListener(
  "click",
  function(){

    audioOn=!audioOn;

    this.textContent=
      audioOn
        ?"🔊 SES: AÇIK"
        :"🔇 SES: KAPALI";

    if(!audioOn&&engineGain)
      engineGain.gain.value=0;

    if(audioOn)
      initAudio();
  }
);

/* ==========================================================
   FULLSCREEN
   ========================================================== */

document.addEventListener(
  "click",
  ()=>{
    if(
      document.documentElement
      .requestFullscreen
    ){
      document.documentElement
      .requestFullscreen()
      .catch(()=>{});
    }
  },
  {once:true}
);

/* ==========================================================
   MOBILE PREVENT SCROLL
   ========================================================== */

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault()
);

</script>
