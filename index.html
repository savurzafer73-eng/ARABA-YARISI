<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road - Ultimate Edition</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,sans-serif;
  touch-action:none;
}

button{
  font-family:inherit;
  cursor:pointer;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#111;
}

/* SKY */

#sky{
  position:absolute;
  inset:0;
  background:linear-gradient(#071426,#315c78 55%,#d57b3e);
  transition:background 1s;
}

.sun{
  position:absolute;
  width:65px;
  height:65px;
  border-radius:50%;
  right:13%;
  top:10%;
  background:#fff1a8;
  box-shadow:0 0 40px #ffd86b;
}

.moon{
  position:absolute;
  display:none;
  width:58px;
  height:58px;
  right:14%;
  top:10%;
  border-radius:50%;
  background:#eee;
  box-shadow:0 0 25px #fff;
}

.stars{
  position:absolute;
  inset:0;
  opacity:0;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 5px white;
}

/* CITY */

.city{
  position:absolute;
  bottom:38%;
  left:0;
  width:100%;
  height:22%;
  display:flex;
  align-items:flex-end;
  gap:4px;
  overflow:hidden;
}

.building{
  min-width:35px;
  background:#101923;
  border-top:2px solid #293747;
  position:relative;
}

.window{
  position:absolute;
  width:5px;
  height:7px;
  background:#f7d86a;
  box-shadow:0 0 5px #f7d86a;
}

/* ROAD */

#road{
  position:absolute;
  left:6%;
  right:6%;
  top:0;
  bottom:0;
  background:
    linear-gradient(
      90deg,
      #555 0%,
      #292929 7%,
      #1c1c1c 15%,
      #292929 85%,
      #555 93%,
      #555 100%
    );
  clip-path:polygon(39% 0,61% 0,96% 100%,4% 100%);
  overflow:hidden;
}

.roadLine{
  position:absolute;
  width:7px;
  height:105px;
  background:#eee;
  border-radius:5px;
  box-shadow:0 0 5px #fff;
}

.edge{
  position:absolute;
  z-index:4;
  width:5px;
  height:100%;
  background:white;
  box-shadow:0 0 5px white;
}

.edge.left{
  left:11%;
  transform:rotate(7deg);
}

.edge.right{
  right:11%;
  transform:rotate(-7deg);
}

/* HUD */

#hud{
  position:absolute;
  z-index:80;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.hudBox{
  color:white;
  font-size:13px;
  font-weight:bold;
  padding:8px 10px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.18);
  border-radius:11px;
  backdrop-filter:blur(6px);
  text-shadow:0 2px 4px #000;
}

/* PLAYER */

#player{
  position:absolute;
  width:74px;
  height:126px;
  left:50%;
  bottom:60px;
  z-index:50;
  transform:translateX(-50%);
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.7));
}

.carBody{
  position:absolute;
  left:5px;
  top:10px;
  width:64px;
  height:108px;
  border-radius:16px 16px 9px 9px;
  border:2px solid #300;
  background:linear-gradient(
    90deg,
    #5e0000,
    #c60000,
    #ff2525,
    #d50000,
    #620000
  );
}

.carHood{
  position:absolute;
  left:10px;
  top:4px;
  width:54px;
  height:45px;
  border-radius:18px 18px 7px 7px;
  background:linear-gradient(
    90deg,
    #8e0000,
    #ef1717,
    #ff3636,
    #a90000
  );
}

.windshield{
  position:absolute;
  left:13px;
  top:36px;
  width:48px;
  height:31px;
  border-radius:11px 11px 3px 3px;
  background:linear-gradient(
    135deg,
    #d8f7ff,
    #234c66 45%,
    #0a1a28
  );
  border:2px solid #111;
}

.divider{
  position:absolute;
  left:36px;
  top:37px;
  width:3px;
  height:28px;
  background:#111;
}

.grille{
  position:absolute;
  left:13px;
  bottom:8px;
  width:48px;
  height:19px;
  background:#090909;
  border:2px solid #777;
  border-radius:3px;
}

.grilleLine{
  position:absolute;
  top:2px;
  bottom:2px;
  width:2px;
  background:#777;
}

.grilleLine:nth-child(1){left:8px}
.grilleLine:nth-child(2){left:17px}
.grilleLine:nth-child(3){left:26px}
.grilleLine:nth-child(4){left:35px}

.headlight{
  position:absolute;
  width:12px;
  height:9px;
  bottom:11px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 13px #fff;
  z-index:10;
}

.headlight.left{left:9px}
.headlight.right{right:9px}

.bumper{
  position:absolute;
  left:9px;
  bottom:3px;
  width:56px;
  height:7px;
  background:linear-gradient(#eee,#777);
  border-radius:3px;
}

.badge{
  position:absolute;
  left:27px;
  bottom:29px;
  color:#fff;
  font-size:11px;
  z-index:20;
}

.wheel{
  position:absolute;
  width:12px;
  height:32px;
  background:#080808;
  border-radius:5px;
  z-index:12;
  box-shadow:inset 0 0 0 2px #333;
}

.wheel.l1{left:-1px;top:26px}
.wheel.l2{left:-1px;bottom:22px}
.wheel.r1{right:-1px;top:26px}
.wheel.r2{right:-1px;bottom:22px}

.flame{
  position:absolute;
  display:none;
  bottom:-38px;
  left:25px;
  width:24px;
  height:43px;
  background:linear-gradient(#fff,#32d9ff,#0055ff);
  clip-path:polygon(25% 0,75% 0,100% 100%,50% 75%,0 100%);
  filter:drop-shadow(0 0 10px #00aaff);
  animation:flame .08s infinite alternate;
}

@keyframes flame{
  from{transform:scaleY(.8)}
  to{transform:scaleY(1.2)}
}

/* ENEMY */

.enemy{
  position:absolute;
  width:57px;
  height:94px;
  z-index:35;
  border-radius:14px;
  box-shadow:0 6px 12px #000;
}

.enemy.red{
  background:linear-gradient(90deg,#640000,#ff2424,#750000);
}

.enemy.blue{
  background:linear-gradient(90deg,#05327b,#298dff,#05327b);
}

.enemy.yellow{
  background:linear-gradient(90deg,#705400,#ffd21c,#705400);
}

.enemy.green{
  background:linear-gradient(90deg,#064628,#18b967,#064628);
}

.enemy .glass{
  position:absolute;
  left:9px;
  top:13px;
  width:39px;
  height:28px;
  background:linear-gradient(135deg,#d7f7ff,#173b50);
  border-radius:8px;
}

.enemy .wheel{
  position:absolute;
  width:9px;
  height:25px;
  background:#050505;
}

.enemy .wl{left:-4px}
.enemy .wr{right:-4px}

/* COIN */

.coin{
  position:absolute;
  width:27px;
  height:27px;
  z-index:34;
  border-radius:50%;
  background:radial-gradient(
    circle,
    #fff7a0 0 18%,
    #ffd000 19% 65%,
    #a36c00 66%
  );
  border:2px solid #fff1a0;
  box-shadow:0 0 15px #ffd000;
  animation:coin .45s linear infinite;
}

@keyframes coin{
  from{transform:rotateY(0)}
  to{transform:rotateY(360deg)}
}

/* NITRO */

#nitro{
  position:absolute;
  z-index:85;
  left:12px;
  bottom:18px;
  width:150px;
}

#nitroLabel{
  color:white;
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
  text-shadow:0 2px 4px #000;
}

#nitroBar{
  height:15px;
  background:#101010;
  border:1px solid #666;
  border-radius:10px;
  overflow:hidden;
}

#nitroFill{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#00aaff,#5555ff,#b7aaff);
}

/* NITRO BUTTON */

#nitroButton{
  position:absolute;
  z-index:90;
  right:18px;
  bottom:25px;
  width:76px;
  height:76px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.5);
  background:linear-gradient(#075eff,#00aaff);
  color:#fff;
  font-weight:bold;
  box-shadow:0 0 20px rgba(0,170,255,.5);
}

/* TOUCH */

.touch{
  position:absolute;
  z-index:45;
  top:0;
  bottom:0;
  width:50%;
}

#leftTouch{left:0}
#rightTouch{right:0}

/* RAIN */

#rain{
  display:none;
  position:absolute;
  inset:0;
  z-index:70;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      105deg,
      transparent 0 20px,
      rgba(190,220,255,.35) 21px,
      transparent 23px 48px
    );
  animation:rain .3s linear infinite;
}

@keyframes rain{
  from{background-position:0 0}
  to{background-position:-50px 120px}
}

/* SCREENS */

.screen{
  position:absolute;
  inset:0;
  z-index:200;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:rgba(0,0,0,.84);
  padding:20px;
  overflow:auto;
}

.screen h1{
  font-size:38px;
  margin-bottom:15px;
  text-shadow:0 0 20px #ff2500;
}

.screen p{
  line-height:1.6;
  color:#ddd;
  margin-bottom:20px;
}

.btn{
  border:0;
  border-radius:14px;
  padding:14px 25px;
  margin:5px;
  color:white;
  font-size:17px;
  font-weight:bold;
  background:linear-gradient(135deg,#d90000,#ff5a00);
  box-shadow:0 7px 25px rgba(255,50,0,.35);
}

.btn.blue{
  background:linear-gradient(135deg,#075eff,#00aaff);
}

.btn.dark{
  background:linear-gradient(135deg,#252525,#555);
}

.hidden{
  display:none!important;
}

/* MENU */

.menuLogo{
  font-size:48px;
  font-weight:900;
  color:#ff3322;
  text-shadow:0 0 25px #ff2200;
  margin-bottom:5px;
}

.menuSub{
  color:#ddd;
  margin-bottom:18px;
}

.menuCoins{
  padding:10px 18px;
  background:rgba(255,210,0,.12);
  border:1px solid rgba(255,210,0,.4);
  border-radius:15px;
  margin-bottom:20px;
  color:#ffd400;
  font-weight:bold;
}

/* GARAGE */

.cards{
  width:100%;
  max-width:520px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:15px;
}

.carCard,
.trackCard{
  padding:14px 8px;
  border-radius:15px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
}

.carVisual{
  width:48px;
  height:80px;
  margin:0 auto 8px;
  border-radius:13px;
  border:2px solid #222;
}

.carName{
  font-weight:bold;
  margin-bottom:5px;
}

.price{
  color:#ffd000;
  font-size:13px;
  margin-bottom:7px;
}

.selected{
  border:2px solid #00c8ff;
  box-shadow:0 0 15px rgba(0,200,255,.35);
}

.locked{
  opacity:.55;
}

/* TRACKS */

.trackCards{
  width:100%;
  max-width:520px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.trackCard{
  min-height:90px;
}

.trackIcon{
  font-size:32px;
  margin-bottom:5px;
}

.trackName{
  font-weight:bold;
}

/* PAUSE BUTTON */

#pause{
  position:absolute;
  z-index:100;
  right:12px;
  top:55px;
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:18px;
}

/* SETTINGS */

.setting{
  width:100%;
  max-width:400px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px;
  margin:6px;
  background:rgba(255,255,255,.08);
  border-radius:14px;
}

.switch{
  padding:9px 15px;
  border-radius:10px;
  border:0;
  color:white;
  font-weight:bold;
  background:#555;
}

.switch.on{
  background:#00a85a;
}

/* SMALL */

@media(max-width:380px){

  .screen h1{
    font-size:30px;
  }

  .menuLogo{
    font-size:38px;
  }

  .btn{
    font-size:15px;
    padding:12px 20px;
  }

  .cards{
    gap:7px;
  }

  .carCard{
    padding:9px 5px;
  }

  #hud{
    gap:3px;
  }

  .hudBox{
    padding:6px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<div id="game">

<!-- WORLD -->

<div id="sky">
  <div class="sun"></div>
  <div class="moon"></div>

  <div class="stars">
    <i class="star" style="left:10%;top:12%"></i>
    <i class="star" style="left:22%;top:20%"></i>
    <i class="star" style="left:35%;top:9%"></i>
    <i class="star" style="left:48%;top:18%"></i>
    <i class="star" style="left:63%;top:10%"></i>
    <i class="star" style="left:78%;top:22%"></i>
    <i class="star" style="left:90%;top:8%"></i>
  </div>
</div>

<div class="city" id="city"></div>

<div id="road"></div>

<div class="edge left"></div>
<div class="edge right"></div>

<div id="rain"></div>

<!-- HUD -->

<div id="hud" class="hidden">
  <div class="hudBox">🏆 <span id="score">0</span></div>
  <div class="hudBox">🪙 <span id="coins">0</span></div>
  <div class="hudBox">❤️ <span id="lives">3</span></div>
  <div class="hudBox">⚡ <span id="speed">0</span></div>
</div>

<button id="pause" class="hidden">Ⅱ</button>

<!-- PLAYER -->

<div id="player" class="hidden">

  <div class="carBody"></div>
  <div class="carHood"></div>
  <div class="windshield"></div>
  <div class="divider"></div>

  <div class="headlight left"></div>
  <div class="headlight right"></div>

  <div class="grille">
    <div class="grilleLine"></div>
    <div class="grilleLine"></div>
    <div class="grilleLine"></div>
    <div class="grilleLine"></div>
  </div>

  <div class="badge">🐎</div>

  <div class="bumper"></div>

  <div class="wheel l1"></div>
  <div class="wheel l2"></div>
  <div class="wheel r1"></div>
  <div class="wheel r2"></div>

  <div class="flame"></div>

</div>

<!-- NITRO -->

<div id="nitro" class="hidden">
  <div id="nitroLabel">🔥 NİTRO</div>
  <div id="nitroBar">
    <div id="nitroFill"></div>
  </div>
</div>

<button id="nitroButton" class="hidden">🔥<br>NİTRO</button>

<div id="leftTouch" class="touch hidden"></div>
<div id="rightTouch" class="touch hidden"></div>

<!-- ================= MAIN MENU ================= -->

<div id="menuScreen" class="screen">

  <div class="menuLogo">🏎️ TURBO ROAD</div>

  <div class="menuSub">
    ULTIMATE EDITION
  </div>

  <div class="menuCoins">
    🪙 GARAGE PARASI:
    <span id="menuMoney">0</span>
  </div>

  <button class="btn" id="playBtn">
    🏁 YARIŞA BAŞLA
  </button>

  <button class="btn blue" id="garageBtn">
    🚗 GARAJ
  </button>

  <button class="btn blue" id="trackBtn">
    🗺️ PİST SEÇ
  </button>

  <button class="btn dark" id="settingsBtn">
    ⚙️ AYARLAR
  </button>

</div>

<!-- ================= GARAGE ================= -->

<div id="garageScreen" class="screen hidden">

  <h1>🚗 GARAJ</h1>

  <p>
    Kazandığın paralarla yeni arabalar satın al.
  </p>

  <div class="menuCoins">
    🪙 <span id="garageMoney">0</span>
  </div>

  <div class="cards" id="carCards"></div>

  <button class="btn dark" id="garageBack">
    ← MENÜ
  </button>

</div>

<!-- ================= TRACK ================= -->

<div id="trackScreen" class="screen hidden">

  <h1>🗺️ PİSTLER</h1>

  <p>Yarışacağın ortamı seç.</p>

  <div class="trackCards" id="trackCards"></div>

  <button class="btn dark" id="trackBack">
    ← MENÜ
  </button>

</div>

<!-- ================= SETTINGS ================= -->

<div id="settingsScreen" class="screen hidden">

  <h1>⚙️ AYARLAR</h1>

  <div class="setting">
    <span>🔊 Oyun Sesi</span>
    <button class="switch on" id="soundSwitch">AÇIK</button>
  </div>

  <div class="setting">
    <span>📳 Titreşim</span>
    <button class="switch on" id="vibrateSwitch">AÇIK</button>
  </div>

  <button class="btn dark" id="settingsBack">
    ← MENÜ
  </button>

</div>

<!-- ================= PAUSE ================= -->

<div id="pauseScreen" class="screen hidden">

  <h1>⏸️ DURAKLATILDI</h1>

  <button class="btn" id="continueBtn">
    ▶ DEVAM ET
  </button>

  <button class="btn dark" id="pauseMenuBtn">
    🏠 ANA MENÜ
  </button>

</div>

<!-- ================= GAME OVER ================= -->

<div id="gameOver" class="screen hidden">

  <h1>💥 KAZA!</h1>

  <p>
    Skor: <b id="finalScore">0</b><br>
    Yarış Parası: <b id="finalCoins">0</b><br>
    Toplam Para: <b id="finalMoney">0</b><br>
    Rekor: <b id="bestScore">0</b>
  </p>

  <button class="btn" id="restartBtn">
    🔄 TEKRAR OYNA
  </button>

  <button class="btn dark" id="gameMenuBtn">
    🏠 ANA MENÜ
  </button>

</div>

</div>

    night:true
  }
};

/* =========================================
   AUDIO
========================================= */

function startAudio(){

  if(!soundOn)return;

  if(!audio){

    try{
      audio=new(
        window.AudioContext||
        window.webkitAudioContext
      )();
    }catch(e){}
  }

  if(audio&&audio.state==="suspended"){
    audio.resume();
  }
}

function sound(freq,duration=.1,type="sine"){

  if(!soundOn||!audio)return;

  try{

    const o=audio.createOscillator();
    const g=audio.createGain();

    o.type=type;
    o.frequency.value=freq;

    g.gain.setValueAtTime(
      .04,
      audio.currentTime
    );

    g.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+duration
    );

    o.connect(g);
    g.connect(audio.destination);

    o.start();
    o.stop(audio.currentTime+duration);

  }catch(e){}
}

/* =========================================
   CITY
========================================= */

function createCity(){

  const city=document.getElementById("city");

  city.innerHTML="";

  for(let i=0;i<40;i++){

    const b=document.createElement("div");

    b.className="building";

    b.style.height=

    for(let j=0;j<8;j++){

      const w=document.createElement("i");

      w.className="window";

      w.style.top=

    }

}

/* =========================================
   ROAD LINES
========================================= */

function createLines(){

  lines.forEach(x=>{
    if(x.el)x.el.remove();
  });

  lines=[];

  for(let i=0;i<14;i++){

    const el=document.createElement("div");

    el.className="roadLine";

    const obj={
      el:el,
      y:i*110-100
    };

    el.style.left="50%";
    el.style.top=obj.y+"px";
    el.style.transform="translateX(-50%)";

    road.appendChild(el);

    lines.push(obj);
  }
}

/* =========================================
   MENU
========================================= */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(x=>x.classList.add("hidden"));

  document
    .getElementById(id)
    .classList.remove("hidden");
}

function updateMoney(){

  document.getElementById("menuMoney")
    .textContent=money;

  document.getElementById("garageMoney")
    .textContent=money;
}

/* =========================================
   GARAGE
========================================= */

function renderGarage(){

  const box=document.getElementById("carCards");

  box.innerHTML="";

  Object.entries(cars).forEach(([id,car])=>{

    const owned=ownedCars.includes(id);
    const selected=selectedCar===id;

    const card=document.createElement("div");

    card.className=
      "carCard"+
      (selected?" selected":"")+
      (!owned?" locked":"");

    card.innerHTML=`

      <div
        class="carVisual"
        style="background:linear-gradient(
          90deg,
          #222,
          ${car.color},
          #eee,
          ${car.color},
          #222
        )">
      </div>

      <div class="carName">
        ${car.name}
      </div>

      <div class="price">
        ${owned?"SAHİP":("🪙 "+car.price)}
      </div>

      <button class="btn ${owned?"blue":"dark"}"
              style="font-size:12px;padding:8px 10px">

        ${
          selected
          ?"✓ SEÇİLİ"
          :owned
          ?"SEÇ"
          :"SATIN AL"
        }

      </button>
    `;

    const button=card.querySelector("button");

    button.onclick=()=>{

      if(owned){

        selectedCar=id;

        localStorage.setItem(
          "turboCar",
          selectedCar
        );

        renderGarage();

        sound(600,.12);

        return;
      }

      if(money>=car.price){

        money-=car.price;

        ownedCars.push(id);

        selectedCar=id;

        localStorage.setItem(
          "turboMoney",
          money
        );

        localStorage.setItem(
          "turboCars",
          JSON.stringify(ownedCars)
        );

        localStorage.setItem(
          "turboCar",
          selectedCar
        );

        updateMoney();
        renderGarage();

        sound(800,.15);
        sound(1100,.1);

      }else{

        sound(120,.2);

        alert(
          "Bu arabayı almak için "+
          car.price+
          " puan gerekiyor."
        );
      }
    };

    box.appendChild(card);

  });

}

/* =========================================
   TRACKS
========================================= */

function renderTracks(){

  const box=document.getElementById("trackCards");

  box.innerHTML="";

  Object.entries(tracks).forEach(([id,t])=>{

    const card=document.createElement("div");

    card.className=
      "trackCard"+
      (selectedTrack===id?" selected":"");

    card.innerHTML=`

      <div class="trackIcon">
        ${t.icon}
      </div>

      <div class="trackName">
        ${t.name}
      </div>

    `;

    card.onclick=()=>{

      selectedTrack=id;

      localStorage.setItem(
        "turboTrack",
        selectedTrack
      );

      renderTracks();

      sound(500,.1);
    };

    box.appendChild(card);
  });
}

/* =========================================
   TRACK STYLE
========================================= */

function applyTrack(){

  const t=tracks[selectedTrack];

  document.getElementById("sky")
    .style.background=t.sky;

  const stars=
    document.querySelector(".stars");

  const moon=
    document.querySelector(".moon");

  const sun=
    document.querySelector(".sun");

  if(t.night){

    stars.style.opacity=1;
    moon.style.display="block";
    sun.style.display="none";

  }else{

    stars.style.opacity=0;
    moon.style.display="none";
    sun.style.display="block";
  }

  document.getElementById("rain")
    .style.display=t.rain?"block":"none";
}

/* =========================================
   PLAYER
========================================= */

function updatePlayer(){

  player.style.left=playerX+"px";

  player.style.transform=
    `translateX(-50%) rotate(${direction*8}deg)`;
}

function applyCar(){

  const car=cars[selectedCar];

  document
    .querySelector(".carBody")
    .style.background=
      `linear-gradient(
        90deg,
        #111,
        ${car.color},
        #fff,

/* =========================================
   CONTROL
========================================= */

function setDirection(x){

  if(!running||paused)return;

  direction=
    x<innerWidth/2?-1:1;
}

function stopDirection(){

  direction=0;
}

document
.getElementById("leftTouch")
.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    setDirection(innerWidth*.2);
  },
  {passive:false}
);

document
.getElementById("rightTouch")
.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    setDirection(innerWidth*.8);
  },
  {passive:false}
);

game.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    if(e.touches.length){
      setDirection(
        e.touches[0].clientX
      );
    }

  },
  {passive:false}
);

game.addEventListener(
  "touchend",
  e=>{
    stopDirection();
  },
  {passive:false}
);

game.addEventListener(
  "mousedown",
  e=>{
    setDirection(e.clientX);
  }
);

game.addEventListener(
  "mouseup",
  stopDirection
);

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft"||
      e.key.toLowerCase()==="a"
    ){
      direction=-1;
    }

    if(
      e.key==="ArrowRight"||
      e.key.toLowerCase()==="d"
    ){
      direction=1;
    }

    if(e.code==="Space"){
      nitroActive(true);
    }
  }
);

document.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft"||
      e.key==="ArrowRight"||
      e.key.toLowerCase()==="a"||
      e.key.toLowerCase()==="d"
    ){
      direction=0;
    }

    if(e.code==="Space"){
      nitroActive(false);
    }
  }
);

/* =========================================
   NITRO
========================================= */

function nitroActive(value){

  if(!running||paused)return;

  turbo=
    value&&nitro>0;

  flame.style.display=
    turbo?"block":"none";
}

const nitroButton=
  document.getElementById("nitroButton");

nitroButton.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    nitroActive(true);
  },
  {passive:false}
);

nitroButton.addEventListener(
  "touchend",
  e=>{
    e.preventDefault();
    nitroActive(false);
  },
  {passive:false}
);

/* =========================================
   ENEMY
========================================= */

function createEnemy(){

  const el=document.createElement("div");

  const colors=[
    "red",
    "blue",
    "yellow",
    "green"
  ];

  el.className=
    "enemy "+
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];

  const glass=
    document.createElement("div");

  glass.className="glass";

  el.appendChild(glass);

  const wl=
    document.createElement("div");

  wl.className="wheel wl";

  const wr=
    document.createElement("div");

  el.appendChild(wl);
  el.appendChild(wr);

  const left=innerWidth*.15;
  const right=innerWidth*.85;

  const x=
    left+30+
    Math.random()*
    (right-left-90);

  const enemy={
    el:el,
    x:x,
    y:-120,
    speed:.7+
      Math.random()*.5
  };

  el.style.left=x+"px";
  el.style.top="-120px";

  game.appendChild(el);

  enemies.push(enemy);
}

/* =========================================
   COIN
========================================= */

function createCoin(){

  const el=
    document.createElement("div");

  el.className="coin";

  const left=innerWidth*.15;
  const right=innerWidth*.85;

  const x=
    left+35+
    Math.random()*
    (right-left-90);

  const obj={
    el:el,
    x:x,
    y:-40
  };

  el.style.left=x+"px";
  el.style.top="-40px";

  game.appendChild(el);

  coinList.push(obj);
}

/* =========================================
   COLLISION
========================================= */

function collision(a,b){

  const r1=
    a.getBoundingClientRect();

  const r2=
    b.getBoundingClientRect();

  return !(
    r1.right<r2.left||
    r1.left>r2.right||
    r1.bottom<r2.top||
    r1.top>r2.bottom
  );
}

/* =========================================
   CRASH
========================================= */

function crash(){

  lives--;

  livesEl.textContent=lives;

  sound(80,.35,"sawtooth");

  if(vibrationOn&&navigator.vibrate){

    navigator.vibrate([
      120,60,120
    ]);
  }

  const damage=
    document.createElement("div");

  damage.style.position="absolute";
  damage.style.inset="0";
  damage.style.background=
    "rgba(255,0,0,.35)";
  damage.style.zIndex="75";
  damage.style.pointerEvents="none";

  game.appendChild(damage);

  setTimeout(()=>{
    damage.remove();
  },250);

  if(lives<=0){
    endGame();
  }
}

/* =========================================
   START
========================================= */

function startGame(){

  startAudio();

  running=true;
  paused=false;

  score=0;
  raceCoins=0;
  lives=3;

  const car=cars[selectedCar];

  speed=car.speed;
  nitro=100;

  playerX=innerWidth/2;

  enemies.forEach(x=>x.el.remove());
  coinList.forEach(x=>x.el.remove());

  enemies=[];
  coinList=[];

  scoreEl.textContent=0;
  coinsEl.textContent=0;
  livesEl.textContent=3;

  document.getElementById("hud")
    .classList.remove("hidden");

  document.getElementById("pause")
    .classList.remove("hidden");

  player.classList.remove("hidden");

  document.getElementById("nitro")
    .classList.remove("hidden");

  nitroButton.classList.remove("hidden");

  document
    .getElementById("leftTouch")
    .classList.remove("hidden");

  document
    .getElementById("rightTouch")
    .classList.remove("hidden");

  applyTrack();
  applyCar();
  updatePlayer();

  showGame();
}

/* =========================================
   GAME SCREEN
========================================= */

function showGame(){

  document
    .querySelectorAll(".screen")
    .forEach(x=>x.classList.add("hidden"));
}

/* =========================================
   END
========================================= */

function endGame(){

  running=false;
  turbo=false;

  flame.style.display="none";

  if(score>best){

    best=score;

    localStorage.setItem(
      "turboBest",
      best
    );
  }

  money+=raceCoins;

  localStorage.setItem(
    "turboMoney",
    money
  );

  document.getElementById("finalScore")
    .textContent=score;

  document.getElementById("finalCoins")
    .textContent=raceCoins;

  document.getElementById("finalMoney")
    .textContent=money;

  document.getElementById("bestScore")
    .textContent=best;

  hideGameObjects();

  showScreen("gameOver");

  sound(100,.4,"sawtooth");
}

/* =========================================
   HIDE GAME OBJECTS
========================================= */

function hideGameObjects(){

  document.getElementById("hud")
    .classList.add("hidden");

  document.getElementById("pause")
    .classList.add("hidden");

  player.classList.add("hidden");

  document.getElementById("nitro")
    .classList.add("hidden");

  nitroButton.classList.add("hidden");

  document
    .getElementById("leftTouch")
    .classList.add("hidden");

  document
    .getElementById("rightTouch")
    .classList.add("hidden");
}

/* =========================================
   PAUSE
========================================= */

function pauseGame(){

  if(!running)return;

  paused=true;
  turbo=false;

  flame.style.display="none";

  showScreen("pauseScreen");
}

function continueGame(){

  if(!running)return;

  paused=false;

  showGame();
}

/* =========================================
   MAIN MENU
========================================= */

function goMenu(){

  running=false;
  paused=false;

  enemies.forEach(x=>x.el.remove());
  coinList.forEach(x=>x.el.remove());

  enemies=[];
  coinList=[];

  hideGameObjects();

  updateMoney();

  showScreen("menuScreen");
}

/* =========================================
   GAME LOOP
========================================= */

let lastTime=0;

function loop(time){

  if(!lastTime)
    lastTime=time;

  const dt=
    Math.min(
      2,
      (time-lastTime)/16.67
    );

  lastTime=time;

  if(running&&!paused){

    const car=cars[selectedCar];

    /* PLAYER */

    playerX+=
      direction*
      5*
      car.handling*
      dt;

    const minX=
      innerWidth*.12;

    const maxX=
      innerWidth*.88;

    playerX=
      Math.max(
        minX,
        Math.min(maxX,playerX)
      );

    updatePlayer();

    /* SPEED */

    let currentSpeed=
      speed;

    if(turbo&&nitro>0){

      currentSpeed+=5;

      nitro-=.55*dt;

      if(nitro<0)
        nitro=0;

    }else{

      nitro+=.08*dt;

      if(nitro>100)
        nitro=100;
    }

    nitroFill.style.width=
      nitro+"%";

    speedEl.textContent=
      Math.round(
        currentSpeed*20
      );

    /* ROAD */

    lines.forEach(line=>{

      line.y+=
        currentSpeed*
        1.8*
        dt;

      if(line.y>innerHeight)
        line.y=-120;

      line.el.style.top=
        line.y+"px";
    });

    /* SCORE */

    score+=
      Math.max(
        1,
        Math.floor(currentSpeed/3)
      );

    scoreEl.textContent=score;

    /* DIFFICULTY */

    const level=
      Math.floor(score/1000);

    enemyTimer+=dt;
    coinTimer+=dt;

    const enemyDelay=
      Math.max(
        28,
        75-level*3
      );

    if(enemyTimer>enemyDelay){

      createEnemy();
      enemyTimer=0;
    }

    if(coinTimer>55){

      createCoin();
      coinTimer=0;
    }

    /* ENEMIES */

    enemies.forEach((e,i)=>{

      e.y+=
        currentSpeed*
        e.speed*
        dt;

      e.el.style.top=
        e.y+"px";

      if(
        collision(
          player,
          e.el
        )
      ){

        e.el.remove();
        enemies.splice(i,1);

        crash();

        return;
      }

      if(e.y>innerHeight+150){

        e.el.remove();
        enemies.splice(i,1);
      }
    });

    /* COINS */

    coinList.forEach((c,i)=>{

      c.y+=
        currentSpeed*
        1.4*
        dt;

      c.el.style.top=
        c.y+"px";

      if(
        collision(
          player,
          c.el
        )
      ){

        raceCoins++;

        score+=100;

        coinsEl.textContent=
          raceCoins;

        scoreEl.textContent=
          score;

        c.el.remove();

        coinList.splice(i,1);

        sound(900,.08);

        if(vibrationOn&&navigator.vibrate)
          navigator.vibrate(25);

        return;
      }

      if(c.y>innerHeight+50){

        c.el.remove();
        coinList.splice(i,1);
      }
    });
  }

  requestAnimationFrame(loop);
}

/* =========================================
   SETTINGS
========================================= */

function updateSettingsUI(){

  const soundBtn=
    document.getElementById("soundSwitch");

  const vibBtn=
    document.getElementById("vibrateSwitch");

  soundBtn.textContent=
    soundOn?"AÇIK":"KAPALI";

  soundBtn.className=
    "switch"+
    (soundOn?" on":"");

  vibBtn.textContent=
    vibrationOn?"AÇIK":"KAPALI";

  vibBtn.className=
    "switch"+
    (vibrationOn?" on":"");
}

document
.getElementById("soundSwitch")
.onclick=()=>{

  soundOn=!soundOn;

  localStorage.setItem(
    "turboSound",
    soundOn?"on":"off"
  );

  updateSettingsUI();

  if(soundOn){

    startAudio();
    sound(700,.1);
  }
};

document
.getElementById("vibrateSwitch")
.onclick=()=>{

  vibrationOn=!vibrationOn;

  localStorage.setItem(
    "turboVibration",
    vibrationOn?"on":"off"
  );

  updateSettingsUI();

  if(vibrationOn&&navigator.vibrate)
    navigator.vibrate(40);
};

/* =========================================
   RESIZE
========================================= */

window.addEventListener(
  "resize",
  ()=>{

    if(!running)
      playerX=innerWidth/2;

    updatePlayer();
  }
);

/* =========================================
   INIT
========================================= */

createCity();
createLines();
applyTrack();
applyCar();
updateMoney();
updateSettingsUI();

requestAnimationFrame(loop);

</script>
